/* Star-Sign Table: the digital decks.
   Player decks, the Fate Deck and the damage deck, with the draw rules of
   Core Engine: 2.0 and Core Engine: d20 Classic. No DOM here: every function
   takes a plain, JSON-safe state object and changes it. */
const PLAY = (function(){
  const SUITS = ['♠','♥','♦','♣'];
  const RED = s => s==='♥' || s==='♦';
  const RANK = r => r===1 ? 'A' : String(r);
  const isNum = c => typeof c.r === 'number';
  const isFace = c => c.r==='J' || c.r==='Q' || c.r==='K';

  /* ---------- randomness ---------- */
  function rand(n){                       // unbiased integer in [0, n)
    const g = (typeof crypto!=='undefined' && crypto.getRandomValues) ? crypto : null;
    if (!g) return Math.floor(Math.random()*n);
    const buf = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n;
    let x; do { g.getRandomValues(buf); x = buf[0]; } while (x >= lim);
    return x % n;
  }
  function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  /* ---------- building the physical decks ---------- */
  function numberCards(counts){
    const out = [];
    counts.forEach((n,i)=>{ for (let k=0;k<n;k++) out.push({r:i+1, s:SUITS[(k+i)%4]}); });
    return out;
  }
  function jokers(R,B){ const out=[]; for (let i=0;i<R;i++) out.push({r:'S', s:''}); for (let i=0;i<B;i++) out.push({r:'E', s:''}); return out; }
  const FATE_COUNTS = [17,9,6,5,5,5,3,2,6,18];
  function fateCards(game){
    const out = numberCards(FATE_COUNTS).concat(jokers(2,2));
    if (game==='paizo') for (const s of ['♥','♦','♠','♣']) for (const r of ['J','Q','K']) out.push({r, s});
    return out;
  }
  function damageCards(){ return numberCards([4,4,4,4,4,4,4,4,4,4]).concat(jokers(1,1)); }

  /* ---------- a pile: draw pile + discard pile ---------- */
  function newPile(cards){ return {draw: shuffle(cards.slice()), discard: []}; }

  /* ---------- what a Joker means right now ---------- */
  // Wild magic can change meanings: Day for Night swaps them, Sun Breaks Through
  // turns the next Eclipse into a Sun, Sudden Eclipse the next Sun into an Eclipse.
  function meaning(c, fx){
    if (c.r!=='S' && c.r!=='E') return c.r;
    let m = c.r==='S' ? 'H' : 'L';
    if (fx && fx.dayForNight) m = m==='H' ? 'L' : 'H';
    if (fx && m==='L' && fx.sunBreaks){ fx.sunBreaks = false; fx.used = 'Sun Breaks Through: this Eclipse counts as a Sun.'; m = 'H'; }
    else if (fx && m==='H' && fx.suddenEclipse){ fx.suddenEclipse = false; fx.used = 'Sudden Eclipse: this Sun counts as an Eclipse.'; m = 'L'; }
    return m;
  }

  /* ---------- the draw rules ---------- */
  // mode: 'normal' (two cards, a Joker ends it), 'fortune' (three, keep the best pair),
  // 'misfortune' (three, keep the worst pair). seq holds meanings alongside cards.
  function done(seq, mode){
    const ms = seq.map(x=>x.m);
    if (mode==='normal') return seq.length>=2 || (seq.length===1 && (ms[0]==='H' || ms[0]==='L'));
    if (mode==='fortune') return ms.includes('H') || seq.length>=3;
    if (mode==='misfortune') return ms.includes('L') || seq.length>=3;
    return seq.length>=2;
  }
  function evaluate(seq, mode){
    const ms = seq.map(x=>x.m), idx = seq.map((_,i)=>i);
    const H = idx.filter(i=>ms[i]==='H'), L = idx.filter(i=>ms[i]==='L'), N = idx.filter(i=>typeof ms[i]==='number');
    if (mode==='normal'){
      if (H.length) return {nat:20, keep:[H[0]], total:20};
      if (L.length) return {nat:1, keep:[L[0]], total:1};
      return {nat:null, keep:N.slice(0,2), total:N.reduce((a,i)=>a+ms[i],0)};
    }
    if (mode==='fortune'){
      if (H.length) return {nat:20, keep:[H[0]], total:20};
      if (L.length>=2) return {nat:1, keep:L.slice(0,2), total:1, note:'Two Eclipses can’t both be dropped.'};
      const best = N.slice().sort((a,b)=>ms[b]-ms[a]).slice(0,2).sort((a,b)=>a-b);
      return {nat:null, keep:best, total:best.reduce((a,i)=>a+ms[i],0)};
    }
    // misfortune
    if (L.length) return {nat:1, keep:[L[0]], total:1};
    if (H.length>=2) return {nat:20, keep:H.slice(0,2), total:20, note:'Two Suns can’t both be dropped.'};
    const worst = N.slice().sort((a,b)=>ms[a]-ms[b]).slice(0,2).sort((a,b)=>a-b);
    return {nat:null, keep:worst, total:worst.reduce((a,i)=>a+ms[i],0)};
  }

  /* ---------- player deck state ---------- */
  function newPlayer(deck){
    return {
      v:1, deckId:deck.id, game:deck.game, c:deck.c.slice(), R:deck.R, B:deck.B, ability:deck.ability||'none',
      draw: shuffle(numberCards(deck.c).concat(jokers(deck.R, deck.B))), discard:[], table:null, held:[], kept:[],
      level:0, collapsed:false, deckOuts:0, checks:0, day:1,
      uses:{day:{}, enc:{}}, inEncounter:false, pendingFortune:false,
      hero:1, inspiration:false, fx:{}, pending:null, log:[]
    };
  }
  const allCards = st => numberCards(st.c).concat(jokers(st.R, st.B));
  const penalty = st => 2*st.level;
  const hasAb = (st, key, on) => on && st.game==='paizo' && st.ability===key;

  function log(st, entry){ entry.t = Date.now(); entry.day = st.day; st.log.unshift(entry); if (st.log.length>80) st.log.length = 80; }

  // Before a new action, the cards on the table go to the discard pile, face-down.
  function clearTable(st){
    if (st.table){ st.discard.push(...st.table.cards); st.table = null; }
    if (st.pending){ st.discard.push(...st.pending.seq.map(x=>x.c)); st.pending = null; }
  }
  // The deck-out: drawing the last card forces a reshuffle and a level of exhaustion.
  function deckOut(st, ab, events){
    st.deckOuts++;
    let gained = true;
    if (hasAb(st,'taurus',ab) && !st.uses.day.taurus){ st.uses.day.taurus = true; gained = false; events.push({kind:'unyielding'}); }
    if (gained){ st.level = Math.min(4, st.level+1); if (st.level>=4) st.collapseAfter = true; }
    st.draw = shuffle(st.discard.splice(0));
    if (hasAb(st,'capricorn',ab)) st.pendingFortune = true;
    events.push({kind:'deckout', level:st.level, gained});
  }
  function drawOne(st, ab, events){
    if (!st.draw.length){                     // only when every card is out of the deck
      if (!st.discard.length) return null;
      st.draw = shuffle(st.discard.splice(0));
    }
    const card = st.draw.pop();
    if (!st.draw.length) deckOut(st, ab, events);
    return card;
  }
  function continueSeq(st, seq, mode, ab, events){
    while (!done(seq, mode)){
      const c = drawOne(st, ab, events); if (!c) break;
      seq.push({c, m:meaning(c, st.fx)});
    }
    return seq;
  }
  function finishCollapse(st, events){
    if (st.collapseAfter){ st.collapseAfter = false; st.collapsed = true; events.push({kind:'collapse'}); }
  }

  // Pick the mode after the table's effects: Second Ascent, First Blood, wild magic.
  function effectiveMode(st, want, type, ab, notes){
    let mode = want;
    const fortunes = [], misfortunes = [];
    if (want==='fortune') fortunes.push('fortune');
    if (want==='misfortune') misfortunes.push('misfortune');
    if (st.pendingFortune && hasAb(st,'capricorn',ab)){ st.pendingFortune = false; fortunes.push('Second Ascent'); }
    if (type==='attack' && hasAb(st,'aries',ab) && !st.uses.enc.aries){ st.uses.enc.aries = true; fortunes.push('First Blood'); }
    if (st.fx.nextMode==='fortune'){ fortunes.push('Fortune’s Turn'); st.fx.nextMode = null; }
    else if (st.fx.nextMode==='misfortune'){ misfortunes.push('Ill Fortune'); st.fx.nextMode = null; }
    if (fortunes.length && misfortunes.length){ mode = 'normal'; notes.push('Fortune and misfortune cancel, so you draw normally.'); }
    else if (fortunes.length){ mode = 'fortune'; const f = fortunes.filter(x=>x!=='fortune'); if (f.length) notes.push(f.join(' and ') + ' makes this a fortune check.'); }
    else if (misfortunes.length){ mode = 'misfortune'; const f = misfortunes.filter(x=>x!=='misfortune'); if (f.length) notes.push(f.join(' and ') + ' makes this a misfortune check.'); }
    return mode;
  }

  function makeResult(st, seq, mode, meta, events, notes){
    const e = evaluate(seq, mode);
    const r = {kind:meta.kind||'check', type:meta.type||'skill', mode, cards:seq.map(x=>x.c), meanings:seq.map(x=>x.m),
      keep:e.keep, nat:e.nat, total:e.total, pen:meta.pen, mod:meta.mod, dc:meta.dc, notes:notes.concat(e.note?[e.note]:[]),
      events, label:meta.label||null};
    if (st.fx.used){ r.notes.push(st.fx.used); st.fx.used = null; }
    return r;
  }

  /* A check. opts: {type, mode, mod, dc, label}. Returns the result (also on st.table). */
  function check(st, opts, ab){
    clearTable(st);
    const events = [], notes = [], pen = penalty(st);
    const type = opts.type || 'skill';
    if (st.fx.nextNat){                      // Crown of Fortune / Crown of Ruin: don't draw
      const nat = st.fx.nextNat; st.fx.nextNat = null;
      const r = {kind:'check', type, mode:'normal', cards:[], meanings:[], keep:[], nat, total:nat, pen, mod:opts.mod, dc:opts.dc,
        notes:[nat===20 ? 'Crown of Fortune: a natural 20, no draw.' : 'Crown of Ruin: a natural 1, no draw.'], events:[], label:opts.label||null};
      st.table = r; st.checks++; log(st, {what:'check', r:summary(r)}); return r;
    }
    // A plain check (drawn from your deck for an ally) ignores your own fortune effects.
    const mode = opts.plain ? 'normal' : effectiveMode(st, opts.mode||'normal', type, ab, notes);
    const seq = [];
    // Loose Arrow: on an attack, stop after the first card so the player can swap it.
    const loose = !opts.plain && type==='attack' && hasAb(st,'sagittarius',ab) && !st.uses.enc.sagittarius;
    if (loose){
      const c = drawOne(st, ab, events);
      if (c){ seq.push({c, m:meaning(c, st.fx)});
        st.pending = {seq, mode, opts, events, notes, pen};
        return {pending:true, first:c, events};
      }
    }
    continueSeq(st, seq, mode, ab, events);
    return finishCheck(st, seq, mode, opts, events, notes, pen);
  }
  function finishCheck(st, seq, mode, opts, events, notes, pen){
    const r = makeResult(st, seq, mode, {kind:opts.kind||'check', type:opts.type, mod:opts.mod, dc:opts.dc, pen, label:opts.label}, events, notes);
    st.table = r; st.checks++;
    finishCollapse(st, events);
    log(st, {what:r.kind, r:summary(r)});
    return r;
  }
  // Loose Arrow decision: swap the first card or keep it, then finish the draw.
  function resolveLoose(st, swap, ab){
    const p = st.pending; if (!p) return null;
    st.pending = null;
    if (swap){
      st.uses.enc.sagittarius = true;
      const old = p.seq.pop().c; st.discard.push(old);
      p.notes.push(`Loose Arrow: you discarded the ${cardName(old)} and drew a new first card.`);
      const c = drawOne(st, ab, p.events); if (c) p.seq.push({c, m:meaning(c, st.fx)});
    }
    continueSeq(st, p.seq, p.mode, ab, p.events);
    return finishCheck(st, p.seq, p.mode, p.opts, p.events, p.notes, p.pen);
  }

  /* Twin Draw (Gemini): two separate checks; the player chooses which one counts. */
  function twin(st, opts, ab){
    clearTable(st);
    const events = [], pen = penalty(st), res = [];
    for (let k=0;k<2;k++){
      const seq = continueSeq(st, [], 'normal', ab, events), e = evaluate(seq, 'normal');
      res.push({kind:'check', type:opts.type||'skill', mode:'normal', cards:seq.map(x=>x.c), meanings:seq.map(x=>x.m), keep:e.keep, nat:e.nat, total:e.total,
        pen, mod:opts.mod, dc:opts.dc, notes:['Twin Draw: you drew two separate checks and chose this one. Both are discarded.'], events:[], label:'Twin Draw'});
    }
    st.uses.enc.gemini = true;
    if (st.fx.used){ res[1].notes.push(st.fx.used); st.fx.used = null; }
    st.table = {kind:'twin', cards:res[0].cards.concat(res[1].cards), twins:res, events, notes:[]};
    finishCollapse(st, events);
    return st.table;
  }
  function chooseTwin(st, i){
    const t = st.table; if (!t || t.kind!=='twin') return null;
    const r = t.twins[i], o = t.twins[1-i];
    st.discard.push(...o.cards);
    r.events = t.events; st.table = r; st.checks++;
    log(st, {what:'check', r:summary(r)});
    return r;
  }

  /* Rerolls. how: 'new' (keep your most recent card, pair it with a new one) or 'better' (best pair of three). */
  function reroll(st, how, ab, why){
    const prev = st.table;
    if (!prev || prev.kind==='burn' || prev.kind==='cast') return null;
    const events = [], notes = [], pen = penalty(st);
    if (why) notes.push(why);
    if (prev.nat!==null || prev.keep.length<2){
      notes.push(prev.nat===1 ? 'The check was a natural 1, so this is a new check instead.' : 'This is a new check.');
      const opts = {type:prev.type, mod:prev.mod, dc:prev.dc, mode:'normal', label:'Reroll'};
      clearTable(st);
      const seq = []; continueSeq(st, seq, 'normal', ab, events);
      const r = finishCheck(st, seq, 'normal', opts, events, notes, pen); r.reroll = how; return r;
    }
    const kept = prev.keep.map(i=>({c:prev.cards[i], m:prev.meanings[i]}));
    const dropped = prev.cards.filter((_,i)=>!prev.keep.includes(i));
    const c = drawOne(st, ab, events);
    if (!c) return null;
    const nw = {c, m:meaning(c, st.fx)};
    let r;
    if (how==='new'){
      const recent = kept[kept.length-1], first = kept.slice(0,-1).map(x=>x.c);
      st.discard.push(...dropped, ...first);
      const seq = [recent, nw];
      const e = nw.m==='H' ? {nat:20, keep:[1], total:20} : nw.m==='L' ? {nat:1, keep:[1], total:1} : {nat:null, keep:[0,1], total:recent.m + nw.m};
      r = {kind:'check', type:prev.type, mode:'reroll-new', cards:seq.map(x=>x.c), meanings:seq.map(x=>x.m), keep:e.keep, nat:e.nat, total:e.total,
        pen, mod:prev.mod, dc:prev.dc, notes:notes.concat(['You kept your most recent card and paired it with the new card. The new card total stands, even if it’s lower.']), events, label:'Reroll'};
    } else {
      st.discard.push(...dropped);
      const seq = kept.concat([nw]);
      let e;
      if (nw.m==='H') e = {nat:20, keep:[2], total:20};
      else if (nw.m==='L') e = {nat:null, keep:[0,1], total:kept[0].m + kept[1].m, note:'The new card is an Eclipse, the lowest card, so you keep your original pair.'};
      else { const idx = [0,1,2].sort((a,b)=>seq[b].m-seq[a].m).slice(0,2).sort((a,b)=>a-b); e = {nat:null, keep:idx, total:idx.reduce((a,i)=>a+seq[i].m,0)}; }
      r = {kind:'check', type:prev.type, mode:'reroll-better', cards:seq.map(x=>x.c), meanings:seq.map(x=>x.m), keep:e.keep, nat:e.nat, total:e.total,
        pen, mod:prev.mod, dc:prev.dc, notes:notes.concat(e.note?[e.note]:['You kept the best pair of the three.']), events, label:'Reroll'};
    }
    if (st.fx.used){ r.notes.push(st.fx.used); st.fx.used = null; }
    r.reroll = how;
    st.table = r; finishCollapse(st, events);
    log(st, {what:'reroll', r:summary(r)});
    return r;
  }

  /* Burn cards: casting costs, a fixed result, Burnout. */
  function burn(st, n, kind, label, ab){
    clearTable(st);
    const events = [], cards = [];
    for (let i=0;i<n;i++){ const c = drawOne(st, ab, events); if (!c) break; cards.push(c); }
    const r = {kind, cards, meanings:cards.map(c=>meaning(c,null)), keep:[], nat:null, total:null, notes:[], events, label};
    st.table = r; finishCollapse(st, events);
    log(st, {what:kind, r:summary(r)});
    return r;
  }

  /* Held draws: draw now, set aside face-up, use later in place of a draw. */
  function hold(st, mode, ab, label){
    clearTable(st);
    const events = [], notes = [];
    const m = effectiveMode(st, mode||'normal', 'held', ab, notes);
    const seq = continueSeq(st, [], m, ab, events);
    const e = evaluate(seq, m);
    const h = {id:Date.now().toString(36)+rand(1e6).toString(36), cards:seq.map(x=>x.c), meanings:seq.map(x=>x.m), keep:e.keep, nat:e.nat, total:e.total, mode:m, label:label||'Held draw'};
    st.held.push(h); finishCollapse(st, events);
    log(st, {what:'hold', r:{cards:h.cards, total:h.total, nat:h.nat, label:h.label}});
    return {held:h, events, notes};
  }
  function useHeld(st, id, opts){
    const i = st.held.findIndex(h=>h.id===id); if (i<0) return null;
    clearTable(st);
    const h = st.held.splice(i,1)[0];
    const r = {kind:'check', type:opts.type||'skill', mode:h.mode, cards:h.cards, meanings:h.meanings, keep:h.keep, nat:h.nat, total:h.total,
      pen:penalty(st), mod:opts.mod, dc:opts.dc, notes:['You used a held draw. Modifiers apply now, including exhaustion gained since.'], events:[], label:h.label};
    st.table = r; st.checks++;
    log(st, {what:'held', r:summary(r)});
    return r;
  }
  function dropHeld(st, id){ const i = st.held.findIndex(h=>h.id===id); if (i<0) return; st.discard.push(...st.held.splice(i,1)[0].cards); }

  /* Crowned (Leo) and Sting (Scorpio): keep the Joker, draw a replacement for this check. */
  function keepJoker(st, ab){
    const r = st.table; if (!r) return null;
    const want = st.ability==='leo' ? 'S' : 'E';
    const i = r.cards.findIndex(c=>c.r===want); if (i<0) return null;
    const key = st.ability; st.uses.day[key] = true;
    const card = r.cards[i];
    st.kept.push({card, kind: want==='S' ? 'sun' : 'eclipse'});
    const events = [];
    const seq = r.cards.map((c,j)=>({c, m:r.meanings[j]})).filter((_,j)=>j!==i);
    const mode = r.mode==='reroll-new' ? 'normal' : r.mode==='reroll-better' ? 'fortune' : r.mode;
    continueSeq(st, seq, mode, ab, events);
    const nr = makeResult(st, seq, mode, {kind:'check', type:r.type, mod:r.mod, dc:r.dc, pen:r.pen, label:r.label},
      r.events.concat(events), r.notes.concat([want==='S' ? 'Crowned: you kept the Sun aside and drew a replacement card.' : 'Sting: you kept the Eclipse aside and drew a replacement card.']));
    st.table = nr; finishCollapse(st, events);
    log(st, {what:'keep', r:summary(nr)});
    return nr;
  }
  function playKept(st, kind, opts){
    const i = st.kept.findIndex(k=>k.kind===kind); if (i<0) return null;
    clearTable(st);
    const k = st.kept.splice(i,1)[0];
    let r;
    if (kind==='sun'){
      r = {kind:'check', type:'attack', mode:'normal', cards:[k.card], meanings:['H'], keep:[0], nat:20, total:20, pen:penalty(st), mod:opts.mod, dc:opts.dc,
        notes:['Crowned: you played your kept Sun as your draw. It counts as a natural 20.'], events:[], label:'Kept Sun'};
      st.checks++;
    } else {
      r = {kind:'played', cards:[k.card], meanings:['L'], keep:[0], nat:1, total:null, notes:['Sting: the GM’s next draw for this enemy’s check is a natural 1. Tell the GM before they draw.'], events:[], label:'Kept Eclipse'};
    }
    st.table = r;
    log(st, {what:'kept', r:summary(r)});
    return r;
  }

  /* Dream Tide (Pisces): swap one card of a failed check for the top card of your deck, unseen. */
  function dreamTide(st, idx, ab){
    const r = st.table; if (!r || !r.cards[idx]) return null;
    st.uses.day.pisces = true;
    const events = [];
    const c = drawOne(st, ab, events); if (!c) return null;
    st.discard.push(r.cards[idx]);
    const seq = r.cards.map((x,j)=>({c:x, m:r.meanings[j]}));
    const out = r.cards[idx];
    seq[idx] = {c, m:meaning(c, st.fx)};
    return rejudge(st, r, seq, events, `Dream Tide: you swapped the ${cardName(out)} for the top card of your deck.`, ab);
  }
  /* Sift (Virgo): swap one card of the check for the top card of your discard pile. */
  function sift(st, idx, ab){
    const r = st.table; if (!r || !r.cards[idx] || !st.discard.length) return null;
    st.uses.day.virgo = true;
    const c = st.discard.pop(), out = r.cards[idx];
    st.discard.push(out);
    const seq = r.cards.map((x,j)=>({c:x, m:r.meanings[j]}));
    seq[idx] = {c, m:meaning(c, st.fx)};
    return rejudge(st, r, seq, [], `Sift: you swapped the ${cardName(out)} for the ${cardName(c)} from your discard pile.`, ab);
  }
  function rejudge(st, r, seq, events, note, ab){
    // After a swap the check is judged again with the same rule; a Joker counts as usual.
    const mode = r.mode==='fortune' || r.mode==='misfortune' ? r.mode : r.mode==='reroll-better' ? 'fortune' : 'normal';
    // A check that stopped early on a Joker may be short once the Joker is swapped out: finish its draw.
    continueSeq(st, seq, mode, ab, events);
    const nr = makeResult(st, seq, mode, {kind:'check', type:r.type, mod:r.mod, dc:r.dc, pen:r.pen, label:r.label}, r.events.concat(events), r.notes.concat([note]));
    st.table = nr; finishCollapse(st, events);
    log(st, {what:'swap', r:summary(nr)});
    return nr;
  }

  /* Look at the top cards of your deck (Weigh the Odds) and put them back in a new order. */
  function peek(st, n){ return st.draw.slice(-n).reverse(); }         // [top, second, third]
  function reorderTop(st, order){                                      // order: cards, top first
    const n = order.length; st.draw.splice(st.draw.length-n, n, ...order.slice().reverse());
  }
  /* Borrowed Time (wild magic #27): shuffle the top 3 cards of the discard pile back into the deck. */
  function borrowedTime(st){ const back = st.discard.splice(Math.max(0, st.discard.length-3)); st.draw.push(...back); shuffle(st.draw); return back.length; }

  /* Rest and the day. */
  function nightsRest(st){
    st.draw = shuffle(allCards(st)); st.discard = []; st.table = null; st.held = []; st.kept = []; st.pending = null;
    st.level = 0; st.collapsed = false; st.collapseAfter = false; st.deckOuts = 0; st.checks = 0; st.day++;
    st.uses = {day:{}, enc:{}}; st.pendingFortune = false; st.inEncounter = false; st.fx = {};
    log(st, {what:'rest'});
  }
  function wake(st){ if (st.collapsed || st.level>=4){ st.collapsed = false; st.level = 3; log(st, {what:'wake'}); } }
  function grandAlignment(st){
    clearTable(st);
    st.draw.push(...st.discard.splice(0)); shuffle(st.draw);
    st.level = 0; st.collapsed = false; st.fx.nextNat = 20;
    log(st, {what:'grand'});
  }
  function startEncounter(st){ st.uses.enc = {}; st.inEncounter = true; log(st, {what:'encounter'}); }
  function endEncounter(st){ st.inEncounter = false; st.fx.sunBreaks = false; st.fx.suddenEclipse = false; st.fx.dayForNight = false; st.fx.nextNat = null; st.fx.nextMode = null; log(st, {what:'endencounter'}); }
  function setLevel(st, L){ st.level = Math.max(0, Math.min(4, L)); st.collapsed = st.level>=4; }

  /* ---------- judging a result ---------- */
  // game 'paizo': four degrees; a Sun steps up, an Eclipse steps down.
  // game 'classic': sub '5e' or '35'. Attacks: only the Sun crits.
  const DEG = ['Critical failure','Failure','Success','Critical success'];
  const DEG_ATTACK = ['Critical miss','Miss','Hit','Critical hit'];
  function judge(r, game, sub){
    if (r.total==null) return null;

const ECL_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1.6 2.2"/><circle cx="12" cy="12" r="6.5" fill="currentColor"/></svg>';
function card(c, o={}){
  if (o.back) return `<div class="pc back ${o.size||''}" role="img" aria-label="Face-down card"></div>`;
  if (!c) return '';
  const cls = ['pc', o.size||'', o.dim?'dim':'', o.deal!=null?'deal':''].filter(Boolean);
  const st = o.deal!=null ? ` style="animation-delay:${o.deal*85}ms"` : '';
  const lab = ` role="img" aria-label="${esc(P.cardName(c))}${o.dim?' (not counted)':''}"`;
  if (c.r==='S') return `<div class="${cls.join(' ')} joker sun"${st}${lab}>${SUN_SVG}<b>Sun</b><small>natural 20</small></div>`;
  if (c.r==='E') return `<div class="${cls.join(' ')} joker eclipse"${st}${lab}>${ECL_SVG}<b>Eclipse</b><small>natural 1</small></div>`;
  const red = P.RED(c.s), rank = c.r===1 ? 'A' : c.r;
  if (P.isFace(c)) cls.push('face');
  if (red) cls.push('red');
  return `<div class="${cls.join(' ')}"${st}${lab}><span class="ix" aria-hidden="true">${rank}<i>${c.s}&#xFE0E;</i></span><span class="ctr" aria-hidden="true">${P.isFace(c) ? rank+'<i>'+c.s+'&#xFE0E;</i>' : rank}</span><span class="ix b" aria-hidden="true">${rank}<i>${c.s}&#xFE0E;</i></span></div>`;
}
const mini = cards => `<span class="minirow">${cards.map(c=>card(c,{size:'sm'})).join('')}</span>`;
const plural = (n,w,ws) => `${n} ${n===1?w:(ws||w+'s')}`;
const signed = n => n>0 ? '+'+n : n<0 ? '−'+Math.abs(n) : '0';
function stepper(id, val, act, label){
  return `<div class="stepper" role="group" aria-label="${esc(label)}"><button type="button" data-act="${act}" data-d="-1" aria-label="Lower ${esc(label)}">−</button><input id="${id}" class="mono" type="number" inputmode="numeric" value="${esc(val)}" data-bind="${act}" aria-label="${esc(label)}"><button type="button" data-act="${act}" data-d="1" aria-label="Raise ${esc(label)}">+</button></div>`;
}
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(ui.toastT); ui.toastT = setTimeout(()=>t.hidden = true, 2200); }
function copy(text, msg){
  try { navigator.clipboard.writeText(text).then(()=>toast(msg||'Copied'), ()=>toast('Select the text and copy it yourself')); } catch(e){ toast('Select the text and copy it yourself'); }
}

/* ---------------- shell ---------------- */
function renderShell(){
  const nav = TABS.map(([k,l])=>`<button type="button" data-act="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${ICONS[k]}<span>${l}</span></button>`).join('');
  $('tabs').innerHTML = nav; $('toptabs').innerHTML = nav;
  ['paizo','classic'].forEach(g=>{ const b = $('g-'+g); b.setAttribute('aria-checked', String(S.game===g)); b.tabIndex = S.game===g ? 0 : -1; });
  const t = themeNow(); if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  syncBars();
}
/* Light or dark. "Auto" follows the device: in the Android app the phone says which (the page can't always tell). */
function themeNow(){
  const th = S.settings.theme;
  if (th==='light' || th==='dark') return th;
  const N = window.StarSignNative;
  if (N && typeof N.isNight==='function'){ try { return N.isNight() ? 'dark' : 'light'; } catch(e){} }
  return '';
}
/* The phone's status bar and navigation bar take the page's colours (Android app), and so does the browser's bar (website). */
let barsKey = '';
function syncBars(){
  const root = document.documentElement, cs = getComputedStyle(root);
  const dark = root.getAttribute('data-theme')==='dark' || (!root.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const top = cs.getPropertyValue('--bg').trim(), bottom = (innerWidth >= 900 ? cs.getPropertyValue('--bg') : cs.getPropertyValue('--surface')).trim();
  const key = [top, bottom, dark].join('|'); if (key===barsKey || !top) return; barsKey = key;
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', top);
  const N = window.StarSignNative;
  if (N && typeof N.setBars==='function'){ try { N.setBars(top, bottom, dark); } catch(e){} }
}
window.__themeChanged = () => { if (S) renderShell(); };
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>window.__themeChanged()); } catch(e){}
addEventListener('resize', ()=>{ if (S) syncBars(); });
let rendering = false;
function render(){
  if (rendering){ queueMicrotask(render); return; }
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
}
function renderNow(){
  syncLab(); renderShell();
  const v = $('view');
  const html = S.tab==='build' ? viewBuild() : S.tab==='gm' ? viewGM() : S.tab==='rules' ? viewRules() : viewPlay();
  v.innerHTML = html;
  after();
  flush();
}
function noteWild(){
  const fs = S.fate && S.fate[G()];
  if (!fs || !fs.wild || !fs.wild.row || fs.wild.noted) return;
  fs.wild.noted = true; fs.wild.level = memberLevel(fs.wild.destined) || fs.wild.level || null;
  sendWild(fs);
}
function after(){
  if (S.tab==='gm') noteWild();
  if (LIVE.role==='player'){ sendPresence(); lanSave(); }
  if (ui.scrollTable){ ui.scrollTable = false; const t = document.querySelector('.table'); if (t){ const r = t.getBoundingClientRect(), vh = window.innerHeight - (window.innerWidth<900 ? 80 : 0); if (r.top < 70 || r.bottom > vh) t.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); } }
  if (S.tab==='build') scheduleFixes();
  if (S.tab==='rules') rulesAfter();
}

function pendingNote(deck, st){
  const notes = [];
  const ab = abOn();
  if (ab && deck.ability==='capricorn' && st.pendingFortune) notes.push('Second Ascent: your next check is a fortune check.');
  if (ab && deck.ability==='aries' && !st.uses.enc.aries) notes.push('First Blood: your next attack is a fortune check.');
  if (st.fx.nextNat) notes.push(st.fx.nextNat===20 ? 'Crown of Fortune: your next check is a natural 20.' : 'Crown of Ruin: your next check is a natural 1.');
  if (st.fx.nextMode) notes.push(st.fx.nextMode==='fortune' ? 'Fortune’s Turn: your next check is a fortune check.' : 'Ill Fortune: your next check is a misfortune check.');
  if (st.fx.dayForNight) notes.push('Day for Night: Suns and Eclipses swap meanings until the encounter ends.');
  if (st.fx.sunBreaks) notes.push('Sun Breaks Through: your next Eclipse counts as a Sun.');
  if (st.fx.suddenEclipse) notes.push('Sudden Eclipse: your next Sun counts as an Eclipse.');
  return notes.length ? `<div class="callout gold">${notes.map(esc).join('<br>')}</div>` : '';
}

function resultBlock(r, opts={}){
  const game = G(), sub = S.sub;
  const j = r.total!=null ? P.judge(r, game, sub) : null;
  const drop = i => r.keep && r.keep.length && !r.keep.includes(i);
  const pickable = opts.pick;
  const cardsHtml = r.cards.map((c,i)=>{
    const inner = card(c, {size:'lg', dim: r.kind==='check' && drop(i), deal: opts.deal ? i : null});
    return pickable ? `<button type="button" class="pcbtn" data-act="${pickable}" data-i="${i}" aria-label="Swap the ${esc(P.cardName(c))}">${inner}</button>` : inner;
  }).join('');
  let h = `<div class="tres"><div class="fan">${cardsHtml || '<span class="muted">No cards drawn</span>'}</div>`;
  if (r.total!=null){
    const nat = r.nat===20 ? 'natural 20' : r.nat===1 ? 'natural 1' : 'card total';
    h += `<div class="total"><span class="k">${nat}</span><span class="n">${r.total}</span></div>`;
    if (j && (r.mod || r.pen || (r.extras&&r.extras.length) || j.dc!=null && j.dc!=='')){
      const parts = [`<b>${r.total}</b>`]; if (+r.mod) parts.push(`${+r.mod<0?'−':'+'} ${Math.abs(+r.mod)}`); for (const x of (r.extras||[])) parts.push(`+ ${x.v} <span class="small">(d${x.die})</span>`); if (r.pen) parts.push(`− ${r.pen} <span class="small">(${W().exh})</span>`);
      h += `<div class="total"><span class="k">result</span><span class="n">${j.value}${j.dc!=null && j.dc!=='' && !isNaN(+j.dc) ? `<small>vs ${r.type==='attack'?'AC':'DC'} ${+j.dc}</small>` : ''}</span></div>`;
      h += `</div><p class="math">${parts.join(' ')} = <b>${j.value}</b></p><div class="tres">`;
    }
    if (j && j.label) h += `<span class="verdict ${j.good?'good':'bad'} ${(j.deg===3||j.crit)?'crit':''}">${esc(j.label)}</span>`;
  }
  h += '</div>';
  return {h, j};
}
function eventNotes(r){
  const w = W(), out = [];
  for (const e of (r.events||[])){
    if (e.kind==='deckout') out.push(e.gained ? `<p class="exh"><b>Deck-out.</b> You drew your deck’s last card, reshuffled your discard pile into a new deck and are now <b>${w.lvl(e.level)}</b>${e.level<4?`: −${2*e.level} to your checks, starting with your next check`:''}.</p>` : '');
    if (e.kind==='unyielding') out.push(`<p class="gold"><b>Deck-out, Unyielding.</b> You reshuffled without gaining a level of ${w.exh} (once until your ${w.restl}).</p>`);
    if (e.kind==='collapse') out.push(`<p class="bad"><b>${w.lvl(4)}: you collapse.</b> Finish this check, then fall unconscious.</p>`);
  }
  for (const n of (r.notes||[])) out.push(`<p>${esc(n)}</p>`);
  return out.join('');
}
function tableHTML(deck, st){
  const w = W(), ab = abOn(), r = st.table;
  const lbl = r ? tableLabel(r) : 'Your table';
  let h = `<section class="table" aria-labelledby="table-h" aria-live="polite"><div class="th"><span class="lbl" id="table-h">${lbl}</span><span class="lbl">${st.draw.length} in deck</span></div>`;
  if (st.pending){
    const c = st.pending.seq[0].c;
    h += `<div class="tres"><div class="fan">${card(c,{size:'lg',deal:0})}${card(null,{back:true,size:'lg'})}</div><p style="flex:1 1 220px">Loose Arrow: you can discard this first card and draw a new one, once this encounter.</p></div>
      <div class="tact"><button class="btn primary" data-act="loose" data-swap="1">Loose Arrow: draw a new first card</button><button class="btn" data-act="loose" data-swap="0">Keep it, draw the second card</button></div>`;

    h += `<div class="idle"><div class="fan">${card(null,{back:true,size:'lg'})}</div><p>Your deck is shuffled. Pick what the check is, set your modifier and tap <b>Draw a check</b>. Cards land here.</p></div>`;

    h += `<div class="tnotes">${eventNotes(r)}<p>Twin Draw: choose which check counts. Both are discarded.</p></div>`;
    return h + '</section>';
  }
  if (r.kind==='cast' || r.kind==='burn'){
    h += `<div class="tres"><div class="fan">${r.cards.map((c,i)=>card(c,{size:'lg',dim:true,deal:i})).join('')}</div><p style="flex:1 1 220px">${r.kind==='cast' ? `Casting cost: ${plural(r.cards.length,'card')} discarded unused, whatever they are.` : `${plural(r.cards.length,'card')} burned: discarded unused.`}</p></div>`;

    return h + '</section>';
  }
  if (r.kind==='played'){
    h += `<div class="tres"><div class="fan">${card(r.cards[0],{size:'lg',deal:0})}</div></div><div class="tnotes">${eventNotes(r)}</div>`;
    return h + '</section>';
  }
  const pick = ui.pick==='dream' ? 'dream-pick' : ui.pick==='sift' ? 'sift-pick' : null;
  const b = resultBlock(r, {deal: ui.fresh, pick});
  h += b.h;
  h += `<div class="tnotes">${eventNotes(r)}</div>`;
  // follow-ups
  if (ui.pick==='dream') h += `<div class="tact"><span class="small" style="color:var(--sky-muted)">Tap the card to swap for the top card of your deck.</span><button class="btn sm" data-act="pick-cancel">Cancel</button></div>`;
  else if (ui.pick==='sift'){ const top = st.discard[st.discard.length-1]; h += `<div class="tact" style="align-items:center"><span class="pickcard">${card(top,{size:'md'})}Top of your discard</span><span class="small" style="color:var(--sky-muted);flex:1 1 180px">Tap one of the check’s cards to swap it for this card, or cancel.</span><button class="btn sm" data-act="pick-cancel">Cancel</button></div>`; }
  else if (r.total!=null){
    const acts = [];
    acts.push(`<button class="btn sm" data-act="reroll" data-how="new">Reroll: ${w.rNew.toLowerCase()}</button>`);
    acts.push(`<button class="btn sm" data-act="reroll" data-how="better">Reroll: ${w.rBetter.toLowerCase()}</button>`);
    if (isP()) acts.push(`<button class="btn sm" data-act="hero-reroll" ${st.hero>0?'':'disabled'}>Spend a Hero Point</button>`);
    else acts.push(`<button class="btn sm" data-act="insp-reroll" ${st.inspiration?'':'disabled'}>Use Heroic Inspiration</button>`);

    const f = flips.find(([hi,lo,p])=>p<=need && c[hi-1]>0);
    if (!f) break;
    c[f[0]-1]--; c[f[1]-1]++; need -= f[2];
  }
  if (need!==0) return 'Couldn’t pay it with flips alone; try the fixes in the Lab test.';
  d.c = c; return 'Paid: the pip total now matches.';
}

/* ---------- The hotspot table: the GM's Android phone hosts it; no internet needed. ----------
   The GM's app runs a small server. Android players connect through the app; any other phone
   opens the GM's address in its browser and gets the whole app from the GM's phone. */
const LAN = HOST==='android' || HOST==='lan';
const LAN_PORT = 8765;
const NATIVE = () => window.StarSignNative || null;
let lanSink = null;
window.__lanRecv = function(kind, text){ if (lanSink) lanSink(kind, text); };
function lanTransport(host, port){
  let handler = ()=>{};
  if (HOST==='android'){
    const n = NATIVE();
    const t = {send: x => { try { n.lanSend(x); } catch(e){} }, close: () => { if (lanSink===sink) lanSink = null; try { n.lanClose(); } catch(e){} }, on: fn => { handler = fn; }};
    const sink = (k, x) => handler(k, x); lanSink = sink;
    setTimeout(()=>{ try { n.lanConnect(String(host), +port); } catch(e){ handler('close', 'The app couldn’t open a connection.'); } }, 0);
    return t;
  }
  let ws = null;
  try { ws = new WebSocket(`ws://${host}:${port}/ws`); } catch(e){ setTimeout(()=>handler('close', 'Couldn’t connect.'), 0); return {send(){}, close(){}, on(fn){ handler = fn; }}; }
  ws.onopen = () => handler('open');
  ws.onmessage = e => handler('msg', String(e.data));
  ws.onclose = () => handler('close', 'connection lost');
  return {send: x => { try { if (ws.readyState===1) ws.send(x); } catch(e){} }, close: () => { try { ws.close(); } catch(e){} }, on: fn => { handler = fn; }};
}
// The same shape as the Claude live table, so the rest of the app doesn't care which one it has.
function lanTable(host, port, role){
  const T = {me:null, peersList:[], ph:new Set(), th:{}, ch:new Set(), conn:false, mine:{}, left:false, tr:null, retry:null, saves:[], onSaves:null, onState:null, onDenied:null, resolve:null, reject:null};
  const toPeer = p => { let pr = {}; try { pr = JSON.parse(p.presence); if (!pr || typeof pr!=='object' || Array.isArray(pr)) pr = {}; } catch(e){}
    return Object.freeze({peer:String(p.peer), by:null, isMe:p.peer===T.me, sameTab:p.peer===T.me, kind:'viewer', guest:false, role:p.role==='gm'?'gm':'player', presence:Object.freeze(pr), updatedAt:+p.at||Date.now()}); };
  function connect(){
    const tr = T.tr = lanTransport(host, port);
    tr.on((k, x)=>{
      if (T.tr!==tr) return;
      if (k==='open'){
        T.conn = true; tr.send('hello\n'+role);
        if (Object.keys(T.mine).length) tr.send('presence\n'+JSON.stringify(T.mine));
        T.ch.forEach(f=>f(true));
        if (T.resolve){ T.resolve(); T.resolve = T.reject = null; }
      } else if (k==='msg'){

        else if (m.t==='peers' && Array.isArray(m.peers)){ T.peersList = m.peers.slice(0, 64).map(toPeer); const ch = {peers:T.peersList, joined:[], left:[], updated:[]}; T.ph.forEach(f=>f(ch)); }
        else if (m.t==='emit'){ let d = null; try { d = JSON.parse(m.data); } catch(e){} const msg = {topic:String(m.topic), data:d, peer:String(m.from), isMe:m.from===T.me, sameTab:m.from===T.me}; (T.th[msg.topic]||[]).forEach(f=>f(msg)); }
        else if (m.t==='saves' && Array.isArray(m.names)){ T.saves = m.names.slice(0, 60).map(n=>clean(n,40)).filter(Boolean); if (T.onSaves) T.onSaves(T.saves); }
        else if (m.t==='state' && typeof m.data==='string'){ if (T.onState) T.onState(clean(m.name,40), m.data); }

  let h = `<div class="view"><div class="vhead"><div><p class="eyebrow">Rules · ${W().game}</p><h1>${esc(B.title)}</h1></div>

    <div class="prose" id="prose" lang="en">${q ? `<p class="note" style="margin-bottom:14px">${secs.length ? `${plural(secs.length,'section')} mention “${esc(q)}”.` : `Nothing mentions “${esc(q)}”. Try a shorter word.`}</p>` : ''}${secs.map(s=>`<section id="${s.id}">${s.html}</section>`).join('')}</div></div></div>`;

function rulesAfter(){
  const q = (S.rules.q||'').trim(); if (q.length<2) return;
  const host = $('prose'); if (!host) return;
  for (const sec of host.querySelectorAll('section')) walkMark(sec, q);
}
function walkMark(host, q){
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  const walk = n => { for (const c of [...n.childNodes]){ if (c.nodeType===3){ if (re.test(c.nodeValue)){ re.lastIndex = 0; const span = document.createElement('span'); span.innerHTML = esc(c.nodeValue).replace(re, m=>`<mark>${m}</mark>`); c.replaceWith(...span.childNodes); } re.lastIndex = 0; } else if (c.nodeType===1 && !/^(MARK|SCRIPT|STYLE)$/.test(c.tagName)) walk(c); } };
  walk(host);
}

const ACT = {
  tab(el){ S.tab = el.dataset.tab; ui.pick = null; ui.confirm = null; render(); $('view').focus({preventScroll:true}); window.scrollTo(0,0); },
  // --- play: setup
  type(el){ withDeck((d,st)=>{ st.input.type = el.dataset.type; }); render(); },
  mod(el){ withDeck((d,st)=>{ const t = st.input.type; st.input.mods[t] = (+st.input.mods[t]||0) + (+el.dataset.d); }); render(); },
  hero(el){ withDeck((d,st)=>{ const n = +el.dataset.n; st.hero = st.hero===n ? n-1 : n; }); render(); },
  insp(){ withDeck((d,st)=>{ st.inspiration = !st.inspiration; }); render(); },
  draw(el){ withDeck((d,st)=>{ const o = inputs(st); P.check(st, Object.assign(o, {mode:el.dataset.mode}), abOn()); dealt(); }); render(); },
  loose(el){ withDeck((d,st)=>{ P.resolveLoose(st, el.dataset.swap==='1', abOn()); dealt(); }); render(); },
  hold(){ withDeck((d,st)=>{ P.hold(st, 'normal', abOn()); ui.pick = null; toast('Held draw set aside'); }); render(); },

};
const RERENDER_ON_CHANGE = new Set(['mod','dc','gmod','gdc','flatdc','count','jk-R','jk-B','ability','st-size']);
const RERENDER_ON_INPUT = new Set(['wmq','rulesq']);
function nmBind(name){ const m = name.match(/^dmg-(n|b|die|times)-(p|g)$/); return m; }

document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.disabled) return;
  const name = el.dataset.act;
  // damage steppers share one handler
  const m = name.match(/^dmg-(n|b|times)-(p|g)$/);
  if (m){ const o = m[2]==='g' ? S.gm.dmg : S.dmg; const key = {n:'n', b:'bonus', times:'times'}[m[1]]; o[key] = (+o[key]||0) + (+el.dataset.d); if (key==='n') o.n = Math.max(1, Math.min(60, o.n)); if (key==='times') o.times = Math.max(2, Math.min(10, o.times)); render(); return; }
  const fn = ACT[name]; if (fn){ fn(el, ev); }
});
document.addEventListener('input', ev=>{
  const el = ev.target.closest('[data-bind]'); if (!el) return;
  const name = el.dataset.bind;
  const m = name.match(/^dmg-(n|b|die|times)-(p|g)$/);
  if (m){ const o = m[2]==='g' ? S.gm.dmg : S.dmg; const key = {n:'n', b:'bonus', die:'die', times:'times'}[m[1]]; const v = +el.value; if (!isNaN(v)) o[key] = v; save(); return; }
  const fn = BIND[name]; if (fn) fn(el);
  if (RERENDER_ON_INPUT.has(name)){ clearTimeout(el._t); el._t = setTimeout(()=>{ const pos = el.selectionStart; render(); const again = $(el.id); if (again){ again.focus(); try { again.setSelectionRange(pos,pos); } catch(e){} } }, 220); }
});
document.addEventListener('change', ev=>{
  const el = ev.target.closest('[data-bind]'); if (!el) return;
  const name = el.dataset.bind;
  if (/^dmg-(n|b|die|times)-(p|g)$/.test(name)){ render(); return; }
  if (name==='switch-deck' || name==='rulesjump') return;
  if (RERENDER_ON_CHANGE.has(name)){ if (name==='st-size'){ render(); return; } ui.fixes = null; render(); }
});
document.addEventListener('keydown', ev=>{
  if (ev.key==='Escape' && $('sheet-root').innerHTML) closeSettings();
  if (ev.key==='Enter' && ev.target && ev.target.id==='code-in'){ ev.preventDefault(); ACT['load-code'](); }
});
$('open-settings').addEventListener('click', openSettings);
$('gamesw').addEventListener('click', ev=>{ const b = ev.target.closest('button[data-game]'); if (!b || S.game===b.dataset.game) return; S.game = b.dataset.game; ui.pick = null; ui.fixes = null; ui.confirm = null; ui.libra = null; ui.glimpse = null; render(); toast(`${W().game} rules`); });
$('gamesw').addEventListener('keydown', ev=>{ if (!['ArrowLeft','ArrowRight'].includes(ev.key)) return; ev.preventDefault(); S.game = S.game==='paizo' ? 'classic' : 'paizo'; render(); $('g-'+S.game).focus(); });

/* ---------------- boot ---------------- */
function firstRun(){
  // A working table from the first second: an example deck, clearly marked, ready to draw.
  const s = signDeck('libra', 'paizo');
  const d = makeDeck({name:'Example: Libra deck', game:'paizo', c:s.c, R:s.R, B:s.B, ability:s.ability, sign:'libra', ex:true});
  S.decks.push(d); S.active.paizo = d.id; S.firstRun = false;
}
function migrate(){
  // Older saves named party members by id; draws and wild magic now carry the character's name.
  const ids = Object.fromEntries((S.gm.party||[]).map(p=>[p.id, p.name]));
  if (S.gm.who && ids[S.gm.who]) S.gm.who = ids[S.gm.who];
  for (const g of ['paizo','classic']){ const fs = S.fate && S.fate[g]; if (!fs) continue;
    for (const x of (fs.sets||[])) if (ids[x.who]) x.who = ids[x.who];
    if (fs.wild && ids[fs.wild.destined]) fs.wild.destined = ids[fs.wild.destined]; }
  for (const k of ['showLocal','enc','hosting']) if (S.gm[k]===undefined) S.gm[k] = false;
  for (const d of S.decks) if (!d.level) d.level = 1;
}
async function liveBoot(){
  if (LAN){
    LIVE.avail = true;
    if (HOST==='android'){ if (S.gm.hosting) await hostLan(); else if (S.table && S.table.lan) await joinLan(S.table.lan, true); }
    else { ui.pickSave = !S.decks.some(d=>!d.ex); await joinLan(location.host || ('localhost:'+LAN_PORT)); }
    liveRefresh(); return;
  }
  if (HOST==='web' || HOST==='file'){ LIVE.avail = false; liveRefresh(); return; }
  const room = await roomNS();
  if (!room){ liveRefresh(); return; }
  if (S.gm.hosting) await hostTable();
  else if (S.table && S.table.code) await joinTable(S.table.code);
  liveRefresh();
}
function start(hot){
  S = (hot && hot.v===1) ? Object.assign(fresh(), hot) : (load() || fresh());
  if (S.firstRun) firstRun();
  migrate();
  const h = (location.hash||'').replace('#','');
  if (['play','build','gm','rules'].includes(h)) S.tab = h;
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(()=>S); } catch(e){}
  render();
  liveBoot();
  dlBoot();
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data);
} catch(e){ start(null); }
})();

</script>

<script>
if ('serviceWorker' in navigator && window.SST_HOST==='web' && (location.protocol==='https:' || location.hostname==='localhost')) addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); } catch(e){}
</script>
