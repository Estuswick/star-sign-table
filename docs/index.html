<script type="application/json" id="rules-data">{"ae":{"core":{"title":"Aces & Eclipses Core Rulebook","sections":[{"id":"ae-how-to-use-this-book","title":"How to Use This Book","html":"\u003ch2 id=\"ae-how-to-use-this-book-how-to-use-this-book\">How to Use This Book\u003c/h2>\n\u003cp class=\"edition\">\u003cem>Second release · 3 October 2026\u003c/em>\u003c/p>\n\u003cp>Aces &amp; Eclipses is a fantasy roleplaying game played with cards instead of dice. Every check is two cards drawn and added. Each player draws from a deck tuned to their star sign, the GM draws from the Fate Deck, whose face cards feed wild magic when the table plays with it, and damage comes from a shared damage deck.\u003c/p>\n\u003cp>This book holds the game's engine: the card rules every other rule runs on. It covers how a check is drawn and what it achieves, what luck costs, how characters tire and rest, how damage is dealt, the twelve star-sign decks, how to build a deck of your own, and wild magic. Characters, actions, spells, conditions and traits (Strikes, saving throws, Hero Points, dying and the rest) come from the four-degrees-of-success rules the game is built on, credited in Appendix C; the rules here say how the cards run them.\u003c/p>\n\u003cp>The rules chapters say what to do at the table. The numbers behind them are gathered at the back of the book, in Part Four, The Math, for anyone who wants them. Nothing there is needed to play.\u003c/p>\n\u003cp>Three tools go with these rules. The \u003cstrong>Aces &amp; Eclipses Companion App\u003c/strong> puts the game on your phone: each player's deck to draw from, the deck builder with the Lab test, the GM's Fate Deck with wild magic, the damage deck, and this whole book to search. The \u003cstrong>Star-Sign Deck Lab\u003c/strong> builds and tests any player deck, applies sign-ability prices, and can switch abilities off. The \u003cstrong>Fate Deck page\u003c/strong> lays out the Fate Deck and resolves wild magic.\u003c/p>\n\u003cp>The book has four parts. \u003cstrong>Playing\u003c/strong> covers every check and luck rule, the Fate Deck and damage. \u003cstrong>Decks\u003c/strong> presents the twelve star-sign decks and their abilities, and shows how to build your own. \u003cstrong>Running the Game\u003c/strong> covers wild magic (an optional rule) and pacing. \u003cstrong>The Math\u003c/strong>, at the back, shows how the decks are balanced; you never need it at the table. Four appendices hold a quick reference, a glossary, the licenses and the Aces &amp; Eclipses Compatibility License.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Part One, Playing:\u003c/strong> 1 Components · 2 Checks · 3 Casting costs · 4 Exhaustion and rest · 5 Flat checks · 6 Fortune, misfortune, rerolls and Hero Points · 7 Held draws · 8 Companions and other minions · 9 The Fate Deck · 10 Damage\u003c/li>\n\u003cli>\u003cstrong>Part Two, Decks:\u003c/strong> 11 The twelve star-sign decks · 12 Star-sign abilities · 13 Building your own deck\u003c/li>\n\u003cli>\u003cstrong>Part Three, Running the Game:\u003c/strong> 14 Wild magic · 15 Pacing the day · 16 Watch in playtesting\u003c/li>\n\u003cli>\u003cstrong>Part Four, The Math:\u003c/strong> 17 The standard day and the balance rules · 18 What a two-card draw can and can't do · 19 Why the average isn't enough · 20 The sign decks against a d20 · 21 Checks and luck against a d20 · 22 The damage deck against dice · 23 Pricing the abilities · 24 How sure the build table is · 25 Wild magic odds\u003c/li>\n\u003cli>\u003cstrong>Appendices:\u003c/strong> A Quick reference: every card rule · B Glossary · C Licenses\u003c/li>\n\u003c/ul>\n"},{"id":"ae-1-components","title":"1. Components","html":"\u003ch2 id=\"ae-1-components-1-components\">1. Components\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Deck\u003c/th>\n\u003cth>Who uses it\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Built from\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Player deck\u003c/strong>\u003c/td>\n\u003ctd>Each player: a sign deck, or a custom deck they build (chapter 13)\u003c/td>\n\u003ctd>45–90: Ace to 10 plus Suns and Eclipses\u003c/td>\n\u003ctd>2–8 standard packs, depending on the deck\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Fate Deck\u003c/strong>\u003c/td>\n\u003ctd>The GM, for monsters, minions and flat checks\u003c/td>\n\u003ctd>100: Ace to 10, 3 Suns and 3 Eclipses; 112 with wild magic, which adds the 12 face cards\u003c/td>\n\u003ctd>5 standard packs (face cards from one)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Damage deck\u003c/strong>\u003c/td>\n\u003ctd>Shared by the table; players may keep a personal copy\u003c/td>\n\u003ctd>42: Ace to 10 in four suits plus 2 Jokers\u003c/td>\n\u003ctd>1 standard pack, face cards removed\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Aces count as 1. A standard pack has four of each rank and usually one colored and one black Joker. \u003cstrong>The colored Joker is the Sun and the black one the Eclipse\u003c/strong>; the rules use those names, and &quot;Joker&quot; means either. No dice are needed.\u003c/p>\n","part":"Part One · Playing"},{"id":"ae-2-checks","title":"2. Checks","html":"\u003ch2 id=\"ae-2-checks-2-checks\">2. Checks\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Draw one card at a time, two in all, and add them.\u003c/strong> The sum is your \u003cstrong>card total\u003c/strong> (2–20). Add your modifier to get the check's result, and compare it with the DC:\n\u003cul>\n\u003cli>\u003cstrong>Meet or beat the DC:\u003c/strong> success. \u003cstrong>Beat it by 10 or more:\u003c/strong> critical success.\u003c/li>\n\u003cli>\u003cstrong>Fall short of it:\u003c/strong> failure. \u003cstrong>Fall short by 10 or more:\u003c/strong> critical failure.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>A Joker ends the draw.\u003c/strong>\n\u003cul>\n\u003cli>\u003cstrong>The Sun:\u003c/strong> natural 20. It counts as a card total of 20 and improves the degree of success by one step.\u003c/li>\n\u003cli>\u003cstrong>The Eclipse:\u003c/strong> natural 1. It counts as a card total of 1 and worsens the degree of success by one step.\u003c/li>\n\u003cli>If the first card is a Joker, don't draw the second; the check costs only one card. A Joker drawn second still counts.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Players draw from their own deck\u003c/strong> for their own checks: attacks, saves, skill checks, Perception and initiative. \u003cstrong>The GM draws from the Fate Deck\u003c/strong> for monsters' checks, minions' checks (chapter 8), all flat checks, and \u003cstrong>secret checks\u003c/strong> (Recall Knowledge, Seek, Sense Motive and other checks with the secret trait). For a secret check, the GM draws face-down and adds the player's modifier; it costs the player no cards, and fortune, misfortune and rerolls on it use Fate Deck cards.\u003c/li>\n\u003cli>\u003cstrong>Discard drawn cards face-down.\u003c/strong> Nobody looks back through a discard pile, so knowing what's left in a deck takes memory.\u003c/li>\n\u003c/ol>\n\u003cp>A check costs 2 cards, or 1 when the first card is a Joker.\u003c/p>\n"},{"id":"ae-3-casting-costs","title":"3. Casting costs","html":"\u003ch2 id=\"ae-3-casting-costs-3-casting-costs\">3. Casting costs\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>A cantrip costs 1 card. Any other spell, including focus spells, costs 2, whatever its rank.\u003c/strong> Draw them and discard them unused, whatever they are: a Sun drawn this way is wasted, and an Eclipse is dodged.\u003c/li>\n\u003cli>\u003cstrong>A spell attack is a separate check\u003c/strong> on top of the casting cost: two cards, or one if the first is a Joker.\u003c/li>\n\u003cli>So a spell with a spell attack costs 4 cards (3 when the attack opens on a Joker), and a cantrip with a spell attack costs 3 (2).\u003c/li>\n\u003c/ul>\n"},{"id":"ae-4-exhaustion-and-rest","title":"4. Exhaustion and rest","html":"\u003ch2 id=\"ae-4-exhaustion-and-rest-4-exhaustion-and-rest\">4. Exhaustion and rest\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Drawing the last card of your deck (a deck-out) forces a reshuffle and gives you a level of exhaustion.\u003c/strong> If you need a second card after your deck's last one, reshuffle and draw it from the new deck.\u003c/li>\n\u003cli>\u003cstrong>Exhausted N:\u003c/strong> a −2 penalty per level (−2N) to every check you draw for, starting with your next check. The penalty is untyped, so it stacks with frightened, sickened and other penalties. It doesn't lower your AC or DCs, and it doesn't affect results that ignore all modifiers (such as a fixed result taken instead of drawing).\u003c/li>\n\u003cli>\u003cstrong>Exhausted 3:\u003c/strong> you're also \u003cstrong>fatigued\u003c/strong> (a −1 status penalty to AC and saving throws, and you can't use exploration activities while traveling).\u003c/li>\n\u003cli>\u003cstrong>Exhausted 4 is the maximum: you collapse.\u003c/strong> Finish the check or spell you were drawing for, then fall \u003cstrong>unconscious\u003c/strong>. After 10 minutes of rest you wake up at Exhausted 3, still fatigued. Your next deck-out brings you back to Exhausted 4.\u003c/li>\n\u003cli>\u003cstrong>A night's rest removes all exhaustion and fatigue, and you start the next day with a fresh shuffle.\u003c/strong>\u003c/li>\n\u003cli>Damage decks and the Fate Deck never cause exhaustion; reshuffle them when they run out.\u003c/li>\n\u003c/ul>\n"},{"id":"ae-5-flat-checks","title":"5. Flat checks","html":"\u003ch2 id=\"ae-5-flat-checks-5-flat-checks\">5. Flat checks\u003c/h2>\n\u003cp>Flat checks are pure-luck checks with no modifiers: targeting a concealed (DC 5) or hidden (DC 11) creature, ending persistent damage (DC 15), recovery checks while dying (DC 10 + dying value), and effects such as stupefied, grabbed, deafened and confused.\u003c/p>\n\u003cp>\u003cstrong>The GM draws one card from the Fate Deck.\u003c/strong> A Sun always succeeds and an Eclipse always fails. With wild magic, a face card is set aside and replaced, as on any Fate Deck check (chapter 9). Otherwise the card must meet this number:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Flat check DC\u003c/th>\n\u003cth>Card needed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Any number card\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>2 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>3 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>4 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>DC − 6 (5 for DC 11, up to 10 for DC 16)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>Sun\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Recovery checks while dying\u003c/strong> use this table (dying 1 = DC 11: a 5 or higher). A Sun is a critical success (dying −2) and an Eclipse a critical failure (dying +2).\u003c/li>\n\u003cli>\u003cstrong>Fortune\u003c/strong> on a flat check draws 2 Fate Deck cards and keeps the better; \u003cstrong>misfortune\u003c/strong> keeps the worse. \u003cstrong>A reroll\u003c/strong>, including a Hero Point on a recovery check, draws a new Fate Deck card.\u003c/li>\n\u003cli>Flat checks never cost players cards.\u003c/li>\n\u003c/ul>\n"},{"id":"ae-6-fortune-misfortune-rerolls-and-hero-points","title":"6. Fortune, misfortune, rerolls and Hero Points","html":"\u003ch2 id=\"ae-6-fortune-misfortune-rerolls-and-hero-points-6-fortune-misfortune-rerolls-and-hero-points\">6. Fortune, misfortune, rerolls and Hero Points\u003c/h2>\n\u003cp>Only one fortune and one misfortune effect can apply to a check. If both apply, they cancel and you draw normally.\u003c/p>\n\u003ch3 id=\"ae-6-fortune-misfortune-rerolls-and-hero-points-fortune\">Fortune\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Effect\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Take the better of two checks\u003c/td>\n\u003ctd>\u003cstrong>Draw 3 cards and keep the best pair.\u003c/strong> Draw one at a time; a Sun at any point ends the draw as a natural 20. An Eclipse is the card you drop. Two Eclipses can't both be dropped, so the check is a natural 1.\u003c/td>\n\u003ctd>~2.9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Try again after a bad result\u003c/td>\n\u003ctd>See Rerolls.\u003c/td>\n\u003ctd>+1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skip the draw and take a fixed result\u003c/td>\n\u003ctd>\u003cstrong>Don't draw. Burn 1 card\u003c/strong> (discard it unused) and take the fixed result.\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"ae-6-fortune-misfortune-rerolls-and-hero-points-misfortune\">Misfortune\u003c/h3>\n\u003cp>\u003cstrong>Draw 3 cards and keep the worst pair.\u003c/strong> An Eclipse at any point ends the draw as a natural 1. A Sun is the card you drop; two Suns can't both be dropped, so the check is a natural 20. The player draws from their own deck.\u003c/p>\n\u003ch3 id=\"ae-6-fortune-misfortune-rerolls-and-hero-points-rerolls\">Rerolls\u003c/h3>\n\u003cp>After a failed check, draw a third card. How it combines follows the reroll's wording:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Reroll says\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003cth>Examples\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Use the new result\u003c/strong> (even if it's worse), or doesn't say\u003c/td>\n\u003ctd>\u003cstrong>Keep your most recent card and pair it with the new card.\u003c/strong> Your first card is discarded, and the new card total stands even if it's lower.\u003c/td>\n\u003ctd>Hero Points, and most rerolls from feats and spells\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Use the better result\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Keep the best pair of the three.\u003c/strong>\u003c/td>\n\u003ctd>Rerolls that say to use the better result\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>New card is a Sun:\u003c/strong> natural 20, either way.\u003c/li>\n\u003cli>\u003cstrong>New card is an Eclipse:\u003c/strong> natural 1 for &quot;use the new result&quot;; for &quot;use the better result&quot; it's the lowest card, so you keep your original pair.\u003c/li>\n\u003cli>\u003cstrong>The failed check was an Eclipse:\u003c/strong> make a new check instead.\u003c/li>\n\u003cli>\u003cstrong>A bonus on the reroll\u003c/strong> (say, +2) is added as usual.\u003c/li>\n\u003cli>\u003cstrong>Forcing an enemy to reroll\u003c/strong> (e.g., redirecting an attack to a new target) uses a new check.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-6-fortune-misfortune-rerolls-and-hero-points-hero-points\">Hero Points\u003c/h3>\n\u003cp>Everyone starts each session with 1 Hero Point; the GM awards about 1 more per hour of play; you can have at most 3.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Spend 1:\u003c/strong> after a check, keep your most recent card, draw a new card and pair them. The new card total stands, even if it's worse. It's a fortune effect.\u003c/li>\n\u003cli>\u003cstrong>Spend all (at least 1):\u003c/strong> when your dying condition would increase, lose dying and stabilize at 0 HP instead. No draw.\u003c/li>\n\u003c/ul>\n"},{"id":"ae-7-held-draws","title":"7. Held draws","html":"\u003ch2 id=\"ae-7-held-draws-7-held-draws\">7. Held draws\u003c/h2>\n\u003cp>A held draw is a real draw, set aside face-up and used later in place of drawing. It covers effects that draw a check now and use it later.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kind\u003c/th>\n\u003cth>Covers\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Hold a draw for yourself\u003c/strong>\u003c/td>\n\u003ctd>Effects that draw a check now and use it later\u003c/td>\n\u003ctd>Draw normally and set the cards aside face-up. When you use them, don't draw again; modifiers apply at that moment, including exhaustion gained since. Discard them if the effect ends unused. Held cards are outside your deck, so a reshuffle doesn't return them.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Give a held draw to someone else\u003c/strong>\u003c/td>\n\u003ctd>Effects that draw ahead of time for an ally\u003c/td>\n\u003ctd>The giver draws from their own deck and pays the cards. The recipient uses them with the recipient's own modifiers. An effect that grants a new draw each turn has its target draw that held draw.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Reuse or share a draw\u003c/strong>\u003c/td>\n\u003ctd>Effects that apply one draw to several targets, or one character drawing for a group\u003c/td>\n\u003ctd>The same card total counts again, with no new cards. An effect that reuses a result without its natural 20 or 1 counts a Sun as 20 and an Eclipse as 1, with no change of degree. When one character draws for a group, that character draws once.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Hold a whole check result\u003c/strong>\u003c/td>\n\u003ctd>Effects that make a check now and use its total for a later save\u003c/td>\n\u003ctd>Make the check now and record the total; use it for the later save. Its modifiers are the ones from when it was made.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Lucky number\u003c/strong>\u003c/td>\n\u003ctd>Effects that give a character a lucky number\u003c/td>\n\u003ctd>The GM draws your lucky number from the Fate Deck: a card total, redrawing Jokers. When your card total hits it, reroll with the &quot;use the new result&quot; rule; if the new card total hits it again, you critically fail.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>A held Sun is a natural 20 when used; a held Eclipse a natural 1.\u003c/li>\n\u003cli>Fortune on a held draw: draw 3, keep the best pair, and hold that.\u003c/li>\n\u003cli>Rerolls work on a check that used a held draw; for &quot;use the new result&quot;, your most recent card is the second held card.\u003c/li>\n\u003cli>An effect that lets a character learn the result of one of their secret checks reveals the GM's draw instead.\u003c/li>\n\u003c/ul>\n"},{"id":"ae-8-companions-and-other-minions","title":"8. Companions and other minions","html":"\u003ch2 id=\"ae-8-companions-and-other-minions-8-companions-and-other-minions\">8. Companions and other minions\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Minions draw from the Fate Deck.\u003c/strong> Animal companions, familiars, summoned creatures, anything else with the minion trait, and other creatures a player controls (a hireling, a mount) make their checks with the Fate Deck, as monsters do. The player decides what the minion does; the GM draws, or hands the player the Fate Deck to draw. Minion checks never cost the player cards or cause exhaustion, and their luck effects (fortune, misfortune, rerolls) use Fate Deck cards too.\u003c/li>\n\u003cli>\u003cstrong>Face cards drawn for a minion count toward wild magic,\u003c/strong> when you play with it, like any Fate Deck check made for a player's action. If one completes the fourth set, the Destined is the minion's controller (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Bonded partners are the exception.\u003c/strong> A creature that shares its controller's actions and multiple attack penalty, so that the two act as one character, draws from its controller's deck; together they spend cards at about the rate of one character.\u003c/li>\n\u003cli>\u003cstrong>Damage\u003c/strong> a minion deals uses the players' Joker rule (chapter 10).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>Design note:\u003c/em> Companions and summons would otherwise double their owner's card use and push them into exhaustion early.\u003c/p>\n"},{"id":"ae-9-the-fate-deck","title":"9. The Fate Deck","html":"\u003ch2 id=\"ae-9-the-fate-deck-9-the-fate-deck\">9. The Fate Deck\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Cards\u003c/th>\n\u003cth>Count\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Aces\u003c/td>\n\u003ctd>17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 · 3 · 4 · 5 · 6 · 7 · 8 · 9\u003c/td>\n\u003ctd>12 · 12 · 5 · 5 · 5 · 6 · 7 · 7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10s\u003c/td>\n\u003ctd>18\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Suns / Eclipses\u003c/td>\n\u003ctd>3 / 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>100\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Face cards (J, Q, K of each suit), with wild magic\u003c/td>\n\u003ctd>12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total with wild magic\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>112\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Same draw as the players:\u003c/strong> one card at a time, two in all; a first-card Joker ends the draw.\u003c/li>\n\u003cli>\u003cstrong>Monsters use it\u003c/strong> for their attacks, saves, skill checks and Perception, and monster fortune and misfortune work as for players. \u003cstrong>Players still draw their own checks\u003c/strong>, including saves against monster abilities.\u003c/li>\n\u003cli>\u003cstrong>With wild magic, face cards never change a total.\u003c/strong> When the GM draws one, place it in the wild magic sets and draw a replacement, so the odds come from the other 100 cards either way. About a fifth of Fate Deck checks turn one up.\u003c/li>\n\u003cli>\u003cstrong>No exhaustion.\u003c/strong> Reshuffle when it runs out, about every 52 checks, with wild magic or without. Placed face cards stay out until wild magic goes off.\u003c/li>\n\u003c/ul>\n\u003cp>Face cards feed \u003cstrong>wild magic\u003c/strong>, an optional rule that goes off about once per encounter; the full rule and all 93 combinations are in chapter 14. A table that plays without it leaves the face cards out.\u003c/p>\n"},{"id":"ae-10-damage","title":"10. Damage","html":"\u003ch2 id=\"ae-10-damage-10-damage\">10. Damage\u003c/h2>\n\u003cp>Damage, healing, random durations and random tables all come from the damage deck. Damage is written in die sizes, as in 2d6 or 1d12: each die is one card, read on the die table below.\u003c/p>\n\u003ch3 id=\"ae-10-damage-the-damage-deck\">The damage deck\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>The central damage deck\u003c/strong> is one standard pack with the face cards removed: \u003cstrong>42 cards, Ace to 10 in four suits, plus the 2 Jokers.\u003c/strong> Everyone draws damage from it, monsters included. Both Jokers work the same way here; the Sun and the Eclipse only differ on checks.\u003c/li>\n\u003cli>\u003cstrong>Optional personal damage decks.\u003c/strong> A player may keep their own damage deck instead of drawing from the central one. It holds exactly the same cards as the central deck. Damage decks have no star-sign variants.\u003c/li>\n\u003cli>\u003cstrong>Damage decks never tire you.\u003c/strong> Damage draws never come from a player deck and never cause exhaustion. When a damage deck runs out, reshuffle it and keep going.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>Design note:\u003c/em> Why damage stays out of player decks: every hit would burn cards, so characters would tire faster as they level, and each deck's shape would skew its damage.\u003c/p>\n\u003ch3 id=\"ae-10-damage-reading-a-card-as-a-die\">Reading a card as a die\u003c/h3>\n\u003cp>Draw one card per damage die and read it for that die size. Add the results, then add any modifiers.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>d4\u003c/strong> (card ÷ 3, rounded down, +1)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d6\u003c/strong> (card ÷ 2, rounded down, +1)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d8\u003c/strong> (card − 1; Ace is 1, 10 is 8)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d10\u003c/strong> (card value)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d12\u003c/strong> (card + 1)\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Rare sizes: \u003cstrong>d2\u003c/strong> is the card's color (black 1, red 2); \u003cstrong>d3\u003c/strong> is card ÷ 4, rounded down, +1. Jokers are covered below.\u003c/p>\n\u003ch3 id=\"ae-10-damage-jokers-bonus-damage\">Jokers: bonus damage\u003c/h3>\n\u003cp>Each damage card is a Joker about 1 time in 21. What a Joker does depends on who is dealing the damage:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Dealt by\u003c/th>\n\u003cth>Joker rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Players\u003c/strong> (and creatures they control: companions, familiars, summons)\u003c/td>\n\u003ctd>The die counts as its \u003cstrong>maximum\u003c/strong> (a 6 on a d6, 12 on a d12).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Monsters and hazards\u003c/strong>\u003c/td>\n\u003ctd>The die counts as its \u003cstrong>maximum, and you draw another die of the same size.\u003c/strong> If that's a Joker too, repeat.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>GMs building encounters: Jokers make damage run a little high on both sides, more for monsters, so fights run slightly deadlier for the party than their budget says. It shows most in big monster damage pools.\u003c/p>\n\u003cp>Jokers only matter for damage and healing dice. When the damage deck is used for other random numbers (durations, 1–20 and 1–100 tables), redraw any Joker.\u003c/p>\n\u003ch3 id=\"ae-10-damage-damage-rules\">Damage rules\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Rule\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Damage dice (weapons, spells, monsters)\u003c/td>\n\u003ctd>One card per die, read on the die table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Striking runes, heightened spells\u003c/td>\n\u003ctd>More dice means more cards.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical hit\u003c/td>\n\u003ctd>Double the total.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Deadly\u003c/strong> (extra die on a crit)\u003c/td>\n\u003ctd>Draw the extra cards on a crit; they aren't doubled.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Fatal\u003c/strong> (die size increases on a crit, plus one die)\u003c/td>\n\u003ctd>Re-read the same cards on the fatal die size, then draw one more card at that size.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Two-hand\u003c/strong>, \u003cstrong>jousting\u003c/strong>\u003c/td>\n\u003ctd>Read the cards on the larger die size.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Precision damage, splash, forceful, backstabber\u003c/td>\n\u003ctd>Each die is a card; flat bonuses stay flat.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Persistent damage\u003c/td>\n\u003ctd>Draw its damage at the end of each of your turns. The flat check to end it is one Fate Deck card (9 or higher for DC 15).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Healing dice\u003c/td>\n\u003ctd>Same as damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Maximum damage&quot; effects\u003c/td>\n\u003ctd>Count each die at its maximum; don't draw.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Reroll 1s on damage dice&quot;\u003c/td>\n\u003ctd>Redraw any card that reads as a 1.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Average damage (effects where each die counts as its average rounded up)\u003c/td>\n\u003ctd>Don't draw; use 3 / 4 / 5 / 6 / 7 for d4 / d6 / d8 / d10 / d12.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Resistance, weakness, immunity\u003c/td>\n\u003ctd>The cards don't change them; apply them as written.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"ae-10-damage-other-random-numbers\">Other random numbers\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Random number\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Random durations (&quot;1d4 rounds&quot;, &quot;1d4 hours&quot;)\u003c/td>\n\u003ctd>One damage card, read on the die table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1–20 tables\u003c/td>\n\u003ctd>One damage card, \u003cstrong>plus 10 if it's red\u003c/strong>: an exact 1–20.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1–100 tables\u003c/td>\n\u003ctd>Two damage cards: the first is the tens, the second the ones; a 10 counts as 0, and 0-0 is 100. An exact 1–100.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Smaller tables (1–8, 1–10 and so on)\u003c/td>\n\u003ctd>One damage card, read on the die table.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"ae-10-damage-optional-rule-big-pools\">Optional rule: big pools\u003c/h3>\n\u003cp>Recommended. For pools of more than 5 dice (e.g., a heightened blast spell), draw 5 cards and count every die beyond that at its average, rounding the total down.\u003c/p>\n\u003cul>\n\u003cli>Example: 20d6 is 5 cards plus 15 × 3.5 = 52.5, so 5 cards + 52.\u003c/li>\n\u003cli>It keeps 20- and 30-die spells quick, and the average is unchanged apart from Jokers; the results just bunch closer to the average.\u003c/li>\n\u003cli>Only the 5 drawn cards can be Jokers, so big pools get less of the Joker bonus under this rule, which matters most for monsters.\u003c/li>\n\u003c/ul>\n"},{"id":"ae-11-the-twelve-star-sign-decks","title":"11. The twelve star-sign decks","html":"\u003ch2 id=\"ae-11-the-twelve-star-sign-decks-11-the-twelve-star-sign-decks\">11. The twelve star-sign decks\u003c/h2>\n\u003cp>\u003cstrong>Element sets the size. Modality sets the spread and the Jokers.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Fire (45–51 cards):\u003c/strong> short and fierce. Strongest on a fresh shuffle; runs out once or twice in a standard day.\u003c/li>\n\u003cli>\u003cstrong>Air (55–63 cards):\u003c/strong> quick; runs out once, around the middle of the day.\u003c/li>\n\u003cli>\u003cstrong>Water (67–75 cards):\u003c/strong> middling; runs out once, past the middle of the day.\u003c/li>\n\u003cli>\u003cstrong>Earth (80–90 cards):\u003c/strong> long and enduring; runs out once, late in the day.\u003c/li>\n\u003cli>\u003cstrong>Fixed\u003c/strong> signs are steady, with more Jokers. \u003cstrong>Mutable\u003c/strong> signs are swingy, with few Jokers. \u003cstrong>Cardinal\u003c/strong> signs sit between the two.\u003c/li>\n\u003cli>\u003cstrong>Every sign has an ability,\u003c/strong> paid for in pips: its \u003cstrong>pip total\u003c/strong> (its number cards added up, Ace = 1) is its size's pip total in the build table (13.4) minus the ability's price. Chapter 12 describes the abilities, and how each deck gets its price back at a table that plays without them.\u003c/li>\n\u003cli>\u003cstrong>One sign has uneven Jokers.\u003c/strong> \u003cstrong>Virgo\u003c/strong> is the only deck with more Suns than Eclipses: more natural 20s, paid for with weaker number cards. Only decks of 75 cards or more can carry the extra Sun (13.2).\u003c/li>\n\u003c/ul>\n\u003cp>Deck codes list Ace, 2, 3 … 10, then Suns / Eclipses. In the Deck Lab, type a sign's name to load its deck with its ability; a pasted code needs + and the ability's name, as in 8-6-3-1-1-1-3-5-7-8 / 1-1 + First Blood. Any number of players can take the same sign; each builds their own copy of its deck. &quot;Packs&quot; is the number of standard packs needed to build it; Aries, Leo and Aquarius need only two.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Element · modality\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Ability (price in pips)\u003c/th>\n\u003cth>Deck code\u003c/th>\n\u003cth>Packs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>Fire · Cardinal\u003c/td>\n\u003ctd>45\u003c/td>\n\u003ctd>First Blood (6)\u003c/td>\n\u003ctd>8-6-3-1-1-1-3-5-7-8 / 1-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>Fire · Fixed\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>Crowned (6)\u003c/td>\n\u003ctd>1-2-4-6-7-7-7-6-4-0 / 2-2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>Fire · Mutable\u003c/td>\n\u003ctd>51\u003c/td>\n\u003ctd>Loose Arrow (8)\u003c/td>\n\u003ctd>11-7-4-2-0-0-2-4-7-12 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>Air · Cardinal\u003c/td>\n\u003ctd>55\u003c/td>\n\u003ctd>Weigh the Odds (4)\u003c/td>\n\u003ctd>12-8-4-1-0-0-2-5-9-12 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>Air · Fixed\u003c/td>\n\u003ctd>59\u003c/td>\n\u003ctd>Water Bearer (4)\u003c/td>\n\u003ctd>5-6-6-5-5-5-5-5-6-7 / 2-2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>Air · Mutable\u003c/td>\n\u003ctd>63\u003c/td>\n\u003ctd>Twin Draw (9)\u003c/td>\n\u003ctd>15-10-5-1-0-0-1-4-9-16 / 1-1\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>Water · Cardinal\u003c/td>\n\u003ctd>67\u003c/td>\n\u003ctd>Shell (13)\u003c/td>\n\u003ctd>10-8-6-5-4-4-4-5-7-10 / 2-2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>Water · Fixed\u003c/td>\n\u003ctd>71\u003c/td>\n\u003ctd>Sting (18)\u003c/td>\n\u003ctd>2-5-9-10-10-9-8-6-4-2 / 3-3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>Water · Mutable\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>Dream Tide (2)\u003c/td>\n\u003ctd>20-11-4-1-0-0-2-6-11-18 / 1-1\u003c/td>\n\u003ctd>5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>Earth · Cardinal\u003c/td>\n\u003ctd>80\u003c/td>\n\u003ctd>Second Ascent (1)\u003c/td>\n\u003ctd>14-11-7-5-3-2-3-6-10-15 / 2-2\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>Earth · Fixed\u003c/td>\n\u003ctd>85\u003c/td>\n\u003ctd>Unyielding (12)\u003c/td>\n\u003ctd>0-6-10-13-14-13-11-7-3-0 / 4-4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>Earth · Mutable\u003c/td>\n\u003ctd>90\u003c/td>\n\u003ctd>Sift (6)\u003c/td>\n\u003ctd>24-14-7-2-0-0-2-7-13-18 / 2-1\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Chapter 20, at the back of the book, has each deck's numbers over short, standard and long days.\u003c/p>\n","part":"Part Two · Decks"},{"id":"ae-12-star-sign-abilities","title":"12. Star-sign abilities","html":"\u003ch2 id=\"ae-12-star-sign-abilities-12-star-sign-abilities\">12. Star-sign abilities\u003c/h2>\n\u003ch3 id=\"ae-12-star-sign-abilities-how-abilities-work\">How abilities work\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Every sign has one ability,\u003c/strong> built from the zodiac's own grid. The element sets what it touches: Fire attacks, Air foresight and allies, Water saves and protection, Earth the deck and endurance. The modality sets how: Cardinal signs act at a start, Fixed signs hold something back, Mutable signs change a card.\u003c/li>\n\u003cli>\u003cstrong>Abilities are paid for in pips.\u003c/strong> A deck with an ability builds to a lower pip total: its row's pip total minus the ability's price. The twelve sign decks already include it. Cheap abilities cost 1 or 2 pips; the strongest cost 15 to 25.\u003c/li>\n\u003cli>\u003cstrong>How often:\u003c/strong> \u003cem>once per day\u003c/em> resets at a night's rest, the same as exhaustion. \u003cem>Once per encounter\u003c/em> means once per fight or other scene that starts with initiative. \u003cem>After each deck-out\u003c/em> resets every time your deck runs out.\u003c/li>\n\u003cli>\u003cstrong>No actions, no extra cost.\u003c/strong> Using an ability takes no action. Any cards it makes you draw come from your deck and count toward deck-outs; the price already includes that.\u003c/li>\n\u003cli>\u003cstrong>Fortune rules still apply.\u003c/strong> An ability that makes a check a fortune check doesn't stack with another fortune effect, and cancels against misfortune as usual (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Kept Suns and Eclipses\u003c/strong> (Leo, Scorpio) sit outside your deck until you play them, so a reshuffle doesn't bring them back. They aren't held draws: one you haven't played goes back into your deck at your next night's rest.\u003c/li>\n\u003cli>\u003cstrong>Custom decks\u003c/strong> can buy any one ability, or none. Look up its price for the deck's size below, subtract it from the pip total (13.6), and keep the same swing range (13.3) and copy limit (13.4). With more Eclipses than Suns, test the deck in the Deck Lab (13.6).\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-12-star-sign-abilities-the-twelve-abilities\">The twelve abilities\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Cardinal (starts)\u003c/th>\n\u003cth>Fixed (holds)\u003c/th>\n\u003cth>Mutable (changes)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Fire\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Aries:\u003c/strong> First Blood\u003c/td>\n\u003ctd>\u003cstrong>Leo:\u003c/strong> Crowned\u003c/td>\n\u003ctd>\u003cstrong>Sagittarius:\u003c/strong> Loose Arrow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Air\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Libra:\u003c/strong> Weigh the Odds\u003c/td>\n\u003ctd>\u003cstrong>Aquarius:\u003c/strong> Water Bearer\u003c/td>\n\u003ctd>\u003cstrong>Gemini:\u003c/strong> Twin Draw\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Water\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Cancer:\u003c/strong> Shell\u003c/td>\n\u003ctd>\u003cstrong>Scorpio:\u003c/strong> Sting\u003c/td>\n\u003ctd>\u003cstrong>Pisces:\u003c/strong> Dream Tide\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Earth\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Capricorn:\u003c/strong> Second Ascent\u003c/td>\n\u003ctd>\u003cstrong>Taurus:\u003c/strong> Unyielding\u003c/td>\n\u003ctd>\u003cstrong>Virgo:\u003c/strong> Sift\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Ability\u003c/th>\n\u003cth>How often\u003c/th>\n\u003cth>Effect\u003c/th>\n\u003cth>Affects\u003c/th>\n\u003cth>Price in its deck\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong> (45 cards)\u003c/td>\n\u003ctd>First Blood\u003c/td>\n\u003ctd>Once per encounter\u003c/td>\n\u003ctd>Your first Strike in each encounter is a fortune check: draw 3 cards and keep the best pair.\u003c/td>\n\u003ctd>Attacks\u003c/td>\n\u003ctd>6 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong> (48 cards)\u003c/td>\n\u003ctd>Crowned\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>When you draw a Sun, you can keep it instead: set it aside face-up and draw a replacement card for that check. Later, play it as your draw for any attack roll; it counts as a natural 20.\u003c/td>\n\u003ctd>Attacks\u003c/td>\n\u003ctd>6 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong> (51 cards)\u003c/td>\n\u003ctd>Loose Arrow\u003c/td>\n\u003ctd>Once per encounter\u003c/td>\n\u003ctd>After drawing the first card of an attack roll, you can discard it and draw a new first card.\u003c/td>\n\u003ctd>Attacks\u003c/td>\n\u003ctd>8 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong> (55 cards)\u003c/td>\n\u003ctd>Weigh the Odds\u003c/td>\n\u003ctd>Once per encounter\u003c/td>\n\u003ctd>When an encounter starts, before you draw for initiative, look at the top 3 cards of your deck and put them back in any order.\u003c/td>\n\u003ctd>Initiative and the first attack\u003c/td>\n\u003ctd>4 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong> (59 cards)\u003c/td>\n\u003ctd>Water Bearer\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>When you or an ally within 30 feet fails a check, that character can draw a new check from your deck and use the better result, with their own modifier. You pay the cards.\u003c/td>\n\u003ctd>Any check, any ally\u003c/td>\n\u003ctd>4 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong> (63 cards)\u003c/td>\n\u003ctd>Twin Draw\u003c/td>\n\u003ctd>Once per encounter\u003c/td>\n\u003ctd>Before a check, declare Twin Draw: draw two separate checks, choose which one counts, and discard both.\u003c/td>\n\u003ctd>Any check (priced for use on an attack)\u003c/td>\n\u003ctd>9 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong> (67 cards)\u003c/td>\n\u003ctd>Shell\u003c/td>\n\u003ctd>Once per encounter\u003c/td>\n\u003ctd>The first time each encounter you or an ally within 30 feet fails a saving throw, that character can draw a new check from your deck and use the better result. You pay the cards.\u003c/td>\n\u003ctd>Saves, for the whole party\u003c/td>\n\u003ctd>13 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong> (71 cards)\u003c/td>\n\u003ctd>Sting\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>When you draw an Eclipse, you can keep it instead: set it aside face-up and draw a replacement card for that check. Later, play it before the GM draws for an enemy's check; that check is a natural 1.\u003c/td>\n\u003ctd>Defense\u003c/td>\n\u003ctd>18 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong> (75 cards)\u003c/td>\n\u003ctd>Dream Tide\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>When you fail a check, you can swap one of its cards for the top card of your deck, unseen.\u003c/td>\n\u003ctd>Any check\u003c/td>\n\u003ctd>2 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong> (80 cards)\u003c/td>\n\u003ctd>Second Ascent\u003c/td>\n\u003ctd>After each deck-out\u003c/td>\n\u003ctd>Your first check after each reshuffle is a fortune check.\u003c/td>\n\u003ctd>Any check\u003c/td>\n\u003ctd>1 pip\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong> (85 cards)\u003c/td>\n\u003ctd>Unyielding\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>The first time each day your deck runs out, reshuffle without gaining a level of exhaustion.\u003c/td>\n\u003ctd>Endurance\u003c/td>\n\u003ctd>12 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong> (90 cards)\u003c/td>\n\u003ctd>Sift\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>After you draw a check, you can look at the top card of your discard pile and swap one of the check's cards for it.\u003c/td>\n\u003ctd>Any check\u003c/td>\n\u003ctd>6 pips\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"ae-12-star-sign-abilities-what-an-ability-does-to-a-deck\">What an ability does to a deck\u003c/h3>\n\u003cp>Paying pips weakens every check a little, and the ability gives the value back in its own area. So abilities shift a deck's strengths without changing its total.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Attack abilities\u003c/strong> (Aries, Leo, Sagittarius) turn a little defense into more damage.\u003c/li>\n\u003cli>\u003cstrong>Protective abilities\u003c/strong> (Cancer, Scorpio) cost the most of the sign abilities, so the deck's own attacks land a little softer; they pay it back by keeping damage off the party.\u003c/li>\n\u003cli>\u003cstrong>Taurus\u003c/strong> never tires on a standard day: its one deck-out costs nothing, so it stays flat from the first check to the last instead of starting strong and ending weak.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-12-star-sign-abilities-prices-for-custom-decks\">Prices for custom decks\u003c/h3>\n\u003cp>Pips to subtract from the pip total, by deck size. For a size between columns, use the Deck Lab.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Ability\u003c/th>\n\u003cth>45\u003c/th>\n\u003cth>50\u003c/th>\n\u003cth>55\u003c/th>\n\u003cth>60\u003c/th>\n\u003cth>65\u003c/th>\n\u003cth>70\u003c/th>\n\u003cth>75\u003c/th>\n\u003cth>80\u003c/th>\n\u003cth>85\u003c/th>\n\u003cth>90\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>First Blood (Aries)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>13\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Crowned (Leo)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Loose Arrow (Sagittarius)\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Weigh the Odds (Libra)\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Water Bearer (Aquarius)\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Twin Draw (Gemini)\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shell (Cancer)\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sting (Scorpio)\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>19\u003c/td>\n\u003ctd>19\u003c/td>\n\u003ctd>20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dream Tide (Pisces)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Second Ascent (Capricorn)\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unyielding (Taurus)\u003c/td>\n\u003ctd>25\u003c/td>\n\u003ctd>25\u003c/td>\n\u003ctd>25\u003c/td>\n\u003ctd>24\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>21\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sift (Virgo)\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Once-per-encounter abilities cost more in bigger decks: each pip is a smaller share of a big deck, so it takes more of them to buy the same value. Unyielding costs the most in small decks, which run out early enough in the day for the saved level of exhaustion to matter for longer; a 90-card deck runs out so late that it costs only 8. Second Ascent gets cheaper as decks grow, because a big deck reshuffles less often.\u003c/p>\n\u003ch3 id=\"ae-12-star-sign-abilities-playing-without-abilities-optional-rule\">Playing without abilities (optional rule)\u003c/h3>\n\u003cp>Sign abilities are optional. A table that would rather play without them agrees at session zero, and the choice covers every player deck at the table.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Sign decks take their price back.\u003c/strong> Each sign deck paid for its ability with a lower pip total, so without it the deck plays a little weak. Add the price back by moving a card or two up, as listed below; most moves are flips to their mirrors (the pip dial, 13.5), which leave swing points alone. Every deck is balanced again.\u003c/li>\n\u003cli>\u003cstrong>Custom decks build to the full pip total.\u003c/strong> Skip the ability step (step 3 of the short version in chapter 13, and 13.6) and build to your row's pip total in 13.4. The starter decks have no ability, so they need no change.\u003c/li>\n\u003cli>\u003cstrong>A deck built with an ability comes up short.\u003c/strong> Taking the ability off leaves it weaker by the price; add the pips back the same way before play.\u003c/li>\n\u003cli>\u003cstrong>Nothing else changes.\u003c/strong> Sizes, Joker limits, swing ranges, the copy limit and the balance rules stay the same. The Deck Lab has a switch at the top that turns abilities off.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Price\u003c/th>\n\u003cth>Change to add it back\u003c/th>\n\u003cth>Deck code without the ability\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>one 5 → 6, one 3 → 8\u003c/td>\n\u003ctd>8-6-2-1-0-2-3-6-7-8 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>two 4s → 7s\u003c/td>\n\u003ctd>1-2-4-4-7-7-9-6-4-0 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>one 4 → 7, one 3 → 8\u003c/td>\n\u003ctd>11-7-3-1-0-0-3-5-7-12 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>one 4 → 8\u003c/td>\n\u003ctd>12-8-4-0-0-0-2-6-9-12 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>one 4 → 8\u003c/td>\n\u003ctd>5-6-6-4-5-5-5-6-6-7 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>one Ace → 10\u003c/td>\n\u003ctd>14-10-5-1-0-0-1-4-9-17 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>one 5 → 6, one 4 → 7, one Ace → 10\u003c/td>\n\u003ctd>9-8-6-4-3-5-5-5-7-11 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>two Aces → 10s\u003c/td>\n\u003ctd>0-5-9-10-10-9-8-6-4-4 / 3-3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>one 7 → 9\u003c/td>\n\u003ctd>20-11-4-1-0-0-1-6-12-18 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>one 5 → 6\u003c/td>\n\u003ctd>14-11-7-5-2-3-3-6-10-15 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>one 3 → 8, one 2 → 9\u003c/td>\n\u003ctd>0-5-9-13-14-13-11-8-4-0 / 4-4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>one 4 → 10\u003c/td>\n\u003ctd>24-14-7-1-0-0-2-7-13-19 / 2-1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Libra, Aquarius, Pisces and Virgo move a card up by something other than its mirror, which adds a few swing points; all four stay inside their swing ranges.\u003c/p>\n"},{"id":"ae-13-building-your-own-deck","title":"13. Building your own deck","html":"\u003ch2 id=\"ae-13-building-your-own-deck-13-building-your-own-deck\">13. Building your own deck\u003c/h2>\n\u003cp>How a player builds their own balanced deck instead of taking a star-sign deck. The Deck Lab tests any deck exactly and loads every starter deck in the build table (13.4).\u003c/p>\n\u003ch3 id=\"ae-13-building-your-own-deck-the-short-version\">The short version\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Pick a size:\u003c/strong> 45, 50, 55 … up to 90 cards.\u003c/li>\n\u003cli>\u003cstrong>Pick your Jokers.\u003c/strong> Eclipses equal your Suns or one more, with at least one Sun, up to your size's limit (13.2).\u003c/li>\n\u003cli>\u003cstrong>Pick a sign ability, or none\u003c/strong> (13.6). Its price for your size comes off your pip total. A table that plays without abilities skips this step (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Fill the rest with number cards (Ace to 10)\u003c/strong> so that your row of the build table (13.4) is met:\n\u003cul>\n\u003cli>\u003cstrong>Pip total:\u003c/strong> the values of your number cards (Ace = 1) add up to exactly your row's pip total, minus your ability's price.\u003c/li>\n\u003cli>\u003cstrong>Swing points:\u003c/strong> add up to a number inside your row's swing range (13.3).\u003c/li>\n\u003cli>\u003cstrong>Copy limit:\u003c/strong> no value appears more times than your row allows (a third of your number cards).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Or start from your row's starter deck\u003c/strong> and change it with the pip dial and the swing dial (13.5). Each dial moves one of the two numbers and leaves the other alone.\u003c/li>\n\u003cli>\u003cstrong>Test it in the Deck Lab\u003c/strong> if you like; the GM may ask you to. A deck that meets its row is balanced. If you bought an ability and have more Eclipses than Suns, do test it (13.6).\u003c/li>\n\u003c/ol>\n\u003cp>A balanced deck matches the sign decks over a standard day, within the balance limits, and the game's DCs are built for that standard. Chapter 17 says exactly what that means.\u003c/p>\n\u003ch3 id=\"ae-13-building-your-own-deck-13-1-size\">13.1 Size\u003c/h3>\n\u003cp>Smaller decks get stronger cards but run out sooner, and every time a deck runs out you gain a level of exhaustion (chapter 4). The pip totals in 13.4 already account for this.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Runs out in a standard day\u003c/th>\n\u003cth>Highest exhaustion\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>twice\u003c/td>\n\u003ctd>Exhausted 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50–90\u003c/td>\n\u003ctd>once\u003c/td>\n\u003ctd>Exhausted 1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Custom decks come in steps of 5. For a size in between (the sign decks use 48, 51, 59, 63, 67 and 71), use the Deck Lab: it works out the exact pip total for any size, and the deck is fine if it passes the Lab test.\u003c/p>\n\u003ch3 id=\"ae-13-building-your-own-deck-13-2-jokers\">13.2 Jokers\u003c/h3>\n\u003cp>A Sun is a natural 20 and an Eclipse a natural 1 (chapter 2). Jokers don't have to be even. The limits:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Eclipses equal your Suns, or one more.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>At least one Sun\u003c/strong>, except in the big-deck setups below.\u003c/li>\n\u003cli>\u003cstrong>Total Jokers, at most:\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>45–50\u003c/th>\n\u003cth>55\u003c/th>\n\u003cth>60–65\u003c/th>\n\u003cth>70–75\u003c/th>\n\u003cth>80–85\u003c/th>\n\u003cth>90\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Most Jokers\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>The setups each size allows (Suns / Eclipses), plus the big-deck extras:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>1 / 1\u003c/th>\n\u003cth>1 / 2\u003c/th>\n\u003cth>2 / 2\u003c/th>\n\u003cth>2 / 3\u003c/th>\n\u003cth>3 / 3\u003c/th>\n\u003cth>3 / 4\u003c/th>\n\u003cth>4 / 4\u003c/th>\n\u003cth>4 / 5\u003c/th>\n\u003cth>Big-deck extras\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>0 / 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>0 / 1, 0 / 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>0 / 2, 2 / 1, 3 / 2, 4 / 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>0 / 1, 0 / 2, 2 / 1, 3 / 2, 4 / 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>85\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>0 / 1, 0 / 2, 2 / 1, 3 / 2, 4 / 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>0 / 1, 0 / 2, 2 / 1, 3 / 2, 4 / 3, 5 / 4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch4 id=\"ae-13-building-your-own-deck-what-each-kind-of-setup-plays-like\">What each kind of setup plays like\u003c/h4>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Setup\u003c/th>\n\u003cth>Examples\u003c/th>\n\u003cth>How it plays\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Even\u003c/strong>\u003c/td>\n\u003ctd>1 / 1, 2 / 2, 3 / 3, 4 / 4 (every sign but Virgo)\u003c/td>\n\u003ctd>The default. Natural 20s and 1s come up equally.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>One extra Eclipse\u003c/strong>\u003c/td>\n\u003ctd>1 / 2, 2 / 3, 3 / 4, 4 / 5\u003c/td>\n\u003ctd>More natural 1s, paid for with stronger number cards (a higher pip total). Saves hurt a little more; Strikes are unchanged.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>No Sun\u003c/strong>\u003c/td>\n\u003ctd>0 / 1, 0 / 2\u003c/td>\n\u003ctd>Never a natural 20. Crits come only from high totals, so the deck has to be mostly Aces and 10s. Weapons that rely on crits (deadly, fatal) do a little worse.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>One extra Sun\u003c/strong> (75 cards and up)\u003c/td>\n\u003ctd>2 / 1 (Virgo), 3 / 2, 4 / 3, 5 / 4\u003c/td>\n\u003ctd>More natural 20s, paid for with weaker number cards. Strikes and saves both favor you, which sits close to the limit of balance, so the swing ranges are narrow.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>More Jokers also make a deck last longer, because a check that opens on a Joker costs one card instead of two. Chapter 24 explains why the limits sit where they do.\u003c/p>\n\u003ch3 id=\"ae-13-building-your-own-deck-13-3-swing-points\">13.3 Swing points\u003c/h3>\n\u003cp>Swing points measure how far your cards sit from the middle. Extreme cards swing your draws; middle cards keep them steady.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Swing points\u003c/strong>\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Add the points for every number card. Your row's swing range is where the deck stays balanced. Below it the deck is too steady and its Strikes crit too rarely; above it, too swingy. Inside the range, the low end plays steady and the high end swingy.\u003c/p>\n\u003ch3 id=\"ae-13-building-your-own-deck-13-4-the-build-table\">13.4 The build table\u003c/h3>\n\u003cp>Pick your row. &quot;Number cards&quot; is the size minus your Jokers. &quot;Most copies&quot; is the copy limit: the most of any one value. The starter deck meets every rule for its row; its code lists Ace, 2, 3 … 10, then Suns and Eclipses. &quot;Packs&quot; is the standard packs needed to build the starter.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Number cards\u003c/th>\n\u003cth>Pip total\u003c/th>\n\u003cth>Swing points\u003c/th>\n\u003cth>Most copies\u003c/th>\n\u003cth>Starter deck\u003c/th>\n\u003cth>Packs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>43\u003c/td>\n\u003ctd>254\u003c/td>\n\u003ctd>247–300\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>7-6-4-2-1-1-1-3-7 \u003ctd>7-8-9-10-11-11-9-8-6-4 / 4-3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>5 / 4\u003c/td>\n\u003ctd>81\u003c/td>\n\u003ctd>420\u003c/td>\n\u003ctd>30–57\u003c/td>\n\u003ctd>27\u003c/td>\n\u003ctd>0-0-7-18-24-19-11-2-0-0 / 5-4\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"ae-13-building-your-own-deck-13-5-adjusting-a-deck-the-pip-dial-and-the-swing-dial\">13.5 Adjusting a deck: the pip dial and the swing dial\u003c/h3>\n\u003cp>Every card has a \u003cstrong>mirror\u003c/strong>: A and 10, 2 and 9, 3 and 8, 4 and 7, 5 and 6. Mirrors have the same swing points, which gives you two dials that don't interfere with each other.\u003c/p>\n\u003cp>\u003cstrong>The pip dial: flip a card to its mirror.\u003c/strong> The pip total changes, the swing points don't.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Flip\u003c/th>\n\u003cth>Pip total\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>5 → 6\u003c/td>\n\u003ctd>+1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4 → 7\u003c/td>\n\u003ctd>+3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3 → 8\u003c/td>\n\u003ctd>+5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 → 9\u003c/td>\n\u003ctd>+7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A → 10\u003c/td>\n\u003ctd>+9\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Flip the other way (6 → 5, 10 → A and so on) to lower the pip total by the same amount.\u003c/p>\n\u003cp>\u003cstrong>The swing dial: push two cards apart, or pull them together.\u003c/strong> Move one card down and another up by the same number of steps. The pip total doesn't change.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Push apart\u003c/th>\n\u003cth>Swing points\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>a 5 → 4 and a 6 → 7\u003c/td>\n\u003ctd>+2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 4 → 3 and a 7 → 8\u003c/td>\n\u003ctd>+4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 3 → 2 and an 8 → 9\u003c/td>\n\u003ctd>+6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 2 → A and a 9 → 10\u003c/td>\n\u003ctd>+8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 5 → A and a 6 → 10\u003c/td>\n\u003ctd>+20\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Pull together (the same moves reversed) to lower the swing points by the same amount. Any other pair also keeps the pip total, as long as one card goes down and one goes up by the same number of steps; its swing change is whatever the swing points table in 13.3 says.\u003c/p>\n\u003ch3 id=\"ae-13-building-your-own-deck-13-6-buying-a-sign-ability\">13.6 Buying a sign ability\u003c/h3>\n\u003cp>A custom deck can take any one of the twelve sign abilities, or none. Chapter 12 says what each one does. You pay for it in pips:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Look up its price\u003c/strong> for your size in chapter 12 (Prices for custom decks), or let the Deck Lab work it out.\u003c/li>\n\u003cli>\u003cstrong>Take the price off your row's pip total.\u003c/strong> The swing range and copy limit stay the same.\u003c/li>\n\u003cli>\u003cstrong>Lower the pip total with the pip dial\u003c/strong> (13.5): flip high cards to their mirrors (10 → A is −9, 9 → 2 is −7, 8 → 3 is −5, 7 → 4 is −3, 6 → 5 is −1). Flips don't change swing points.\u003c/li>\n\u003c/ol>\n\u003cp>For example, the 50-card starter with 1 Sun and 1 Eclipse (9-7-5-2-0-0-1-4-8-12 / 1-1, pip total 277) can buy First Blood for 7 pips: flip one 9 to a 2 for 9-8-5-2-0-0-1-4-7-12 / 1-1, pip total 270.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>The sign decks already include theirs.\u003c/strong> Each one's pip total is its size's pip total minus its ability's price.\u003c/li>\n\u003cli>\u003cstrong>Even Jokers or an extra Sun: any ability works.\u003c/strong> Every starter deck with those setups stays balanced with any of the twelve abilities.\u003c/li>\n\u003cli>\u003cstrong>More Eclipses than Suns: test it in the Deck Lab.\u003c/strong> A few pairings need a different set of flips or a swing-dial move, most of them in the no-Sun decks, and one takes too much damage on saves. Chapter 23 lists them.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-13-building-your-own-deck-13-7-worked-example-50-cards-1-sun-and-2-eclipses\">13.7 Worked example: 50 cards, 1 Sun and 2 Eclipses\u003c/h3>\n\u003cp>The row says: 47 number cards, pip total \u003cstrong>282\u003c/strong>, swing points \u003cstrong>259–314\u003c/strong>, at most \u003cstrong>15\u003c/strong> of any value.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Deal the number cards evenly.\u003c/strong> Four of each value is 40 cards; add the other 7 from the middle out (5, 6, 4, 7, 3, 8, 2).\nAce to 10: 4-5-5-5-5-5-5-5-4-4. Pip total 255, swing points 174.\u003c/li>\n\u003cli>\u003cstrong>Flip to reach 282 (+27).\u003c/strong> Three Aces → 10s (+27).\nNow 1-5-5-5-5-5-5-5-4-7. Pip total 282, swing points still 174.\u003c/li>\n\u003cli>\u003cstrong>Push apart to land near the middle of the range (+110).\u003c/strong> Five times, a 5 and a 6 → an Ace and a 10 (+100); then a 3 and an 8 → a 2 and a 9 (+6), and a 4 and a 7 → a 3 and an 8 (+4).\nNow \u003cstrong>6-6-5-4-0-0-4-5-5-12 / 1-2\u003c/strong>. Pip total 282, swing points 284, largest count 12.\u003c/li>\n\u003c/ol>\n\u003cp>The deck meets its row, and the Deck Lab confirms it's balanced. The deck after step 2 doesn't pass: its swing points sit far below the range, so its Strikes crit too rarely (94% of a d20's damage). The ranges leave some margin, so a deck just outside its range can still pass the Lab test, but not one that far out.\u003c/p>\n"},{"id":"ae-14-wild-magic","title":"14. Wild magic","html":"\u003ch2 id=\"ae-14-wild-magic-14-wild-magic\">14. Wild magic\u003c/h2>\n\u003cp>The Fate Deck's face cards feed wild magic. The Fate Deck page fills the sets as you draw and shows the effect.\u003c/p>\n\u003cp>\u003cstrong>Wild magic is optional.\u003c/strong> The table decides at session zero whether to play with it. With wild magic, the Fate Deck holds the 12 face cards (112 cards); without it, leave them out (100 cards) and skip this chapter. The face cards never change a check's odds, so nothing else changes either way.\u003c/p>\n\u003ch3 id=\"ae-14-wild-magic-how-it-goes-off\">How it goes off\u003c/h3>\n\u003col>\n\u003cli>The GM places face cards in the order drawn into four sets of three, drawing a replacement card each time. Only face cards drawn for Fate Deck checks made in response to a player's action or request count, including flat checks and secret checks. The GM can't draw extra checks to fish for them.\u003c/li>\n\u003cli>When the fourth set is complete (roughly once per encounter), wild magic goes off.\u003c/li>\n\u003cli>\u003cstrong>Read the side and strength from the cards.\u003c/strong> In each set, count pairs of matching suits: a one-suit set has 3 pairs, a two-suit set 1, a three-suit set none. Add red pairs (♥ ♦) and subtract black pairs (♠ ♣). The net, from −4 to +4, is the result:\n\u003cul>\n\u003cli>\u003cstrong>Above 0: good wild magic\u003c/strong>, stronger the higher it goes.\u003c/li>\n\u003cli>\u003cstrong>Below 0: bad wild magic\u003c/strong>, stronger the lower it goes.\u003c/li>\n\u003cli>\u003cstrong>0: mixed:\u003c/strong> it hits friend and foe alike, or it's a harmless oddity.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Look up the exact combination below for its effect, and resolve it with the rules in the next section. Order doesn't matter, either within a set or between sets.\u003c/li>\n\u003cli>Return all 12 face cards to the Fate Deck's discard pile.\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"ae-14-wild-magic-resolving-an-effect\">Resolving an effect\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cp>\u003cstrong>The Destined\u003c/strong> is the character whose action completed the fourth set: the player the GM was responding to when the last face card came up. If that's unclear, the GM picks.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Allies\u003c/strong> are the Destined, the other player characters and their companions. \u003cstrong>Enemies\u003c/strong> are creatures hostile to the party. \u003cstrong>A chosen enemy\u003c/strong> is an enemy the Destined picks within 60 feet.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Surge rank\u003c/strong> is half the Destined's level, rounded up. \u003cstrong>Surge DC\u003c/strong> is the standard DC for the Destined's level:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Destined level\u003c/th>\n\u003cth>1\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003cth>11\u003c/th>\n\u003cth>12\u003c/th>\n\u003cth>13\u003c/th>\n\u003cth>14\u003c/th>\n\u003cth>15\u003c/th>\n\u003cth>16\u003c/th>\n\u003cth>17\u003c/th>\n\u003cth>18\u003c/th>\n\u003cth>19\u003c/th>\n\u003cth>20\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Surge rank\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Surge DC\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>19\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>24\u003c/td>\n\u003ctd>26\u003c/td>\n\u003ctd>27\u003c/td>\n\u003ctd>28\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>31\u003c/td>\n\u003ctd>32\u003c/td>\n\u003ctd>34\u003c/td>\n\u003ctd>35\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>38\u003c/td>\n\u003ctd>39\u003c/td>\n\u003ctd>40\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>It happens at once,\u003c/strong> in the middle of whatever is going on, and costs no actions or cards. Creatures save against the surge DC with their normal draw: players from their own deck, monsters from the Fate Deck.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Effects last 1 minute (10 rounds)\u003c/strong> unless they say otherwise. They're magical, so they can be counteracted at the surge rank. An effect with the \u003cem>incapacitation\u003c/em> trait uses the surge rank as its rank.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Damage and healing\u003c/strong> use the damage deck. Good wild magic uses the players' Joker rule; bad wild magic is a hazard and uses the monsters' rule (chapter 10).\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>No enemy around?\u003c/strong> An effect that needs one waits and goes off at the start of the next encounter's first round. Everything else happens right away.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Bad is good turned around.\u003c/strong> Every bad combination is the opposite of a good one, with the same odds (swap ♥ for ♠ and ♦ for ♣), and its effect is that good effect turned against the party. The Opposite column pairs them.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Mixed wild magic hits friend and foe alike, or it's a harmless oddity.\u003c/strong> The most common combination of all, #58, sends you to the Oddities table below.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>The GM can swap\u003c/strong> an effect that makes no sense in the scene (a vine burst on a ship's rigging, say) for another of the same result.\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003cp>Chapter 25, at the back of the book, gives the odds of every result and combination.\u003c/p>\n\u003ch3 id=\"ae-14-wild-magic-all-93-combinations\">All 93 combinations\u003c/h3>\n\u003cp>Suits within a set are listed ♥ ♦ ♠ ♣. One-suit sets are listed first, then two-suit sets, then three-suit sets.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>The four sets\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Opposite\u003c/th>\n\u003cth>Effect\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♦ · ♠♠♣ · ♠♣♣\u003c/td>\n\u003ctd>Good 4\u003c/td>\n\u003ctd>#93\u003c/td>\n\u003ctd>\u003cstrong>Crown of Fortune.\u003c/strong> Every ally regains 2d8 Hit Points per surge rank, loses one level of exhaustion and gains a Hero Point (up to 3). Each ally's next check this encounter is a natural 20: don't draw.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>♥♥♥ · ♦♠♣ · ♦♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#87\u003c/td>\n\u003ctd>\u003cstrong>Spell Surge.\u003c/strong> The Destined, or an ally they choose who casts spells, casts one of their spells of the surge rank or lower that takes 3 actions or fewer, right now and free: no actions, no spell slot, no cards. If no ally casts spells, fire bursts instead in a 20-foot burst at a point the Destined chooses within 120 feet: 2d6 fire damage per surge rank, basic Reflex save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>♦♦♦ · ♥♠♣ · ♥♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#88\u003c/td>\n\u003ctd>\u003cstrong>Ablative Barrier.\u003c/strong> Each ally within 40 feet of the Destined gains resistance to all damage equal to twice the surge rank for 1 minute. Each time an ally's resistance reduces damage, it drops by 1 for all of them; it ends at 0.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♠ · ♠♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n
