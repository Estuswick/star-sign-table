function withDeck(fn){ const d = activeDeck(); if (!d) return; const st = pstate(d); fn(d, st); }
function inputs(st){ return {type:st.input.type, mod:+st.input.mods[st.input.type]||0, dc: st.input.dc===''||st.input.dc==null ? '' : +st.input.dc}; }
/* Drop-downs (<details>) keep the open or closed state you leave them in, through every redraw and the
   next time the app opens. Each has a name (data-dk); opening or closing one is saved on this device.
   det(name, open by default?) gives a drop-down its name and its state. */
function det(key, def){ const v = S.open && S.open[key]; return `data-dk="${key}"${(typeof v==='boolean' ? v : def) ? ' open' : ''}`; }
function dealt(){ ui.fresh = true; ui.pick = null; ui.scrollTable = true; keepAwake(); }
/* Undo: one step back for the last check drawn with a Draw panel's buttons. The state from just before
   the check comes back, so its cards return to the deck, and then whatever is left in the deck is
   reshuffled, so nobody can see their next card and keep it or throw it away. Undo stays available
   only while nothing else has changed that deck since (changing the modifier or DC doesn't count). */
const UNDO = {};   // 'p:<deck id>' or 'f:<game>' -> {snap, after, get}
const undoSig = o => { if (!o) return ''; const {input, ...rest} = o; return JSON.stringify(rest); };
function undoMark(key, snap, get){ UNDO[key] = {snap, after:null, get}; }
function undoSettle(){ for (const u of Object.values(UNDO)) if (u.after===null) u.after = undoSig(u.get()); }
function undoOK(key){ const u = UNDO[key]; if (!u) return false; const o = u.get(); return !!o && (u.after===null || u.after===undoSig(o)); }
function undoRow(key, act, what){
  const ok = undoOK(key);
  return `<div class="undo-row"><button class="btn sm" data-act="${act}" ${ok ? '' : 'disabled'} aria-label="Undo the last check">↶ Undo</button><span class="note">${ok ? `Takes back the last check: its cards go back and ${what} is reshuffled.` : `Undo takes back the last check drawn here, then reshuffles ${what}.`}</span></div>`;
}

  'build-sign'(el){ const key = el.dataset.key, s = signDeck(key, G()), d = draft(); Object.assign(d, {c:s.c, R:s.R, B:s.B, ability:s.ability, sign:key, size:deckSize(s)}); if (!d.name || /deck$/.test(d.name)) d.name = ''; ui.fixes = null; render(); toast(`${SIGN_NAME[key]} deck loaded`); showSaveBar(); },
  'load-starter'(){ const d = draft(); const S0 = +($('st-size').value), [R,B] = $('st-j').value.split('-').map(Number); const row = isP() ? L.rowAt(S0,R,B) : L.classicRowAt(S0,R,B); if (!row) return; Object.assign(d, {c:(isP()?row[7]:row[9]).slice(), R, B, ability:'none', sign:null, size:S0}); ui.fixes = null; render(); toast(`${S0}-card starter loaded`); showSaveBar(); },
  'load-code'(){ const v = $('code-in').value; ui.codeIn = v; syncLab(); const p = L.parseCode(v); if (p.error){ ui.codeErr = p.error; render(); return; } const d = draft(); Object.assign(d, {c:p.c, R:p.R, B:p.B, ability:p.key, sign: p.sign ? p.sign.toLowerCase() : null, size:p.c.reduce((a,x)=>a+x,0)+p.R+p.B}); ui.codeErr = p.ignored ? `Abilities are off, so ${p.ignored} was left out.` : null; ui.fixes = null; render(); toast('Deck loaded'); showSaveBar(); },
  blank(){ const d = draft(); d.c = new Array(10).fill(0); d.sign = null; if (!d.size) d.size = 40; ui.fixes = null; render(); },

  flip(el){ const d = draft(), a = +el.dataset.a, b = +el.dataset.b; if (d.c[a-1]<1) return; d.c[a-1]--; d.c[b-1]++; d.sign = null; render(); },

  'save-deck'(el){
    const d = draft(); const name = (d.name||'').trim() || (d.sign ? SIGN_NAME[d.sign]+' deck' : 'My deck');

  other(el){ const side = el.dataset.side; const x = P.otherDie(dmgState(side), el.dataset.k); if (side==='g') ui.gmOther = x; else ui.lastOther = x; render(); },
  // --- rules
  book(el){ S.rules.book = el.dataset.v; render(); window.scrollTo(0,0); },
  toc(el, ev){ ev.preventDefault(); const t = $(el.dataset.id); if (t) t.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); },
  // --- settings
  'close-settings'(el, ev){ if (ev.target.closest('[data-stop]') && !ev.target.closest('.iconbtn')) return; closeSettings(); },
  'set-wild'(){ S.wild = S.wild || {ae:true, classic:false}; S.wild[G()] = !S.wild[G()]; P.fateUpgrade(fate(), S.wild[G()]); ui.oddity = null; ui.fglimpse = null; render(); toast(S.wild[G()] ? 'Wild magic on: the 12 face cards are in the Fate Deck' : 'Wild magic off: the face cards are out of the Fate Deck'); },
  'set-abilities'(){ if (!isP()) return; S.abilities = !S.abilities; S.draft.ae = null; ui.fixes = null; openSettings(); render(); toast(S.abilities ? 'Sign abilities on' : 'Sign abilities off'); },
  'set-sub'(el){ S.sub = el.dataset.v; openSettings(); render(); },
  'set-compat'(){ S.compat = !S.compat;
    if (!S.compat && S.game==='classic'){ S.game = 'ae'; ui.pick = null; ui.fixes = null; ui.confirm = null; ui.libra = null; ui.glimpse = null; }
    openSettings(); render(); toast(S.compat ? 'd20 Classic on: switch games at the top' : 'd20 Classic off'); },
  'set-counts'(){ S.settings.counts = !S.settings.counts; openSettings(); render(); },
  'set-wake'(){ S.settings.wake = !S.settings.wake; if (!S.settings.wake && wakeLock){ try { wakeLock.release(); } catch(e){} wakeLock = null; } try { if (window.StarSignNative) window.StarSignNative.keepAwake(!!S.settings.wake); } catch(e){} openSettings(); save(); },
  'set-theme'(el){ S.settings.theme = el.dataset.v; renderShell(); openSettings(); save(); },
  'save-offline'(){ saveOffline(); },
  async install(){ const e = INSTALL.evt; if (!e) return; INSTALL.evt = null; try { e.prompt(); const c = await e.userChoice; toast(c && c.outcome==='accepted' ? 'Installing' : 'Not installed'); } catch(x){} openSettings(); },
  backup(){ const code = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); const ta = $('backup-in'); if (ta){ ta.value = code; ta.select(); } copy(code, 'Backup code copied'); },
  restore(){ const v = ($('backup-in').value||'').trim(); if (!v){ toast('Paste a backup code first'); return; }
    try { const o = JSON.parse(decodeURIComponent(escape(atob(v)))); if (!o || o.v!==1 || !Array.isArray(o.decks)) throw 0; S = Object.assign(fresh(), o); migrate(); closeSettings(); render(); toast('Restored'); } catch(e){ toast('That code isn’t a backup from this app'); } },
  erase(){ ui.confirm = 'erase'; openSettings(); },
  'confirm-no-settings'(){ ui.confirm = null; openSettings(); },
  'erase-yes'(){ S = fresh(); S.firstRun = false; ui.confirm = null; closeSettings(); render(); toast('Everything erased'); },
};

/* input bindings (typing without re-rendering on every key) */
const BIND = {
  mod(el){ withDeck((d,st)=>{ st.input.mods[st.input.type] = el.value===''||el.value==='-' ? 0 : +el.value; }); save(); },
  dc(el){ withDeck((d,st)=>{ st.input.dc = el.value==='' ? '' : +el.value; }); save(); },
  gmod(el){ S.gm.input.mod = el.value===''||el.value==='-' ? 0 : +el.value; save(); },
  gdc(el){ S.gm.input.dc = el.value==='' ? '' : +el.value; save(); },
  flatdc(el){ const v = +el.value; if (v>=1 && v<=25){ S.gm.flatDc = v; } },
  'switch-deck'(el){ S.active[G()] = el.value; ui.pick = null; ui.fresh = false; render(); },
  count(el){ const d = draft(), i = +el.dataset.i, v = parseInt(el.value,10); d.c[i] = isNaN(v) ? 0 : Math.max(0, Math.min(60, v)); d.sign = null; },
  'jk-R'(el){ const d = draft(), v = parseInt(el.value,10); d.R = isNaN(v)?0:Math.max(0,Math.min(20,v)); d.sign = null; },
  'jk-B'(el){ const d = draft(), v = parseInt(el.value,10); d.B = isNaN(v)?0:Math.max(0,Math.min(20,v)); d.sign = null; },
  ability(el){ draft().ability = el.value; ui.fixes = null; },
  'deck-name'(el){ draft().name = el.value; document.querySelectorAll('[data-bind="deck-name"]').forEach(x=>{ if (x!==el) x.value = el.value; }); save(); },
  'deck-level'(el){ const v = parseInt(el.value,10); if (!isNaN(v)){ draft().level = Math.max(1, Math.min(20, v)); document.querySelectorAll('[data-bind="deck-level"]').forEach(x=>{ if (x!==el) x.value = draft().level; }); save(); } },
  'st-size'(el){ ui.stSize = +el.value; },
  wmq(el){ ui.wmQ = el.value; },
  rulesq(el){ S.rules.q = el.value; },
  rulesjump(el){ const t = $(el.value); if (t){ if (S.rules.q){ S.rules.q = ''; render(); } const t2 = $(el.value); if (t2) t2.scrollIntoView({block:'start'}); } },
};
const RERENDER_ON_CHANGE = new Set(['mod','dc','gmod','gdc','flatdc','count','jk-R','jk-B','ability','st-size']);
const RERENDER_ON_INPUT = new Set(['wmq','rulesq']);
function nmBind(name){ const m = name.match(/^dmg-(n|b|die|times)-(p|g)$/); return m; }

document.addEventListener('toggle', ev=>{
  const d = ev.target; if (!d || d.tagName!=='DETAILS' || !d.dataset || !d.dataset.dk) return;
  S.open = S.open || {}; if (S.open[d.dataset.dk]===d.open) return;
  S.open[d.dataset.dk] = d.open; save();
}, true);
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.disabled) return;
  const name = el.dataset.act;
  // damage steppers share one handler
  const m = name.match(/^dmg-(n|b|times)-(p|g)$/);
  if (m){ const o = m[2]==='g' ? S.gm.dmg : S.dmg; const key = {n:'n', b:'bonus', times:'times'}[m[1]]; o[key] = (+o[key]||0) + (+el.dataset.d); if (key==='n') o.n = Math.max(1, Math.min(60, o.n)); if (key==='times') o.times = Math.max(2, Math.min(10, o.times)); render(); return; }
  const fn = ACT[name]; if (fn){ fn(el, ev); }
});
document.addEventListener('input', ev=>{
  const el = ev.target.closest('[data-bind]'); if (!el) return;
  const name = el.dataset.bind;
  const m = name.match(/^dmg-(n|b|die|times)-(p|g)$/);
  if (m){ const o = m[2]==='g' ? S.gm.dmg : S.dmg; const key = {n:'n', b:'bonus', die:'die', times:'times'}[m[1]]; const v = +el.value; if (!isNaN(v)) o[key] = v; save(); return; }
  const fn = BIND[name]; if (fn) fn(el);
  if (RERENDER_ON_INPUT.has(name)){ clearTimeout(el._t); el._t = setTimeout(()=>{ const pos = el.selectionStart; render(); const again = $(el.id); if (again){ again.focus(); try { again.setSelectionRange(pos,pos); } catch(e){} } }, 220); }
});
document.addEventListener('change', ev=>{
  const el = ev.target.closest('[data-bind]'); if (!el) return;
  const name = el.dataset.bind;
  if (/^dmg-(n|b|die|times)-(p|g)$/.test(name)){ render(); return; }
  if (name==='switch-deck' || name==='rulesjump') return;
  if (RERENDER_ON_CHANGE.has(name)){ if (name==='st-size'){ render(); return; } ui.fixes = null; render(); }
});
document.addEventListener('keydown', ev=>{
  if (ev.key==='Escape' && $('sheet-root').innerHTML) closeSettings();
  if (ev.key==='Enter' && ev.target && ev.target.id==='code-in'){ ev.preventDefault(); ACT['load-code'](); }
});
$('open-settings').addEventListener('click', openSettings);
$('gamesw').addEventListener('click', ev=>{ const b = ev.target.closest('button[data-game]'); if (!b || S.game===b.dataset.game) return; S.game = b.dataset.game; ui.pick = null; ui.fixes = null; ui.confirm = null; ui.libra = null; ui.glimpse = null; render(); toast(`${W().game} rules`); });
$('gamesw').addEventListener('keydown', ev=>{ if (!['ArrowLeft','ArrowRight'].includes(ev.key)) return; ev.preventDefault(); S.game = S.game==='classic' ? 'ae' : 'classic'; render(); $('g-'+S.game).focus(); });

/* ---------------- boot ---------------- */
function firstRun(){
  // A working table from the first second: an example deck, clearly marked, ready to draw.
  const s = signDeck('libra', 'ae');
  const d = makeDeck({name:'Example: Libra deck', game:'ae', c:s.c, R:s.R, B:s.B, ability:s.ability, sign:'libra', ex:true});
  S.decks.push(d); S.active.ae = d.id; S.firstRun = false;
}
function migrate(){
  // Saves from the Star-Sign Table called the main game '2.0', under another key; it's Aces & Eclipses now ('ae').
  const g = x => x==='classic' ? 'classic' : 'ae';
  if (S.game!=='classic') S.game = 'ae';
  for (const k of ['active','draft','fate']){ const o = S[k] = S[k] || {};
    for (const x of Object.keys(o)) if (x!=='ae' && x!=='classic'){ if (o.ae==null) o.ae = o[x]; delete o[x]; }
    if (!('ae' in o)) o.ae = null; if (!('classic' in o)) o.classic = null; }
  for (const d of S.decks) d.game = g(d.game);
  for (const st of Object.values(S.play||{})) if (st && st.game) st.game = g(st.game);
  for (const fs of Object.values(S.fate)) if (fs && fs.game) fs.game = g(fs.game);
  // Wild magic is an optional rule in both games: on in Aces & Eclipses (as before), off in d20 Classic, until the table says otherwise.
  if (!S.wild || typeof S.wild!=='object') S.wild = {ae:true, classic:false};
  for (const k of ['ae','classic']) S.wild[k] = !!S.wild[k];
  // Saved Fate Decks are brought to the 100-card deck, with the face cards only when wild magic is on.
  for (const fs of Object.values(S.fate)) if (fs) P.fateUpgrade(fs, S.wild[fs.game==='classic' ? 'classic' : 'ae']);
  // d20 Classic is a bonus mode, off unless this device already plays it.
  if (typeof S.compat!=='boolean') S.compat = S.game==='classic' || S.decks.some(d=>d.game==='classic' && !d.ex);
  if (!S.compat) S.game = 'ae';
  if (S.sub!=='35') S.sub = 'fifth';   // fifth edition, or 3.5
  // Older saves named party members by id; draws and wild magic now carry the character's name.
  const ids = Object.fromEntries((S.gm.party||[]).map(p=>[p.id, p.name]));
  if (S.gm.who && ids[S.gm.who]) S.gm.who = ids[S.gm.who];
  for (const k of ['ae','classic']){ const fs = S.fate && S.fate[k]; if (!fs) continue;
    for (const x of (fs.sets||[])) if (ids[x.who]) x.who = ids[x.who];
    if (fs.wild && ids[fs.wild.destined]) fs.wild.destined = ids[fs.wild.destined]; }
  for (const k of ['showLocal','enc','hosting']) if (S.gm[k]===undefined) S.gm[k] = false;
  if (!S.open || typeof S.open!=='object') S.open = {};
  for (const d of S.decks) if (!d.level) d.level = 1;
}
async function liveBoot(){
  if (LAN){
    LIVE.avail = true;
    if (HOST==='android'){ if (S.gm.hosting) await hostLan(); else if (S.table && S.table.lan) await joinLan(S.table.lan, true); }
    else { ui.pickSave = !S.decks.some(d=>!d.ex); await joinLan(location.host || ('localhost:'+LAN_PORT)); }
    liveRefresh(); return;
  }
  if (HOST==='web' || HOST==='file'){ LIVE.avail = false; liveRefresh(); return; }
  const room = await roomNS();
  if (!room){ liveRefresh(); return; }
  if (S.gm.hosting) await hostTable();
  else if (S.table && S.table.code) await joinTable(S.table.code);
  liveRefresh();
}
function start(hot){
  S = (hot && hot.v===1) ? Object.assign(fresh(), hot) : (load() || fresh());
  if (S.firstRun) firstRun();
  migrate();
  const h = (location.hash||'').replace('#','');
  if (['play','build','gm','rules'].includes(h)) S.tab = h;
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(()=>S); } catch(e){}
  render();
  liveBoot();
  dlBoot();
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data);
} catch(e){ start(null); }
})();

</script>

if ('serviceWorker' in navigator && window.SST_HOST==='web' && (location.protocol==='https:' || location.hostname==='localhost')) addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); } catch(e){}
