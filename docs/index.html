 cloudburst drenches everything within 60 feet of the Destined until the start of their next turn: nonmagical fires go out, the wild magic tries to counteract magical fire (as #39), and creatures in the rain are concealed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>53\u003c/td>\n\u003ctd>♥♥♣ · ♦♠♠ · ♥♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Strike Up the Band.\u003c/strong> For 1 minute theme music follows the Destined: a +2 status bonus to Diplomacy, Intimidation and Performance checks, a −2 status penalty to Deception checks, and they can&#39;t Hide or Sneak.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>54\u003c/td>\n\u003ctd>♥♥♦ · ♠♠♣ · ♥♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Stolen Face.\u003c/strong> The Destined and the enemy nearest them swap appearances for 1 minute (an illusion). A creature that Seeks and beats the surge DC sees through it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>♥♥♦ · ♠♣♣ · ♥♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Living Object.\u003c/strong> The nearest unattended object (up to Medium size) sprouts animal legs and follows the Destined around until the encounter ends, getting underfoot. It&#39;s harmless.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>56\u003c/td>\n\u003ctd>♥♦♦ · ♠♠♣ · ♥♦♣ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Gem Spray.\u003c/strong> Gems shoot from the Destined in a 15-foot cone: 1 piercing damage to each creature in it, friend or foe. They&#39;re real: draw a damage-deck card and read it as a d4; the gems are worth that many × 10 silver pieces.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>57\u003c/td>\n\u003ctd>♥♦♦ · ♠♣♣ · ♥♦♠ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Ethereal Object.\u003c/strong> The unattended object nearest the Destined (up to 30 cubic feet: a crate, a door, a table) turns ethereal for good: it gives no cover, and anything can pass through it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>58\u003c/td>\n\u003ctd>♥♦♠ · ♥♦♣ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>8.4156%\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Oddity.\u003c/strong> Something harmless and strange: draw a damage-deck card (redraw Jokers) and look it up on the Oddities table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>59\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♣ · ♦♦♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#14\u003c/td>\n\u003ctd>\u003cstrong>Bad Omen.\u003c/strong> The Destined loses a Hero Point. If they have none, their next check this encounter is a misfortune check instead (draw 3 cards, keep the worst pair).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♠ · ♦♦♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#15\u003c/td>\n\u003ctd>\u003cstrong>Hostile Beast.\u003c/strong> A beast drawn by the magic appears within 30 feet of the Destined and attacks the party for 1 minute, then vanishes. Its level is the Destined&#39;s level − 3 (at least −1); it takes 2 actions at the end of each of the Destined&#39;s turns.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>61\u003c/td>\n\u003ctd>♥♠♠ · ♥♣♣ · ♦♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#16\u003c/td>\n\u003ctd>\u003cstrong>Clumsy Hex.\u003c/strong> The Destined attempts a Reflex save. Failure: clumsy 2 for 1 minute. Critical failure: clumsy 3 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>62\u003c/td>\n\u003ctd>♥♠♠ · ♥♣♣ · ♦♦♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#19\u003c/td>\n\u003ctd>\u003cstrong>Verdant Clutch.\u003c/strong> Vines burst up in a 20-foot burst centered on the Destined. Each creature in it attempts a Reflex save or is immobilized (Escape DC = surge DC), and the area is difficult terrain for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>63\u003c/td>\n\u003ctd>♥♥♠ · ♦♠♠ · ♦♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#22\u003c/td>\n\u003ctd>\u003cstrong>Butterfly Swarm.\u003c/strong> Six hundred butterflies fill a 20-foot burst centered on the Destined for 2 rounds. Creatures inside are blinded while they stay in the swarm.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>64\u003c/td>\n\u003ctd>♥♥♣ · ♦♠♠ · ♦♣♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#27\u003c/td>\n\u003ctd>\u003cstrong>Burnout.\u003c/strong> Each ally burns the top 3 cards of their deck: discard them unused. If that takes a deck&#39;s last card, it runs out as usual.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>♥♥♦ · ♥♠♠ · ♦♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#20\u003c/td>\n\u003ctd>\u003cstrong>Tinge of Terror.\u003c/strong> The Destined and each ally within 20 feet attempt a Will save: frightened 1 on a failure, frightened 2 on a critical failure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>66\u003c/td>\n\u003ctd>♥♥♦ · ♥♣♣ · ♦♠♠ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#24\u003c/td>\n\u003ctd>\u003cstrong>Whirligig.\u003c/strong> The Destined attempts a Will save (incapacitation). On a failure they spin like a top: stunned 1, then confused until the end of their next turn.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>67\u003c/td>\n\u003ctd>♥♥♦ · ♦♠♠ · ♠♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#23\u003c/td>\n\u003ctd>\u003cstrong>Leaping Weapon.\u003c/strong> The Destined&#39;s weapon, or whatever they&#39;re holding, leaps from their hands and lands 10 feet away in a random direction.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>68\u003c/td>\n\u003ctd>♥♥♦ · ♦♠♠ · ♦♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#26\u003c/td>\n\u003ctd>\u003cstrong>Ill Fortune.\u003c/strong> Each ally&#39;s next check this encounter is a misfortune check: draw 3 cards and keep the worst pair.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>69\u003c/td>\n\u003ctd>♥♥♦ · ♦♣♣ · ♠♠♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#29\u003c/td>\n\u003ctd>\u003cstrong>Glimpsed.\u003c/strong> The GM looks at the top 3 cards of the Destined&#39;s deck and puts them back in any order.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♠ · ♠♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#17\u003c/td>\n\u003ctd>\u003cstrong>Weakness Hex.\u003c/strong> The Destined attempts a Fortitude save. Failure: enfeebled 2 for 1 minute. Critical failure: enfeebled 3 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>71\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♠ · ♥♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#18\u003c/td>\n\u003ctd>\u003cstrong>Muddle.\u003c/strong> The Destined attempts a Will save. Failure: stupefied 2 for 1 minute. Critical failure: stupefied 3 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>72\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♠ · ♦♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#21\u003c/td>\n\u003ctd>\u003cstrong>Laughing Fit.\u003c/strong> The Destined attempts a Will save. Success: no reactions for 1 round. Failure: slowed 1 and no reactions for 1 round. Critical failure: slowed 1 and no reactions for 3 rounds, and they fall prone.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>73\u003c/td>\n\u003ctd>♥♦♦ · ♥♣♣ · ♠♠♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#28\u003c/td>\n\u003ctd>\u003cstrong>Backlash.\u003c/strong> The magic snaps back at the Destined and each ally within 30 feet: 1d6 force damage per surge rank (basic Fortitude save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>74\u003c/td>\n\u003ctd>♥♦♦ · ♥♣♣ · ♦♠♠ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#25\u003c/td>\n\u003ctd>\u003cstrong>Critter Curse.\u003c/strong> The Destined attempts a Will save (incapacitation). On a failure they turn into a harmless Tiny animal until the end of their next turn (1d4 rounds on a critical failure): they can move and hide but can&#39;t attack, cast spells or use their gear.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>♠♠♣ · ♥♦♠ · ♥♦♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#32\u003c/td>\n\u003ctd>\u003cstrong>Sticky Nectar.\u003c/strong> Sticky nectar coats the Destined (Reflex save negates): clumsy 1 and a −10-foot status penalty to their Speeds for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>76\u003c/td>\n\u003ctd>♠♣♣ · ♥♦♠ · ♥♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#33\u003c/td>\n\u003ctd>\u003cstrong>Sudden Eclipse.\u003c/strong> The next Sun any ally draws this encounter counts as an Eclipse instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>77\u003c/td>\n\u003ctd>♥♠♠ · ♥♦♣ · ♥♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#30\u003c/td>\n\u003ctd>\u003cstrong>Tattletale Glow.\u003c/strong> Glittering light outlines the Destined and each ally within 20 feet for 1 minute: they can&#39;t be concealed, and invisible ones are only concealed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>78\u003c/td>\n\u003ctd>♥♣♣ · ♥♦♠ · ♥♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#34\u003c/td>\n\u003ctd>\u003cstrong>Luminous Pests.\u003c/strong> Birds of light burst from the Destined in a 30-foot cone. The Destined and every creature in the cone, allies included, attempt a Will save or are dazzled for 1 minute (on a critical failure, blinded for 1 round and then dazzled for 1 minute).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>79\u003c/td>\n\u003ctd>♦♠♠ · ♥♦♣ · ♥♦♣ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#31\u003c/td>\n\u003ctd>\u003cstrong>Mental Broadcast.\u003c/strong> For 1 minute everyone within 30 feet hears the Destined&#39;s surface thoughts: before each of the Destined&#39;s turns, their player says out loud what they plan to do, and enemies can act on it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80\u003c/td>\n\u003ctd>♦♣♣ · ♥♦♠ · ♥♦♠ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#35\u003c/td>\n\u003ctd>\u003cstrong>Gale Blast.\u003c/strong> Wind slams through the party: the Destined and each ally within 20 feet attempt a Fortitude save. Failure: pushed 10 feet in the same random direction. Critical failure: also knocked prone.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>81\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♣ · ♥♦♦ · ♦♣♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>0.1753%\u003c/td>\n\u003ctd>570\u003c/td>\n\u003ctd>#9\u003c/td>\n\u003ctd>\u003cstrong>Bewildered.\u003c/strong> The Destined attempts a Will save. Critical success: no effect. Success: stupefied 1 for 1 round. Failure: confused for 1 round. Critical failure: confused for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>82\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♦ · ♥♣♣ · ♦♦♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>0.1753%\u003c/td>\n\u003ctd>570\u003c/td>\n\u003ctd>#8\u003c/td>\n\u003ctd>\u003cstrong>Energy Unleashed.\u003c/strong> Raw energy bursts out of the Destined: each creature within 10 feet, the Destined included, takes 2d6 untyped damage per surge rank (basic Reflex save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>83\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♠ · ♥♦♦ · ♦♠♠\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>0.1753%\u003c/td>\n\u003ctd>570\u003c/td>\n\u003ctd>#11\u003c/td>\n\u003ctd>\u003cstrong>Lightning Strike.\u003c/strong> Lightning strikes the Destined and arcs to each ally within 10 feet of them: (surge rank + 1)d12 electricity damage, basic Reflex save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>84\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♦ · ♥♠♠ · ♦♦♠\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>0.1753%\u003c/td>\n\u003ctd>570\u003c/td>\n\u003ctd>#10\u003c/td>\n\u003ctd>\u003cstrong>Dwindle.\u003c/strong> The Destined attempts a Fortitude save or shrinks to Tiny for 1 minute (1 hour on a critical failure): reach 0 feet, a −2 status penalty to damage rolls and a −10-foot status penalty to their Speeds.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>85\u003c/td>\n\u003ctd>♥♠♠ · ♦♣♣ · ♥♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#12\u003c/td>\n\u003ctd>\u003cstrong>Leaden Limbs.\u003c/strong> The Destined attempts a Fortitude save. Critical success: no effect. Success: slowed 1 for 1 round. Failure: slowed 1 for 1 minute. Critical failure: slowed 2 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>86\u003c/td>\n\u003ctd>♥♣♣ · ♦♠♠ · ♥♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#13\u003c/td>\n\u003ctd>\u003cstrong>Oppressive Voice.\u003c/strong> A voice thunders through the Destined&#39;s mind: 1d4 nonlethal mental damage per surge rank (basic Will save). On a failure they&#39;re also stunned 1; on a critical failure, stunned 2.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>87\u003c/td>\n\u003ctd>♠♠♠ · ♥♦♣ · ♥♦♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>0.2338%\u003c/td>\n\u003ctd>428\u003c/td>\n\u003ctd>#2\u003c/td>\n\u003ctd>\u003cstrong>Magical Nemesis.\u003c/strong> A hostile creature drawn by the magic appears within 60 feet of the Destined. The GM picks it; its level is the Destined&#39;s level − 2 (at least −1). It acts right after the Destined&#39;s turn, fights on the enemies&#39; side, and after 1 minute may leave or stay.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>88\u003c/td>\n\u003ctd>♣♣♣ · ♥♦♠ · ♥♦♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>0.2338%\u003c/td>\n\u003ctd>428\u003c/td>\n\u003ctd>#3\u003c/td>\n\u003ctd>\u003cstrong>Flame Burst.\u003c/strong> Fire explodes in a 20-foot burst centered on the Destined: 2d6 fire damage per surge rank, basic Reflex save. Enemies in the burst are hit too.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>89\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♦ · ♦♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#5\u003c/td>\n\u003ctd>\u003cstrong>Dirge.\u003c/strong> Four wailing skeletons appear and sing the party&#39;s dirge for 1 minute: allies take a −1 status penalty to attack rolls, Perception checks, saving throws and skill checks.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>♠♠♠ · ♥♦♦ · ♥♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#4\u003c/td>\n\u003ctd>\u003cstrong>Life Sap.\u003c/strong> The magic feeds on the Destined and each ally within 20 feet (Fortitude save). Critical success: no effect. Success: enfeebled 1 for 1 minute. Failure: drained 1, and enfeebled 2 for 1 minute. Critical failure: as failure, and doomed 1.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>91\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♦ · ♦♠♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#7\u003c/td>\n\u003ctd>\u003cstrong>Slowing Wave.\u003c/strong> Time thickens around the Destined and each ally within 30 feet (Fortitude save). Critical success: no effect. Success: slowed 1 for 1 round. Failure: slowed 1 for 1 minute. Critical failure: slowed 1 for 1 minute and stunned 1.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>92\u003c/td>\n\u003ctd>♣♣♣ · ♥♦♦ · ♥♠♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#6\u003c/td>\n\u003ctd>\u003cstrong>Toxic Cloud.\u003c/strong> A poisonous cloud fills a 20-foot burst centered on the Destined for 1 minute; creatures inside are concealed. A creature that starts its turn in it takes 1d6 poison damage per surge rank (basic Fortitude save) and is sickened 1 on a failure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>93\u003c/td>\n\u003ctd>♠♠♠ · ♣♣♣ · ♥♥♦ · ♥♦♦\u003c/td>\n\u003ctd>Bad 4\u003c/td>\n\u003ctd>0.0584%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003ctd>#1\u003c/td>\n\u003ctd>\u003cstrong>Crown of Ruin.\u003c/strong> Every ally takes 2d8 void damage per surge rank (basic Fortitude save), gains one level of exhaustion (as if their deck ran out, without the reshuffle) and loses a Hero Point. Each ally&#39;s next check this encounter is a natural 1: don&#39;t draw.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"c2-14-wild-magic-oddities-58\">Oddities (#58)\u003c/h3>\n\u003cp>Draw a card from the damage deck; redraw Jokers.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>Oddity\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>Leaves sprout from the Destined&#39;s hair and clothes and fall off after a day.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>The Destined turns blue, green or purple for a week.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>The enemy nearest the Destined turns blue, green or purple for a week.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Knee-high grass springs up in a 60-foot cone in front of the Destined.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>Six hundred bright butterflies pour out and flutter away.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>A fountain of wine bursts from the ground nearby and flows for 10 minutes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>A copper piece appears and pings off the Destined&#39;s forehead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>A mouse appears and follows the Destined for a day, devoted and useless.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>Rainbow dye splashes over the Destined and lasts a day.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>A life-size chocolate statue of the enemy nearest the Destined appears beside them.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"c2-15-pacing-the-day","title":"15. Pacing the day","html":"\u003ch2 id=\"c2-15-pacing-the-day-15-pacing-the-day\">15. Pacing the day\u003c/h2>\n\u003cp>\u003cstrong>The last fight of the day is the GM&#39;s to balance and the party&#39;s to prepare for.\u003c/strong> No rule softens it.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Every deck except Taurus is strong early in the day and weak late,\u003c/strong> because every deck runs out at least once in a standard day. Fire decks swing the most between morning and night, Earth decks the least. Unyielding cancels Taurus&#39;s one deck-out, so it stays flat all day. A boss at the end of a long day plays harder than its encounter budget says.\u003c/li>\n\u003cli>\u003cstrong>Day length shifts which decks are strong:\u003c/strong> short days favor small decks, long days favor big ones.\u003c/li>\n\u003cli>\u003cstrong>Damage runs a little high on both sides\u003c/strong> because of the damage deck&#39;s Jokers, a little more for monsters (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Collapses only happen on long days.\u003c/strong> Exhausted 4 comes around check 63 for Aries, 69 for Leo, 75 for Sagittarius and 83 for Libra; the other decks don&#39;t get there in any realistic day.\u003c/li>\n\u003cli>\u003cstrong>What the party can do:\u003c/strong> track the cards left in each deck, rest before the big fight when they can, and save Hero Points and fortune effects for it.\u003c/li>\n\u003c/ul>\n\u003cp>Chapter 20 has each deck&#39;s numbers over short, standard and long days.\u003c/p>\n"},{"id":"c2-16-watch-in-playtesting","title":"16. Watch in playtesting","html":"\u003ch2 id=\"c2-16-watch-in-playtesting-16-watch-in-playtesting\">16. Watch in playtesting\u003c/h2>\n\u003cp>Things to watch at the table; none of them breaks the balance rules.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Unyielding (Taurus) depends on day length.\u003c/strong> On short days the deck never runs out, so it pays for nothing; on long days it&#39;s worth more than its price.\u003c/li>\n\u003cli>\u003cstrong>Sting (Scorpio) is the strongest once-per-day ability.\u003c/strong> Its price assumes the Eclipse ends up on an enemy&#39;s attack; played on a boss&#39;s big spell or save, it&#39;s worth more.\u003c/li>\n\u003cli>\u003cstrong>Shell is priced for a party of four.\u003c/strong> In a smaller party it&#39;s worth a little less, in a bigger one a little more.\u003c/li>\n\u003cli>\u003cstrong>Twin Draw&#39;s value depends on the deck.\u003c/strong> Swingy decks, Gemini&#39;s included, gain less from it than its price assumes.\u003c/li>\n\u003cli>\u003cstrong>Crown of Ruin (#93)\u003c/strong> is the harshest effect: damage, a level of exhaustion and a natural 1 for every ally. It comes up about once in 1,700 wild magic events.\u003c/li>\n\u003cli>\u003cstrong>Day for Night (#49)\u003c/strong> hits Scorpio (three Eclipses) and Virgo (two Suns) in opposite directions.\u003c/li>\n\u003cli>\u003cstrong>Glimpse (#29)\u003c/strong> lets the Destined see face cards near the top of the Fate Deck and move them, which can speed up the next wild magic.\u003c/li>\n\u003cli>\u003cstrong>Mental Broadcast (#79)\u003c/strong> depends on the table playing along; the GM can swap in any other minor effect.\u003c/li>\n\u003c/ul>\n"},{"id":"c2-17-the-standard-day-and-the-balance-rules","title":"17. The standard day and the balance rules","html":"\u003ch2 id=\"c2-17-the-standard-day-and-the-balance-rules-17-the-standard-day-and-the-balance-rules\">17. The standard day and the balance rules\u003c/h2>\n\u003cp>Every &quot;balanced&quot; in this book means the same thing: over a standard day of 50 checks, a deck&#39;s day edge is within ±0.1, and its Strike damage and the damage it takes from basic saves each land within 97–103% of a d20&#39;s. A deck&#39;s \u003cstrong>edge\u003c/strong> is its average card total minus 10.5, minus its exhaustion penalty; its \u003cstrong>day edge\u003c/strong> is that edge over a standard day. One point of edge is about 5% more success on a typical check. This chapter sets out the day and the rules the decks are built to.\u003c/p>\n\u003ch3 id=\"c2-17-the-standard-day-and-the-balance-rules-the-standard-day\">The standard day\u003c/h3>\n\u003cp>All balance numbers assume a \u003cstrong>standard day of 50 checks\u003c/strong>, a martial character&#39;s day: 3–4 encounters (about 14 combat rounds) plus exploration. That&#39;s about 95–99 cards, depending on the deck.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Character\u003c/th>\n\u003cth>Per day\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Martial\u003c/td>\n\u003ctd>~50 checks (about 2.5 per combat round)\u003c/td>\n\u003ctd>~98\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Caster, character level 1–4\u003c/td>\n\u003ctd>4 spells + 14 cantrips + ~32 other checks\u003c/td>\n\u003ctd>~92\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Caster, character level 5–12\u003c/td>\n\u003ctd>10 spells + 8 cantrips + ~32 other checks\u003c/td>\n\u003ctd>~98\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Caster, character level 13–20\u003c/td>\n\u003ctd>14 spells + 4 cantrips + ~32 other checks\u003c/td>\n\u003ctd>~102\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>About a quarter of casters&#39; spells need a spell attack. Drawing fewer cards than the standard day helps a little (low-level casters: +0.05 to +0.2 day edge), and drawing more hurts a little (high-level casters: −0.05 to −0.23, mostly for Fire and Air decks).\u003c/p>\n\u003ch3 id=\"c2-17-the-standard-day-and-the-balance-rules-balance-rules\">Balance rules\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>Size buys power.\u003c/strong> A deck&#39;s allowed average card total is \u003cstrong>10.5 + 2 × its average exhaustion level over a standard day.\u003c/strong> With 1 Sun and 1 Eclipse:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Deck size\u003c/th>\n\u003cth>Runs out around check\u003c/th>\n\u003cth>Highest exhaustion in a standard day\u003c/th>\n\u003cth>Allowed average\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>16, 31, 47\u003c/td>\n\u003ctd>3 (−6)\u003c/td>\n\u003ctd>12.75\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>18, 36\u003c/td>\n\u003ctd>2 (−4)\u003c/td>\n\u003ctd>12.32\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>21, 41\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>12.02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>23, 46\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>11.72\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>26\u003c/td>\n\u003ctd>1 (−2)\u003c/td>\n\u003ctd>11.47\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>28\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.37\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>31\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.27\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.07\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>38\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>10.97\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>More Jokers make a deck last longer, so its allowed average drops a little: with 3 of each, a 40-card deck&#39;s is 11.89 and a 70-card deck&#39;s 11.03. The Deck Lab works out the exact allowed average for any deck. A deck at its allowed average succeeds exactly as often as a d20 over a standard day, averaged over all difficulties.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Jokers can be uneven, within limits.\u003c/strong> Eclipses equal the Suns or one more, with at least one Sun, and a deck holds at most 2 Jokers at 30 cards, 3 at 35–40, 4 at 45–50, 5 at 55, 6 at 60–65 and 7 at 70–75. Decks of 65 cards or more get a few extra setups, including no Sun at all; more Suns than Eclipses works only at 75 cards. 13.2 has the list, and chapter 24 the reasons.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Measure Strike damage, not just the average.\u003c/strong> A critical failure on a Strike is no worse than a miss, but a critical hit doubles damage. So a deck with more extreme draws gets extra crits without paying for its extra misses, and out-damages a steadier deck with the same average (chapter 19).\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Use Jokers as the counterweight.\u003c/strong> More Jokers means more crits and more Strike damage. Steadier decks get more Jokers; swingier decks get fewer.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Aim for 97–103%.\u003c/strong> Over a standard day, a deck&#39;s damage from three-Strike turns, and the damage it takes from basic saves, should each land within 97–103% of a d20&#39;s, with a day edge within ±0.1.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>No value makes up more than a third of the number cards.\u003c/strong> Decks piled onto a few values land on the same totals over and over, which makes their balance hard to predict. All twelve sign decks are inside it; the closest is Pisces, with sixteen 10s among 58 number cards.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Abilities cost pips.\u003c/strong> A deck with a sign ability builds to a lower pip total: its size&#39;s pip total minus the ability&#39;s price at that size (chapter 12). To judge it, add the price back as a bonus on every check (each pip adds 2 × (number cards − 1) ÷ (cards × (cards − 1)) to the average); with that bonus it must pass rule 5. Unyielding (Taurus) is judged by playing it out instead: the first deck-out of the day gives no exhaustion.\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>Chapter 13 turns these rules into a paper method for building a deck, and chapter 23 shows how the sign abilities are priced.\u003c/p>\n"},{"id":"c2-18-what-a-two-card-draw-can-and-can-t-do","title":"18. What a two-card draw can and can't do","html":"\u003ch2 id=\"c2-18-what-a-two-card-draw-can-and-can-t-do-18-what-a-two-card-draw-can-and-can-39-t-do\">18. What a two-card draw can and can&#39;t do\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>It can&#39;t match a d20 exactly.\u003c/strong> Two draws from one deck can&#39;t add up to 20 equally likely card totals. Middle totals like 10 and 11 come up often and the extremes rarely, and each deck bends that shape its own way.\u003c/li>\n\u003cli>\u003cstrong>Decks that all matched the d20 would all play the same,\u003c/strong> so &quot;fair&quot; means the average over a standard day, not an identical shape.\u003c/li>\n\u003cli>\u003cstrong>Reshuffle only when forced.\u003c/strong> Each Joker comes up once per pass through the deck, and that is what holds natural 20s and 1s at the rates in chapter 20.\u003c/li>\n\u003cli>\u003cstrong>Card counting.\u003c/strong> Discards go face-down, so knowing when your only Eclipse is gone, or when the GM&#39;s Suns are used up, takes counting and memory. The balance math assumes nobody tracks this; in a 30-card deck a careful player can, and it helps with timing Hero Points and fortune effects.\u003c/li>\n\u003c/ul>\n"},{"id":"c2-19-why-the-average-isn-t-enough","title":"19. Why the average isn't enough","html":"\u003ch2 id=\"c2-19-why-the-average-isn-t-enough-19-why-the-average-isn-39-t-enough\">19. Why the average isn&#39;t enough\u003c/h2>\n\u003cp>Two 80-card example decks, both averaging exactly 10.5, with 2 Suns and 2 Eclipses each:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Steady:\u003c/strong> mostly 4s to 7s (2-5-9-12-13-13-11-7-4-0).\u003c/li>\n\u003cli>\u003cstrong>Swingy:\u003c/strong> mostly Aces, 2s, 9s and 10s (21-13-5-1-0-0-2-5-11-18).\u003c/li>\n\u003c/ul>\n\u003cp>A fighter makes three Strikes in a turn. The second takes −5 and the third −10, so the number needed on the draw rises from 8 to 13 to 18. A hit counts as 1, a crit as 2.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Strike\u003c/th>\n\u003cth>Need\u003c/th>\n\u003cth>d20\u003c/th>\n\u003cth>Steady deck\u003c/th>\n\u003cth>Swingy deck\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>First\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>50% hit, 15% crit → 0.80\u003c/td>\n\u003ctd>76% hit, 5% crit → 0.87\u003c/td>\n\u003ctd>50% hit, 21% crit → 0.91\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Second\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>35% hit, 5% crit → 0.45\u003c/td>\n\u003ctd>22% hit, 5% crit → 0.32\u003c/td>\n\u003ctd>24% hit, 5% crit → 0.34\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Third\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>10% hit, 5% crit → 0.20\u003c/td>\n\u003ctd>0% hit, 5% crit → 0.10\u003c/td>\n\u003ctd>16% hit, 5% crit → 0.26\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Turn total\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>1.45\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>1.29 (89%)\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>1.50 (103%)\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The steady deck almost never misses the first Strike, but it almost never draws the 18+ it needs for a crit, and it can&#39;t land the third Strike without a Sun. The swingy deck misses more often, but its misses cost nothing extra and its high draws turn into crits and long-shot hits.\u003c/p>\n\u003cp>Saves work differently: a critical failure on a basic save doubles the damage you take, so extreme draws cut both ways, and decks differ by only a few percent. That&#39;s why the balance rules count both. The Strike balance holds when crits are worth more than double: with crits at 2.5 times a hit (typical for deadly weapons) or 3 times (fatal weapons), every sign deck stays within 97–103%, counting its ability as its price. Leo is lowest (98.3% and 97.7%) and Virgo highest (102.2% and 102.5%).\u003c/p>\n"},{"id":"c2-20-the-sign-decks-against-a-d20","title":"20. The sign decks against a d20","html":"\u003ch2 id=\"c2-20-the-sign-decks-against-a-d20-20-the-sign-decks-against-a-d20\">20. The sign decks against a d20\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Average card total\u003c/th>\n\u003cth>Spread (SD; d20 5.77)\u003c/th>\n\u003cth>Natural 20 / 1\u003c/th>\n\u003cth>Cards per check\u003c/th>\n\u003cth>Fresh shuffle: Strike damage / save damage taken\u003c/th>\n\u003cth>Standard day: Strike damage / save damage taken\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>12.55\u003c/td>\n\u003ctd>5.10\u003c/td>\n\u003ctd>6.6% / 6.6%\u003c/td>\n\u003ctd>1.93\u003c/td>\n\u003ctd>134% / 83%\u003c/td>\n\u003ctd>102% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>12.22\u003c/td>\n\u003ctd>4.90\u003c/td>\n\u003ctd>6.0% / 6.0%\u003c/td>\n\u003ctd>1.94\u003c/td>\n\u003ctd>127% / 85%\u003c/td>\n\u003ctd>99% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>11.99\u003c/td>\n\u003ctd>5.41\u003c/td>\n\u003ctd>5.5% / 5.5%\u003c/td>\n\u003ctd>1.94\u003c/td>\n\u003ctd>126% / 86%\u003c/td>\n\u003ctd>102% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>40\u003c/td>\n\u003ctd>11.90\u003c/td>\n\u003ctd>5.33\u003c/td>\n\u003ctd>4.9% / 4.9%\u003c/td>\n\u003ctd>1.95\u003c/td>\n\u003ctd>122% / 87%\u003c/td>\n\u003ctd>100% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>44\u003c/td>\n\u003ctd>11.57\u003c/td>\n\u003ctd>4.38\u003c/td>\n\u003ctd>8.8% / 8.8%\u003c/td>\n\u003ctd>1.91\u003c/td>\n\u003ctd>117% / 93%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>11.32\u003c/td>\n\u003ctd>5.61\u003c/td>\n\u003ctd>4.1% / 4.1%\u003c/td>\n\u003ctd>1.96\u003c/td>\n\u003ctd>115% / 91%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>52\u003c/td>\n\u003ctd>11.07\u003c/td>\n\u003ctd>4.98\u003c/td>\n\u003ctd>7.5% / 7.5%\u003c/td>\n\u003ctd>1.92\u003c/td>\n\u003ctd>113% / 94%\u003c/td>\n\u003ctd>100% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>56\u003c/td>\n\u003ctd>10.80\u003c/td>\n\u003ctd>5.00\u003c/td>\n\u003ctd>6.9% / 10.3%\u003c/td>\n\u003ctd>1.91\u003c/td>\n\u003ctd>110% / 98%\u003c/td>\n\u003ctd>99% / 103%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>60\u003c/td>\n\u003ctd>11.19\u003c/td>\n\u003ctd>5.82\u003c/td>\n\u003ctd>3.3% / 3.3%\u003c/td>\n\u003ctd>1.97\u003c/td>\n\u003ctd>112% / 94%\u003c/td>\n\u003ctd>101% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>65\u003c/td>\n\u003ctd>11.10\u003c/td>\n\u003ctd>5.31\u003c/td>\n\u003ctd>6.0% / 6.0%\u003c/td>\n\u003ctd>1.94\u003c/td>\n\u003ctd>108% / 95%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>70\u003c/td>\n\u003ctd>10.47\u003c/td>\n\u003ctd>4.72\u003c/td>\n\u003ctd>8.3% / 8.3%\u003c/td>\n\u003ctd>1.91\u003c/td>\n\u003ctd>98% / 100%\u003c/td>\n\u003ctd>98% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>10.83\u003c/td>\n\u003ctd>5.64\u003c/td>\n\u003ctd>5.3% / 2.6%\u003c/td>\n\u003ctd>1.96\u003c/td>\n\u003ctd>108% / 94%\u003c/td>\n\u003ctd>102% / 98%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>&quot;Average card total&quot; and &quot;Spread&quot; (its standard deviation) come from the deck&#39;s own cards, before exhaustion. The damage figures count each ability as its price, added back as a bonus on every check; Taurus&#39;s Unyielding is played out instead.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Scorpio&#39;s third Eclipse\u003c/strong> gives natural 1s on 10.3% of its checks, paid for with stronger number cards, so its saves take about 3% more damage than a d20&#39;s while its Strikes stay even.\u003c/li>\n\u003cli>\u003cstrong>Virgo&#39;s extra Sun\u003c/strong> gives natural 20s on 5.3% of its checks and natural 1s on 2.6%, paid for with weaker number cards.\u003c/li>\n\u003cli>\u003cstrong>Cards per check\u003c/strong> average 2 − (Jokers ÷ deck size) over a day, about 1.91–1.97 for the twelve decks.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"c2-20-the-sign-decks-against-a-d20-short-days-and-long-days\">Short days and long days\u003c/h3>\n\u003cp>Edge in points, with Strike damage compared with a d20, counting abilities as in the table above. The highest exhaustion level reached by the end of a long day, or the first collapse, is in brackets. On a standard day only Aries reaches Exhausted 3 (around check 47), Taurus never tires, and nobody collapses.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Short day (25 checks)\u003c/th>\n\u003cth>Standard day (50 checks)\u003c/th>\n\u003cth>Long day (80 checks)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aries\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>+1.5 · 123%\u003c/td>\n\u003ctd>0.0 · 102%\u003c/td>\n\u003ctd>−1.4 · 85% (collapses around check 63)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leo\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>+1.3 · 117%\u003c/td>\n\u003ctd>0.0 · 99%\u003c/td>\n\u003ctd>−1.5 · 81% (collapses around check 69)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sagittarius\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>+1.3 · 119%\u003c/td>\n\u003ctd>0.0 · 102%\u003c/td>\n\u003ctd>−1.5 · 84% (collapses around check 75)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Libra\u003c/td>\n\u003ctd>40\u003c/td>\n\u003ctd>+1.2 · 117%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.4 · 83% (Exhausted 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aquarius\u003c/td>\n\u003ctd>44\u003c/td>\n\u003ctd>+1.1 · 115%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.3 · 84% (Exhausted 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gemini\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>+1.0 · 115%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.2 · 85% (Exhausted 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancer\u003c/td>\n\u003ctd>52\u003c/td>\n\u003ctd>+0.9 · 113%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.0 · 88% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scorpio\u003c/td>\n\u003ctd>56\u003c/td>\n\u003ctd>+0.8 · 110%\u003c/td>\n\u003ctd>0.0 · 99%\u003c/td>\n\u003ctd>−1.0 · 88% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pisces\u003c/td>\n\u003ctd>60\u003c/td>\n\u003ctd>+0.8 · 112%\u003c/td>\n\u003ctd>0.0 · 101%\u003c/td>\n\u003ctd>−0.9 · 88% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Capricorn\u003c/td>\n\u003ctd>65\u003c/td>\n\u003ctd>+0.7 · 108%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−0.8 · 90% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Taurus\u003c/td>\n\u003ctd>70\u003c/td>\n\u003ctd>0.0 · 98%\u003c/td>\n\u003ctd>0.0 · 98%\u003c/td>\n\u003ctd>−0.2 · 96% (Exhausted 1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Virgo\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>+0.5 · 108%\u003c/td>\n\u003ctd>0.0 · 102%\u003c/td>\n\u003ctd>−0.7 · 93% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Fire decks deal 25–35% more Strike damage than a d20 on a fresh shuffle, but on a long day all three collapse at Exhausted 4. Earth decks barely move either way, and Taurus, whose first deck-out costs nothing, hardly moves at all. Long-day figures count only the checks made while awake, so they don&#39;t show what a collapse costs: a character down for 10 minutes, which in a fight means a character out.\u003c/p>\n\u003ch3 id=\"c2-20-the-sign-decks-against-a-d20-through-the-day\">Through the day\u003c/h3>\n\u003cp>Every deck except Taurus is ahead of a d20 early in the day and behind it late. Edge in the first and last quarters of a standard day: Fire +1.8 to +2.2 early and −2.1 to −2.3 late, Air +1.1 to +1.5 and −1.1 to −1.8, Water +0.8 to +0.9 and −1.1 to −1.2, Capricorn and Virgo +0.5 to +0.7 and −1.3. Unyielding cancels Taurus&#39;s one deck-out, so it stays flat all day.\u003c/p>\n"},{"id":"c2-21-checks-and-luck-against-a-d20","title":"21. Checks and luck against a d20","html":"\u003ch2 id=\"c2-21-checks-and-luck-against-a-d20-21-checks-and-luck-against-a-d20\">21. Checks and luck against a d20\u003c/h2>\n\u003ch3 id=\"c2-21-checks-and-luck-against-a-d20-the-fate-deck\">The Fate Deck\u003c/h3>\n\u003cp>Average card total 10.50; natural 20 and natural 1 each 4.9% (d20 5%); monster Strike damage 99.9% of a d20&#39;s and damage monsters take on basic saves 99.7%; within 6.5 percentage points of a d20 at every number needed. Long shots land a little more often: needing a 20, 10% instead of 5%.\u003c/p>\n\u003ch3 id=\"c2-21-checks-and-luck-against-a-d20-flat-checks\">Flat checks\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Flat check DC\u003c/th>\n\u003cth>Card needed\u003c/th>\n\u003cth>Chance\u003c/th>\n\u003cth>d20\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Any number card\u003c/td>\n\u003ctd>97.5%\u003c/td>\n\u003ctd>90%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>2 or higher\u003c/td>\n\u003ctd>76%\u003c/td>\n\u003ctd>85–75%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>3 or higher\u003c/td>\n\u003ctd>65%\u003c/td>\n\u003ctd>70–65%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>4 or higher\u003c/td>\n\u003ctd>57.5%\u003c/td>\n\u003ctd>60–55%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>DC − 6 (5 for DC 11, up to 10 for DC 16)\u003c/td>\n\u003ctd>51%, 45%, 39%, 35%, 32.5%, 25%\u003c/td>\n\u003ctd>50%, 45%, 40%, 35%, 30%, 25%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>25%\u003c/td>\n\u003ctd>20%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>Sun\u003c/td>\n\u003ctd>2.5%\u003c/td>\n\u003ctd>15–5%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Dying:\u003c/strong> with no help, a character who goes down at dying 1 dies 29% of the time (d20: 31%), at dying 2 59% (d20: 59%), at dying 3 83% (d20: 82%). Single recovery checks are a little less swingy: critical results come up 2.5% of the time instead of 5–15%.\u003c/li>\n\u003cli>\u003cstrong>Concealment\u003c/strong> (DC 5) passes 76% of the time instead of 80%.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"c2-21-checks-and-luck-against-a-d20-fortune-misfortune-and-rerolls\">Fortune, misfortune and rerolls\u003c/h3>\n\u003cp>Success chance at typical numbers needed (5 to 16):\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Effect\u003c/th>\n\u003cth>d20\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Fortune (keep the better)\u003c/td>\n\u003ctd>+22 percentage points\u003c/td>\n\u003ctd>+18 to +20.5, depending on the deck; Aquarius, the steadiest, +14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Misfortune (keep the worse)\u003c/td>\n\u003ctd>−22 percentage points\u003c/td>\n\u003ctd>−17 to −22; Aquarius −13\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Use the better result&quot; reroll\u003c/td>\n\u003ctd>turns 46% of failures into successes\u003c/td>\n\u003ctd>38–60%, never worse\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>&quot;Use the new result&quot; rerolls usually cost something (a Hero Point, a once-a-day feat), and the player sees the card they&#39;d keep before deciding, so most players skip the reroll when that card is low:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>&quot;Use the new result&quot; reroll\u003c/th>\n\u003cth>Always rerolls a failure\u003c/th>\n\u003cth>Rerolls only with a 1-in-3 chance or better\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>d20\u003c/td>\n\u003ctd>46% succeed · 9.7% get worse\u003c/td>\n\u003ctd>spends on 75% of failures · 53% succeed · 7.2% worse\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cards (keep the most recent card)\u003c/td>\n\u003ctd>29–45% succeed · 3.7–9.6% worse\u003c/td>\n\u003ctd>spends on 38–62% of failures · 49–68% succeed · 1.3–3.4% worse\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>By deck, for a player who rerolls only with a 1-in-3 chance or better:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Deck\u003c/th>\n\u003cth>Failures they&#39;d spend it on\u003c/th>\n\u003cth>Spends that succeed\u003c/th>\n\u003cth>Spends that make it worse\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aries\u003c/td>\n\u003ctd>58%\u003c/td>\n\u003ctd>68%\u003c/td>\n\u003ctd>2.4%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Libra\u003c/td>\n\u003ctd>62%\u003c/td>\n\u003ctd>60%\u003c/td>\n\u003ctd>2.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancer\u003c/td>\n\u003ctd>44%\u003c/td>\n\u003ctd>61%\u003c/td>\n\u003ctd>2.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scorpio\u003c/td>\n\u003ctd>45%\u003c/td>\n\u003ctd>61%\u003c/td>\n\u003ctd>3.4%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pisces\u003c/td>\n\u003ctd>55%\u003c/td>\n\u003ctd>55%\u003c/td>\n\u003ctd>1.6%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Taurus\u003c/td>\n\u003ctd>38%\u003c/td>\n\u003ctd>59%\u003c/td>\n\u003ctd>3.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Virgo\u003c/td>\n\u003ctd>56%\u003c/td>\n\u003ctd>51%\u003c/td>\n\u003ctd>1.3%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fate Deck\u003c/td>\n\u003ctd>58%\u003c/td>\n\u003ctd>49%\u003c/td>\n\u003ctd>2.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cem>d20\u003c/em>\u003c/td>\n\u003ctd>\u003cem>75%\u003c/em>\u003c/td>\n\u003ctd>\u003cem>53%\u003c/em>\u003c/td>\n\u003ctd>\u003cem>7.2%\u003c/em>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"c2-21-checks-and-luck-against-a-d20-held-draws-and-lucky-numbers\">Held draws and lucky numbers\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Held draws:\u003c/strong> a character who holds a draw every combat round and skips draws too low to hit wastes about 3–7 cards a day, about −0.05 to −0.16 edge.\u003c/li>\n\u003cli>\u003cstrong>Lucky number:\u003c/strong> drawn from the Fate Deck, it comes up 4.8–6.5% of the time across the twelve signs (d20: 5%).\u003c/li>\n\u003c/ul>\n"},{"id":"c2-22-the-damage-deck-against-dice","title":"22. The damage deck against dice","html":"\u003ch2 id=\"c2-22-the-damage-deck-against-dice-22-the-damage-deck-against-dice\">22. The damage deck against dice\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Exact averages.\u003c/strong> Without Jokers, every row of the die table in chapter 10 has exactly the die&#39;s average (d4 2.5, d6 3.5, d8 4.5, d10 5.5, d12 6.5). Spreads are close to real dice: d4 1.02 (die 1.12), d6 1.50 (1.71), d8 2.58 (2.29), d10 2.87 (2.87), d12 2.87 (3.45). The d12 can&#39;t show a 1 or a 12, but its average is exact.\u003c/li>\n\u003cli>\u003cstrong>Jokers add a little.\u003c/strong> Each damage card is a Joker about 1 time in 21. The players&#39; rule adds 3–4% to a die&#39;s average, and the monsters&#39; rule 8–9%:\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Die\u003c/th>\n\u003cth>No Joker\u003c/th>\n\u003cth>Player (max)\u003c/th>\n\u003cth>Monster (max + another die)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>d4\u003c/td>\n\u003ctd>2.50\u003c/td>\n\u003ctd>2.57\u003c/td>\n\u003ctd>2.70\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d6\u003c/td>\n\u003ctd>3.50\u003c/td>\n\u003ctd>3.62\u003c/td>\n\u003ctd>3.80\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d8\u003c/td>\n\u003ctd>4.50\u003c/td>\n\u003ctd>4.67\u003c/td>\n\u003ctd>4.90\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d10\u003c/td>\n\u003ctd>5.50\u003c/td>\n\u003ctd>5.71\u003c/td>\n\u003ctd>6.00\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d12\u003c/td>\n\u003ctd>6.50\u003c/td>\n\u003ctd>6.76\u003c/td>\n\u003ctd>7.10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Bigger attacks see more Jokers:\u003c/strong> 9% of 2-die rolls, 25% of 6-die rolls, 44% of 12-die rolls (a dragon&#39;s breath) and 62% of 20-die rolls. For monsters those Jokers chain into extra dice, so the biggest monster attacks are where the damage deck bites hardest. Overall, monster damage runs about 8–9% above the base game&#39;s numbers and the party&#39;s about 3–4%, so fights run slightly deadlier for the party.\u003c/li>\n\u003cli>\u003cstrong>Big pools.\u003c/strong> Under the house rule in chapter 10, 20d6 swings about ±3 instead of ±8.\u003c/li>\n\u003c/ul>\n"},{"id":"c2-23-pricing-the-abilities","title":"23. Pricing the abilities","html":"\u003ch2 id=\"c2-23-pricing-the-abilities-23-pricing-the-abilities\">23. Pricing the abilities\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Valued over a standard day.\u003c/strong> Each ability is worth what it adds over a standard day of 50 checks (three or four fights of initiative, two Strikes a round and a basic save every other round, plus exploration checks), drawing one card at a time with reshuffles and exhaustion.\u003c/li>\n\u003cli>\u003cstrong>Value is counted in hits.\u003c/strong> A Strike hit is worth 1 and a crit 2; damage avoided on a basic save counts the same way (a failed save is 1, a critical failure 2); other checks are worth half a hit per success. A d20 character earns about 18 hits of Strike damage a day and takes about 5 from basic saves.\u003c/li>\n\u003cli>\u003cstrong>The price is the number of pips worth the same value\u003c/strong> at that deck size, smoothed across sizes.\u003c/li>\n\u003cli>\u003cstrong>Unyielding is priced exactly.\u003c/strong> It takes one level of exhaustion off every check after the day&#39;s first deck-out, so its price is the pips that raise the average by the same amount over a standard day. That runs 1 to 2 pips above its worth in hits, and it matches how the Lab test handles it (by playing it out).\u003c/li>\n\u003cli>\u003cstrong>Assumptions about play.\u003c/strong> Players use each ability sensibly: Twin Draw on an attack, Loose Arrow on a first card of 4 or lower, Sift only when the swap helps, Dream Tide on a failed check whose low card is 5 or less, Crowned&#39;s Sun kept for a second Strike, and Sting&#39;s Eclipse played on an enemy&#39;s attack. Shell covers every ally&#39;s saves, so its value counts a party of four. Water Bearer is once per day, so it&#39;s priced as one new check on the first failed attack or save of the day, whoever makes it.\u003c/li>\n\u003cli>\u003cstrong>The sign decks.\u003c/strong> Each sign deck pays its price, and the deck plus its ability plays within 0.4 hits a day of its full-pip version without the ability (about 1.5% of a day&#39;s value); all but Gemini and Taurus are within 0.2.\u003c/li>\n\u003cli>\u003cstrong>The balance rules add the price back.\u003c/strong> A deck with an ability is balanced if, with the price returned as a bonus on every check, it passes the usual rules: a day edge within ±0.1, and Strike damage and damage taken on saves within 97–103% of a d20&#39;s. The Lab test does this for you, and plays Taurus&#39;s Unyielding out exactly; Taurus passes that way too.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"c2-23-pricing-the-abilities-what-each-ability-is-worth\">What each ability is worth\u003c/h3>\n\u003cp>Value in hits a day (a Strike hit is 1, a crit 2), across deck sizes:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Ability\u003c/th>\n\u003cth>Worth, in hits a day\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>First Blood (Aries)\u003c/td>\n\u003ctd>0.5–1.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Crowned (Leo)\u003c/td>\n\u003ctd>0.7–0.9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Loose Arrow (Sagittarius)\u003c/td>\n\u003ctd>0.7–1.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Weigh the Odds (Libra)\u003c/td>\n\u003ctd>0.4–0.5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Water Bearer (Aquarius)\u003c/td>\n\u003ctd>0.3–0.5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Twin Draw (Gemini)\u003c/td>\n\u003ctd>0.1–1.0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shell (Cancer)\u003c/td>\n\u003ctd>0.9–1.4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sting (Scorpio)\u003c/td>\n\u003ctd>1.6–2.4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dream Tide (Pisces)\u003c/td>\n\u003ctd>0.2–0.3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Second Ascent (Capricorn)\u003c/td>\n\u003ctd>0.1–0.5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unyielding (Taurus)\u003c/td>\n\u003ctd>1.5–4.3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sift (Virgo)\u003c/td>\n\u003ctd>0.4–0.6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Prices are set on decks with one Sun and one Eclipse, and they hold for the twelve sign decks, which use five different Joker setups. Twin Draw&#39;s value depends on the deck: swingy decks gain less from it, and the Gemini deck gets about 3 pips of value for its 6-pip price.\u003c/p>\n\u003ch3 id=\"c2-23-pricing-the-abilities-what-an-ability-does-to-a-deck\">What an ability does to a deck\u003c/h3>\n\u003cp>The value an ability moves between attacks, defense and other checks, in hits a day:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Price\u003c/th>\n\u003cth>Attacks\u003c/th>\n\u003cth>Defense\u003c/th>\n\u003cth>Other checks\u003c/th>\n\u003cth>Net, hits a day\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aries\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>+0.2\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leo\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>+0.4\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sagittarius\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>+0.4\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003ctd>+0.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Libra\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>+0.2\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aquarius\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gemini\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancer\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>−1.0\u003c/td>\n\u003ctd>+1.3\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003ctd>+0.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scorpio\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>−0.9\u003c/td>\n\u003ctd>+0.9\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pisces\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>+0.2\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Capricorn\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Taurus\u003c/td>\n\u003ctd>21\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003ctd>−0.3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Virgo\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>+0.1\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Attack abilities\u003c/strong> (Aries, Leo, Sagittarius) turn a little defense into more damage.\u003c/li>\n\u003cli>\u003cstrong>Protective abilities\u003c/strong> (Cancer, Scorpio) cost 10 to 16 pips, so the deck&#39;s own attacks deal about 5% less than they did before; it&#39;s paid back as roughly a hit a day of damage kept off the party.\u003c/li>\n\u003cli>\u003cstrong>Taurus\u003c/strong> pays 21 pips, the most of any sign, and never tires on a standard day: its edge stays flat from the first check to the last instead of starting high and ending low.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"c2-23-pricing-the-abilities-abilities-on-custom-decks\">Abilities on custom decks\u003c/h3>\n\u003cp>For example, the 40-card starter that buys First Blood (13.6) has, counting First Blood at its price, a day edge of +0.02, 100.5% of a d20&#39;s Strike damage and 98.4% of its damage on saves. Without the ability, the same deck would be 0.2 points of edge short.\u003c/p>\n\u003cp>\u003cstrong>Any starter, any ability.\u003c/strong> A starter deck pays for an ability by flipping from the big end (10 → A first). Every starter with even Jokers or an extra Sun stays balanced with any of the twelve abilities. With more Eclipses than Suns, almost every pairing does too, a few after a different set of flips or one swing-dial move. Eleven take too much damage on saves, 103–104% of a d20&#39;s: First Blood, Crowned, Loose Arrow, Shell, Sting and Unyielding in the 65-card deck with no Sun; Sting and Unyielding in the 70-card one; and Unyielding in the 35- and 40-card 1 / 2 decks and the 70-card 3 / 4 deck.\u003c/p>\n\u003ch3 id=\"c2-23-pricing-the-abilities-the-sign-decks-without-abilities\">The sign decks without abilities\u003c/h3>\n\u003cp>Without their abilities, the sign decks as printed play weak: 0.05 to 0.55 points of day edge short, and Scorpio and Taurus also drop to about 92% of a d20&#39;s Strike damage. With their prices added back (chapter 12), every one passes the Lab test. Pisces and Capricorn, whose abilities cost 2 pips, already pass without any change, but the changes restore their full pip totals.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Deck code without the ability\u003c/th>\n\u003cth>Standard day: edge · Strike damage / save damage taken\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>2-2-2-1-1-3-4-5-4-4 / 1-1\u003c/td>\n\u003ctd>−0.01 · 101.8% / 98.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>2-2-2-2-2-4-5-4-4-4 / 1-1\u003c/td>\n\u003ctd>+0.01 · 99.0% / 97.6%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>4-3-3-2-2-2-2-3-5-8 / 1-1\u003c/td>\n\u003ctd>0.00 · 101.4% / 98.4%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>5-4-3-2-1-2-3-5-6-7 / 1-1\u003c/td>\n\u003ctd>+0.02 · 99.9% / 98.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>0-0-1-5-9-11-8-5-1-0 / 2-2\u003c/td>\n\u003ctd>−0.02 · 100.2% / 99.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>9-6-3-2-1-1-2-4-7-11 / 1-1\u003c/td>\n\u003ctd>+0.01 · 100.2% / 98.4%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>3-3-4-6-6-6-6-5-5-4 / 2-2\u003c/td>\n\u003ctd>+0.01 · 100.5% / 99.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>1-3-5-6-7-7-7-7-5-3 / 2-3\u003c/td>\n\u003ctd>0.00 · 99.9% / 102.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>14-9-4-0-1-1-0-4-9-16 / 1-1\u003c/td>\n\u003ctd>−0.01 · 100.5% / 99.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>7-7-6-6-5-4-4-5-7-10 / 2-2\u003c/td>\n\u003ctd>+0.01 · 100.0% / 99.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>1-5-6-8-12-9-10-8-3-2 / 3-3\u003c/td>\n\u003ctd>−0.01 · 99.6% / 99.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>17-11-5-3-1-1-3-6-10-15 / 2-1\u003c/td>\n\u003ctd>0.00 · 101.8% / 97.6%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"c2-24-how-sure-the-build-table-is","title":"24. How sure the build table is","html":"\u003ch2 id=\"c2-24-how-sure-the-build-table-is-24-how-sure-the-build-table-is\">24. How sure the build table is\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Every starter deck passes the Lab test.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>A deck that meets its row is balanced,\u003c/strong> from smooth shapes to lumpy ones with gaps, at every size and Joker setup in the build table. The rare exception misses the balance limits by less than 1 percentage point. The Deck Lab gives the exact answer for any deck.\u003c/li>\n\u003cli>\u003cstrong>The ranges are a safe zone, not the whole balanced region.\u003c/strong> A deck a few swing points outside can still pass the Lab test. Of the six sign decks at these sizes, five sit inside their row&#39;s swing range, with their pip totals lowered by their abilities&#39; prices. Virgo (75 cards, 2 Suns and 1 Eclipse) sits 8 swing points under its narrow range, where it&#39;s better centered on crit-heavy weapons, and passes.\u003c/li>\n\u003cli>\u003cstrong>The copy limit is part of what makes the ranges reliable.\u003c/strong> Decks piled onto a few values (say, half 3s and half 8s) land on the same totals over and over and fall outside the balance limits in ways swing points don&#39;t predict.\u003c/li>\n\u003cli>\u003cstrong>Crit-heavy weapons.\u003c/strong> The balance rules cover ordinary Strikes. With fatal weapons, where a crit is worth about three hits, decks in the build table range from 93% to 107% of a d20&#39;s damage: lowest with no Sun, highest with extra Suns or three of each. Deadly weapons fall in between. A player who relies on fatal or deadly weapons should pick a setup with a Sun; the Lab test shows the fatal figure for any deck.\u003c/li>\n\u003cli>\u003cstrong>Casters\u003c/strong> draw a few more or fewer cards than the standard day, depending on level (chapter 17). That shifts a custom deck the same small amount as a sign deck.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"c2-24-how-sure-the-build-table-is-what-each-kind-of-setup-plays-like\">What each kind of setup plays like\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Setup\u003c/th>\n\u003cth>Examples\u003c/th>\n\u003cth>How it plays\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Even\u003c/strong>\u003c/td>\n\u003ctd>1 / 1, 2 / 2, 3 / 3 (the other ten signs)\u003c/td>\n\u003ctd>The default. Natural 20s and 1s come up equally. Strike damage 97–103% of a d20&#39;s; you take 97–101% of a d20&#39;s damage on saves.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>One extra Eclipse\u003c/strong>\u003c/td>\n\u003ctd>1 / 2, 2 / 3 (Scorpio), 3 / 4\u003c/td>\n\u003ctd>More natural 1s, paid for with stronger number cards (a higher pip total). You take 100–103% of a d20&#39;s damage on saves; Strikes are unchanged.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>No Sun\u003c/strong>\u003c/td>\n\u003ctd>0 / 1, 0 / 2\u003c/td>\n\u003ctd>Never a natural 20. Crits come only from high totals, so the deck has to be mostly Aces and 10s. Weapons that rely on crits (deadly, fatal) deal about 93–95% of a d20&#39;s damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>One extra Sun\u003c/strong> (75 only)\u003c/td>\n\u003ctd>2 / 1 (Virgo), 3 / 2, 4 / 3\u003c/td>\n\u003ctd>More natural 20s, paid for with weaker number cards. Both sides favor you: Strike damage 99–103%, and you take 97–99% of a d20&#39;s damage on saves. That&#39;s close to the limit of balance, so the swing ranges are narrow.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"c2-24-how-sure-the-build-table-is-why-the-joker-limits-sit-where-they-do\">Why the Joker limits sit where they do\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Why Eclipses can outnumber Suns but not the other way round.\u003c/strong> A missed Strike costs the same whether it&#39;s a failure or a critical failure, so an extra natural 1 costs you almost nothing on attacks; it hurts on saves, where a critical failure doubles the damage. Stronger number cards pay that back. An extra natural 20 helps both: more crits on Strikes and more saves that take no damage. Weaker number cards can take back one of those but not both, until the deck is big enough (75 cards) to dilute the extra Joker.\u003c/li>\n\u003cli>\u003cstrong>Why more Jokers need bigger decks.\u003c/strong> In a 30-card deck, two of each Joker would make natural 20s and 1s 12.6% each, against a d20&#39;s 5%. Even the steadiest number cards can&#39;t offset that many natural 20s on Strikes. Bigger decks dilute the Jokers.\u003c/li>\n\u003cli>\u003cstrong>Why a deck needs a Sun.\u003c/strong> Without one, the only way to crit as often as a d20 is to fill the deck with Aces and 10s, and the copy limit caps that. Only decks of 65 cards or more have room.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"c2-24-how-sure-the-build-table-is-the-starter-decks\">The starter decks\u003c/h3>\n\u003cp>How often each starter deck in 13.4 draws a natural 20 and a natural 1 (a d20: 5% each), and its Strike damage and damage taken on saves over a standard day, compared with a d20&#39;s:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Natural 20 / 1\u003c/th>\n\u003cth>Standard day: Strike damage / save damage taken\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>6.6% / 6.6%\u003c/td>\n\u003ctd>101% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>5.6% / 5.6%\u003c/td>\n\u003ctd>100% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>5.5% / 11.1%\u003c/td>\n\u003ctd>98% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>4.9% / 4.9%\u003c/td>\n\u003ctd>100% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>4.9% / 9.7%\u003c/td>\n\u003ctd>100% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>4.4% / 4.4%\u003c/td>\n\u003ctd>101% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>4.3% / 8.7%\u003c/td>\n\u003ctd>100% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>8.6% / 8.6%\u003c/td>\n\u003ctd>101% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>4.0% / 4.0%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>3.9% / 7.8%\u003c/td>\n\u003ctd>100% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>7.8% / 7.8%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>3.6% / 3.6%\u003c/td>\n\u003ctd>101% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>3.6% / 7.1%\u003c/td>\n\u003ctd>100% / 101%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>7.1% / 7.1%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>7.0% / 10.5%\u003c/td>\n\u003ctd>98% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>3.3% / 3.3%\u003c/td>\n\u003ctd>101% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>3.3% / 6.6%\u003c/td>\n\u003ctd>99% / 101%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>6.5% / 6.5%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>6.4% / 9.7%\u003c/td>\n\u003ctd>100% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>3 / 3\u003c/td>\n\u003ctd>9.6% / 9.6%\u003c/td>\n\u003ctd>102% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>3.1% / 3.1%\u003c/td>\n\u003ctd>99% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>3.0% / 6.1%\u003c/td>\n\u003ctd>100% / 101%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>6.0% / 6.0%\u003c/td>\n\u003ctd>101% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>6.0% / 8.9%\u003c/td>\n\u003ctd>101% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>3 / 3\u003c/td>\n\u003ctd>8.9% / 8.9%\u003c/td>\n\u003ctd>100% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>0 / 2\u003c/td>\n\u003ctd>0% / 6.1%\u003c/td>\n\u003ctd>98% / 103%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>2.8% / 2.8%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>2.8% / 5.6%\u003c/td>\n\u003ctd>99% / 101%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>5.6% / 5.6%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>5.5% / 8.3%\u003c/td>\n\u003ctd>100% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>3 / 3\u003c/td>\n\u003ctd>8.3% / 8.3%\u003c/td>\n\u003ctd>100% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>3 / 4\u003c/td>\n\u003ctd>8.2% / 10.9%\u003c/td>\n\u003ctd>100% / 103%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>0 / 1\u003c/td>\n\u003ctd>0% / 2.9%\u003c/td>\n\u003ctd>98% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>0 / 2\u003c/td>\n\u003ctd>0% / 5.7%\u003c/td>\n\u003ctd>98% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>2.6% / 2.6%\u003c/td>\n\u003ctd>99% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>2.6% / 5.3%\u003c/td>\n\u003ctd>100% / 101%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>5.2% / 5.2%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>5.2% / 7.8%\u003c/td>\n\u003ctd>100% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>3 / 3\u003c/td>\n\u003ctd>7.7% / 7.7%\u003c/td>\n\u003ctd>100% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>3 / 4\u003c/td>\n\u003ctd>7.7% / 10.2%\u003c/td>\n\u003ctd>98% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>0 / 2\u003c/td>\n\u003ctd>0% / 5.3%\u003c/td>\n\u003ctd>99% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>5.3% / 2.6%\u003c/td>\n\u003ctd>102% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>3 / 2\u003c/td>\n\u003ctd>7.8% / 5.2%\u003c/td>\n\u003ctd>101% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>4 / 3\u003c/td>\n\u003ctd>10.2% / 7.7%\u003c/td>\n\u003ctd>102% / 98%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The worked example in 13.7 deals 99.9% of a d20&#39;s Strike damage over a standard day and takes 102.4% on saves, with a day edge of −0.02; the deck after its step 2 was already balanced at 98% and 102%.\u003c/p>\n"},{"id":"c2-appendix-a-quick-reference-what-the-system-replaces","title":"Appendix A. Quick reference: what the system replaces","html":"\u003ch2 id=\"c2-appendix-a-quick-reference-what-the-system-replaces-appendix-a-quick-reference-what-the-system-replaces\">Appendix A. Quick reference: what the system replaces\u003c/h2>\n\u003cp>Every dice mechanic in the base game has a card rule. Where each one is handled:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Mechanic\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003cth>Where\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The d20 check, natural 20 / 1\u003c/td>\n\u003ctd>Two cards added one at a time; the Sun (the colored Joker) = natural 20, the Eclipse (the black Joker) = natural 1\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Flat checks (80 / 50 / 30% and the rest)\u003c/td>\n\u003ctd>One card from the Fate Deck against a threshold\u003c/td>\n\u003ctd>Chapter 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fortune and misfortune (roll twice)\u003c/td>\n\u003ctd>Draw 3 cards, keep the best or worst pair\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rerolls and Hero Points\u003c/td>\n\u003ctd>Draw a third card: keep your most recent card (&quot;use the new result&quot;) or the best pair (&quot;use the better result&quot;)\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skipping the roll for a fixed result\u003c/td>\n\u003ctd>Burn 1 card, take the fixed result\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Held and reused rolls\u003c/td>\n\u003ctd>Held draws, set aside face-up\u003c/td>\n\u003ctd>Chapter 7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Monster checks\u003c/td>\n\u003ctd>The Fate Deck\u003c/td>\n\u003ctd>Chapter 9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Companion, familiar and summon checks\u003c/td>\n\u003ctd>The Fate Deck; a bonded partner that shares its controller&#39;s actions draws from the controller&#39;s deck\u003c/td>\n\u003ctd>Chapter 8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Secret checks\u003c/td>\n\u003ctd>The GM draws face-down from the Fate Deck and adds the player&#39;s modifier\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Damage dice d4–d12, pools of 1–30\u003c/td>\n\u003ctd>One card per die from the damage deck, read on a table with exact averages; big-pools house rule\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Deadly, fatal, two-hand, jousting, striking runes, crits\u003c/td>\n\u003ctd>Extra cards, re-read cards on a new die size, double the total\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Persistent damage\u003c/td>\n\u003ctd>Damage cards each turn; one Fate Deck card to end it\u003c/td>\n\u003ctd>Chapters 10 and 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Random durations, d20 and d100 tables\u003c/td>\n\u003ctd>Damage-deck cards (d20 = card + 10 if red; d100 = two cards)\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Running out of cards\u003c/td>\n\u003ctd>A deck-out forces a reshuffle and costs a level of exhaustion (player decks only)\u003c/td>\n\u003ctd>Chapter 4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"c2-appendix-b-glossary","title":"Appendix B. Glossary","html":"\u003ch2 id=\"c2-appendix-b-glossary-appendix-b-glossary\">Appendix B. Glossary\u003c/h2>\n\u003cp>Every term the card engine adds to the base game, with where it&#39;s explained.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>After each deck-out:\u003c/strong> an ability that resets every time your deck runs out (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Allowed average:\u003c/strong> the average card total a deck may have for its size and Jokers: 10.5 + 2 × its average exhaustion level over a standard day (chapter 17).\u003c/li>\n\u003cli>\u003cstrong>Balanced:\u003c/strong> a deck whose day edge is within ±0.1, and whose Strike damage and damage taken on saves each land within 97–103% of a d20&#39;s over a standard day. Those spans are the \u003cstrong>balance limits\u003c/strong> (chapter 17).\u003c/li>\n\u003cli>\u003cstrong>Best pair, worst pair:\u003c/strong> of three cards, the two with the highest or lowest card total (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Build table:\u003c/strong> the table of deck sizes and Joker setups, with each row&#39;s pip total, swing range, copy limit and starter deck (13.4).\u003c/li>\n\u003cli>\u003cstrong>Burn:\u003c/strong> discard a card unused. Casting costs and fixed results burn cards (chapters 3 and 6).\u003c/li>\n\u003cli>\u003cstrong>Card total:\u003c/strong> the sum of a check&#39;s two cards, 2 to 20. It replaces the d20 roll; add your modifier to get the check&#39;s result (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Casting cost:\u003c/strong> the cards a spell burns: 1 for a cantrip, 2 for any other spell (chapter 3).\u003c/li>\n\u003cli>\u003cstrong>Collapse:\u003c/strong> reaching Exhausted 4. You fall unconscious (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Combination:\u003c/strong> one of wild magic&#39;s 93 suit patterns, numbered #1 to #93. Its text is its effect; its tier (Good 2, Mixed and so on) is its result (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Copy limit:\u003c/strong> the most copies of any one value a deck may hold, a third of its number cards (13.4).\u003c/li>\n\u003cli>\u003cstrong>Custom deck:\u003c/strong> a player deck you build yourself (chapter 13).\u003c/li>\n\u003cli>\u003cstrong>Damage deck, damage card:\u003c/strong> the shared 42-card deck used for damage and other dice, and a card drawn from it (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Deck code:\u003c/strong> a deck&#39;s makeup, written as the counts of Ace, 2, 3 … 10, then Suns / Eclipses (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Deck Lab:\u003c/strong> the Star-Sign Deck Lab, the web tool that builds decks and runs the Lab test.\u003c/li>\n\u003cli>\u003cstrong>Deck-out:\u0
