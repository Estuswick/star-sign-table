i>\n\u003c/ul>\n\u003ch3 id=\"c2-6-fortune-misfortune-rerolls-and-hero-points-hero-points\">Hero Points\u003c/h3>\n\u003cp>Unchanged except for the reroll. Everyone starts each session with 1; the GM awards about 1 more per hour of play; you can have at most 3.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Spend 1:\u003c/strong> after a check, keep your most recent card, draw a new card and pair them. The new card total stands, even if it&#39;s worse. It&#39;s a fortune effect.\u003c/li>\n\u003cli>\u003cstrong>Spend all (at least 1):\u003c/strong> when your dying condition would increase, lose dying and stabilize at 0 HP instead. No draw.\u003c/li>\n\u003c/ul>\n"},{"id":"c2-7-held-draws","title":"7. Held draws","html":"\u003ch2 id=\"c2-7-held-draws-7-held-draws\">7. Held draws\u003c/h2>\n\u003cp>A held draw is a real draw, set aside face-up and used later in place of drawing. It covers the base game&#39;s &quot;roll a d20 now, use it later&quot; effects.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kind\u003c/th>\n\u003cth>Examples\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Hold a draw for yourself\u003c/strong>\u003c/td>\n\u003ctd>Effects that roll a check now and use it later\u003c/td>\n\u003ctd>Draw normally and set the cards aside face-up. When you use them, don&#39;t draw again; modifiers apply at that moment, including exhaustion gained since. Discard them if the effect ends unused. Held cards are outside your deck, so a reshuffle doesn&#39;t return them.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Give a held draw to someone else\u003c/strong>\u003c/td>\n\u003ctd>Effects that roll ahead of time for an ally\u003c/td>\n\u003ctd>The giver draws from their own deck and pays the cards. The recipient uses them with the recipient&#39;s own modifiers. An effect that grants a new roll each turn has its target draw that held draw.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Reuse or share a draw\u003c/strong>\u003c/td>\n\u003ctd>Effects that apply one roll to several targets, or one character rolling for a group\u003c/td>\n\u003ctd>The same card total counts again, with no new cards. An effect that reuses a result without its natural 20 or 1 counts a Sun as 20 and an Eclipse as 1, with no change of degree. When one character rolls for a group, that character draws once.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Hold a whole check result\u003c/strong>\u003c/td>\n\u003ctd>Effects that make a check now and use its total for a later save\u003c/td>\n\u003ctd>Make the check now and record the total; use it for the later save. Its modifiers are the ones from when it was made.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Lucky number\u003c/strong>\u003c/td>\n\u003ctd>Effects that give a character a lucky number\u003c/td>\n\u003ctd>The GM draws your lucky number from the Fate Deck: a card total, redrawing Jokers. When your card total hits it, reroll with the &quot;use the new result&quot; rule; if the new card total hits it again, you critically fail.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>A held Sun is a natural 20 when used; a held Eclipse a natural 1.\u003c/li>\n\u003cli>Fortune on a held draw: draw 3, keep the best pair, and hold that.\u003c/li>\n\u003cli>Rerolls work on a check that used a held draw; for &quot;use the new result&quot;, your most recent card is the second held card.\u003c/li>\n\u003cli>An effect that lets a character learn the result of one of their secret checks reveals the GM&#39;s draw instead.\u003c/li>\n\u003c/ul>\n"},{"id":"c2-8-companions-and-other-minions","title":"8. Companions and other minions","html":"\u003ch2 id=\"c2-8-companions-and-other-minions-8-companions-and-other-minions\">8. Companions and other minions\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Minions draw from the Fate Deck.\u003c/strong> Animal companions, familiars, summoned creatures, anything else with the minion trait, and other creatures a player controls (a hireling, a mount) make their checks with the Fate Deck, as monsters do. The player decides what the minion does; the GM draws, or hands the player the Fate Deck to draw. Minion checks never cost the player cards or cause exhaustion, and their luck effects (fortune, misfortune, rerolls) use Fate Deck cards too.\u003c/li>\n\u003cli>\u003cstrong>Face cards drawn for a minion count toward wild magic,\u003c/strong> like any Fate Deck check made for a player&#39;s action. If one completes the fourth set, the Destined is the minion&#39;s controller (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Bonded partners are the exception.\u003c/strong> A creature that shares its controller&#39;s actions and multiple attack penalty, so that the two act as one character, draws from its controller&#39;s deck; together they spend cards at about the rate of one character.\u003c/li>\n\u003cli>\u003cstrong>Damage\u003c/strong> a minion deals uses the players&#39; Joker rule (chapter 10).\u003c/li>\n\u003c/ul>\n\u003cp>Why: companions and summons would otherwise double their owner&#39;s card use and push them into exhaustion early.\u003c/p>\n"},{"id":"c2-9-the-fate-deck","title":"9. The Fate Deck","html":"\u003ch2 id=\"c2-9-the-fate-deck-9-the-fate-deck\">9. The Fate Deck\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Cards\u003c/th>\n\u003cth>Count\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aces\u003c/td>\n\u003ctd>17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 · 3 · 4 · 5 · 6 · 7 · 8 · 9\u003c/td>\n\u003ctd>9 · 6 · 5 · 5 · 5 · 3 · 2 · 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10s\u003c/td>\n\u003ctd>18\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Face cards (J, Q, K of each suit)\u003c/td>\n\u003ctd>12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Suns / Eclipses\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>92\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Same draw as the players:\u003c/strong> one card at a time, two in all; a first-card Joker ends the draw.\u003c/li>\n\u003cli>\u003cstrong>Monsters use it\u003c/strong> for their attacks, saves, skill checks and Perception, and monster fortune and misfortune work as for players. \u003cstrong>Players still draw their own checks\u003c/strong>, including saves against monster abilities.\u003c/li>\n\u003cli>\u003cstrong>Face cards never change a total.\u003c/strong> When the GM draws one, place it in the wild magic sets and draw a replacement. About a quarter of Fate Deck checks turn one up.\u003c/li>\n\u003cli>\u003cstrong>No exhaustion.\u003c/strong> Reshuffle when it runs out, about every 41 checks. Placed face cards stay out until wild magic goes off.\u003c/li>\n\u003c/ul>\n\u003cp>Face cards feed \u003cstrong>wild magic\u003c/strong>, which goes off about once per encounter; the full rule and all 93 combinations are in chapter 14.\u003c/p>\n"},{"id":"c2-10-damage","title":"10. Damage","html":"\u003ch2 id=\"c2-10-damage-10-damage\">10. Damage\u003c/h2>\n\u003cp>The card rules that replace the base game&#39;s damage dice, healing dice and other random rolls.\u003c/p>\n\u003ch3 id=\"c2-10-damage-the-damage-deck\">The damage deck\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>The central damage deck\u003c/strong> is one standard pack with the face cards removed: \u003cstrong>42 cards, Ace to 10 in four suits, plus the 2 Jokers.\u003c/strong> Everyone draws damage from it, monsters included. Both Jokers work the same way here; the Sun and the Eclipse only differ on checks.\u003c/li>\n\u003cli>\u003cstrong>Optional personal damage decks.\u003c/strong> A player may keep their own damage deck instead of drawing from the central one. It holds exactly the same cards as the central deck. Damage decks have no star-sign variants.\u003c/li>\n\u003cli>\u003cstrong>Damage decks never tire you.\u003c/strong> Damage draws never come from a player deck and never cause exhaustion. When a damage deck runs out, reshuffle it and keep going.\u003c/li>\n\u003c/ul>\n\u003cp>Why damage stays out of player decks: every hit would burn cards, so characters would tire faster as they level, and each deck&#39;s shape would skew its damage.\u003c/p>\n\u003ch3 id=\"c2-10-damage-reading-a-card-as-a-die\">Reading a card as a die\u003c/h3>\n\u003cp>Draw one card per damage die and read it for that die size. Add the results, then add modifiers as usual.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>d4\u003c/strong> (card ÷ 3, rounded down, +1)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d6\u003c/strong> (card ÷ 2, rounded down, +1)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d8\u003c/strong> (card − 1; Ace is 1, 10 is 8)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d10\u003c/strong> (card value)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d12\u003c/strong> (card + 1)\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Rare sizes: \u003cstrong>d2\u003c/strong> is the card&#39;s color (black 1, red 2); \u003cstrong>d3\u003c/strong> is card ÷ 4, rounded down, +1. Jokers are covered below.\u003c/p>\n\u003ch3 id=\"c2-10-damage-jokers-bonus-damage\">Jokers: bonus damage\u003c/h3>\n\u003cp>Each damage card is a Joker about 1 time in 21. What a Joker does depends on who is dealing the damage:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Dealt by\u003c/th>\n\u003cth>Joker rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Players\u003c/strong> (and creatures they control: companions, familiars, summons)\u003c/td>\n\u003ctd>The die counts as its \u003cstrong>maximum\u003c/strong> (a 6 on a d6, 12 on a d12).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Monsters and hazards\u003c/strong>\u003c/td>\n\u003ctd>The die counts as its \u003cstrong>maximum, and you draw another die of the same size.\u003c/strong> If that&#39;s a Joker too, repeat.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>GMs building encounters: Jokers make damage run a little high on both sides, more for monsters, so fights run slightly deadlier for the party than their budget says. It shows most in big monster damage pools.\u003c/p>\n\u003cp>Jokers only matter for damage and healing dice. When the damage deck is used for other rolls (durations, d20 and d100 tables), redraw any Joker.\u003c/p>\n\u003ch3 id=\"c2-10-damage-damage-rules\">Damage rules\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Rule\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Damage dice (weapons, spells, monsters)\u003c/td>\n\u003ctd>One card per die, read on the die table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Striking runes, heightened spells\u003c/td>\n\u003ctd>More dice means more cards.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical hit\u003c/td>\n\u003ctd>Double the total, as usual.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Deadly\u003c/strong> (extra die on a crit)\u003c/td>\n\u003ctd>Draw the extra cards on a crit; they aren&#39;t doubled.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Fatal\u003c/strong> (die size increases on a crit, plus one die)\u003c/td>\n\u003ctd>Re-read the same cards on the fatal die size, then draw one more card at that size.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Two-hand\u003c/strong>, \u003cstrong>jousting\u003c/strong>\u003c/td>\n\u003ctd>Read the cards on the larger die size.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Precision damage, splash, forceful, backstabber\u003c/td>\n\u003ctd>Unchanged: dice become cards, flat bonuses stay flat.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Persistent damage\u003c/td>\n\u003ctd>Draw its damage at the end of each of your turns. The flat check to end it is one Fate Deck card (9 or higher for DC 15).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Healing dice\u003c/td>\n\u003ctd>Same as damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Maximum damage&quot; effects\u003c/td>\n\u003ctd>Count each die at its maximum; don&#39;t draw.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Reroll 1s on damage dice&quot;\u003c/td>\n\u003ctd>Redraw any card that reads as a 1.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Average damage (effects where each die counts as its average rounded up)\u003c/td>\n\u003ctd>Don&#39;t draw; use 3 / 4 / 5 / 6 / 7 for d4 / d6 / d8 / d10 / d12.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Resistance, weakness, immunity\u003c/td>\n\u003ctd>Unchanged.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"c2-10-damage-other-dice\">Other dice\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Roll\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Random durations (&quot;1d4 rounds&quot;, &quot;1d4 hours&quot;)\u003c/td>\n\u003ctd>One damage card, read on the die table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d20 tables\u003c/td>\n\u003ctd>One damage card, \u003cstrong>plus 10 if it&#39;s red\u003c/strong>: an exact 1–20.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d100 tables\u003c/td>\n\u003ctd>Two damage cards: the first is the tens, the second the ones; a 10 counts as 0, and 0-0 is 100. An exact 1–100.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d8, d10 and other small tables\u003c/td>\n\u003ctd>One damage card, read on the die table.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"c2-10-damage-recommended-house-rule-big-pools\">Recommended house rule: big pools\u003c/h3>\n\u003cp>For pools of more than 5 dice (e.g., a heightened blast spell), draw 5 cards and count every die beyond that at its average, rounding the total down.\u003c/p>\n\u003cul>\n\u003cli>Example: 20d6 is 5 cards plus 15 × 3.5 = 52.5, so 5 cards + 52.\u003c/li>\n\u003cli>It keeps 20- and 30-die spells quick, and the average is unchanged apart from Jokers; the results just bunch closer to the average.\u003c/li>\n\u003cli>Only the 5 drawn cards can be Jokers, so big pools get less of the Joker bonus under this rule, which matters most for monsters.\u003c/li>\n\u003c/ul>\n"},{"id":"c2-11-the-twelve-star-sign-decks","title":"11. The twelve star-sign decks","html":"\u003ch2 id=\"c2-11-the-twelve-star-sign-decks-11-the-twelve-star-sign-decks\">11. The twelve star-sign decks\u003c/h2>\n\u003cp>\u003cstrong>Element sets the size. Modality sets the spread and the Jokers.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Fire (30–36 cards):\u003c/strong> short and fierce. Strongest on a fresh shuffle; runs out 2–3 times in a standard day.\u003c/li>\n\u003cli>\u003cstrong>Air (40–48 cards):\u003c/strong> quick; runs out twice.\u003c/li>\n\u003cli>\u003cstrong>Water (52–60 cards):\u003c/strong> middling; runs out once.\u003c/li>\n\u003cli>\u003cstrong>Earth (65–75 cards):\u003c/strong> long and enduring; runs out once, late in the day.\u003c/li>\n\u003cli>\u003cstrong>Cardinal\u003c/strong> signs are close to a d20&#39;s shape. \u003cstrong>Fixed\u003c/strong> signs are steady, with more Jokers. \u003cstrong>Mutable\u003c/strong> signs are swingy, with few Jokers.\u003c/li>\n\u003cli>\u003cstrong>Every sign has an ability,\u003c/strong> paid for in pips: its \u003cstrong>pip total\u003c/strong> (its number cards added up, Ace = 1) is its size&#39;s pip total in the build table (13.4) minus the ability&#39;s price. Chapter 12 describes the abilities, and how each deck gets its price back at a table that plays without them.\u003c/li>\n\u003cli>\u003cstrong>Two signs have uneven Jokers.\u003c/strong> \u003cstrong>Scorpio\u003c/strong> carries a third Eclipse: more natural 1s, paid for with stronger number cards. \u003cstrong>Virgo\u003c/strong> is the only deck with more Suns than Eclipses: more natural 20s, paid for with weaker number cards. Only a 75-card deck can carry the extra Sun (13.2).\u003c/li>\n\u003c/ul>\n\u003cp>Deck codes list Ace, 2, 3 … 10, then Suns / Eclipses. In the Deck Lab, type a sign&#39;s name to load its deck with its ability; a pasted code needs + and the ability&#39;s name, as in 2-2-2-2-1-3-3-5-4-4 / 1-1 + First Blood. Any number of players can take the same sign; each builds their own copy of its deck. &quot;Packs&quot; is the number of standard packs needed to build it; Leo fits in one.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Element · modality\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Ability (price in pips)\u003c/th>\n\u003cth>Deck code\u003c/th>\n\u003cth>Packs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>Fire · Cardinal\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>First Blood (3)\u003c/td>\n\u003ctd>2-2-2-2-1-3-3-5-4-4 / 1-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>Fire · Fixed\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>Crowned (4)\u003c/td>\n\u003ctd>2-2-2-3-3-3-4-4-4-4 / 1-1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>Fire · Mutable\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>Loose Arrow (5)\u003c/td>\n\u003ctd>4-3-4-2-2-2-2-2-5-8 / 1-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>Air · Cardinal\u003c/td>\n\u003ctd>40\u003c/td>\n\u003ctd>Weigh the Odds (3)\u003c/td>\n\u003ctd>5-4-3-3-1-2-2-5-6-7 / 1-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>Air · Fixed\u003c/td>\n\u003ctd>44\u003c/td>\n\u003ctd>Water Bearer (3)\u003c/td>\n\u003ctd>0-0-1-6-9-11-7-5-1-0 / 2-2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>Air · Mutable\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>Twin Draw (6)\u003c/td>\n\u003ctd>9-6-4-2-2-0-2-3-7-11 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>Water · Cardinal\u003c/td>\n\u003ctd>52\u003c/td>\n\u003ctd>Shell (10)\u003c/td>\n\u003ctd>4-3-4-6-7-5-6-5-5-3 / 2-2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>Water · Fixed\u003c/td>\n\u003ctd>56\u003c/td>\n\u003ctd>Sting (16)\u003c/td>\n\u003ctd>2-4-5-6-7-7-7-7-4-2 / 2-3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>Water · Mutable\u003c/td>\n\u003ctd>60\u003c/td>\n\u003ctd>Dream Tide (2)\u003c/td>\n\u003ctd>14-9-4-1-1-0-0-4-9-16 / 1-1\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>Earth · Cardinal\u003c/td>\n\u003ctd>65\u003c/td>\n\u003ctd>Second Ascent (2)\u003c/td>\n\u003ctd>7-7-6-6-7-2-4-5-7-10 / 2-2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>Earth · Fixed\u003c/td>\n\u003ctd>70\u003c/td>\n\u003ctd>Unyielding (21)\u003c/td>\n\u003ctd>3-5-6-9-12-9-9-8-3-0 / 3-3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>Earth · Mutable\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>Sift (5)\u003c/td>\n\u003ctd>17-11-6-3-1-1-3-5-10-15 / 2-1\u003c/td>\n\u003ctd>5\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Chapter 20 compares each deck with a d20, over short, standard and long days.\u003c/p>\n"},{"id":"c2-12-star-sign-abilities","title":"12. Star-sign abilities","html":"\u003ch2 id=\"c2-12-star-sign-abilities-12-star-sign-abilities\">12. Star-sign abilities\u003c/h2>\n\u003ch3 id=\"c2-12-star-sign-abilities-how-abilities-work\">How abilities work\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Every sign has one ability,\u003c/strong> built from the zodiac&#39;s own grid. The element sets what it touches: Fire attacks, Air foresight and allies, Water saves and protection, Earth the deck and endurance. The modality sets how: Cardinal signs act at a start, Fixed signs hold something back, Mutable signs change a card.\u003c/li>\n\u003cli>\u003cstrong>Abilities are paid for in pips.\u003c/strong> A deck with an ability builds to a lower pip total: its row&#39;s pip total minus the ability&#39;s price. The twelve sign decks already include it. Cheap abilities cost 1 or 2 pips; the strongest cost 15 to 25.\u003c/li>\n\u003cli>\u003cstrong>How often:\u003c/strong> \u003cem>once per day\u003c/em> resets at a night&#39;s rest, the same as exhaustion. \u003cem>Once per encounter\u003c/em> means once per fight or other scene that starts with initiative. \u003cem>After each deck-out\u003c/em> resets every time your deck runs out.\u003c/li>\n\u003cli>\u003cstrong>No actions, no extra cost.\u003c/strong> Using an ability takes no action. Any cards it makes you draw come from your deck and count toward deck-outs; the price already includes that.\u003c/li>\n\u003cli>\u003cstrong>Fortune rules still apply.\u003c/strong> An ability that makes a check a fortune check doesn&#39;t stack with another fortune effect, and cancels against misfortune as usual (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Kept Suns and Eclipses\u003c/strong> (Leo, Scorpio) sit outside your deck until you play them, so a reshuffle doesn&#39;t bring them back. They aren&#39;t held draws: one you haven&#39;t played goes back into your deck at your next night&#39;s rest.\u003c/li>\n\u003cli>\u003cstrong>Custom decks\u003c/strong> can buy any one ability, or none. Look up its price for the deck&#39;s size below, subtract it from the pip total (13.6), and keep the same swing range (13.3) and copy limit (13.4). With more Eclipses than Suns, test the deck in the Deck Lab (13.6).\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"c2-12-star-sign-abilities-the-twelve-abilities\">The twelve abilities\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Cardinal (starts)\u003c/th>\n\u003cth>Fixed (holds)\u003c/th>\n\u003cth>Mutable (changes)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Fire\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Aries:\u003c/strong> First Blood\u003c/td>\n\u003ctd>\u003cstrong>Leo:\u003c/strong> Crowned\u003c/td>\n\u003ctd>\u003cstrong>Sagittarius:\u003c/strong> Loose Arrow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Air\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Libra:\u003c/strong> Weigh the Odds\u003c/td>\n\u003ctd>\u003cstrong>Aquarius:\u003c/strong> Water Bearer\u003c/td>\n\u003ctd>\u003cstrong>Gemini:\u003c/strong> Twin Draw\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Water\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Cancer:\u003c/strong> Shell\u003c/td>\n\u003ctd>\u003cstrong>Scorpio:\u003c/strong> Sting\u003c/td>\n\u003ctd>\u003cstrong>Pisces:\u003c/strong> Dream Tide\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Earth\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Capricorn:\u003c/strong> Second Ascent\u003c/td>\n\u003ctd>\u003cstrong>Taurus:\u003c/strong> Unyielding\u003c/td>\n\u003ctd>\u003cstrong>Virgo:\u003c/strong> Sift\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Ability\u003c/th>\n\u003cth>How often\u003c/th>\n\u003cth>Effect\u003c/th>\n\u003cth>Affects\u003c/th>\n\u003cth>Price in its deck\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong> (30 cards)\u003c/td>\n\u003ctd>First Blood\u003c/td>\n\u003ctd>Once per encounter\u003c/td>\n\u003ctd>Your first Strike in each encounter is a fortune check: draw 3 cards and keep the best pair.\u003c/td>\n\u003ctd>Attacks\u003c/td>\n\u003ctd>3 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong> (33 cards)\u003c/td>\n\u003ctd>Crowned\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>When you draw a Sun, you can keep it instead: set it aside face-up and draw a replacement card for that check. Later, play it as your draw for any attack roll; it counts as a natural 20.\u003c/td>\n\u003ctd>Attacks\u003c/td>\n\u003ctd>4 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong> (36 cards)\u003c/td>\n\u003ctd>Loose Arrow\u003c/td>\n\u003ctd>Once per encounter\u003c/td>\n\u003ctd>After drawing the first card of an attack roll, you can discard it and draw a new first card.\u003c/td>\n\u003ctd>Attacks\u003c/td>\n\u003ctd>5 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong> (40 cards)\u003c/td>\n\u003ctd>Weigh the Odds\u003c/td>\n\u003ctd>Once per encounter\u003c/td>\n\u003ctd>When an encounter starts, before you draw for initiative, look at the top 3 cards of your deck and put them back in any order.\u003c/td>\n\u003ctd>Initiative and the first attack\u003c/td>\n\u003ctd>3 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong> (44 cards)\u003c/td>\n\u003ctd>Water Bearer\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>When you or an ally within 30 feet fails a check, that character can draw a new check from your deck and use the better result, with their own modifier. You pay the cards.\u003c/td>\n\u003ctd>Any check, any ally\u003c/td>\n\u003ctd>3 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong> (48 cards)\u003c/td>\n\u003ctd>Twin Draw\u003c/td>\n\u003ctd>Once per encounter\u003c/td>\n\u003ctd>Before a check, declare Twin Draw: draw two separate checks, choose which one counts, and discard both.\u003c/td>\n\u003ctd>Any check (priced for use on an attack)\u003c/td>\n\u003ctd>6 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong> (52 cards)\u003c/td>\n\u003ctd>Shell\u003c/td>\n\u003ctd>Once per encounter\u003c/td>\n\u003ctd>The first time each encounter you or an ally within 30 feet fails a saving throw, that character can draw a new check from your deck and use the better result. You pay the cards.\u003c/td>\n\u003ctd>Saves, for the whole party\u003c/td>\n\u003ctd>10 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong> (56 cards)\u003c/td>\n\u003ctd>Sting\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>When you draw an Eclipse, you can keep it instead: set it aside face-up and draw a replacement card for that check. Later, play it before the GM draws for an enemy&#39;s check; that check is a natural 1.\u003c/td>\n\u003ctd>Defense\u003c/td>\n\u003ctd>16 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong> (60 cards)\u003c/td>\n\u003ctd>Dream Tide\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>When you fail a check, you can swap one of its cards for the top card of your deck, unseen.\u003c/td>\n\u003ctd>Any check\u003c/td>\n\u003ctd>2 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong> (65 cards)\u003c/td>\n\u003ctd>Second Ascent\u003c/td>\n\u003ctd>After each deck-out\u003c/td>\n\u003ctd>Your first check after each reshuffle is a fortune check.\u003c/td>\n\u003ctd>Any check\u003c/td>\n\u003ctd>2 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong> (70 cards)\u003c/td>\n\u003ctd>Unyielding\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>The first time each day your deck runs out, reshuffle without gaining a level of exhaustion.\u003c/td>\n\u003ctd>Endurance\u003c/td>\n\u003ctd>21 pips\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong> (75 cards)\u003c/td>\n\u003ctd>Sift\u003c/td>\n\u003ctd>Once per day\u003c/td>\n\u003ctd>After you draw a check, you can look at the top card of your discard pile and swap one of the check&#39;s cards for it.\u003c/td>\n\u003ctd>Any check\u003c/td>\n\u003ctd>5 pips\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"c2-12-star-sign-abilities-what-an-ability-does-to-a-deck\">What an ability does to a deck\u003c/h3>\n\u003cp>Paying pips weakens every check a little, and the ability gives the value back in its own area. So abilities shift a deck&#39;s strengths without changing its total.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Attack abilities\u003c/strong> (Aries, Leo, Sagittarius) turn a little defense into more damage.\u003c/li>\n\u003cli>\u003cstrong>Protective abilities\u003c/strong> (Cancer, Scorpio) cost the most after Unyielding, so the deck&#39;s own attacks land a little softer; they pay it back by keeping damage off the party.\u003c/li>\n\u003cli>\u003cstrong>Taurus\u003c/strong> pays the most of any sign and never tires on a standard day: it stays flat from the first check to the last instead of starting strong and ending weak.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"c2-12-star-sign-abilities-prices-for-custom-decks\">Prices for custom decks\u003c/h3>\n\u003cp>Pips to subtract from the pip total, by deck size. For a size between columns, use the Deck Lab.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Ability\u003c/th>\n\u003cth>30\u003c/th>\n\u003cth>35\u003c/th>\n\u003cth>40\u003c/th>\n\u003cth>45\u003c/th>\n\u003cth>50\u003c/th>\n\u003cth>55\u003c/th>\n\u003cth>60\u003c/th>\n\u003cth>65\u003c/th>\n\u003cth>70\u003c/th>\n\u003cth>75\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>First Blood (Aries)\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Crowned (Leo)\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Loose Arrow (Sagittarius)\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Weigh the Odds (Libra)\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Water Bearer (Aquarius)\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Twin Draw (Gemini)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shell (Cancer)\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sting (Scorpio)\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>18\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dream Tide (Pisces)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Second Ascent (Capricorn)\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unyielding (Taurus)\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>24\u003c/td>\n\u003ctd>25\u003c/td>\n\u003ctd>25\u003c/td>\n\u003ctd>25\u003c/td>\n\u003ctd>25\u003c/td>\n\u003ctd>24\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>21\u003c/td>\n\u003ctd>18\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sift (Virgo)\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Once-per-encounter abilities cost more in bigger decks: each pip is a smaller share of a big deck, so it takes more of them to buy the same value. Unyielding costs the most in mid-sized decks, which run out early enough in the day for the saved level of exhaustion to matter for longer.\u003c/p>\n\u003ch3 id=\"c2-12-star-sign-abilities-playing-without-abilities-optional-rule\">Playing without abilities (optional rule)\u003c/h3>\n\u003cp>Sign abilities are optional. A table that would rather play without them agrees at session zero, and the choice covers every player deck at the table.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Sign decks take their price back.\u003c/strong> Each sign deck paid for its ability with a lower pip total, so without it the deck plays a little weak. Add the price back by flipping a card or two to their mirrors (the pip dial, 13.5), as listed below. Swing points stay the same, and every deck is balanced again.\u003c/li>\n\u003cli>\u003cstrong>Custom decks build to the full pip total.\u003c/strong> Skip the ability step (step 3 of the short version in chapter 13, and 13.6) and build to your row&#39;s pip total in 13.4. The starter decks have no ability, so they need no change.\u003c/li>\n\u003cli>\u003cstrong>A deck built with an ability comes up short.\u003c/strong> Taking the ability off leaves it weaker by the price; add the pips back the same way before play.\u003c/li>\n\u003cli>\u003cstrong>Nothing else changes.\u003c/strong> Sizes, Joker limits, swing ranges, the copy limit and the balance rules stay the same. The Deck Lab has a switch at the top that turns abilities off.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Price\u003c/th>\n\u003cth>Change to add it back\u003c/th>\n\u003cth>Deck code without the ability\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>one 4 → 7\u003c/td>\n\u003ctd>2-2-2-1-1-3-4-5-4-4 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>one 4 → 7, one 5 → 6\u003c/td>\n\u003ctd>2-2-2-2-2-4-5-4-4-4 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>one 3 → 8\u003c/td>\n\u003ctd>4-3-3-2-2-2-2-3-5-8 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>one 4 → 7\u003c/td>\n\u003ctd>5-4-3-2-1-2-3-5-6-7 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>one 4 → 7\u003c/td>\n\u003ctd>0-0-1-5-9-11-8-5-1-0 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>one 3 → 8, one 5 → 6\u003c/td>\n\u003ctd>9-6-3-2-1-1-2-4-7-11 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>one Ace → 10, one 5 → 6\u003c/td>\n\u003ctd>3-3-4-6-6-6-6-5-5-4 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>one Ace → 10, one 2 → 9\u003c/td>\n\u003ctd>1-3-5-6-7-7-7-7-5-3 / 2-3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>one 4 → 6\u003c/td>\n\u003ctd>14-9-4-0-1-1-0-4-9-16 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>two 5s → 6s\u003c/td>\n\u003ctd>7-7-6-6-5-4-4-5-7-10 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>21\u003c/td>\n\u003ctd>two Aces → 10s, one 4 → 7\u003c/td>\n\u003ctd>1-5-6-8-12-9-10-8-3-2 / 3-3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>one 3 → 8\u003c/td>\n\u003ctd>17-11-5-3-1-1-3-6-10-15 / 2-1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Pisces has only one 5, so it moves a 4 up to a 6 instead: 2 pips, and one swing point fewer.\u003c/p>\n"},{"id":"c2-13-building-your-own-deck","title":"13. Building your own deck","html":"\u003ch2 id=\"c2-13-building-your-own-deck-13-building-your-own-deck\">13. Building your own deck\u003c/h2>\n\u003cp>How a player builds their own balanced deck instead of taking a star-sign deck. The Deck Lab tests any deck exactly and loads every starter deck in the build table (13.4).\u003c/p>\n\u003ch3 id=\"c2-13-building-your-own-deck-the-short-version\">The short version\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Pick a size:\u003c/strong> 30, 35, 40 … up to 75 cards.\u003c/li>\n\u003cli>\u003cstrong>Pick your Jokers.\u003c/strong> Eclipses equal your Suns or one more, with at least one Sun, up to your size&#39;s limit (13.2).\u003c/li>\n\u003cli>\u003cstrong>Pick a sign ability, or none\u003c/strong> (13.6). Its price for your size comes off your pip total. A table that plays without abilities skips this step (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Fill the rest with number cards (Ace to 10)\u003c/strong> so that your row of the build table (13.4) is met:\u003cul>\n\u003cli>\u003cstrong>Pip total:\u003c/strong> the values of your number cards (Ace = 1) add up to exactly your row&#39;s pip total, minus your ability&#39;s price.\u003c/li>\n\u003cli>\u003cstrong>Swing points:\u003c/strong> add up to a number inside your row&#39;s swing range (13.3).\u003c/li>\n\u003cli>\u003cstrong>Copy limit:\u003c/strong> no value appears more times than your row allows (a third of your number cards).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Or start from your row&#39;s starter deck\u003c/strong> and change it with the pip dial and the swing dial (13.5). Each dial moves one of the two numbers and leaves the other alone.\u003c/li>\n\u003cli>\u003cstrong>Test it in the Deck Lab\u003c/strong> if you like; the GM may ask you to. A deck that meets its row is balanced. If you bought an ability and have more Eclipses than Suns, do test it (13.6).\u003c/li>\n\u003c/ol>\n\u003cp>A balanced deck is as fair as a d20 over a standard day, the same standard the sign decks are built to. Chapter 17 says exactly what that means.\u003c/p>\n\u003ch3 id=\"c2-13-building-your-own-deck-13-1-size\">13.1 Size\u003c/h3>\n\u003cp>Smaller decks get stronger cards but run out sooner, and every time a deck runs out you gain a level of exhaustion (chapter 4). The pip totals in 13.4 already account for this.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Runs out in a standard day\u003c/th>\n\u003cth>Highest exhaustion\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>3 times\u003c/td>\n\u003ctd>Exhausted 3 (fatigued)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35–45\u003c/td>\n\u003ctd>twice\u003c/td>\n\u003ctd>Exhausted 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50–75\u003c/td>\n\u003ctd>once\u003c/td>\n\u003ctd>Exhausted 1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Custom decks come in steps of 5. For a size in between (the sign decks use 33, 36, 44, 48, 52 and 56), use the Deck Lab: it works out the exact pip total for any size, and the deck is fine if it passes the Lab test.\u003c/p>\n\u003ch3 id=\"c2-13-building-your-own-deck-13-2-jokers\">13.2 Jokers\u003c/h3>\n\u003cp>A Sun is a natural 20 and an Eclipse a natural 1 (chapter 2). Jokers don&#39;t have to be even. The limits:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Eclipses equal your Suns, or one more.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>At least one Sun\u003c/strong>, except in the big-deck setups below.\u003c/li>\n\u003cli>\u003cstrong>Total Jokers, at most:\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>30\u003c/th>\n\u003cth>35–40\u003c/th>\n\u003cth>45–50\u003c/th>\n\u003cth>55\u003c/th>\n\u003cth>60–65\u003c/th>\n\u003cth>70–75\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Most Jokers\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The setups each size allows (Suns / Eclipses), plus the big-deck extras:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>1 / 1\u003c/th>\n\u003cth>1 / 2\u003c/th>\n\u003cth>2 / 2\u003c/th>\n\u003cth>2 / 3\u003c/th>\n\u003cth>3 / 3\u003c/th>\n\u003cth>3 / 4\u003c/th>\n\u003cth>Big-deck extras\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>0 / 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>0 / 1, 0 / 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>0 / 2, 2 / 1, 3 / 2, 4 / 3\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>What each kind of setup plays like\u003c/h4>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Setup\u003c/th>\n\u003cth>Examples\u003c/th>\n\u003cth>How it plays\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Even\u003c/strong>\u003c/td>\n\u003ctd>1 / 1, 2 / 2, 3 / 3 (the other ten signs)\u003c/td>\n\u003ctd>The default. Natural 20s and 1s come up equally.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>One extra Eclipse\u003c/strong>\u003c/td>\n\u003ctd>1 / 2, 2 / 3 (Scorpio), 3 / 4\u003c/td>\n\u003ctd>More natural 1s, paid for with stronger number cards (a higher pip total). Saves hurt a little more; Strikes are unchanged.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>No Sun\u003c/strong>\u003c/td>\n\u003ctd>0 / 1, 0 / 2\u003c/td>\n\u003ctd>Never a natural 20. Crits come only from high totals, so the deck has to be mostly Aces and 10s. Weapons that rely on crits (deadly, fatal) do a little worse.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>One extra Sun\u003c/strong> (75 only)\u003c/td>\n\u003ctd>2 / 1 (Virgo), 3 / 2, 4 / 3\u003c/td>\n\u003ctd>More natural 20s, paid for with weaker number cards. Strikes and saves both favor you, which sits close to the limit of balance, so the swing ranges are narrow.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>More Jokers also make a deck last longer, because a check that opens on a Joker costs one card instead of two. Chapter 24 explains why the limits sit where they do.\u003c/p>\n\u003ch3 id=\"c2-13-building-your-own-deck-13-3-swing-points\">13.3 Swing points\u003c/h3>\n\u003cp>Swing points measure how far your cards sit from the middle. Extreme cards swing your draws; middle cards keep them steady.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Swing points\u003c/strong>\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Add the points for every number card. Your row&#39;s swing range is where the deck stays balanced. Below it the deck is too steady and its Strikes crit too rarely; above it, too swingy. Inside the range, the low end plays steady and the high end swingy.\u003c/p>\n\u003ch3 id=\"c2-13-building-your-own-deck-13-4-the-build-table\">13.4 The build table\u003c/h3>\n\u003cp>Pick your row. &quot;Number cards&quot; is the size minus your Jokers. &quot;Most copies&quot; is the copy limit: the most of any one value. The starter deck meets every rule for its row; its code lists Ace, 2, 3 … 10, then Suns and Eclipses. &quot;Packs&quot; is the standard packs needed to build the starter.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Number cards\u003c/th>\n\u003cth>Pip total\u003c/th>\n\u003cth>Swing points\u003c/th>\n\u003cth>Most copies\u003c/th>\n\u003cth>Starter deck\u003c/th>\n\u003cth>Packs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>28\u003c/td>\n\u003ctd>183\u003c/td>\n\u003ctd>99–127\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>1-2-2-2-2-3-4-4-4-4 / 1-1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>207\u003c/td>\n\u003ctd>135–182\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>5-2-1-1-2-3-4-5-5-5 / 1-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>32\u003c/td>\n\u003ctd>212\u003c/td>\n\u003ctd>58–85\u003c/td>\n\u003ct >\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>71\u003c/td>\n\u003ctd>391\u003c/td>\n\u003ctd>377–450\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>12-9-7-5-3-3-4-6-9-13 / 2-2\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>70\u003c/td>\n\u003ctd>395\u003c/td>\n\u003ctd>345–415\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>10-8-7-5-4-4-5-6-9-12 / 2-3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>3 / 3\u003c/td>\n\u003ctd>69\u003c/td>\n\u003ctd>380\u003c/td>\n\u003ctd>177–246\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>3-6-8-9-9-9-8-7-6-4 / 3-3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>3 / 4\u003c/td>\n\u003ctd>68\u003c/td>\n\u003ctd>384\u003c/td>\n\u003ctd>41–115\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>0-2-6-11-13-13-12-8-3-0 / 3-4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>0 / 2\u003c/td>\n\u003ctd>73\u003c/td>\n\u003ctd>421\u003c/td>\n\u003ctd>597–619\u003c/td>\n\u003ctd>24\u003c/td>\n\u003ctd>22-10-2-0-0-0-0-2-13-24 / 0-2\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>72\u003c/td>\n\u003ctd>386\u003c/td>\n\u003ctd>493–506\u003c/td>\n\u003ctd>24\u003c/td>\n\u003ctd>16-11-7-4-2-0-0-4-11-17 / 2-1\u003c/td>\n\u003ctd>5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>3 / 2\u003c/td>\n\u003ctd>70\u003c/td>\n\u003ctd>375\u003c/td>\n\u003ctd>287–320\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>8-8-8-7-6-6-6-6-7-8 / 3-2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>4 / 3\u003c/td>\n\u003ctd>68\u003c/td>\n\u003ctd>364\u003c/td>\n\u003ctd>39–93\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>0-2-7-12-15-15-11-5-1-0 / 4-3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"c2-13-building-your-own-deck-13-5-adjusting-a-deck-the-pip-dial-and-the-swing-dial\">13.5 Adjusting a deck: the pip dial and the swing dial\u003c/h3>\n\u003cp>Every card has a \u003cstrong>mirror\u003c/strong>: A and 10, 2 and 9, 3 and 8, 4 and 7, 5 and 6. Mirrors have the same swing points, which gives you two dials that don&#39;t interfere with each other.\u003c/p>\n\u003cp>\u003cstrong>The pip dial: flip a card to its mirror.\u003c/strong> The pip total changes, the swing points don&#39;t.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Flip\u003c/th>\n\u003cth>Pip total\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>5 → 6\u003c/td>\n\u003ctd>+1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4 → 7\u003c/td>\n\u003ctd>+3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3 → 8\u003c/td>\n\u003ctd>+5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 → 9\u003c/td>\n\u003ctd>+7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A → 10\u003c/td>\n\u003ctd>+9\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Flip the other way (6 → 5, 10 → A and so on) to lower the pip total by the same amount.\u003c/p>\n\u003cp>\u003cstrong>The swing dial: push two cards apart, or pull them together.\u003c/strong> Move one card down and another up by the same number of steps. The pip total doesn&#39;t change.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Push apart\u003c/th>\n\u003cth>Swing points\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>a 5 → 4 and a 6 → 7\u003c/td>\n\u003ctd>+2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 4 → 3 and a 7 → 8\u003c/td>\n\u003ctd>+4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 3 → 2 and an 8 → 9\u003c/td>\n\u003ctd>+6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 2 → A and a 9 → 10\u003c/td>\n\u003ctd>+8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 5 → A and a 6 → 10\u003c/td>\n\u003ctd>+20\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Pull together (the same moves reversed) to lower the swing points by the same amount. Any other pair also keeps the pip total, as long as one card goes down and one goes up by the same number of steps; its swing change is whatever the swing points table in 13.3 says.\u003c/p>\n\u003ch3 id=\"c2-13-building-your-own-deck-13-6-buying-a-sign-ability\">13.6 Buying a sign ability\u003c/h3>\n\u003cp>A custom deck can take any one of the twelve sign abilities, or none. Chapter 12 says what each one does. You pay for it in pips:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Look up its price\u003c/strong> for your size in chapter 12 (Prices for custom decks), or let the Deck Lab work it out.\u003c/li>\n\u003cli>\u003cstrong>Take the price off your row&#39;s pip total.\u003c/strong> The swing range and copy limit stay the same.\u003c/li>\n\u003cli>\u003cstrong>Lower the pip total with the pip dial\u003c/strong> (13.5): flip high cards to their mirrors (10 → A is −9, 9 → 2 is −7, 8 → 3 is −5, 7 → 4 is −3, 6 → 5 is −1). Flips don&#39;t change swing points.\u003c/li>\n\u003c/ol>\n\u003cp>For example, the 40-card starter with 1 Sun and 1 Eclipse (5-4-3-2-2-2-2-4-6-8 / 1-1, pip total 232) can buy First Blood for 5 pips: flip one 8 to a 3 for 5-4-4-2-2-2-2-3-6-8 / 1-1, pip total 227.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>The sign decks already include theirs.\u003c/strong> Each one&#39;s pip total is its size&#39;s pip total minus its ability&#39;s price.\u003c/li>\n\u003cli>\u003cstrong>Even Jokers or an extra Sun: any ability works.\u003c/strong> Every starter deck with those setups stays balanced with any of the twelve abilities.\u003c/li>\n\u003cli>\u003cstrong>More Eclipses than Suns: test it in the Deck Lab.\u003c/strong> A few pairings take too much damage on saves, most of them in the no-Sun decks. Chapter 23 lists them.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"c2-13-building-your-own-deck-13-7-worked-example-40-cards-1-sun-and-2-eclipses\">13.7 Worked example: 40 cards, 1 Sun and 2 Eclipses\u003c/h3>\n\u003cp>The row says: 37 number cards, pip total \u003cstrong>236\u003c/strong>, swing points \u003cstrong>144–192\u003c/strong>, at most \u003cstrong>12\u003c/strong> of any value.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Deal the number cards evenly.\u003c/strong> Three of each value is 30 cards; add the other 7 from the middle out (5, 6, 4, 7, 3, 8, 2).\nAce to 10: 3-4-4-4-4-4-4-4-3-3. Pip total 200, swing points 134.\u003c/li>\n\u003cli>\u003cstrong>Flip to reach 236 (+36).\u003c/strong> Two Aces → 10s (+18), two 2s → 9s (+14), one 4 → 7 (+3), one 5 → 6 (+1).\nNow 1-2-4-3-3-5-5-4-5-5. Pip total 236, swing points still 134.\u003c/li>\n\u003cli>\u003cstrong>Push apart to land near the middle of the range (+30).\u003c/strong> A 5 and a 6 → an Ace and a 10 (+20), a 3 and an 8 → a 2 and a 9 (+6), a 4 and a 7 → a 3 and an 8 (+4).\nNow \u003cstrong>2-3-4-2-2-4-4-4-6-6 / 1-2\u003c/strong>. Pip total 236, swing points 164, largest count 6.\u003c/li>\n\u003c/ol>\n\u003cp>The deck meets its row, and the Deck Lab confirms it&#39;s balanced. The deck after step 2 already passed too: the ranges leave some margin, so a deck just outside its range can still pass the Lab test.\u003c/p>\n"},{"id":"c2-14-wild-magic","title":"14. Wild magic","html":"\u003ch2 id=\"c2-14-wild-magic-14-wild-magic\">14. Wild magic\u003c/h2>\n\u003cp>The Fate Deck&#39;s face cards feed wild magic. The Fate Deck page fills the sets as you draw and shows the effect.\u003c/p>\n\u003ch3 id=\"c2-14-wild-magic-how-it-goes-off\">How it goes off\u003c/h3>\n\u003col>\n\u003cli>The GM places face cards in the order drawn into four sets of three, drawing a replacement card each time. Only face cards drawn for Fate Deck checks made in response to a player&#39;s action or request count, including flat checks and secret checks. The GM can&#39;t draw extra checks to fish for them.\u003c/li>\n\u003cli>When the fourth set is complete (about every 39 Fate Deck checks, roughly once per encounter), wild magic goes off.\u003c/li>\n\u003cli>\u003cstrong>Read the side and strength from the cards.\u003c/strong> In each set, count pairs of matching suits: a one-suit set has 3 pairs, a two-suit set 1, a three-suit set none. Add red pairs (♥ ♦) and subtract black pairs (♠ ♣). The net, from −4 to +4, is the result:\u003cul>\n\u003cli>\u003cstrong>Above 0: good wild magic\u003c/strong>, stronger the higher it goes.\u003c/li>\n\u003cli>\u003cstrong>Below 0: bad wild magic\u003c/strong>, stronger the lower it goes.\u003c/li>\n\u003cli>\u003cstrong>0: mixed:\u003c/strong> it hits friend and foe alike, or it&#39;s a harmless oddity.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Look up the exact combination below for its effect, and resolve it with the rules in the next section. Order doesn&#39;t matter, either within a set or between sets.\u003c/li>\n\u003cli>Return all 12 face cards to the Fate Deck&#39;s discard pile.\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"c2-14-wild-magic-resolving-an-effect\">Resolving an effect\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>The Destined\u003c/strong> is the character whose action completed the fourth set: the player the GM was responding to when the last face card came up. If that&#39;s unclear, the GM picks.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Allies\u003c/strong> are the Destined, the other player characters and their companions. \u003cstrong>Enemies\u003c/strong> are creatures hostile to the party. \u003cstrong>A chosen enemy\u003c/strong> is an enemy the Destined picks within 60 feet.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Surge rank\u003c/strong> is half the Destined&#39;s level, rounded up. \u003cstrong>Surge DC\u003c/strong> is the standard DC for the Destined&#39;s level:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Destined level\u003c/th>\n\u003cth>1\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003cth>11\u003c/th>\n\u003cth>12\u003c/th>\n\u003cth>13\u003c/th>\n\u003cth>14\u003c/th>\n\u003cth>15\u003c/th>\n\u003cth>16\u003c/th>\n\u003cth>17\u003c/th>\n\u003cth>18\u003c/th>\n\u003cth>19\u003c/th>\n\u003cth>20\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Surge rank\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Surge DC\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>19\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>24\u003c/td>\n\u003ctd>26\u003c/td>\n\u003ctd>27\u003c/td>\n\u003ctd>28\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>31\u003c/td>\n\u003ctd>32\u003c/td>\n\u003ctd>34\u003c/td>\n\u003ctd>35\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>38\u003c/td>\n\u003ctd>39\u003c/td>\n\u003ctd>40\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>It happens at once,\u003c/strong> in the middle of whatever is going on, and costs no actions or cards. Creatures save against the surge DC with their normal draw: players from their own deck, monsters from the Fate Deck.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Effects last 1 minute (10 rounds)\u003c/strong> unless they say otherwise. They&#39;re magical, so they can be counteracted at the surge rank. \u003cem>Incapacitation\u003c/em> works as the base game&#39;s trait of that name, using the surge rank as the spell rank.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Damage and healing\u003c/strong> use the damage deck. Good wild magic uses the players&#39; Joker rule; bad wild magic is a hazard and uses the monsters&#39; rule (chapter 10).\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>No enemy around?\u003c/strong> An effect that needs one waits and goes off at the start of the next encounter&#39;s first round. Everything else happens right away.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Bad is good turned around.\u003c/strong> Every bad combination is the opposite of a good one, with the same odds (swap ♥ for ♠ and ♦ for ♣), and its effect is that good effect turned against the party. The Opposite column pairs them.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Mixed wild magic hits friend and foe alike, or it&#39;s a harmless oddity.\u003c/strong> The most common combination of all, #58 (1 in 12), sends you to the Oddities table below.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>The GM can swap\u003c/strong> an effect that makes no sense in the scene (a vine burst on a ship&#39;s rigging, say) for another of the same result.\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"c2-14-wild-magic-odds\">Odds\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Net\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Combinations\u003c/th>\n\u003cth>Chance\u003c/th>\n\u003cth>About 1 in\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>+4\u003c/td>\n\u003ctd>Good 4 (extreme)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0.06%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>+3\u003c/td>\n\u003ctd>Good 3 (major)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>1.87%\u003c/td>\n\u003ctd>53\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>+2\u003c/td>\n\u003ctd>Good 2 (moderate)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>4.91%\u003c/td>\n\u003ctd>20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>+1\u003c/td>\n\u003ctd>Good 1 (minor)\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>28.05%\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>30.22%\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−1\u003c/td>\n\u003ctd>Bad 1 (minor)\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>28.05%\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−2\u003c/td>\n\u003ctd>Bad 2 (moderate)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>4.91%\u003c/td>\n\u003ctd>20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−3\u003c/td>\n\u003ctd>Bad 3 (major)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>1.87%\u003c/td>\n\u003ctd>53\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−4\u003c/td>\n\u003ctd>Bad 4 (extreme)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0.06%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Good and bad are evenly matched: swapping ♥ for ♠ and ♦ for ♣ turns every good combination into a bad one with the same odds. Chances for single combinations range from 8.4% (four three-suit sets, each missing a different suit) down to 0.0065% (four one-suit sets, about 1 in 15,400).\u003c/p>\n\u003ch3 id=\"c2-14-wild-magic-all-93-combinations\">All 93 combinations\u003c/h3>\n\u003cp>Suits within a set are listed ♥ ♦ ♠ ♣. One-suit sets are listed first, then two-suit sets, then three-suit sets.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>The four sets\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Chance\u003c/th>\n\u003cth>About 1 in\u003c/th>\n\u003cth>Opposite\u003c/th>\n\u003cth>Effect\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♦ · ♠♠♣ · ♠♣♣\u003c/td>\n\u003ctd>Good 4\u003c/td>\n\u003ctd>0.0584%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003ctd>#93\u003c/td>\n\u003ctd>\u003cstrong>Crown of Fortune.\u003c/strong> Every ally regains 2d8 Hit Points per surge rank, loses one level of exhaustion and gains a Hero Point (up to 3). Each ally&#39;s next check this encounter is a natural 20: don&#39;t draw.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>♥♥♥ · ♦♠♣ · ♦♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>0.2338%\u003c/td>\n\u003ctd>428\u003c/td>\n\u003ctd>#87\u003c/td>\n\u003ctd>\u003cstrong>Spell Surge.\u003c/strong> The Destined, or an ally they choose who casts spells, casts one of their spells of the surge rank or lower that takes 3 actions or fewer, right now and free: no actions, no spell slot, no cards. If no ally casts spells, fire bursts instead in a 20-foot burst at a point the Destined chooses within 120 feet: 2d6 fire damage per surge rank, basic Reflex save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>♦♦♦ · ♥♠♣ · ♥♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>0.2338%\u003c/td>\n\u003ctd>428\u003c/td>\n\u003ctd>#88\u003c/td>\n\u003ctd>\u003cstrong>Ablative Barrier.\u003c/strong> Each ally within 40 feet of the Destined gains resistance to all damage equal to twice the surge rank for 1 minute. Each time an ally&#39;s resistance reduces damage, it drops by 1 for all of them; it ends at 0.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♠ · ♠♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#90\u003c/td>\n\u003ctd>\u003cstrong>Surge of Life.\u003c/strong> Vitality floods out of the Destined: each ally within 30 feet regains 2d8 Hit Points per surge rank. Undead enemies in the area take that much vitality damage instead (basic Fortitude save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♣ · ♠♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#89\u003c/td>\n\u003ctd>\u003cstrong>Heroic Anthem.\u003c/strong> Four singing skeletons appear and serenade the party for 1 minute: allies gain a +1 status bonus to attack rolls, Perception checks, saving throws and skill checks.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♠ · ♠♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#92\u003c/td>\n\u003ctd>\u003cstrong>Vanishing.\u003c/strong> The Destined and each ally within 10 feet of them turn invisible for 1 minute. An ally&#39;s invisibility ends when they use a hostile action.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♣ · ♠♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#91\u003c/td>\n\u003ctd>\u003cstrong>Quickening.\u003c/strong> The Destined and each ally within 30 feet are quickened for 1 minute. The extra action can only be used to Step, Stride or Strike.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♠ · ♦♣♣ · ♠♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>0.1753%\u003c/td>\n\u003ctd>570\u003c/td>\n\u003ctd>#82\u003c/td>\n\u003ctd>\u003cstrong>Vitality Burst.\u003c/strong> Each ally within 20 feet of the Destined regains 1d8 Hit Points per surge rank. Undead enemies in the area take that much vitality damage instead (basic Fortitude save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♣ · ♦♠♠ · ♠♣♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>0.1753%\u003c/td>\n\u003ctd>570\u003c/td>\n\u003ctd>#81\u003c/td>\n\u003ctd>\u003cstrong>Bewilder.\u003c/strong> A chosen enemy attempts a Will save. Critical success: no effect. Success: stupefied 1 for 1 round. Failure: confused for 1 round. Critical failure: confused for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♠ · ♥♣♣ · ♠♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>0.1753%\u003c/td>\n\u003ctd>570\u003c/td>\n\u003ctd>#84\u003c/td>\n\u003ctd>\u003cstrong>Giant&#39;s Stature.\u003c/strong> The Destined grows to Large for 1 minute: reach +5 feet, a +2 status bonus to melee damage, and clumsy 1. At surge rank 4 or higher they grow to Huge instead: reach +10 feet and +4 to melee damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♣ · ♥♠♠ · ♠♣♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>0.1753%\u003c/td>\n\u003ctd>570\u003c/td>\n\u003ctd>#83\u003c/td>\n\u003ctd>\u003cstrong>Stormlance.\u003c/strong> Lightning leaps from the Destined in a 120-foot line aimed where they choose: (surge rank + 1)d12 electricity damage to each creature in the line, basic Reflex save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>12\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♣ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#85\u003c/td>\n\u003ctd>\u003cstrong>Leaden Limbs.\u003c/strong> A chosen enemy attempts a Fortitude save. Critical success: no effect. Success: slowed 1 for 1 round. Failure: slowed 1 for 1 minute. Critical failure: slowed 2 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♠ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#86\u003c/td>\n\u003ctd>\u003cstrong>Burst of Speed.\u003c/strong> The Destined is quickened for 3 rounds. The extra action can only be used to Step, Stride or Strike.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>14\u003c/td>\n\u003ctd>♥♥♥ · ♦♠♠ · ♦♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#59\u003c/td>\n\u003ctd>\u003cstrong>Lucky Break.\u003c/strong> The Destined gains a Hero Point. If they already have 3, their next check this encounter is a fortune check instead (draw 3 cards, keep the best pair).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15\u003c/td>\n\u003ctd>♦♦♦ · ♥♠♠ · ♥♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#60\u003c/td>\n\u003ctd>\u003cstrong> 03c/td>\n\u003ctd>♦♦♣ · ♥♦♠ · ♥♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#80\u003c/td>\n\u003ctd>\u003cstrong>Gale Blast.\u003c/strong> Wind blasts from the Destined in a 60-foot line aimed where they choose. Each enemy in it attempts a Fortitude save: pushed 10 feet on a failure, pushed 10 feet and knocked prone on a critical failure. Small fires in the line go out.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>36\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♦ · ♠♠♠ · ♣♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.0065%\u003c/td>\n\u003ctd>15,400\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>The Grand Alignment.\u003c/strong> The four suits align. All exhaustion and fatigue end, every deck in play (the players&#39; decks and the Fate Deck) is reshuffled with its discard pile without anyone gaining exhaustion, and every creature in the encounter, friend and foe, treats its next check as a natural 20.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>37\u003c/td>\n\u003ctd>♥♥♥ · ♠♠♠ · ♦♦♣ · ♦♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.0584%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Slumber Tide.\u003c/strong> Drowsy magic fills a 100-foot burst centered on the Destined. Every creature in it, friend and foe, attempts a Will save (incapacitation). Failure: unconscious until the end of its next turn. Critical failure: unconscious for 1 minute. A sleeper wakes if it takes damage or someone spends an Interact action to shake it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>38\u003c/td>\n\u003ctd>♥♥♥ · ♣♣♣ · ♦♦♠ · ♦♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.0584%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Double Spin.\u003c/strong> The Destined and the enemy nearest them both spin like tops. Each attempts a Will save (incapacitation); on a failure it&#39;s stunned 1, then confused until the end of its next turn.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>39\u003c/td>\n\u003ctd>♦♦♦ · ♠♠♠ · ♥♥♣ · ♥♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.0584%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Antimagic Eruption.\u003c/strong> The wild magic tries to counteract every spell and magical effect on each creature within 30 feet of the Destined, friend and foe (counteract rank = surge rank, counteract modifier = surge DC − 10).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>♦♦♦ · ♣♣♣ · ♥♥♠ · ♥♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.0584%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Gravity Reversal.\u003c/strong> Gravity flips within 60 feet of the Destined. Every creature there, friend and foe, falls 30 feet upward unless it succeeds at a Reflex save to grab hold of something. The fallen hang there immobilized until the start of the Destined&#39;s next turn, then drop back down and take falling damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>41\u003c/td>\n\u003ctd>♥♥♠ · ♥♠♠ · ♦♦♣ · ♦♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Sudden Gale.\u003c/strong> Wild winds blow in a random direction within 40 feet of the Destined for 1 minute. A creature that starts its turn there attempts a Fortitude save or falls prone (and is pushed 10 feet on a critical failure); the Destined saves right away. Moving against the wind is difficult terrain, or greater difficult terrain when flying.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>42\u003c/td>\n\u003ctd>♥♥♠ · ♥♣♣ · ♦♦♣ · ♦♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Tremor.\u003c/strong> The ground heaves within 40 feet of the Destined. Every creature standing on the ground attempts a Reflex save or falls prone, and the area is difficult terrain for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>43\u003c/td>\n\u003ctd>♥♥♠ · ♥♦♦ · ♦♣♣ · ♠♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Weightless.\u003c/strong> Creatures and objects within 20 feet of the Destined become nearly weightless until the end of the Destined&#39;s next turn: they can Climb at their land Speed and Leap as high as they normally Leap across.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>44\u003c/td>\n\u003ctd>♥♥♣ · ♥♠♠ · ♦♦♠ · ♦♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Swap.\u003c/strong> The Destined and the enemy nearest them trade places (teleportation).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>♥♥♣ · ♥♣♣ · ♦♦♠ · ♦♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Hellish Shortcut.\u003c/strong> The Destined teleports up to 60 feet to a space they can see, by way of somewhere much hotter: they arrive singed, taking 1d4 fire damage per surge rank (no save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>46\u003c/td>\n\u003ctd>♥♥♣ · ♥♦♦ · ♦♠♠ · ♠♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Emotional Turmoil.\u003c/strong> For 1 minute, at the start of each of the Destined&#39;s turns, draw a damage-deck card: red, a +2 status bonus to attack rolls, saving throws and skill checks until their next turn; black, a −2 status penalty instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>47\u003c/td>\n\u003ctd>♥♥♦ · ♥♠♠ · ♦♦♣ · ♠♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Monstrous Transformation.\u003c/strong> The Destined&#39;s head and arms take a beast&#39;s shape for 1 minute, giving a status bonus to weapon and unarmed damage equal to the surge rank. At the start of each of their turns they attempt a Will save or are confused until their next turn; on a critical success they can end the effect.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>48\u003c/td>\n\u003ctd>♥♥♦ · ♥♣♣ · ♦♦♠ · ♠♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Warp.\u003c/strong> Reality ripples through the Destined: they&#39;re confused until the end of their next turn and gain 1d6 temporary Hit Points per surge rank (at least 4d6) for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>49\u003c/td>\n\u003ctd>♥♥♦ · ♥♦♦ · ♠♠♣ · ♠♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Day for Night.\u003c/strong> Until the encounter ends, Suns and Eclipses swap meanings on every check and flat check, for players and GM alike: a Sun is a natural 1 and an Eclipse a natural 20.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>♥♠♠ · ♦♦♣ · ♥♦♣ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Trinket Squall.\u003c/strong> Illusory trinkets rain down in a 40-foot burst centered on the Destined for 1 minute, making everything in it concealed. A creature that Seeks and beats the surge DC sees through it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>51\u003c/td>\n\u003ctd>♥♣♣ · ♦♦♠ · ♥♦♠ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Blackout.\u003c/strong> Magical darkness fills a 20-foot burst centered on the Destined for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>52\u003c/td>\n\u003ctd>♥♥♠ · ♦♣♣ · ♥♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Downpour.\u003c/strong> A
