 it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>Faint freckles of starlight trace the Destined&#39;s star sign across their cheeks and fade after a week.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>The enemy nearest the Destined hiccups tiny, harmless sparks until the encounter ends.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Every flame within 60 feet of the Destined burns silver for 10 minutes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>A flock of paper birds folds itself out of thin air, circles the Destined three times and flies off.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>For an hour, the Destined&#39;s hair and clothes drift as if underwater.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>A blank playing card appears in the Destined&#39;s hand. It belongs to no deck and can&#39;t be drawn or played.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>For a day, small objects the Destined sets down float an inch above whatever they&#39;re set on.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>For a day, the Destined&#39;s reflection winks at them from every mirror and still pool.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>A life-size ice statue of the Destined, striking a heroic pose, appears beside them and melts over the next hour.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"cd-14-pacing-the-day","title":"14. Pacing the day","html":"\u003ch2 id=\"cd-14-pacing-the-day-14-pacing-the-day\">14. Pacing the day\u003c/h2>\n\u003cp>\u003cstrong>The last fight of the day is the GM&#39;s to balance and the party&#39;s to prepare for.\u003c/strong> No rule softens it.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Every deck is strong early in the day and weak late,\u003c/strong> because every deck runs out at least once in a standard day. Aries, the smallest deck, swings the most between morning and night, the Earth decks the least. A boss at the end of a long day plays harder than its encounter budget says.\u003c/li>\n\u003cli>\u003cstrong>Day length shifts which decks are strong:\u003c/strong> short days favor small decks, long days favor big ones.\u003c/li>\n\u003cli>\u003cstrong>Advantage costs cards.\u003c/strong> Each use draws a third card, so a table that hands advantage out freely will see decks run out a little sooner.\u003c/li>\n\u003cli>\u003cstrong>Damage runs a little high on both sides\u003c/strong> because of the damage deck&#39;s Jokers, a little more for monsters (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Collapses don&#39;t happen in a realistic day.\u003c/strong> On a long day (80 checks) the Fire decks reach Weary 3; even Aries, the smallest deck, reaches Weary 4 only around check 91.\u003c/li>\n\u003cli>\u003cstrong>What the party can do:\u003c/strong> track the cards left in each deck, rest before the big fight when they can, and save Heroic Inspiration and advantage for it.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-15-watch-in-playtesting","title":"15. Watch in playtesting","html":"\u003ch2 id=\"cd-15-watch-in-playtesting-15-watch-in-playtesting\">15. Watch in playtesting\u003c/h2>\n\u003cp>Things to watch at the table; none of them breaks the balance rules.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Advantage costs cards.\u003c/strong> It comes up often in fifth edition, and each use draws an extra card, so decks run out sooner than the standard day assumes. One possible fix: put the dropped card on the bottom of your deck instead of the discard pile.\u003c/li>\n\u003cli>\u003cstrong>Confirming crits costs cards\u003c/strong> in 3.5: about one extra card every 10 attacks. The balance leaves this out.\u003c/li>\n\u003cli>\u003cstrong>Card counting.\u003c/strong> Discards go face-down, but a player who keeps track in their head can still know when their only Eclipse is gone. The balance assumes nobody does, so it&#39;s a small edge for players with a good memory.\u003c/li>\n\u003cli>\u003cstrong>Other games.\u003c/strong> Games where only a natural 20 crits should work with these decks, but the numbers in this book cover only fifth edition and 3.5.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-16-the-standard-day-and-the-balance-rules","title":"16. The standard day and the balance rules","html":"\u003ch2 id=\"cd-16-the-standard-day-and-the-balance-rules-16-the-standard-day-and-the-balance-rules\">16. The standard day and the balance rules\u003c/h2>\n\u003cp>Every &quot;balanced&quot; in this book means the same thing: over a standard day of 50 checks, a deck&#39;s day edge is within ±0.1, and its attack damage in fifth edition, its attack damage in 3.5, and the damage it takes from saves each land within 97–103% of a d20&#39;s. A deck&#39;s \u003cstrong>edge\u003c/strong> is its average card total minus 10.5, minus its weariness penalty; its \u003cstrong>day edge\u003c/strong> is that edge over a standard day. One point of edge is about 5% more success on a typical check. This chapter sets out the day, what balance covers, and the rules the decks are built to.\u003c/p>\n\u003ch3 id=\"cd-16-the-standard-day-and-the-balance-rules-the-standard-day\">The standard day\u003c/h3>\n\u003cp>All balance numbers assume a \u003cstrong>standard day of 50 checks\u003c/strong>, a martial character&#39;s day: 3–4 encounters plus exploration. That&#39;s about 95–99 cards, depending on the deck. Every day starts with a fresh shuffle, and each deck-out costs −2 from then on.\u003c/p>\n\u003ch3 id=\"cd-16-the-standard-day-and-the-balance-rules-what-balance-covers\">What balance covers\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Fifth-edition attacks\u003c/strong> with numbers needed from 5 to 15 on a d20. A natural 20 hits and crits, a natural 1 misses, and a crit counts as 1.6 ordinary hits, since only the dice double.\u003c/li>\n\u003cli>\u003cstrong>Fifth-edition saves\u003c/strong> at the same numbers needed, half damage on a success, with no natural-roll effects.\u003c/li>\n\u003cli>\u003cstrong>3.5 attacks:\u003c/strong> three per turn at 0, −5 and −10, the first needing 5 to 11, with a Sun confirmed by a second attack draw. A deck must balance with all three weapon types: 20/×3, 19–20/×2 and 18–20/×2.\u003c/li>\n\u003cli>\u003cstrong>3.5 saves\u003c/strong> for half damage, with a Sun always saving and an Eclipse always failing.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"cd-16-the-standard-day-and-the-balance-rules-balance-rules\">Balance rules\u003c/h3>\n\u003col>\n\u003cli>\n\u003cp>\u003cstrong>Size buys power.\u003c/strong> A deck&#39;s allowed average card total is \u003cstrong>10.5 + 2 × its average weariness level over a standard day.\u003c/strong> For the main setups:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Deck size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Runs out around check\u003c/th>\n\u003cth>Highest weariness in a standard day\u003c/th>\n\u003cth>Allowed average\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>23, 47\u003c/td>\n\u003ctd>2 (−4)\u003c/td>\n\u003ctd>11.69\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>26\u003c/td>\n\u003ctd>1 (−2)\u003c/td>\n\u003ctd>11.46\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>28\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.36\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>31\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.26\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>34\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.15\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.05\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>39\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>10.94\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>41\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>10.84\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>85\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>44\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>10.74\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>2 / 4\u003c/td>\n\u003ctd>47\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>10.63\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The Deck Lab works out the exact allowed average for any deck. A deck at its allowed average succeeds exactly as often as a d20 over a standard day, averaged over all difficulties.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Suns by size, not by shape.\u003c/strong> Only the Sun crits, so a deck&#39;s crit rate is just how often it draws a Sun. About one Sun per 40 cards gives a d20&#39;s 5%, so each size&#39;s main setup carries one Sun at 45 and 50 cards, two from 55 to 90; the other setups in 12.2 balance too. Eclipses become a choice of shape.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Saves set the floor, attacks the ceiling.\u003c/strong> Saves are pass or fail, so the steadier a deck, the less damage it takes on saves; that sets the low end of each swing range. In 3.5, attack damage rises with swing, which sets the high end.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Lean, for fifth edition.\u003c/strong> Swing points alone don&#39;t settle fifth-edition attack damage; what matters is whether a deck&#39;s extremes sit high or low. Each row has a lean range as well as a swing range (chapter 18).\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Aim for 97–103%.\u003c/strong> Over a standard day, each attack figure and the save figure should land within 97–103% of a d20&#39;s, with a day edge within ±0.1.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>No value makes up more than a third of the number cards.\u003c/strong> Decks piled onto a few values land on the same totals over and over, which makes their balance hard to predict.\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>Chapter 12 turns these rules into a paper method for building a deck.\u003c/p>\n"},{"id":"cd-17-what-a-two-card-draw-can-and-can-t-do","title":"17. What a two-card draw can and can't do","html":"\u003ch2 id=\"cd-17-what-a-two-card-draw-can-and-can-t-do-17-what-a-two-card-draw-can-and-can-t-do\">17. What a two-card draw can and can&#39;t do\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>It can&#39;t match a d20 exactly.\u003c/strong> Two draws from one deck can&#39;t add up to 20 equally likely card totals. Middle totals like 10 and 11 come up often and the extremes rarely, and each deck bends that shape its own way.\u003c/li>\n\u003cli>\u003cstrong>Decks that all matched the d20 would all play the same,\u003c/strong> so &quot;fair&quot; means the average over a standard day, not an identical shape.\u003c/li>\n\u003cli>\u003cstrong>Suns and natural 20s.\u003c/strong> Across the sign decks, a Sun comes up on 3.6 to 6.7% of checks, against a d20&#39;s 5%. Each deck&#39;s number cards make up the difference.\u003c/li>\n\u003cli>\u003cstrong>Reshuffle only when forced.\u003c/strong> Each Joker comes up once per pass through the deck, and that is what holds natural 20s and 1s at the rates in chapter 19.\u003c/li>\n\u003cli>\u003cstrong>Card counting.\u003c/strong> Discards go face-down, so knowing when your only Eclipse is gone, or when the GM&#39;s Suns are used up, takes counting and memory. The balance math assumes nobody tracks this; in a 45-card deck a careful player can, and it helps with timing Heroic Inspiration and advantage.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-18-crits-saves-and-lean","title":"18. Crits, saves and lean","html":"\u003ch2 id=\"cd-18-crits-saves-and-lean-18-crits-saves-and-lean\">18. Crits, saves and lean\u003c/h2>\n\u003cp>What decides whether a deck deals and takes a d20&#39;s damage in these games.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Why only the Sun crits.\u003c/strong> Two cards don&#39;t land on 19 or 20 at a die&#39;s steady 10%: swingy decks land there far more often, steady decks hardly ever. A Sun comes up at close to a d20&#39;s 5% in every deck, so every deck crits about as often as a d20.\u003c/li>\n\u003cli>\u003cstrong>Why a wider range becomes a bigger crit.\u003c/strong> A 19–20 range on a d20 crits 10% of the time for one extra set of dice. On cards a Sun comes up about 5% of the time, so it carries two extra sets: the same extra damage on average, in fewer, bigger hits. The multiplier rule for 3.5 works the same way: 19–20/×2 becomes ×3 on a Sun, and 18–20/×2 becomes ×4, while 20/×3 stays ×3.\u003c/li>\n\u003cli>\u003cstrong>What a fifth-edition crit is worth.\u003c/strong> A crit doubles only the damage dice, so the balance counts it as 1.6 ordinary hits.\u003c/li>\n\u003cli>\u003cstrong>Why steady decks save too well.\u003c/strong> Saves are pass or fail, so a deck whose totals bunch near the middle clears typical save DCs more reliably than a d20 and takes less damage. That&#39;s what sets the bottom of each swing range.\u003c/li>\n\u003cli>\u003cstrong>Why lean exists.\u003c/strong> In fifth edition, a deck&#39;s attack damage depends on whether its extremes sit high or low, not just on how many it has. Swing points count the extremes, and lean says which end they sit at. In 3.5, swing points alone settle attack damage.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-19-the-sign-decks-against-a-d20","title":"19. The sign decks against a d20","html":"\u003ch2 id=\"cd-19-the-sign-decks-against-a-d20-19-the-sign-decks-against-a-d20\">19. The sign decks against a d20\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Average card total\u003c/th>\n\u003cth>Spread (SD; d20 5.77)\u003c/th>\n\u003cth>Natural 20 / 1\u003c/th>\n\u003cth>Swing · lean\u003c/th>\n\u003cth>Fifth-edition attack damage\u003c/th>\n\u003cth>3.5 attack damage\u003c/th>\n\u003cth>Save damage taken\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>45\u003c/td>\n\u003ctd>11.75\u003c/td>\n\u003ctd>5.40\u003c/td>\n\u003ctd>4.4% / 0%\u003c/td>\n\u003ctd>302 · 10\u003c/td>\n\u003ctd>99.1%\u003c/td>\n\u003ctd>99.5–99.8%\u003c/td>\n\u003ctd>99.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>11.56\u003c/td>\n\u003ctd>5.61\u003c/td>\n\u003ctd>4.1% / 4.1%\u003c/td>\n\u003ctd>303 · 29\u003c/td>\n\u003ctd>99.8%\u003c/td>\n\u003ctd>99.9–100.5%\u003c/td>\n\u003ctd>98.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>51\u003c/td>\n\u003ctd>11.43\u003c/td>\n\u003ctd>5.69\u003c/td>\n\u003ctd>3.9% / 3.9%\u003c/td>\n\u003ctd>338 · 26\u003c/td>\n\u003ctd>98.3%\u003c/td>\n\u003ctd>99.1–99.9%\u003c/td>\n\u003ctd>99.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>55\u003c/td>\n\u003ctd>11.37\u003c/td>\n\u003ctd>5.72\u003c/td>\n\u003ctd>3.6% / 3.6%\u003c/td>\n\u003ctd>376 · 12\u003c/td>\n\u003ctd>98.5%\u003c/td>\n\u003ctd>98.7–99.7%\u003c/td>\n\u003ctd>99.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>59\u003c/td>\n\u003ctd>11.27\u003c/td>\n\u003ctd>4.58\u003c/td>\n\u003ctd>6.7% / 3.3%\u003c/td>\n\u003ctd>188 · 0\u003c/td>\n\u003ctd>100.5%\u003c/td>\n\u003ctd>99.1–100.5%\u003c/td>\n\u003ctd>98.3%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>63\u003c/td>\n\u003ctd>11.19\u003c/td>\n\u003ctd>4.82\u003c/td>\n\u003ctd>6.2% / 3.1%\u003c/td>\n\u003ctd>247 · −7\u003c/td>\n\u003ctd>100.4%\u003c/td>\n\u003ctd>99.3–100.4%\u003c/td>\n\u003ctd>98.5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>67\u003c/td>\n\u003ctd>11.12\u003c/td>\n\u003ctd>4.96\u003c/td>\n\u003ctd>5.9% / 2.9%\u003c/td>\n\u003ctd>294 · −4\u003c/td>\n\u003ctd>99.8%\u003c/td>\n\u003ctd>99.1–100.0%\u003c/td>\n\u003ctd>98.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>71\u003c/td>\n\u003ctd>11.01\u003c/td>\n\u003ctd>5.15\u003c/td>\n\u003ctd>5.5% / 8.2%\u003c/td>\n\u003ctd>260 · 32\u003c/td>\n\u003ctd>101.7%\u003c/td>\n\u003ctd>100.1–100.7%\u003c/td>\n\u003ctd>98.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>10.95\u003c/td>\n\u003ctd>5.27\u003c/td>\n\u003ctd>5.3% / 2.6%\u003c/td>\n\u003ctd>405 · −13\u003c/td>\n\u003ctd>98.3%\u003c/td>\n\u003ctd>99.2–99.6%\u003c/td>\n\u003ctd>99.5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>80\u003c/td>\n\u003ctd>10.86\u003c/td>\n\u003ctd>5.44\u003c/td>\n\u003ctd>4.9% / 4.9%\u003c/td>\n\u003ctd>434 · −4\u003c/td>\n\u003ctd>98.7%\u003c/td>\n\u003ctd>99.7–99.9%\u003c/td>\n\u003ctd>99.3%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>85\u003c/td>\n\u003ctd>10.73\u003c/td>\n\u003ctd>5.52\u003c/td>\n\u003ctd>4.6% / 9.1%\u003c/td>\n\u003ctd>401 · 19\u003c/td>\n\u003ctd>100.4%\u003c/td>\n\u003ctd>99.7–99.9%\u003c/td>\n\u003ctd>98.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>90\u003c/td>\n\u003ctd>10.66\u003c/td>\n\u003ctd>5.49\u003c/td>\n\u003ctd>4.4% / 4.4%\u003c/td>\n\u003ctd>522 · −56\u003c/td>\n\u003ctd>98.4%\u003c/td>\n\u003ctd>98.7–99.1%\u003c/td>\n\u003ctd>99.3%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>&quot;Average card total&quot; and &quot;Spread&quot; (its standard deviation) come from the deck&#39;s own cards, before weariness. Damage figures are over a standard day, compared with a d20&#39;s; the 3.5 attack figure is the range across the three weapon types. Damage taken on saves is the same in both games. Every deck&#39;s day edge is within ±0.02.\u003c/p>\n\u003ch3 id=\"cd-19-the-sign-decks-against-a-d20-short-days-and-long-days\">Short days and long days\u003c/h3>\n\u003cp>Edge in points, with fifth-edition attack damage compared with a d20. The highest weariness reached by the end of a long day is in brackets; nobody collapses, even on a long day.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Short day (25 checks)\u003c/th>\n\u003cth>Standard day (50 checks)\u003c/th>\n\u003cth>Long day (80 checks)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aries\u003c/td>\n\u003ctd>45\u003c/td>\n\u003ctd>+1.1 · 109%\u003c/td>\n\u003ctd>0.0 · 99%\u003c/td>\n\u003ctd>−1.3 · 86% (Weary 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leo\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>+1.0 · 109%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.2 · 88% (Weary 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sagittarius\u003c/td>\n\u003ctd>51\u003c/td>\n\u003ctd>+0.9 · 107%\u003c/td>\n\u003ctd>0.0 · 98%\u003c/td>\n\u003ctd>−1.1 · 88% (Weary 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Libra\u003c/td>\n\u003ctd>55\u003c/td>\n\u003ctd>+0.9 · 106%\u003c/td>\n\u003ctd>0.0 · 98%\u003c/td>\n\u003ctd>−1.0 · 89% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aquarius\u003c/td>\n\u003ctd>59\u003c/td>\n\u003ctd>+0.8 · 111%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.0 · 89% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gemini\u003c/td>\n\u003ctd>63\u003c/td>\n\u003ctd>+0.7 · 109%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−0.9 · 90% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancer\u003c/td>\n\u003ctd>67\u003c/td>\n\u003ctd>+0.6 · 107%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−0.8 · 91% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scorpio\u003c/td>\n\u003ctd>71\u003c/td>\n\u003ctd>+0.5 · 108%\u003c/td>\n\u003ctd>0.0 · 102%\u003c/td>\n\u003ctd>−0.7 · 93% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pisces\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>+0.5 · 103%\u003c/td>\n\u003ctd>0.0 · 98%\u003c/td>\n\u003ctd>−0.7 · 91% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Capricorn\u003c/td>\n\u003ctd>80\u003c/td>\n\u003ctd>+0.4 · 102%\u003c/td>\n\u003ctd>0.0 · 99%\u003c/td>\n\u003ctd>−0.6 · 92% (Weary 1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Taurus\u003c/td>\n\u003ctd>85\u003c/td>\n\u003ctd>+0.2 · 103%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−0.7 · 93% (Weary 1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Virgo\u003c/td>\n\u003ctd>90\u003c/td>\n\u003ctd>+0.2 · 100%\u003c/td>\n\u003ctd>0.0 · 98%\u003c/td>\n\u003ctd>−0.7 · 92% (Weary 1)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"cd-19-the-sign-decks-against-a-d20-through-the-day\">Through the day\u003c/h3>\n\u003cp>Edge in the first and last quarters of a standard day: Fire +0.9 to +1.2 early and −1.1 to −1.4 late, Air +0.7 to +0.9 and −1.1 to −1.3, Water +0.5 to +0.6 and −1.3 to −1.4, Earth +0.2 to +0.4 and −0.4 to −1.0.\u003c/p>\n"},{"id":"cd-20-checks-and-luck-against-a-d20","title":"20. Checks and luck against a d20","html":"\u003ch2 id=\"cd-20-checks-and-luck-against-a-d20-20-checks-and-luck-against-a-d20\">20. Checks and luck against a d20\u003c/h2>\n\u003ch3 id=\"cd-20-checks-and-luck-against-a-d20-the-fate-deck\">The Fate Deck\u003c/h3>\n\u003cp>Average card total 10.49; a Sun and an Eclipse each come up on 5.8% of checks (d20 5%). Monster attacks deal 98.5% of a d20&#39;s damage in fifth edition and 100.7 to 101.5% in 3.5, and monsters take 99.9% of a d20&#39;s damage on saves. At every number needed it stays within 7.4 percentage points of a d20; long shots land a little more often (needing a 20, 9% instead of 5%). The face cards change none of this, so the numbers hold with wild magic or without.\u003c/p>\n\u003ch3 id=\"cd-20-checks-and-luck-against-a-d20-plain-rolls\">Plain rolls\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>d20 roll needed\u003c/th>\n\u003cth>Card needed\u003c/th>\n\u003cth>Chance\u003c/th>\n\u003cth>d20\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>2–3\u003c/td>\n\u003ctd>Any number card\u003c/td>\n\u003ctd>97%\u003c/td>\n\u003ctd>95–90%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>2 or higher\u003c/td>\n\u003ctd>80%\u003c/td>\n\u003ctd>85–75%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>3 or higher\u003c/td>\n\u003ctd>68%\u003c/td>\n\u003ctd>70–65%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>4 or higher\u003c/td>\n\u003ctd>56%\u003c/td>\n\u003ctd>60–55%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>The number − 6 (5 for 11, up to 10 for 16)\u003c/td>\n\u003ctd>51%, 46%, 41%, 35%, 28%, 21%\u003c/td>\n\u003ctd>50%, 45%, 40%, 35%, 30%, 25%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>21%\u003c/td>\n\u003ctd>20%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>Sun\u003c/td>\n\u003ctd>3%\u003c/td>\n\u003ctd>15–5%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Death saving throws\u003c/strong> succeed 56% of the time, against a d20&#39;s 55%, and a Sun and an Eclipse each come up 3% of the time, against 5%. A character who gets no help dies 39% of the time, against 41% with a d20.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"cd-20-checks-and-luck-against-a-d20-advantage-and-disadvantage\">Advantage and disadvantage\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Card advantage is a little weaker than rolling twice.\u003c/strong> Drawing 3 and keeping the best pair adds 18 to 22 percentage points of success at typical numbers needed (5 to 16) for the main setups&#39; starter decks, against 22 for two d20s.\u003c/li>\n\u003cli>\u003cstrong>Crits under advantage\u003c/strong> come up on 6 to 11% of advantaged attacks, against 9.75% for two d20s.\u003c/li>\n\u003cli>\u003cstrong>Each use costs an extra card,\u003c/strong> and advantage is common in fifth edition, so decks run out sooner than the standard day assumes.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"cd-20-checks-and-luck-against-a-d20-cards-per-check\">Cards per check\u003c/h3>\n\u003cp>A check averages 2 − (Jokers ÷ deck size) cards over a day: 1.93 to 1.98 for the sign decks.\u003c/p>\n"},{"id":"cd-21-the-damage-deck-against-dice","title":"21. The damage deck against dice","html":"\u003ch2 id=\"cd-21-the-damage-deck-against-dice-21-the-damage-deck-against-dice\">21. The damage deck against dice\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Exact averages.\u003c/strong> Without Jokers, every row of the die table in chapter 10 has exactly the die&#39;s average (d4 2.5, d6 3.5, d8 4.5, d10 5.5, d12 6.5). Spreads are close to real dice: d4 1.02 (die 1.12), d6 1.50 (1.71), d8 2.58 (2.29), d10 2.87 (2.87), d12 2.87 (3.45). The d12 can&#39;t show a 1 or a 12, but its average is exact.\u003c/li>\n\u003cli>\u003cstrong>Jokers add a little.\u003c/strong> Each damage card is a Joker about 1 time in 21. The players&#39; rule adds 3–4% to a die&#39;s average, and the monsters&#39; rule 8–9%:\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Die\u003c/th>\n\u003cth>No Joker\u003c/th>\n\u003cth>Player (max)\u003c/th>\n\u003cth>Monster (max + another die)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>d4\u003c/td>\n\u003ctd>2.50\u003c/td>\n\u003ctd>2.57\u003c/td>\n\u003ctd>2.70\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d6\u003c/td>\n\u003ctd>3.50\u003c/td>\n\u003ctd>3.62\u003c/td>\n\u003ctd>3.80\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d8\u003c/td>\n\u003ctd>4.50\u003c/td>\n\u003ctd>4.67\u003c/td>\n\u003ctd>4.90\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d10\u003c/td>\n\u003ctd>5.50\u003c/td>\n\u003ctd>5.71\u003c/td>\n\u003ctd>6.00\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d12\u003c/td>\n\u003ctd>6.50\u003c/td>\n\u003ctd>6.76\u003c/td>\n\u003ctd>7.10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Bigger attacks see more Jokers:\u003c/strong> 9% of 2-die rolls, 25% of 6-die rolls, 44% of 12-die rolls and 62% of 20-die rolls. For monsters those Jokers chain into extra dice, so the biggest monster attacks are where the damage deck bites hardest.\u003c/li>\n\u003cli>\u003cstrong>Big pools.\u003c/strong> Under the house rule in chapter 10, 20d6 swings about ±3 instead of ±8.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-22-how-sure-the-build-table-is","title":"22. How sure the build table is","html":"\u003ch2 id=\"cd-22-how-sure-the-build-table-is-22-how-sure-the-build-table-is\">22. How sure the build table is\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Every starter deck passes the Lab test,\u003c/strong> in both games, with its own Joker setup.\u003c/li>\n\u003cli>\u003cstrong>A deck built inside the ranges is balanced\u003c/strong> almost every time, and the rare miss sits only a few tenths of a percentage point outside the balance limits. The Deck Lab gives the exact answer for any deck.\u003c/li>\n\u003cli>\u003cstrong>The ranges are a safe zone, not the whole balanced region.\u003c/strong> A deck a little outside its row can still pass the Lab test.\u003c/li>\n\u003cli>\u003cstrong>The copy limit is part of what makes the ranges reliable.\u003c/strong> Decks piled onto a few values land on the same totals over and over and fall outside the balance limits in ways swing points and lean don&#39;t predict.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"cd-22-how-sure-the-build-table-is-the-starter-decks\">The starter decks\u003c/h3>\n\u003cp>How often each starter deck in 12.5 draws a natural 20 and a natural 1 (a d20: 5% each), and its damage over a standard day, compared with a d20&#39;s. The 3.5 figure is the range across the three weapon types.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Natural 20 / 1\u003c/th>\n\u003cth>Fifth-edition attack damage\u003c/th>\n\u003cth>3.5 attack damage\u003c/th>\n\u003cth>Save damage taken\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>4.3% / 8.7%\u003c/td>\n\u003ctd>102.1%\u003c/td>\n\u003ctd>101.2–101.6%\u003c/td>\n\u003ctd>98.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>4.4% / 4.4%\u003c/td>\n\u003ctd>100.0%\u003c/td>\n\u003ctd>99.4–99.7%\u003c/td>\n\u003ctd>98.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>4.4% / 0%\u003c/td>\n\u003ctd>98.7%\u003c/td>\n\u003ctd>99.3–99.6%\u003c/td>\n\u003ctd>99.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>3.9% / 7.8%\u003c/td>\n\u003ctd>100.5%\u003c/td>\n\u003ctd>100.8–101.6%\u003c/td>\n\u003ctd>98.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>7.8% / 3.9%\u003c/td>\n\u003ctd>100.4%\u003c/td>\n\u003ctd>99.9–102.3%\u003c/td>\n\u003ctd>97.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>4.0% / 4.0%\u003c/td>\n\u003ctd>98.8%\u003c/td>\n\u003ctd>97.9–98.6%\u003c/td>\n\u003ctd>98.9%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>7.1% / 3.6%\u003c/td>\n\u003ctd>101.0%\u003c/td>\n\u003ctd>99.8–101.7%\u003c/td>\n\u003ctd>98.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>3.6% / 7.1%\u003c/td>\n\u003ctd>99.5%\u003c/td>\n\u003ctd>98.1–99.1%\u003c/td>\n\u003ctd>98.7%\u003c/ \n\u003ctd>2 / 2\u003c/td>\n\u003ctd>4.4% / 4.4%\u003c/td>\n\u003ctd>98.4%\u003c/td>\n\u003ctd>98.7–99.1%\u003c/td>\n\u003ctd>99.3%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The worked example in 12.7 deals 100.2% of a d20&#39;s attack damage in fifth edition and 99.0–99.3% in 3.5, takes 98.5% on saves, and has a day edge of −0.02; the deck after its step 2 deals only 95.9–96.2% in 3.5.\u003c/p>\n"},{"id":"cd-23-wild-magic-odds","title":"23. Wild magic odds","html":"\u003ch2 id=\"cd-23-wild-magic-odds-23-wild-magic-odds\">23. Wild magic odds\u003c/h2>\n\u003cp>With the optional wild magic rule (chapter 13), wild magic goes off when the fourth set of face cards is complete: about every 48 Fate Deck checks, roughly once per encounter.\u003c/p>\n\u003ch3 id=\"cd-23-wild-magic-odds-odds-of-each-result\">Odds of each result\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Net\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Combinations\u003c/th>\n\u003cth>Chance\u003c/th>\n\u003cth>About 1 in\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>+4\u003c/td>\n\u003ctd>Good 4 (extreme)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0.06%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>+3\u003c/td>\n\u003ctd>Good 3 (major)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>1.87%\u003c/td>\n\u003ctd>53\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>+2\u003c/td>\n\u003ctd>Good 2 (moderate)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>4.91%\u003c/td>\n\u003ctd>20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>+1\u003c/td>\n\u003ctd>Good 1 (minor)\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>28.05%\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>30.22%\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−1\u003c/td>\n\u003ctd>Bad 1 (minor)\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>28.05%\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−2\u003c/td>\n\u003ctd>Bad 2 (moderate)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>4.91%\u003c/td>\n\u003ctd>20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−3\u003c/td>\n\u003ctd>Bad 3 (major)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>1.87%\u003c/td>\n\u003ctd>53\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−4\u003c/td>\n\u003ctd>Bad 4 (extreme)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0.06%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Good and bad are evenly matched: swapping ♥ for ♠ and ♦ for ♣ turns every good combination into a bad one with the same odds.\u003c/p>\n\u003ch3 id=\"cd-23-wild-magic-odds-odds-of-each-combination\">Odds of each combination\u003c/h3>\n\u003cp>A combination&#39;s chance depends only on the shape of its four sets, so the 93 fall into nine groups:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Chance\u003c/th>\n\u003cth>About 1 in\u003c/th>\n\u003cth>Combinations\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>8.4156%\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>#58 (four three-suit sets, each missing a different suit)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#12, #13, #30–35, #50–57, #75–80, #85, #86\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#16–29, #61–74\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>#41–49\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#4–7, #14, #15, #59, #60, #89–92\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.2338%\u003c/td>\n\u003ctd>428\u003c/td>\n\u003ctd>#2, #3, #87, #88\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.1753%\u003c/td>\n\u003ctd>570\u003c/td>\n\u003ctd>#8–11, #81–84\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.0584%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003ctd>#1, #37–40, #93\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.0065%\u003c/td>\n\u003ctd>15,400\u003c/td>\n\u003ctd>#36 (four one-suit sets)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"cd-appendix-a-quick-reference-what-the-system-replaces","title":"Appendix A. Quick reference: what the system replaces","html":"\u003ch2 id=\"cd-appendix-a-quick-reference-what-the-system-replaces-appendix-a-quick-reference-what-the-system-replaces\">Appendix A. Quick reference: what the system replaces\u003c/h2>\n\u003cp>Every dice mechanic in a d20 Classic game has a card rule. Where each one is handled:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Mechanic\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003cth>Where\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The d20 roll, natural 20 / 1\u003c/td>\n\u003ctd>Two cards added one at a time; the Sun (the colored Joker) = natural 20, the Eclipse (the black Joker) = natural 1\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical hits and threat ranges\u003c/td>\n\u003ctd>Only the Sun crits; a wider range means more dice (fifth edition) or a bigger multiplier (3.5)\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Saving throws, ability and skill checks\u003c/td>\n\u003ctd>Two cards; natural results as the game says\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Take 10 / Take 20\u003c/td>\n\u003ctd>No draw\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Secret checks\u003c/td>\n\u003ctd>The GM draws face-down from the Fate Deck and adds the player&#39;s modifier\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pass-or-fail rolls with no modifier, death saving throws\u003c/td>\n\u003ctd>One Fate Deck card against a threshold\u003c/td>\n\u003ctd>Chapter 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Advantage and disadvantage\u003c/td>\n\u003ctd>Draw 3 cards, keep the best or worst pair\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rerolls, Heroic Inspiration and luck\u003c/td>\n\u003ctd>Draw a third card: keep your most recent card (&quot;use the new roll&quot;) or the best pair (&quot;choose either roll&quot;)\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Extra dice on a check\u003c/td>\n\u003ctd>One damage card per die\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rolls made ahead and used later\u003c/td>\n\u003ctd>Held draws, set aside face-up\u003c/td>\n\u003ctd>Chapter 7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Companion, familiar and summon checks\u003c/td>\n\u003ctd>The Fate Deck; a creature that acts through its controller draws from the controller&#39;s deck\u003c/td>\n\u003ctd>Chapter 8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Monster checks\u003c/td>\n\u003ctd>The Fate Deck\u003c/td>\n\u003ctd>Chapter 9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Damage and healing dice\u003c/td>\n\u003ctd>One card per die from the damage deck, read on a table with exact averages; big-pools house rule\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical damage\u003c/td>\n\u003ctd>Dice drawn twice (fifth edition) or damage drawn once per multiplier (3.5)\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Random durations, d20 tables, d100 (d%) and miss chances\u003c/td>\n\u003ctd>Damage-deck cards (d20 = card + 10 if red; d100 = two cards)\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Running out of cards\u003c/td>\n\u003ctd>A deck-out forces a reshuffle and costs a level of weariness (player decks only)\u003c/td>\n\u003ctd>Chapter 4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Wild magic (optional)\u003c/td>\n\u003ctd>Face cards from the Fate Deck fill four sets; their suits pick one of 93 effects\u003c/td>\n\u003ctd>Chapter 13\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"cd-appendix-b-glossary","title":"Appendix B. Glossary","html":"\u003ch2 id=\"cd-appendix-b-glossary-appendix-b-glossary\">Appendix B. Glossary\u003c/h2>\n\u003cp>Every term the card engine adds to your game, with where it&#39;s explained.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Allowed average:\u003c/strong> the average card total a deck may have for its size and Jokers: 10.5 + 2 × its average weariness level over a standard day (chapter 16).\u003c/li>\n\u003cli>\u003cstrong>Attack damage:\u003c/strong> a deck&#39;s damage on attacks over a standard day, compared with a d20&#39;s (chapter 16).\u003c/li>\n\u003cli>\u003cstrong>Balanced:\u003c/strong> a deck whose day edge is within ±0.1, and whose attack damage (in fifth edition, and in 3.5) and damage taken on saves each land within 97–103% of a d20&#39;s over a standard day. Those spans are the \u003cstrong>balance limits\u003c/strong> (chapter 16).\u003c/li>\n\u003cli>\u003cstrong>Best pair, worst pair:\u003c/strong> of three cards, the two with the highest or lowest card total (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Build table:\u003c/strong> the table of deck sizes and Joker setups, with each row&#39;s pip total, swing range, lean range, copy limit and starter deck (12.5).\u003c/li>\n\u003cli>\u003cstrong>Burn:\u003c/strong> discard a card unused. Casting costs burn cards (chapter 3).\u003c/li>\n\u003cli>\u003cstrong>Card total:\u003c/strong> the sum of a check&#39;s two cards, 2 to 20. It replaces the d20 roll; add your modifier as usual (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Casting cost:\u003c/strong> the cards a spell burns: 1 for a cantrip, 2 for any other spell (chapter 3).\u003c/li>\n\u003cli>\u003cstrong>Collapse:\u003c/strong> reaching Weary 4. You fall unconscious (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Combination:\u003c/strong> one of wild magic&#39;s 93 suit patterns, numbered #1 to #93. Its text is its effect; its tier (Good 2, Mixed and so on) is its result (chapter 13).\u003c/li>\n\u003cli>\u003cstrong>Copy limit:\u003c/strong> the most copies of any one value a deck may hold, a third of its number cards (12.5).\u003c/li>\n\u003cli>\u003cstrong>Custom deck:\u003c/strong> a player deck you build yourself (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Damage deck, damage card:\u003c/strong> the shared 42-card deck used for damage and other dice, and a card drawn from it (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Deck code:\u003c/strong> a deck&#39;s makeup, written as the counts of Ace, 2, 3 … 10, then Suns / Eclipses (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Deck Lab:\u003c/strong> the Star-Sign Deck Lab, the web tool that builds decks and runs the Lab test.\u003c/li>\n\u003cli>\u003cstrong>Deck-out:\u003c/strong> drawing the last card of your deck. It forces a reshuffle and gives you a level of weariness (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Destined:\u003c/strong> the character whose action completed the fourth set of face cards. Wild magic centers on them (chapter 13).\u003c/li>\n\u003cli>\u003cstrong>Die table:\u003c/strong> the table that reads a damage card as a d4, d6, d8, d10 or d12 (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Eclipse:\u003c/strong> the black Joker, a natural 1 (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Edge, day edge:\u003c/strong> how far a deck&#39;s average card total sits above 10.5 once its weariness penalty is counted. Day edge is the edge over a standard day (chapter 16).\u003c/li>\n\u003cli>\u003cstrong>Element:\u003c/strong> Fire, Air, Water or Earth. It sets a sign deck&#39;s size (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Face card:\u003c/strong> a Jack, Queen or King. Only the Fate Deck holds them, and only when you play with wild magic, which they feed (chapters 9 and 13).\u003c/li>\n\u003cli>\u003cstrong>Fate Deck:\u003c/strong> the GM&#39;s deck, 100 cards (112 with wild magic), for monsters, companions, plain rolls and secret checks (chapter 9).\u003c/li>\n\u003cli>\u003cstrong>Flip:\u003c/strong> replace a card with its mirror, using the pip dial (12.6).\u003c/li>\n\u003cli>\u003cstrong>Fresh shuffle:\u003c/strong> your whole deck, shuffled at the start of each day (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Held draw:\u003c/strong> cards drawn now, set aside face-up and used later in place of a draw (chapter 7).\u003c/li>\n\u003cli>\u003cstrong>Joker:\u003c/strong> a Sun or an Eclipse.\u003c/li>\n\u003cli>\u003cstrong>Joker setup:\u003c/strong> a deck&#39;s Suns and Eclipses, written Suns / Eclipses, such as 1 / 0 (12.2).\u003c/li>\n\u003cli>\u003cstrong>Lab test:\u003c/strong> the Deck Lab&#39;s exact test of whether a deck is balanced.\u003c/li>\n\u003cli>\u003cstrong>Lean, lean range:\u003c/strong> the swing points of a deck&#39;s 7s to 10s minus those of its Aces to 4s, and the range each build-table row allows (12.4).\u003c/li>\n\u003cli>\u003cstrong>Long day, short day:\u003c/strong> 80 and 25 checks, used to see how decks play away from the standard day (chapter 19).\u003c/li>\n\u003cli>\u003cstrong>Main setup:\u003c/strong> the first Joker setup listed for each size: one Sun at 45 and 50 cards, two from 55 to 90 (12.2).\u003c/li>\n\u003cli>\u003cstrong>Mirror:\u003c/strong> a card&#39;s partner the same distance from the middle: Ace and 10, 2 and 9, 3 and 8, 4 and 7, 5 and 6 (12.6).\u003c/li>\n\u003cli>\u003cstrong>Modality:\u003c/strong> Cardinal, Fixed or Mutable. It sets how swingy a sign deck is (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Most recent card:\u003c/strong> the card a &quot;use the new roll&quot; reroll keeps (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Multiplier on a Sun:\u003c/strong> in 3.5, the crit multiplier a weapon gets on a Sun: 1 + (numbers in the threat range) × (multiplier − 1) (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Natural 20, natural 1:\u003c/strong> a Sun or an Eclipse. A card total of 20 is not a natural 20 (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>New check:\u003c/strong> a brand-new two-card check, drawn in place of an old one (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Number card:\u003c/strong> Ace to 10. Aces count as 1.\u003c/li>\n\u003cli>\u003cstrong>Number needed:\u003c/strong> the card total a check needs to succeed, once modifiers are counted.\u003c/li>\n\u003cli>\u003cstrong>Opposite:\u003c/strong> the combination you get by swapping ♥ for ♠ and ♦ for ♣. It has the same odds, and every bad combination is the opposite of a good one (chapter 13).\u003c/li>\n\u003cli>\u003cstrong>Pip, pip total:\u003c/strong> a number card&#39;s value (Ace = 1), and the sum of a deck&#39;s number cards, which sets its average (12.5).\u003c/li>\n\u003cli>\u003cstrong>Pip dial, swing dial:\u003c/strong> the two ways to adjust a deck. The pip dial flips a card to its mirror and changes the pip total and the lean; the swing dial pushes a card and its mirror apart or pulls them together and changes the swing points (12.6).\u003c/li>\n\u003cli>\u003cstrong>Plain roll:\u003c/strong> a pass-or-fail roll with no modifier, made with one Fate Deck card (chapter 5).\u003c/li>\n\u003cli>\u003cstrong>Set:\u003c/strong> three face cards placed together. Wild magic goes off when the fourth set is complete (chapter 13).\u003c/li>\n\u003cli>\u003cstrong>Shape:\u003c/strong> how often a deck lands on each card total. \u003cstrong>Steady\u003c/strong> decks bunch near the middle; \u003cstrong>swingy\u003c/strong> decks spread toward the ends (chapter 17).\u003c/li>\n\u003cli>\u003cstrong>Sign deck:\u003c/strong> one of the twelve star-sign decks (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Standard day:\u003c/strong> the day all balance is measured over: 50 checks across 3–4 encounters and exploration (chapter 16).\u003c/li>\n\u003cli>\u003cstrong>Standard pack:\u003c/strong> 52 cards plus its Jokers, usually one colored and one black.\u003c/li>\n\u003cli>\u003cstrong>Starter deck:\u003c/strong> the ready-made deck in each row of the build table (12.5).\u003c/li>\n\u003cli>\u003cstrong>Sun:\u003c/strong> the colored Joker, a natural 20. Only the Sun crits (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Surge level, surge DC:\u003c/strong> wild magic&#39;s level (half the Destined&#39;s level, rounded up, at most 9) and DC (a typical spell save DC for the Destined&#39;s level) (chapter 13).\u003c/li>\n\u003cli>\u003cstrong>Swing points, swing range:\u003c/strong> a score for how far a deck&#39;s cards sit from the middle (Ace and 10 score 10, down to 0 for 5 and 6), and the range each build-table row allows (12.3).\u003c/li>\n\u003cli>\u003cstrong>Weariness, Weary 1–4:\u003c/strong> the card engine&#39;s own track: −2 per level to your checks, −1 to AC and saving throws at Weary 3, collapse at Weary 4 (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Wild magic:\u003c/strong> the optional rule whose effects go off when the Fate Deck&#39;s face cards fill four sets (chapter 13).\u003c/li>\n\u003c/ul>\n"},{"id":"cd-appendix-c-licenses","title":"Appendix C. Licenses","html":"\u003ch2 id=\"cd-appendix-c-licenses-appendix-c-licenses\">Appendix C. Licenses\u003c/h2>\n\u003cp>\u003cem>Core Engine: d20 Classic\u003c/em> © 2026 Different Games. It&#39;s an independent product, not published, endorsed or approved by the publishers of the games it works with.\u003c/p>\n\u003ch3 id=\"cd-appendix-c-licenses-system-reference-document-5-2-1\">System Reference Document 5.2.1\u003c/h3>\n\u003cp>This work includes material from the System Reference Document 5.2.1 (&quot;SRD 5.2.1&quot;) by Wizards of the Coast LLC, available at \u003ca href=\"https://www.dndbeyond.com/srd\">https://www.dndbeyond.com/srd\u003c/a>. The SRD 5.2.1 is licensed under the Creative Commons Attribution 4.0 International License, available at \u003ca href=\"https://creativecommons.org/licenses/by/4.0/legalcode\">https://creativecommons.org/licenses/by/4.0/legalcode\u003c/a>.\u003c/p>\n\u003cp>Compatible with fifth edition.\u003c/p>\n\u003ch3 id=\"cd-appendix-c-licenses-3-5\">3.5\u003c/h3>\n\u003cp>The 3.5 rules are referred to by their game mechanics only. No rules text is reproduced from any game, and no material released under the Open Game License is used.\u003c/p>\n"}]}}}</script>

// Sign abilities: price in pips = max(1, round(a·S² + b·S + c)) for a deck of S cards
const ABIL = {
  aries:{name:"First Blood", sign:"Aries", freq:"Once per encounter", text:"Your first Strike in each encounter is a fortune check: draw 3 cards and keep the best pair.", coef:[-0.00175613526, 0.3877364582, -7.518095266]},
  leo:{name:"Crowned", sign:"Leo", freq:"Once per day", text:"When you draw a Sun, you can keep it instead: set it aside face-up and draw a replacement card for that check. Later, play it as your draw for any attack roll; it counts as a natural 20.", coef:[-0.0003678920891, 0.1370565997, 0.3616126281]},
  sagittarius:{name:"Loose Arrow", sign:"Sagittarius", freq:"Once per encounter", text:"After drawing the first card of an attack roll, you can discard it and draw a new first card.", coef:[-0.0008139478923, 0.2726371997, -3.584717306]},

  scorpio:{name:"Sting", sign:"Scorpio", freq:"Once per day", text:"When you draw an Eclipse, you can keep it instead: set it aside face-up and draw a replacement card for that check. Later, play it before the GM draws for an enemy's check; that check is a natural 1.", coef:[-0.0002558802782, 0.1595330172, 7.502026697]},

/* ---------- draw math ---------- */
function analyse(c, R, B){
  const nums = c.reduce((a,x)=>a+x,0);
  const N = nums + R + B;
  const tot = N*(N-1);
  if (N < 2) return null;
  const res = new Array(21).fill(0);
  for (let a=1;a<=10;a++){ const ca=c[a-1]; if(!ca) continue;
    for (let b=1;b<=10;b++){ const w = ca*(c[b-1] - (a===b?1:0)); if (w>0) res[a+b]+=w; } }
  for (let i=0;i<21;i++) res[i]/=tot;
  const pR = (R*(N-1) + nums*R)/tot, pB = (B*(N-1) + nums*B)/tot;   // Joker on card 1, or card 2 after a number
  const full = res.slice(); full[20]+=pR; full[1]+=pB;
  let mean=0; for (let r=1;r<=20;r++) mean+=r*full[r];
  let v=0; for (let r=1;r<=20;r++) v+=(r-mean)**2*full[r];
  const surv = new Array(22).fill(0);
  for (let n=20;n>=1;n--) surv[n]=surv[n+1]+full[n];
  const deg = need => {
    const f = r => r>=need+10?3 : r>=need?2 : r<=need-10?0 : 1;
    const out=[0,0,0,0];
    for (let r=2;r<=20;r++) out[f(r)]+=res[r];
    out[Math.min(3,f(20)+1)]+=pR; out[Math.max(0,f(1)-1)]+=pB;
    return out;
  };
  const q = (R+B)/N;   // chance a check stops after one card
  const ge = new Array(22).fill(0); for (let n=20;n>=2;n--) ge[n] = ge[n+1] + res[n];   // P(two number cards total n or more)
  return {nums, N, res, full, pR, pB, mean, sd:Math.sqrt(v), surv, deg, q, cpc:2-q, ge};
}
function d20deg(need){
  const out=[0,0,0,0];
  for (let r=1;r<=20;r++){ let d = r>=need+10?3 : r>=need?2 : r<=need-10?0 : 1;
    if (r===20) d=Math.min(3,d+1); if (r===1) d=Math.max(0,d-1); out[d]+=0.05; }
  return out;
}
function degF(A, x){   // degrees at a fractional need, interpolated between whole numbers (for an ability's price added back)
  const lo = Math.floor(x + 1e-9), f = x - lo;
  if (f < 1e-9) return A.deg(lo);
  const a = A.deg(lo), b = A.deg(lo+1); return a.map((v,i)=>(1-f)*v + f*b[i]);
}
const strike = p => p[2] + 2*p[3];
const taken  = p => 2*p[0] + p[1] + 0.5*p[2];
const D20_OFF = {}, D20_DEF = {};
for (let n=5;n<=11;n++){ let s=0; for (const k of [0,5,10]) s+=strike(d20deg(n+k)); D20_OFF[n]=s; }
for (let n=5;n<=15;n++) D20_DEF[n]=taken(d20deg(n));
function combat(A, shift){   // shift = exhaustion penalty in points, minus any ability bonus
  let off=0; for (let n=5;n<=11;n++){ let a=0; for (const k of [0,5,10]) a+=strike(degF(A, n+k+shift)); off+=a/D20_OFF[n]; }
  let def=0; for (let n=5;n<=15;n++) def+=taken(degF(A, n+shift))/D20_DEF[n];
  let succ=0; for (let n=2;n<=20;n++){ const p=degF(A, n+shift); succ+=p[2]+p[3]; }
  return {off:off/7, def:def/11, succ:succ/19};
}

/* ---------- exhaustion math ---------- */
// Before check i (1-based), i-1 checks have been made; K of them stopped after one card (K ~ Binomial(i-1, q)).
// Cards used = 2(i-1) - K; level = floor((o + cards) / S), with o the starting position when the deck carries over.
function binom(n, q){
  const out = new Array(n+1).fill(0);
  if (q<=0){ out[0]=1; return out; }
  let p = Math.pow(1-q, n); out[0]=p;
  for (let k=0;k<n;k++){ p = p*(n-k)/(k+1)*q/(1-q); out[k+1]=p; }
  return out;
}
function levelDist(S, i, q, carry, unyielding){        // Map level -> probability during check i
  const w = new Map(), pk = binom(i-1, q), offs = carry ? S : 1;
  for (let o=0;o<offs;o++) for (let k=0;k<pk.length;k++){ if (pk[k]<1e-9) continue;
    let L = Math.floor((o + 2*(i-1) - k)/S); if (unyielding) L = Math.max(0, L-1);   // Unyielding: the day's first deck-out gives no level
    L = Math.min(3, L); w.set(L,(w.get(L)||0) + pk[k]/offs); }   // Exhausted 4 is a collapse; you draw again only after waking at 3
  return w;
}
function expectedLevels(S, checks, carry, q, unyielding){
  const out = [];
  for (let i=1;i<=checks;i++){ let e=0; for (const [L,x] of levelDist(S,i,q,carry,unyielding)) e+=L*x; out.push(e); }
  return out;
}
function levelWeights(S, C, carry, q, unyielding){
  const w = new Map();
  for (let i=1;i<=C;i++) for (const [L,x] of levelDist(S,i,q,carry,unyielding)) w.set(L,(w.get(L)||0)+x/C);
  return w;
}
const strike3 = p => p[2] + 3*p[3];      // fatal weapons: a crit is worth about three hits
const D20_OFF3 = {}; for (let n=5;n<=11;n++){ let s=0; for (const k of [0,5,10]) s+=strike3(d20deg(n+k)); D20_OFF3[n]=s; }
function dayMetrics(A, S, ab, set){   // ab = {bonus, unyielding}: the ability counted at its price, or Unyielding played out; set = rules (default: the page's)
  set = set || state;
  const bonus = ab ? ab.bonus : 0, uny = ab ? ab.unyielding : false;
  const w = levelWeights(S, set.cpd, set.rest==='carry', A.q, uny);
  let Lbar=0, off=0, def=0, off3=0;
  for (const [L,x] of w){ Lbar+=L*x; const sh=set.pen*L - bonus, m=combat(A, sh); off+=x*m.off; def+=x*m.def;
    let a3=0; for (let n=5;n<=11;n++){ let t=0; for (const k of [0,5,10]) t+=strike3(degF(A, n+k+sh)); a3+=t/D20_OFF3[n]; } off3+=x*a3/7; }
  const target = 10.5 + set.pen*Lbar;
  return {Lbar, off, def, off3, target, edge:A.mean + bonus - target};
}
function abilityOf(key, A, S){   // how the Lab counts an ability: its price as a bonus on every check, or Unyielding played out
  if (!ABIL[key] || !A) return {key:'none', price:0, bonus:0, unyielding:false};
  const price = priceOf(key, S), uny = key==='taurus';
  return {key, price, unyielding:uny, bonus: uny || A.nums<2 ? 0 : price*2*(A.nums-1)/(A.N*(A.N-1))};
}
/* ---------- Classic d20: fifth edition and 3.5 ---------- */
// Only the Sun crits. 5th edition: a crit doubles the dice, worth about 1.6 hits; saves are plain totals, half damage on a save.
// 3.5: three attacks at 0/-5/-10; only the Sun threatens, with the weapon's range turned into a bigger multiplier,
// confirmed by a second hit; on saves a Sun always succeeds and an Eclipse always fails.
const C5 = 1.6, P1W = [[20,3],[19,2],[18,2]];
const geAt = (A, n) => n<=2 ? A.ge[2] : n>20 ? 0 : A.ge[n];
const geF = (A, x) => { const lo = Math.floor(x+1e-9), f = x-lo; return f<1e-9 ? geAt(A,lo) : (1-f)*geAt(A,lo) + f*geAt(A,lo+1); };
const d20hit = n => { let h=0; for (let r=2;r<=19;r++) if (r>=n) h++; return h/20; };   // faces 2-19 that hit; 1 misses, 20 crits
const E5A_D20 = {}, E5S_D20 = {}, P1S_D20 = {}, P1A_D20 = P1W.map(()=>({}));

es a Wisdom save. Success: it can't take reactions until the end of its next turn. Failure: slowed until the end of its next turn. Fails by 5 or more: slowed for 3 rounds, and it falls prone."],["Echo Selves","Three illusory images of the Destined appear for 1 minute. An attack against the Destined picks at random among the Destined and the remaining images; an image that's hit vanishes."],["Dancing Blade","The Destined's weapon (or a spectral fist dealing 1d6 bludgeoning damage) animates beside them for 3 rounds. At the end of each of the Destined's turns it attacks an enemy within 15 feet of them, drawing from the Fate Deck with the Destined's attack bonus − 2 (3.5: their best attack bonus − 2), and deals the weapon's damage dice with no modifier."],["Whirligig","A chosen enemy makes a Wisdom save (incapacitation). On a failure it spins like a top and is confused until the end of its next turn."],["Critter Curse","A chosen enemy makes a Wisdom save (incapacitation). On a failure it turns into a harmless Tiny animal until the end of its next turn (for 1d4 rounds if it fails by 5 or more): it can move and hide but can't attack, cast spells or use its gear."],["Fortune's Turn","Each ally's next check this encounter has advantage."],["Borrowed Time","Each ally shuffles the top 3 cards of their discard pile back into their deck."],["Ward","Each ally within 30 feet of the Destined gains temporary hit points equal to 3 × the surge level for 1 minute."],["Glimpse","The Destined looks at the top 3 cards of the Fate Deck and puts them back in any order."],["Tattletale Glow","Glittering light outlines every enemy in a 20-foot radius around a point the Destined chooses within 120 feet, for 1 minute: they can't hide, and attacks against them never suffer disadvantage (3.5: a miss chance) for being unseen."],["Stolen Thoughts","For 1 minute the Destined hears a chosen enemy's surface thoughts: at the start of each round, the GM tells them what it plans to do."],["Sticky Nectar" /* The digital decks.
   Player decks, the Fate Deck and the damage deck, with the draw rules of the
   Aces & Eclipses Core Rulebook ("ae") and Core Engine: d20 Classic ("classic"). No DOM here: every function
   takes a plain, JSON-safe state object and changes it. */
const PLAY = (function(){
  const SUITS = ['♠','♥','♦','♣'];
  const RED = s => s==='♥' || s==='♦';
  const RANK = r => r===1 ? 'A' : String(r);
  const isNum = c => typeof c.r === 'number';
  const isFace = c => c.r==='J' || c.r==='Q' || c.r==='K';

  /* ---------- randomness ---------- */
  function rand(n){                       // unbiased integer in [0, n)
    const g = (typeof crypto!=='undefined' && crypto.getRandomValues) ? crypto : null;
    if (!g) return Math.floor(Math.random()*n);
    const buf = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n;
    let x; do { g.getRandomValues(buf); x = buf[0]; } while (x >= lim);
    return x % n;
  }
  function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  /* ---------- building the physical decks ---------- */
  function numberCards(counts){
    const out = [];
    counts.forEach((n,i)=>{ for (let k=0;k<n;k++) out.push({r:i+1, s:SUITS[(k+i)%4]}); });
    return out;
  }
  function jokers(R,B){ const out=[]; for (let i=0;i<R;i++) out.push({r:'S', s:''}); for (let i=0;i<B;i++) out.push({r:'E', s:''}); return out; }
  // The Fate Deck: the same 100 cards in both games, Ace to 10 and Jokers. Wild magic, an optional rule,
  // adds the 12 face cards (112 cards); they never change a check, so the odds are the same either way.
  const FATE_BASE = {c:[17,12,12,5,5,5,6,7,7,18], R:3, B:3};
  const FATE = {ae:FATE_BASE, classic:FATE_BASE};
  const FATE_COUNTS = FATE_BASE.c;
  function faceCards(){ const out = []; for (const s of ['♥','♦','♠','♣']) for (const r of ['J','Q','K']) out.push({r, s}); return out; }
  function fateCards(game, wm){
    const out = numberCards(FATE_BASE.c).concat(jokers(FATE_BASE.R, FATE_BASE.B));
    return wm ? out.concat(faceCards()) : out;
  }
  function damageCards(){ return numberCards([4,4,4,4,4,4,4,4,4,4]).concat(jokers(1,1)); }

  /* ---------- a pile: draw pile + discard pile ---------- */
  function newPile(cards){ return {draw: shuffle(cards.slice()), discard: []}; }

  /* ---------- what a Joker means right now ---------- */
  // Wild magic can change meanings: Day for Night swaps them, Sun Breaks Through
  // turns the next Eclipse into a Sun, Sudden Eclipse the next Sun into an Eclipse.
  function meaning(c, fx){
    if (c.r!=='S' && c.r!=='E') return c.r;
    let m = c.r==='S' ? 'H' : 'L';
    if (fx && fx.dayForNight) m = m==='H' ? 'L' : 'H';
    if (fx && m==='L' && fx.sunBreaks){ fx.sunBreaks = false; fx.used = 'Sun Breaks Through: this Eclipse counts as a Sun.'; m = 'H'; }
    else if (fx && m==='H' && fx.suddenEclipse){ fx.suddenEclipse = false; fx.used = 'Sudden Eclipse: this Sun counts as an Eclipse.'; m = 'L'; }
    return m;
  }

  /* ---------- the draw rules ---------- */
  // mode: 'normal' (two cards, a Joker ends it), 'fortune' (three, keep the best pair),
  // 'misfortune' (three, keep the worst pair). seq holds meanings alongside cards.
  function done(seq, mode){
    const ms = seq.map(x=>x.m);
    if (mode==='normal') return seq.length>=2 || (seq.length===1 && (ms[0]==='H' || ms[0]==='L'));
    if (mode==='fortune') return ms.includes('H') || seq.length>=3;
    if (mode==='misfortune') return ms.includes('L') || seq.length>=3;
    return seq.length>=2;
  }
  function evaluate(seq, mode){
    const ms = seq.map(x=>x.m), idx = seq.map((_,i)=>i);
    const H = idx.filter(i=>ms[i]==='H'), L = idx.filter(i=>ms[i]==='L'), N = idx.filter(i=>typeof ms[i]==='number');
    if (mode==='normal'){
      if (H.length) return {nat:20, keep:[H[0]], total:20};
      if (L.length) return {nat:1, keep:[L[0]], total:1};
      return {nat:null, keep:N.slice(0,2), total:N.reduce((a,i)=>a+ms[i],0)};
    }
    if (mode==='fortune'){
      if (H.length) return {nat:20, keep:[H[0]], total:20};
      if (L.length>=2) return {nat:1, keep:L.slice(0,2), total:1, note:'Two Eclipses can’t both be dropped.'};
      const best = N.slice().sort((a,b)=>ms[b]-ms[a]).slice(0,2).sort((a,b)=>a-b);
      return {nat:null, keep:best, total:best.reduce((a,i)=>a+ms[i],0)};
    }
    // misfortune
    if (L.length) return {nat:1, keep:[L[0]], total:1};
    if (H.length>=2) return {nat:20, keep:H.slice(0,2), total:20, note:'Two Suns can’t both be dropped.'};
    const worst = N.slice().sort((a,b)=>ms[a]-ms[b]).slice(0,2).sort((a,b)=>a-b);
    return {nat:null, keep:worst, total:worst.reduce((a,i)=>a+ms[i],0)};
  }

  /* ---------- player deck state ---------- */
  function newPlayer(deck){
    return {
      v:1, deckId:deck.id, game:deck.game, c:deck.c.slice(), R:deck.R, B:deck.B, ability:deck.ability||'none',
      draw: shuffle(numberCards(deck.c).concat(jokers(deck.R, deck.B))), discard:[], table:null, held:[], kept:[],
      level:0, collapsed:false, deckOuts:0, checks:0, day:1,
      uses:{day:{}, enc:{}}, inEncounter:false, pendingFortune:false,
      hero:1, inspiration:false, fx:{}, pending:null, log:[]
    };
  }
  const allCards = st => numberCards(st.c).concat(jokers(st.R, st.B));
  const penalty = st => 2*st.level;
  const hasAb = (st, key, on) => on && st.game!=='classic' && st.ability===key;

  function log(st, entry){ entry.t = Date.now(); entry.day = st.day; st.log.unshift(entry); if (st.log.length>80) st.log.length = 80; }

  // Before a new action, the cards on the table go to the discard pile, face-down.
  function clearTable(st){
    if (st.table){ st.discard.push(...st.table.cards); st.table = null; }
    if (st.pending){ st.discard.push(...st.pending.seq.map(x=>x.c)); st.pending = null; }
  }
  // The deck-out: drawing the last card forces a reshuffle and a level of exhaustion.
  function deckOut(st, ab, events){
    st.deckOuts++;
    let gained = true;
    if (hasAb(st,'taurus',ab) && !st.uses.day.taurus){ st.uses.day.taurus = true; gained = false; events.push({kind:'unyielding'}); }
    if (gained){ st.level = Math.min(4, st.level+1); if (st.level>=4) st.collapseAfter = true; }
    st.draw = shuffle(st.discard.splice(0));
    if (hasAb(st,'capricorn',ab)) st.pendingFortune = true;
    events.push({kind:'deckout', level:st.level, gained});
  }
  function drawOne(st, ab, events){
    if (!st.draw.length){                     // only when every card is out of the deck
      if (!st.discard.length) return null;
      st.draw = shuffle(st.discard.splice(0));
    }
    const card = st.draw.pop();
    if (!st.draw.length) deckOut(st, ab, events);
    return card;
  }
  function continueSeq(st, seq, mode, ab, events){
    while (!done(seq, mode)){
      const c = drawOne(st, ab, events); if (!c) break;
      seq.push({c, m:meaning(c, st.fx)});
    }
    return seq;
  }
  function finishCollapse(st, events){
    if (st.collapseAfter){ st.collapseAfter = false; st.collapsed = true; events.push({kind:'collapse'}); }
  }

  // Pick the mode after the table's effects: Second Ascent, First Blood, wild magic.
  function effectiveMode(st, want, type, ab, notes){
    let mode = want;
    const fortunes = [], misfortunes = [];
    if (want==='fortune') fortunes.push('fortune');
    if (want==='misfortune') misfortunes.push('misfortune');
    if (st.pendingFortune && hasAb(st,'capricorn',ab)){ st.pendingFortune = false; fortunes.push('Second Ascent'); }
    if (type==='attack' && hasAb(st,'aries',ab) && !st.uses.enc.aries){ st.uses.enc.aries = true; fortunes.push('First Blood'); }
    if (st.fx.nextMode==='fortune'){ fortunes.push('Fortune’s Turn'); st.fx.nextMode = null; }
    else if (st.fx.nextMode==='misfortune'){ misfortunes.push('Ill Fortune'); st.fx.nextMode = null; }
    if (fortunes.length && misfortunes.length){ mode = 'normal'; notes.push(st.game==='classic' ? 'Advantage and disadvantage cancel, so you draw normally.' : 'Fortune and misfortune cancel, so you draw normally.'); }
    else if (fortunes.length){ mode = 'fortune'; const f = fortunes.filter(x=>x!=='fortune'); if (f.length) notes.push(f.join(' and ') + (st.game==='classic' ? ' gives this check advantage.' : ' makes this a fortune check.')); }
    else if (misfortunes.length){ mode = 'misfortune'; const f = misfortunes.filter(x=>x!=='misfortune'); if (f.length) notes.push(f.join(' and ') + (st.game==='classic' ? ' gives this check disadvantage.' : ' makes this a misfortune check.')); }
    return mode;
  }

  function makeResult(st, seq, mode, meta, events, notes){
    const e = evaluate(seq, mode);
    const r = {kind:meta.kind||'check', type:meta.type||'skill', mode, cards:seq.map(x=>x.c), meanings:seq.map(x=>x.m),
      keep:e.keep, nat:e.nat, total:e.total, pen:meta.pen, mod:meta.mod, dc:meta.dc, notes:notes.concat(e.note?[e.note]:[]),
      events, label:meta.label||null};
    if (st.fx.used){ r.notes.push(st.fx.used); st.fx.used = null; }
    return r;
  }

  /* A check. opts: {type, mode, mod, dc, label}. Returns the result (also on st.table). */
  function check(st, opts, ab){
    clearTable(st);
    const events = [], notes = [], pen = penalty(st);
    const type = opts.type || 'skill';
    if (st.fx.nextNat){                      // Crown of Fortune / Crown of Ruin: don't draw
      const nat = st.fx.nextNat; st.fx.nextNat = null;
      const r = {kind:'check', type, mode:'normal', cards:[], meanings:[], keep:[], nat, total:nat, pen, mod:opts.mod, dc:opts.dc,
        notes:[nat===20 ? 'Crown of Fortune: a natural 20, no draw.' : 'Crown of Ruin: a natural 1, no draw.'], events:[], label:opts.label||null};
      st.table = r; st.checks++; log(st, {what:'check', r:summary(r)}); return r;
    }
    // A plain check (drawn from your deck for an ally) ignores your own fortune effects.
    const mode = opts.plain ? 'normal' : effectiveMode(st, opts.mode||'normal', type, ab, notes);
    const seq = [];
    // Loose Arrow: on an attack, stop after the first card so the player can swap it.
    const loose = !opts.plain && type==='attack' && hasAb(st,'sagittarius',ab) && !st.uses.enc.sagittarius;
    if (loose){
      const c = drawOne(st, ab, events);
      if (c){ seq.push({c, m:meaning(c, st.fx)});
        st.pending = {seq, mode, opts, events, notes, pen};
        return {pending:true, first:c, events};
      }
    }
    continueSeq(st, seq, mode, ab, events);
    return finishCheck(st, seq, mode, opts, events, notes, pen);
  }
  function finishCheck(st, seq, mode, opts, events, notes, pen){
    const r = makeResult(st, seq, mode, {kind:opts.kind||'check', type:opts.type, mod:opts.mod, dc:opts.dc, pen, label:opts.label}, events, notes);
    st.table = r; st.checks++;
    finishCollapse(st, events);
    log(st, {what:r.kind, r:summary(r)});
    return r;
  }
  // Loose Arrow decision: swap the first card or keep it, then finish the draw.
  function resolveLoose(st, swap, ab){
    const p = st.pending; if (!p) return null;
    st.pending = null;
    if (swap){
      st.uses.enc.sagittarius = true;
      const old = p.seq.pop().c; st.discard.push(old);
      p.notes.push(`Loose Arrow: you discarded the ${cardName(old)} and drew a new first card.`);
      const c = drawOne(st, ab, p.events); if (c) p.seq.push({c, m:meaning(c, st.fx)});
    }
    continueSeq(st, p.seq, p.mode, ab, p.events);
    return finishCheck(st, p.seq, p.mode, p.opts, p.events, p.notes, p.pen);
  }

  /* Twin Draw (Gemini): two separate checks; the player chooses which one counts. */
  function twin(st, opts, ab){
    clearTable(st);
    const events = [], pen = penalty(st), res = [];
    for (let k=0;k<2;k++){
      const seq = continueSeq(st, [], 'normal', ab, events), e = evaluate(seq, 'normal');
      res.push({kind:'check', type:opts.type||'skill', mode:'normal', cards:seq.map(x=>x.c), meanings:seq.map(x=>x.m), keep:e.keep, nat:e.nat, total:e.total,
        pen, mod:opts.mod, dc:opts.dc, notes:['Twin Draw: you drew two separate checks and chose this one. Both are discarded.'], events:[], label:'Twin Draw'});

  /* Rerolls. how: 'new' (keep your most recent card, pair it with a new one) or 'better' (best pair of three). */

  /* Dream Tide (Pisces): swap one card of a failed check for the top card of your deck, unseen. */

  /* ---------- judging a result ---------- */

      if (r.nat===1){ out.label = 'Miss'; out.good = false; return out; }

      if (r.nat===20){ out.good = true; out.label = 'Success (a Sun always saves)'; return out; }
      if (r.nat===1){ out.good = false; out.label = 'Failure (an Eclipse always fails)'; return out; }

  /* ---------- flat checks and plain rolls (one Fate Deck card) ---------- */
  function flatNeed(dc){

  function fateUpgrade(fs, wm){

}

function draft(){

  return d;
}

function sizeStep(d, k){

function scheduleFixes(){

function payPrice(d){
  const k = L.checkDeck(d.c, d.R, d.B, d.ability);
  const need = k.pips - k.pipTarget; if (need<=0) return need===0 ? 'Already paid.' : 'Your pip total is under the target; flip cards up instead.';
  // Flip from the big end (10 → A first); when flips can't make the price exactly, move a card or two down instead.
  const cap = Math.floor(d.c.reduce((a,x)=>a+x,0)/3), FL = [[9,0,9],[8,1,7],[7,2,5],[6,3,3],[5,4,1]], cands = [];

    const [f,t,pp] = FL[i]; for (let n=Math.min(x[f], Math.floor(left/pp)); n>=0; n--){ const y=x.slice(); y[f]-=n; y[t]+=n; if (y[t]>cap) continue; flips(i+1, left-n*pp, y); } };
  const downs = (x, left, n) => { if (left===0){ cands.push(x); return; } if (n===3 || cands.length>400) return;
    for (let i=9;i>=1;i--) if (x[i]>0) for (let s=Math.min(i,left); s>=1; s--){ const y=x.slice(); y[i]--; y[i-s]++; if (y[i-s]>cap) continue; downs(y, left-s, n+1); } };
  flips(0, need, d.c.slice()); downs(d.c.slice(), need, 0);
  if (!cands.length) return 'Couldn’t pay it with a few card moves; try the fixes in the Lab test.';
  const pass = cands.find(c=>L.checkDeck(c, d.R, d.B, d.ability).pass);
  d.c = (pass || cands[0]).slice();
  return pass ? 'Paid: the pip total now matches, and the deck passes the Lab test.' : 'Paid: the pip total now matches. The Lab test shows what’s left to fix.';
}

/* =====================================================================

const ROOM_ERR = {

  not_granted: 'Live tables aren’t open to you on this page. Everyone at the table needs to be signed in to Claude, with this page shared with them from its Share menu. Someone who opened it from a public link can still play their own deck.',

/* ---------- The hotspot table: the GM's Android phone hosts it; no internet needed. ----------
   The GM's app runs a small server. Android players connect through the app; any other phone
   opens the GM's address in its browser and gets the whole app from the GM's phone. */
const LAN = HOST==='android' || HOST==='lan';
const LAN_PORT = 8765;
const NATIVE = () => window.StarSignNative || null;
let lanSink = null;
window.__lanRecv = function(kind, text){ if (lanSink) lanSink(kind, text); };
function lanTransport(host, port){
  let handler = ()=>{};
  if (HOST==='android'){
    const n = NATIVE();
    const t = {send: x => { try { n.lanSend(x); } catch(e){} }, close: () => { if (lanSink===sink) lanSink = null; try { n.lanClose(); } catch(e){} }, on: fn => { handler = fn; }};
    const sink = (k, x) => handler(k, x); lanSink = sink;
    setTimeout(()=>{ try { n.lanConnect(String(host), +port); } catch(e){ handler('close', 'The app couldn’t open a connection.'); } }, 0);
    return t;
  }
  let ws = null;

// The same shape as the Claude live table, so the rest of the app doesn't care which one it has.
function lanTable(host, port, role){
  const T = {me:null, peersList:[], ph:new Set(), th:{}, ch:new Set(), conn:false, mine:{}, left:false, tr:null, retry:null, saves:[], onSaves:null, onState:null, onDenied:null, resolve:null, reject:null};
  const toPeer = p => { let pr = {}; try { pr = JSON.parse(p.presence); if (!pr || typeof pr!=='object' || Array.isArray(pr)) pr = {}; } catch(e){}
    return Object.freeze({peer:String(p.peer), by:null, isMe:p.peer===T.me, sameTab:p.peer===T.me, kind:'viewer', guest:false, role:p.role==='gm'?'gm':'player', presence:Object.freeze(pr), updatedAt:+p.at||Date.now()}); };

    const tr = T.tr = lanTransport(host, port);

      } else if (k==='msg'){

        else if (m.t==='emit'){ let d = null; try { d = JSON.parse(m.data); } catch(e){} const msg = {topic:String(m.topic), data:d, peer:String(m.from), isMe:m.from===T.me, sameTab:m.from===T.me}; (T.th[msg.topic]||[]).forEach(f=>f(msg)); }
        else if (m.t==='saves' && Array.isArray(m.names)){ T.saves = m.names.slice(0, 60).map(n=>clean(n,40)).filter(Boolean); if (T.onSaves) T.onSaves(T.saves); }
        else if (m.t==='state' && typeof m.data==='string'){ if (T.onState) T.onState(clean(m.name,40), m.data); }
        else if (m.t==='error' && m.code==='not_permitted'){ if (T.onDenied) T.onDenied(); }

  }
  const api = {
    presence(patch){ for (const [k,v] of Object.entries(patch)){ if (v===null) delete T.mine[k]; else T.mine[k] = v; } if (T.conn) T.tr.send('presence\n'+JSON.stringify(T.mine)); return Promise.resolve(); },
    peers(){ return T.peersList; },
    onPeers(fn){ T.ph.add(fn); if (T.peersList.length) setTimeout(()=>fn({peers:T.peersList, joined:[], left:[], updated:[]}), 0); return ()=>T.ph.delete(fn); },
    on(topic, fn){ (T.th[topic] = T.th[topic]||[]).push(fn); return ()=>{ T.th[topic] = (T.th[topic]||[]).filter(f=>f!==fn); }; },

let RULES = null;
let LIC = null;
function licHtml(){ if (LIC==null){ try { LIC = JSON.parse($('lic-data').textContent).html || ''; } catch(e){ LIC = ''; } } return LIC; }
function rules(){ if (!RULES){ try { RULES = JSON.parse($('rules-data').textContent);
    for (const g of Object.values(RULES)) for (const b of Object.values(g)) for (const sec of b.sections){ const t = document.createElement('div'); t.innerHTML = sec.html; sec.text = (t.textContent||'').replace(/\s+/g,' '); }
  } catch(e){ RULES = {ae:{core:{title:'',sections:[]}},classic:{stars:{title:'',sections:[]},core:{title:'',sections:[]}}}; } } return RULES; }
function viewRules(){
  // Aces & Eclipses has one book, the Core Rulebook; d20 Classic has its booklet and its core book.
  const R = rules()[G()], bk = isP() || S.rules.book==='core' ? 'core' : 'stars', B = R[bk];
  const q = (S.rules.q||'').trim();
  const secs = q ? B.sections.filter(s=>s.text.toLowerCase().includes(q.toLowerCase()) || s.title.toLowerCase().includes(q.toLowerCase())) : B.sections;
  const toc = B.sections.map(s=>`${s.part ? `<span class="tocpart">${esc(s.part)}</span>` : ''}<a href="#${s.id}" data-act="toc" data-id="${s.id}">${esc(s.title)}</a>`).join('');
  let h = `<div class="view"><div class="vhead"><div><p class="eyebrow">Rules · ${W().game}</p><h1>${esc(B.title)}</h1></div>
    <p>${isP() ? 'Every card rule in the game, with the numbers behind every deck at the back, in Part Four, The Math.' : bk==='stars' ? 'The short player-and-GM booklet: everything you need at the table.' : 'The full rules, including the numbers behind every deck in Part Four, The Math.'}</p></div>
    <div class="rulesbar">${isP() ? '' : `<div class="seg" role="radiogroup" aria-label="Book">${[['stars','Written in the Stars'],['core','Core Engine']].map(([k,l])=>`<button type="button" role="radio" aria-checked="${bk===k}" data-act="book" data-v="${k}">${l}</button>`).join('')}</div>`}
    <input class="input" type="search" id="rules-q" placeholder="Search the rules, like “flat check” or “Taurus”" value="${esc(S.rules.q||'')}" data-bind="rulesq" aria-label="Search the rules">
    <select class="input" id="rules-jump" data-bind="rulesjump" aria-label="Jump to a section"><option value="">Jump to a section…</option>${B.sections.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></div>
    <div class="rulesgrid"><nav class="toc" aria-label="Contents"><span class="booktitle">Contents</span>${toc}</nav>
    <div class="prose" id="prose" lang="en">${q ? `<p class="note" style="margin-bottom:14px">${secs.length ? `${plural(secs.length,'section')} mention “${esc(q)}”.` : `Nothing mentions “${esc(q)}”. Try a shorter word.`}</p>` : ''}${secs.map(s=>`<section id="${s.id}">${s.html}</section>`).join('')}</div></div></div>`;
  return h;
}
function rulesAfter(){
  const q = (S.rules.q||'').trim(); if (q.length<2) return;
  const host = $('prose'); if (!host) return;
  for (const sec of host.querySelectorAll('section')) walkMark(sec, q);
}
function walkMark(host, q){
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  const walk = n => { for (const c of [...n.childNodes]){ if (c.nodeType===3){ if (re.test(c.nodeValue)){ re.lastIndex = 0; const span = document.createElement('span'); span.innerHTML = esc(c.nodeValue).replace(re, m=>`<mark>${m}</mark>`); c.replaceWith(...span.childNodes); } re.lastIndex = 0; } else if (c.nodeType===1 && !/^(MARK|SCRIPT|STYLE)$/.test(c.tagName)) walk(c); } };
  walk(host);
}
