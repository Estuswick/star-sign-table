\u003ctd>#90\u003c/td>\n\u003ctd>\u003cstrong>Surge of Life.\u003c/strong> Vitality floods out of the Destined: each ally within 30 feet regains 2d8 Hit Points per surge rank. Undead enemies in the area take that much vitality damage instead (basic Fortitude save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♣ · ♠♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#89\u003c/td>\n\u003ctd>\u003cstrong>Heroic Anthem.\u003c/strong> Four singing skeletons appear and serenade the party for 1 minute: allies gain a +1 status bonus to attack rolls, Perception checks, saving throws and skill checks.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♠ · ♠♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#92\u003c/td>\n\u003ctd>\u003cstrong>Vanishing.\u003c/strong> The Destined and each ally within 10 feet of them turn invisible for 1 minute. An ally's invisibility ends when they use a hostile action.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♣ · ♠♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#91\u003c/td>\n\u003ctd>\u003cstrong>Quickening.\u003c/strong> The Destined and each ally within 30 feet are quickened for 1 minute. The extra action can only be used to Step, Stride or Strike.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♠ · ♦♣♣ · ♠♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#82\u003c/td>\n\u003ctd>\u003cstrong>Vitality Burst.\u003c/strong> Each ally within 20 feet of the Destined regains 1d8 Hit Points per surge rank. Undead enemies in the area take that much vitality damage instead (basic Fortitude save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♣ · ♦♠♠ · ♠♣♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#81\u003c/td>\n\u003ctd>\u003cstrong>Bewilder.\u003c/strong> A chosen enemy attempts a Will save. Critical success: no effect. Success: stupefied 1 for 1 round. Failure: confused for 1 round. Critical failure: confused for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♠ · ♥♣♣ · ♠♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#84\u003c/td>\n\u003ctd>\u003cstrong>Giant's Stature.\u003c/strong> The Destined grows to Large for 1 minute: reach +5 feet, a +2 status bonus to melee damage, and clumsy 1. At surge rank 4 or higher they grow to Huge instead: reach +10 feet and +4 to melee damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♣ · ♥♠♠ · ♠♣♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#83\u003c/td>\n\u003ctd>\u003cstrong>Stormlance.\u003c/strong> Lightning leaps from the Destined in a 120-foot line aimed where they choose: (surge rank + 1)d12 electricity damage to each creature in the line, basic Reflex save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>12\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♣ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#85\u003c/td>\n\u003ctd>\u003cstrong>Leaden Limbs.\u003c/strong> A chosen enemy attempts a Fortitude save. Critical success: no effect. Success: slowed 1 for 1 round. Failure: slowed 1 for 1 minute. Critical failure: slowed 2 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♠ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#86\u003c/td>\n\u003ctd>\u003cstrong>Burst of Speed.\u003c/strong> The Destined is quickened for 3 rounds. The extra action can only be used to Step, Stride or Strike.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>14\u003c/td>\n\u003ctd>♥♥♥ · ♦♠♠ · ♦♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#59\u003c/td>\n\u003ctd>\u003cstrong>Lucky Break.\u003c/strong> The Destined gains a Hero Point. If they already have 3, their next check this encounter is a fortune check instead (draw 3 cards, keep the best pair).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15\u003c/td>\n\u003ctd>♦♦♦ · ♥♠♠ · ♥♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#60\u003c/td>\n\u003ctd>\u003cstrong>Beast Ally.\u003c/strong> A beast made of starlight (a great stag, a bear or the like) appears next to the Destined and fights for the party for 1 minute, then fades. Its level is the Destined's level − 3 (at least −1); it takes 2 actions at the end of each of the Destined's turns.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>16\u003c/td>\n\u003ctd>♥♥♠ · ♥♣♣ · ♦♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#61\u003c/td>\n\u003ctd>\u003cstrong>Clumsy Hex.\u003c/strong> A chosen enemy attempts a Reflex save. Failure: clumsy 2 for 1 minute. Critical failure: clumsy 3 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>♥♥♠ · ♥♦♦ · ♠♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#70\u003c/td>\n\u003ctd>\u003cstrong>Weakness Hex.\u003c/strong> A chosen enemy attempts a Fortitude save. Failure: enfeebled 2 for 1 minute. Critical failure: enfeebled 3 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♠ · ♠♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#71\u003c/td>\n\u003ctd>\u003cstrong>Muddle.\u003c/strong> A chosen enemy attempts a Will save. Failure: stupefied 2 for 1 minute. Critical failure: stupefied 3 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>19\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♠ · ♦♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#62\u003c/td>\n\u003ctd>\u003cstrong>Verdant Clutch.\u003c/strong> Vines burst up in a 20-foot burst at a point the Destined chooses within 60 feet. Each creature in it attempts a Reflex save or is immobilized (Escape DC = surge DC), and the area is difficult terrain for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♣ · ♠♠♣ · ♥♦♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#65\u003c/td>\n\u003ctd>\u003cstrong>Tinge of Terror.\u003c/strong> Each enemy within 30 feet of the Destined attempts a Will save: frightened 1 on a failure, frightened 2 on a critical failure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>21\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♣ · ♠♣♣ · ♥♦♠\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#72\u003c/td>\n\u003ctd>\u003cstrong>Laughing Fit.\u003c/strong> A chosen enemy attempts a Will save. Success: no reactions for 1 round. Failure: slowed 1 and no reactions for 1 round. Critical failure: slowed 1 and no reactions for 3 rounds, and it falls prone.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>22\u003c/td>\n\u003ctd>♥♥♣ · ♥♠♠ · ♦♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#63\u003c/td>\n\u003ctd>\u003cstrong>Echo Selves.\u003c/strong> Three illusory images of the Destined appear for 1 minute. An attack against the Destined picks at random among the Destined and the remaining images; an image that's hit vanishes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>23\u003c/td>\n\u003ctd>♥♥♣ · ♥♦♦ · ♠♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#67\u003c/td>\n\u003ctd>\u003cstrong>Dancing Blade.\u003c/strong> The Destined's weapon (or a spectral fist dealing 1d6 bludgeoning) animates beside them for 3 rounds. At the end of each of the Destined's turns it Strikes an enemy within 15 feet of them, using their attack modifier − 2; it doesn't count toward their multiple attack penalty.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>24\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♠ · ♠♠♣ · ♥♦♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#66\u003c/td>\n\u003ctd>\u003cstrong>Whirligig.\u003c/strong> A chosen enemy attempts a Will save (incapacitation). On a failure it spins like a top: stunned 1, then confused until the end of its next turn.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>25\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♠ · ♠♣♣ · ♥♦♠\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#74\u003c/td>\n\u003ctd>\u003cstrong>Critter Curse.\u003c/strong> A chosen enemy attempts a Will save (incapacitation). On a failure it turns into a harmless Tiny animal until the end of its next turn (1d4 rounds on a critical failure): it can move and hide but can't attack, cast spells or use its gear.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>26\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♣ · ♠♠♣ · ♥♦♠\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#68\u003c/td>\n\u003ctd>\u003cstrong>Fortune's Turn.\u003c/strong> Each ally's next check this encounter is a fortune check: draw 3 cards and keep the best pair.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>27\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♣ · ♦♠♠ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#64\u003c/td>\n\u003ctd>\u003cstrong>Borrowed Time.\u003c/strong> Each ally shuffles the top 3 cards of their discard pile back into their deck.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>28\u003c/td>\n\u003ctd>♥♥♦ · ♦♦♠ · ♠♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#73\u003c/td>\n\u003ctd>\u003cstrong>Ward.\u003c/strong> Each ally within 30 feet of the Destined gains temporary Hit Points equal to 3 × the surge rank for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>29\u003c/td>\n\u003ctd>♥♥♦ · ♦♦♣ · ♠♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#69\u003c/td>\n\u003ctd>\u003cstrong>Glimpse.\u003c/strong> The Destined looks at the top 3 cards of the Fate Deck and puts them back in any order.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>♥♥♠ · ♥♦♣ · ♦♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#77\u003c/td>\n\u003ctd>\u003cstrong>Tattletale Glow.\u003c/strong> Glittering light outlines every enemy in a 20-foot burst at a point the Destined chooses within 120 feet, for 1 minute: they can't be concealed, and invisible ones are only concealed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>31\u003c/td>\n\u003ctd>♥♥♣ · ♥♦♠ · ♦♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#79\u003c/td>\n\u003ctd>\u003cstrong>Stolen Thoughts.\u003c/strong> For 1 minute the Destined hears a chosen enemy's surface thoughts: at the start of each round, the GM tells them what it plans to do.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>32\u003c/td>\n\u003ctd>♥♥♦ · ♥♠♣ · ♦♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#75\u003c/td>\n\u003ctd>\u003cstrong>Sticky Nectar.\u003c/strong> Sticky nectar coats a chosen enemy (Reflex save negates): clumsy 1 and a −10-foot status penalty to its Speeds for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>33\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♣ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#76\u003c/td>\n\u003ctd>\u003cstrong>Sun Breaks Through.\u003c/strong> The next Eclipse any ally draws this encounter counts as a Sun instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>34\u003c/td>\n\u003ctd>♦♦♠ · ♥♦♣ · ♥♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#78\u003c/td>\n\u003ctd>\u003cstrong>Luminous Pests.\u003c/strong> Birds of light burst from the Destined in a 30-foot cone. Each enemy in it attempts a Will save or is dazzled for 1 minute (on a critical failure, blinded for 1 round and then dazzled for 1 minute). Allies are unaffected.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>♦♦♣ · ♥♦♠ · ♥♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#80\u003c/td>\n\u003ctd>\u003cstrong>Gale Blast.\u003c/strong> Wind blasts from the Destined in a 60-foot line aimed where they choose. Each enemy in it attempts a Fortitude save: pushed 10 feet on a failure, pushed 10 feet and knocked prone on a critical failure. Small fires in the line go out.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>36\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♦ · ♠♠♠ · ♣♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>The Grand Alignment.\u003c/strong> The four suits align. All exhaustion and fatigue end, every deck in play (the players' decks and the Fate Deck) is reshuffled with its discard pile without anyone gaining exhaustion, and every creature in the encounter, friend and foe, treats its next check as a natural 20.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>37\u003c/td>\n\u003ctd>♥♥♥ · ♠♠♠ · ♦♦♣ · ♦♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Slumber Tide.\u003c/strong> Drowsy magic fills a 100-foot burst centered on the Destined. Every creature in it, friend and foe, attempts a Will save (incapacitation). Failure: unconscious until the end of its next turn. Critical failure: unconscious for 1 minute. A sleeper wakes if it takes damage or someone spends an Interact action to shake it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>38\u003c/td>\n\u003ctd>♥♥♥ · ♣♣♣ · ♦♦♠ · ♦♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Double Spin.\u003c/strong> The Destined and the enemy nearest them both spin like tops. Each attempts a Will save (incapacitation); on a failure it's stunned 1, then confused until the end of its next turn.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>39\u003c/td>\n\u003ctd>♦♦♦ · ♠♠♠ · ♥♥♣ · ♥♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Antimagic Eruption.\u003c/strong> The wild magic tries to counteract every spell and magical effect on each creature within 30 feet of the Destined, friend and foe (counteract rank = surge rank, counteract modifier = surge DC − 10).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>♦♦♦ · ♣♣♣ · ♥♥♠ · ♥♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Falling Up.\u003c/strong> The sky pulls within 60 feet of the Destined. Every creature there, friend and foe, falls 30 feet upward unless it succeeds at a Reflex save to grab hold of something. The fallen hang there immobilized until the start of the Destined's next turn, then drop back down and take falling damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>41\u003c/td>\n\u003ctd>♥♥♠ · ♥♠♠ · ♦♦♣ · ♦♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Sudden Gale.\u003c/strong> Wild winds blow in a random direction within 40 feet of the Destined for 1 minute. A creature that starts its turn there attempts a Fortitude save or falls prone (and is pushed 10 feet on a critical failure); the Destined saves right away. Moving against the wind is difficult terrain, or greater difficult terrain when flying.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>42\u003c/td>\n\u003ctd>♥♥♠ · ♥♣♣ · ♦♦♣ · ♦♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Tremor.\u003c/strong> The ground heaves within 40 feet of the Destined. Every creature standing on the ground attempts a Reflex save or falls prone, and the area is difficult terrain for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>43\u003c/td>\n\u003ctd>♥♥♠ · ♥♦♦ · ♦♣♣ · ♠♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Weightless.\u003c/strong> Creatures and objects within 20 feet of the Destined become nearly weightless until the end of the Destined's next turn: they can Climb at their land Speed and Leap as high as they normally Leap across.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>44\u003c/td>\n\u003ctd>♥♥♣ · ♥♠♠ · ♦♦♠ · ♦♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Swap.\u003c/strong> The Destined and the enemy nearest them trade places (teleportation).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>♥♥♣ · ♥♣♣ · ♦♦♠ · ♦♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Hellish Shortcut.\u003c/strong> The Destined teleports up to 60 feet to a space they can see, by way of somewhere much hotter: they arrive singed, taking 1d4 fire damage per surge rank (no save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>46\u003c/td>\n\u003ctd>♥♥♣ · ♥♦♦ · ♦♠♠ · ♠♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Emotional Turmoil.\u003c/strong> For 1 minute, at the start of each of the Destined's turns, draw a damage-deck card: red, a +2 status bonus to attack rolls, saving throws and skill checks until their next turn; black, a −2 status penalty instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>47\u003c/td>\n\u003ctd>♥♥♦ · ♥♠♠ · ♦♦♣ · ♠♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Monstrous Transformation.\u003c/strong> The Destined's head and arms take a beast's shape for 1 minute, giving a status bonus to weapon and unarmed damage equal to the surge rank. At the start of each of their turns they attempt a Will save or are confused until their next turn; on a critical success they can end the effect.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>48\u003c/td>\n\u003ctd>♥♥♦ · ♥♣♣ · ♦♦♠ · ♠♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Warp.\u003c/strong> Reality ripples through the Destined: they're confused until the end of their next turn and gain 1d6 temporary Hit Points per surge rank (at least 4d6) for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>49\u003c/td>\n\u003ctd>♥♥♦ · ♥♦♦ · ♠♠♣ · ♠♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Day for Night.\u003c/strong> Until the encounter ends, Suns and Eclipses swap meanings on every check and flat check, for players and GM alike: a Sun is a natural 1 and an Eclipse a natural 20.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>♥♠♠ · ♦♦♣ · ♥♦♣ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Trinket Squall.\u003c/strong> Illusory trinkets rain down in a 40-foot burst centered on the Destined for 1 minute, making everything in it concealed. A creature that Seeks and beats the surge DC sees through it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>51\u003c/td>\n\u003ctd>♥♣♣ · ♦♦♠ · ♥♦♠ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Blackout.\u003c/strong> Magical darkness fills a 20-foot burst centered on the Destined for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>52\u003c/td>\n\u003ctd>♥♥♠ · ♦♣♣ · ♥♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Cloudburst.\u003c/strong> Rain pours down on everything within 60 feet of the Destined until the start of their next turn: nonmagical fires go out, the wild magic tries to counteract magical fire (as #39), and creatures in the rain are concealed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>53\u003c/td>\n\u003ctd>♥♥♣ · ♦♠♠ · ♥♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Strike Up the Band.\u003c/strong> For 1 minute theme music follows the Destined: a +2 status bonus to Diplomacy, Intimidation and Performance checks, a −2 status penalty to Deception checks, and they can't Hide or Sneak.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>54\u003c/td>\n\u003ctd>♥♥♦ · ♠♠♣ · ♥♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Stolen Face.\u003c/strong> The Destined and the enemy nearest them swap appearances for 1 minute (an illusion). A creature that Seeks and beats the surge DC sees through it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>♥♥♦ · ♠♣♣ · ♥♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Living Object.\u003c/strong> The nearest unattended object (up to Medium size) sprouts animal legs and follows the Destined around until the encounter ends, getting underfoot. It's harmless.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>56\u003c/td>\n\u003ctd>♥♦♦ · ♠♠♣ · ♥♦♣ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Starshard Spray.\u003c/strong> Shards of cold starlight burst from the Destined in a 15-foot cone: 1 piercing damage to each creature in it, friend or foe. Where they land, they glitter for an hour, shedding dim light in a 5-foot radius.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>57\u003c/td>\n\u003ctd>♥♦♦ · ♠♣♣ · ♥♦♠ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Ghost Object.\u003c/strong> The unattended object nearest the Destined (up to 30 cubic feet: a crate, a door, a table) turns pale and insubstantial for good: it gives no cover, and anything can pass through it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>58\u003c/td>\n\u003ctd>♥♦♠ · ♥♦♣ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Oddity.\u003c/strong> Something harmless and strange: draw a damage-deck card (redraw Jokers) and look it up on the Oddities table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>59\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♣ · ♦♦♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#14\u003c/td>\n\u003ctd>\u003cstrong>Bad Omen.\u003c/strong> The Destined loses a Hero Point. If they have none, their next check this encounter is a misfortune check instead (draw 3 cards, keep the worst pair).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♠ · ♦♦♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#15\u003c/td>\n\u003ctd>\u003cstrong>Hostile Beast.\u003c/strong> A beast made of starlight appears within 30 feet of the Destined and attacks the party for 1 minute, then fades. Its level is the Destined's level − 3 (at least −1); it takes 2 actions at the end of each of the Destined's turns.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>61\u003c/td>\n\u003ctd>♥♠♠ · ♥♣♣ · ♦♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#16\u003c/td>\n\u003ctd>\u003cstrong>Clumsy Hex.\u003c/strong> The Destined attempts a Reflex save. Failure: clumsy 2 for 1 minute. Critical failure: clumsy 3 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>62\u003c/td>\n\u003ctd>♥♠♠ · ♥♣♣ · ♦♦♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#19\u003c/td>\n\u003ctd>\u003cstrong>Verdant Clutch.\u003c/strong> Vines burst up in a 20-foot burst centered on the Destined. Each creature in it attempts a Reflex save or is immobilized (Escape DC = surge DC), and the area is difficult terrain for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>63\u003c/td>\n\u003ctd>♥♥♠ · ♦♠♠ · ♦♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#22\u003c/td>\n\u003ctd>\u003cstrong>Starmote Swarm.\u003c/strong> A whirl of glittering motes fills a 20-foot burst centered on the Destined for 2 rounds. Creatures inside are blinded while they stay in it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>64\u003c/td>\n\u003ctd>♥♥♣ · ♦♠♠ · ♦♣♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#27\u003c/td>\n\u003ctd>\u003cstrong>Burnout.\u003c/strong> Each ally burns the top 3 cards of their deck: discard them unused. If that takes a deck's last card, it runs out as usual.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>♥♥♦ · ♥♠♠ · ♦♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#20\u003c/td>\n\u003ctd>\u003cstrong>Tinge of Terror.\u003c/strong> The Destined and each ally within 20 feet attempt a Will save: frightened 1 on a failure, frightened 2 on a critical failure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>66\u003c/td>\n\u003ctd>♥♥♦ · ♥♣♣ · ♦♠♠ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#24\u003c/td>\n\u003ctd>\u003cstrong>Whirligig.\u003c/strong> The Destined attempts a Will save (incapacitation). On a failure they spin like a top: stunned 1, then confused until the end of their next turn.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>67\u003c/td>\n\u003ctd>♥♥♦ · ♦♠♠ · ♠♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#23\u003c/td>\n\u003ctd>\u003cstrong>Leaping Weapon.\u003c/strong> The Destined's weapon, or whatever they're holding, leaps from their hands and lands 10 feet away in a random direction.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>68\u003c/td>\n\u003ctd>♥♥♦ · ♦♠♠ · ♦♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#26\u003c/td>\n\u003ctd>\u003cstrong>Ill Fortune.\u003c/strong> Each ally's next check this encounter is a misfortune check: draw 3 cards and keep the worst pair.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>69\u003c/td>\n\u003ctd>♥♥♦ · ♦♣♣ · ♠♠♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#29\u003c/td>\n\u003ctd>\u003cstrong>Glimpsed.\u003c/strong> The GM looks at the top 3 cards of the Destined's deck and puts them back in any order.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♠ · ♠♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#17\u003c/td>\n\u003ctd>\u003cstrong>Weakness Hex.\u003c/strong> The Destined attempts a Fortitude save. Failure: enfeebled 2 for 1 minute. Critical failure: enfeebled 3 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>71\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♠ · ♥♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#18\u003c/td>\n\u003ctd>\u003cstrong>Muddle.\u003c/strong> The Destined attempts a Will save. Failure: stupefied 2 for 1 minute. Critical failure: stupefied 3 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>72\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♠ · ♦♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#21\u003c/td>\n\u003ctd>\u003cstrong>Laughing Fit.\u003c/strong> The Destined attempts a Will save. Success: no reactions for 1 round. Failure: slowed 1 and no reactions for 1 round. Critical failure: slowed 1 and no reactions for 3 rounds, and they fall prone.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>73\u003c/td>\n\u003ctd>♥♦♦ · ♥♣♣ · ♠♠♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#28\u003c/td>\n\u003ctd>\u003cstrong>Backlash.\u003c/strong> The magic snaps back at the Destined and each ally within 30 feet: 1d6 force damage per surge rank (basic Fortitude save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>74\u003c/td>\n\u003ctd>♥♦♦ · ♥♣♣ · ♦♠♠ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#25\u003c/td>\n\u003ctd>\u003cstrong>Critter Curse.\u003c/strong> The Destined attempts a Will save (incapacitation). On a failure they turn into a harmless Tiny animal until the end of their next turn (1d4 rounds on a critical failure): they can move and hide but can't attack, cast spells or use their gear.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>♠♠♣ · ♥♦♠ · ♥♦♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#32\u003c/td>\n\u003ctd>\u003cstrong>Sticky Nectar.\u003c/strong> Sticky nectar coats the Destined (Reflex save negates): clumsy 1 and a −10-foot status penalty to their Speeds for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>76\u003c/td>\n\u003ctd>♠♣♣ · ♥♦♠ · ♥♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#33\u003c/td>\n\u003ctd>\u003cstrong>Sudden Eclipse.\u003c/strong> The next Sun any ally draws this encounter counts as an Eclipse instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>77\u003c/td>\n\u003ctd>♥♠♠ · ♥♦♣ · ♥♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#30\u003c/td>\n\u003ctd>\u003cstrong>Tattletale Glow.\u003c/strong> Glittering light outlines the Destined and each ally within 20 feet for 1 minute: they can't be concealed, and invisible ones are only concealed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>78\u003c/td>\n\u003ctd>♥♣♣ · ♥♦♠ · ♥♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#34\u003c/td>\n\u003ctd>\u003cstrong>Luminous Pests.\u003c/strong> Birds of light burst from the Destined in a 30-foot cone. The Destined and every creature in the cone, allies included, attempt a Will save or are dazzled for 1 minute (on a critical failure, blinded for 1 round and then dazzled for 1 minute).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>79\u003c/td>\n\u003ctd>♦♠♠ · ♥♦♣ · ♥♦♣ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#31\u003c/td>\n\u003ctd>\u003cstrong>Mental Broadcast.\u003c/strong> For 1 minute everyone within 30 feet hears the Destined's surface thoughts: before each of the Destined's turns, their player says out loud what they plan to do, and enemies can act on it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80\u003c/td>\n\u003ctd>♦♣♣ · ♥♦♠ · ♥♦♠ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#35\u003c/td>\n\u003ctd>\u003cstrong>Gale Blast.\u003c/strong> Wind slams through the party: the Destined and each ally within 20 feet attempt a Fortitude save. Failure: pushed 10 feet in the same random direction. Critical failure: also knocked prone.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>81\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♣ · ♥♦♦ · ♦♣♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#9\u003c/td>\n\u003ctd>\u003cstrong>Bewildered.\u003c/strong> The Destined attempts a Will save. Critical success: no effect. Success: stupefied 1 for 1 round. Failure: confused for 1 round. Critical failure: confused for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>82\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♦ · ♥♣♣ · ♦♦♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#8\u003c/td>\n\u003ctd>\u003cstrong>Energy Unleashed.\u003c/strong> Raw energy bursts out of the Destined: each creature within 10 feet, the Destined included, takes 2d6 untyped damage per surge rank (basic Reflex save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>83\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♠ · ♥♦♦ · ♦♠♠\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#11\u003c/td>\n\u003ctd>\u003cstrong>Lightning Strike.\u003c/strong> Lightning strikes the Destined and arcs to each ally within 10 feet of them: (surge rank + 1)d12 electricity damage, basic Reflex save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>84\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♦ · ♥♠♠ · ♦♦♠\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#10\u003c/td>\n\u003ctd>\u003cstrong>Dwindle.\u003c/strong> The Destined attempts a Fortitude save or shrinks to Tiny for 1 minute (1 hour on a critical failure): reach 0 feet, a −2 status penalty to damage rolls and a −10-foot status penalty to their Speeds.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>85\u003c/td>\n\u003ctd>♥♠♠ · ♦♣♣ · ♥♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#12\u003c/td>\n\u003ctd>\u003cstrong>Leaden Limbs.\u003c/strong> The Destined attempts a Fortitude save. Critical success: no effect. Success: slowed 1 for 1 round. Failure: slowed 1 for 1 minute. Critical failure: slowed 2 for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>86\u003c/td>\n\u003ctd>♥♣♣ · ♦♠♠ · ♥♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#13\u003c/td>\n\u003ctd>\u003cstrong>Oppressive Voice.\u003c/strong> A voice thunders through the Destined's mind: 1d4 nonlethal mental damage per surge rank (basic Will save). On a failure they're also stunned 1; on a critical failure, stunned 2.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>87\u003c/td>\n\u003ctd>♠♠♠ · ♥♦♣ · ♥♦♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#2\u003c/td>\n\u003ctd>\u003cstrong>Magical Nemesis.\u003c/strong> A hostile creature drawn by the magic appears within 60 feet of the Destined. The GM picks it; its level is the Destined's level − 2 (at least −1). It acts right after the Destined's turn, fights on the enemies' side, and after 1 minute may leave or stay.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>88\u003c/td>\n\u003ctd>♣♣♣ · ♥♦♠ · ♥♦♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#3\u003c/td>\n\u003ctd>\u003cstrong>Flame Burst.\u003c/strong> Fire explodes in a 20-foot burst centered on the Destined: 2d6 fire damage per surge rank, basic Reflex save. Enemies in the burst are hit too.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>89\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♦ · ♦♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#5\u003c/td>\n\u003ctd>\u003cstrong>Dirge.\u003c/strong> Four wailing skeletons appear and sing the party's dirge for 1 minute: allies take a −1 status penalty to attack rolls, Perception checks, saving throws and skill checks.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>♠♠♠ · ♥♦♦ · ♥♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#4\u003c/td>\n\u003ctd>\u003cstrong>Life Sap.\u003c/strong> The magic feeds on the Destined and each ally within 20 feet (Fortitude save). Critical success: no effect. Success: enfeebled 1 for 1 minute. Failure: drained 1, and enfeebled 2 for 1 minute. Critical failure: as failure, and doomed 1.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>91\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♦ · ♦♠♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#7\u003c/td>\n\u003ctd>\u003cstrong>Slowing Wave.\u003c/strong> Time thickens around the Destined and each ally within 30 feet (Fortitude save). Critical success: no effect. Success: slowed 1 for 1 round. Failure: slowed 1 for 1 minute. Critical failure: slowed 1 for 1 minute and stunned 1.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>92\u003c/td>\n\u003ctd>♣♣♣ · ♥♦♦ · ♥♠♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#6\u003c/td>\n\u003ctd>\u003cstrong>Toxic Cloud.\u003c/strong> A poisonous cloud fills a 20-foot burst centered on the Destined for 1 minute; creatures inside are concealed. A creature that starts its turn in it takes 1d6 poison damage per surge rank (basic Fortitude save) and is sickened 1 on a failure.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>93\u003c/td>\n\u003ctd>♠♠♠ · ♣♣♣ · ♥♥♦ · ♥♦♦\u003c/td>\n\u003ctd>Bad 4\u003c/td>\n\u003ctd>#1\u003c/td>\n\u003ctd>\u003cstrong>Crown of Ruin.\u003c/strong> Every ally takes 2d8 void damage per surge rank (basic Fortitude save), gains one level of exhaustion (as if their deck ran out, without the reshuffle) and loses a Hero Point. Each ally's next check this encounter is a natural 1: don't draw.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"ae-14-wild-magic-oddities-58\">Oddities (#58)\u003c/h3>\n\u003cp>Draw a card from the damage deck; redraw Jokers.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>Oddity\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>For a day, the Destined's shadow falls toward the nearest light instead of away from it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>Faint freckles of starlight trace the Destined's star sign across their cheeks and fade after a week.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>The enemy nearest the Destined hiccups tiny, harmless sparks until the encounter ends.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Every flame within 60 feet of the Destined burns silver for 10 minutes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>A flock of paper birds folds itself out of thin air, circles the Destined three times and flies off.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>For an hour, the Destined's hair and clothes drift as if underwater.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>A blank playing card appears in the Destined's hand. It belongs to no deck and can't be drawn or played.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>For a day, small objects the Destined sets down float an inch above whatever they're set on.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>For a day, the Destined's reflection winks at them from every mirror and still pool.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>A life-size ice statue of the Destined, striking a heroic pose, appears beside them and melts over the next hour.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","part":"Part Three · Running the Game"},{"id":"ae-15-pacing-the-day","title":"15. Pacing the day","html":"\u003ch2 id=\"ae-15-pacing-the-day-15-pacing-the-day\">15. Pacing the day\u003c/h2>\n\u003cp>\u003cstrong>The last fight of the day is the GM's to balance and the party's to prepare for.\u003c/strong> No rule softens it.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Every deck except Taurus is strong early in the day and weak late,\u003c/strong> because every deck runs out at least once in a standard day. Aries, the smallest deck, swings the most between morning and night, the Earth decks the least. Unyielding cancels Taurus's one deck-out, so it stays flat all day. A boss at the end of a long day plays harder than its encounter budget says.\u003c/li>\n\u003cli>\u003cstrong>Day length shifts which decks are strong:\u003c/strong> short days favor small decks, long days favor big ones.\u003c/li>\n\u003cli>\u003cstrong>Damage runs a little high on both sides\u003c/strong> because of the damage deck's Jokers, a little more for monsters (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Collapses don't happen in a realistic day.\u003c/strong> On a long day (80 checks) the Fire decks reach Exhausted 3 and are fatigued; even Aries, the smallest deck, reaches Exhausted 4 only around check 93.\u003c/li>\n\u003cli>\u003cstrong>What the party can do:\u003c/strong> track the cards left in each deck, rest before the big fight when they can, and save Hero Points and fortune effects for it. Chapter 20 has each deck's numbers over short, standard and long days.\u003c/li>\n\u003c/ul>\n"},{"id":"ae-16-watch-in-playtesting","title":"16. Watch in playtesting","html":"\u003ch2 id=\"ae-16-watch-in-playtesting-16-watch-in-playtesting\">16. Watch in playtesting\u003c/h2>\n\u003cp>Things to watch at the table; none of them breaks the balance rules.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Unyielding (Taurus) depends on day length.\u003c/strong> On short days the deck never runs out, so it pays for nothing; on long days it's worth more than its price.\u003c/li>\n\u003cli>\u003cstrong>Sting (Scorpio) is the strongest once-per-day ability.\u003c/strong> Its price assumes the Eclipse ends up on an enemy's attack; played on a boss's big spell or save, it's worth more.\u003c/li>\n\u003cli>\u003cstrong>Shell is priced for a party of four.\u003c/strong> In a smaller party it's worth a little less, in a bigger one a little more.\u003c/li>\n\u003cli>\u003cstrong>Twin Draw is priced for use on an attack.\u003c/strong> Spent on a skill check it's worth less than its price; spent on a save against a big effect, more.\u003c/li>\n\u003cli>\u003cstrong>Crown of Ruin (#93)\u003c/strong> is the harshest effect: damage, a level of exhaustion and a natural 1 for every ally. It comes up about once in 1,700 wild magic events.\u003c/li>\n\u003cli>\u003cstrong>Day for Night (#49)\u003c/strong> works against Virgo (two Suns, one Eclipse) and for decks with more Eclipses than Suns. The other eleven sign decks have even Jokers, so it comes out even for them.\u003c/li>\n\u003cli>\u003cstrong>Glimpse (#29)\u003c/strong> lets the Destined see face cards near the top of the Fate Deck and move them, which can speed up the next wild magic.\u003c/li>\n\u003cli>\u003cstrong>Mental Broadcast (#79)\u003c/strong> depends on the table playing along; the GM can swap in any other minor effect.\u003c/li>\n\u003c/ul>\n"},{"id":"ae-17-the-standard-day-and-the-balance-rules","title":"17. The standard day and the balance rules","html":"\u003ch2 id=\"ae-17-the-standard-day-and-the-balance-rules-17-the-standard-day-and-the-balance-rules\">17. The standard day and the balance rules\u003c/h2>\n\u003cp>\u003cstrong>The benchmark.\u003c/strong> The game's numbers (its DCs, its modifiers and the rule that 10 over or under the DC is a critical) are tuned to an even spread of results from 1 to 20, the spread of a twenty-sided die, or d20. Every deck is built to succeed as often as that over a standard day, so this part measures each rule against a d20. Nobody at the table ever rolls one.\u003c/p>\n\u003cp>Every &quot;balanced&quot; in this book means the same thing: over a standard day of 50 checks, a deck's day edge is within ±0.1, and its Strike damage and the damage it takes from basic saves each land within 97–103% of a d20's. A deck's \u003cstrong>edge\u003c/strong> is its average card total minus 10.5, minus its exhaustion penalty; its \u003cstrong>day edge\u003c/strong> is that edge over a standard day. One point of edge is about 5% more success on a typical check. This chapter sets out the day and the rules the decks are built to.\u003c/p>\n\u003ch3 id=\"ae-17-the-standard-day-and-the-balance-rules-the-standard-day\">The standard day\u003c/h3>\n\u003cp>All balance numbers assume a \u003cstrong>standard day of 50 checks\u003c/strong>, a martial character's day: 3–4 encounters (about 14 combat rounds) plus exploration. That's about 95–99 cards, depending on the deck.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Character\u003c/th>\n\u003cth>Per day\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Martial\u003c/td>\n\u003ctd>~50 checks (about 2.5 per combat round)\u003c/td>\n\u003ctd>~98\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Caster, character level 1–4\u003c/td>\n\u003ctd>4 spells + 14 cantrips + ~32 other checks\u003c/td>\n\u003ctd>~92\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Caster, character level 5–12\u003c/td>\n\u003ctd>10 spells + 8 cantrips + ~32 other checks\u003c/td>\n\u003ctd>~98\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Caster, character level 13–20\u003c/td>\n\u003ctd>14 spells + 4 cantrips + ~32 other checks\u003c/td>\n\u003ctd>~102\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>About a quarter of casters' spells need a spell attack. Drawing fewer cards than the standard day helps a little (low-level casters: +0.05 to +0.13 day edge), and drawing more hurts a little (high-level casters: −0.06 to −0.17, most for Aries and Leo). Taurus feels neither, since Unyielding absorbs its one deck-out either way.\u003c/p>\n\u003ch3 id=\"ae-17-the-standard-day-and-the-balance-rules-balance-rules\">Balance rules\u003c/h3>\n\u003col>\n\u003cli>\n\u003cp>\u003cstrong>Size buys power.\u003c/strong> A deck's allowed average card total is \u003cstrong>10.5 + 2 × its average exhaustion level over a standard day.\u003c/strong> With 1 Sun and 1 Eclipse:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Deck size\u003c/th>\n\u003cth>Runs out around check\u003c/th>\n\u003cth>Highest exhaustion in a standard day\u003c/th>\n\u003cth>Allowed average\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>23, 46\u003c/td>\n\u003ctd>2 (−4)\u003c/td>\n\u003ctd>11.72\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>26\u003c/td>\n\u003ctd>1 (−2)\u003c/td>\n\u003ctd>11.47\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>28\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.37\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>31\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.27\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.07\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>38\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>10.97\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80\u003c/td>\n\u003ctd>41\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>10.87\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>85\u003c/td>\n\u003ctd>43\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>10.77\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>46\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>10.67\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>More Jokers make a deck last longer, so its allowed average drops a little: with 3 of each, a 60-card deck's is 11.23 and a 90-card deck's 10.63. The Deck Lab works out the exact allowed average for any deck. A deck at its allowed average succeeds exactly as often as a d20 over a standard day, averaged over all difficulties.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Jokers can be uneven, within limits.\u003c/strong> Eclipses equal the Suns or one more, with at least one Sun, and a deck holds at most 4 Jokers at 45–50 cards, 5 at 55, 6 at 60–65, 7 at 70–75, 8 at 80–85 and 9 at 90. Decks of 65 cards or more get a few extra setups, including no Sun at all; more Suns than Eclipses works only from 75 cards. 13.2 has the list, and chapter 24 the reasons.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Measure Strike damage, not just the average.\u003c/strong> A critical failure on a Strike is no worse than a miss, but a critical hit doubles damage. So a deck with more extreme draws gets extra crits without paying for its extra misses, and out-damages a steadier deck with the same average (chapter 19).\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Use Jokers as the counterweight.\u003c/strong> More Jokers means more crits and more Strike damage. Steadier decks get more Jokers; swingier decks get fewer.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Aim for 97–103%.\u003c/strong> Over a standard day, a deck's damage from three-Strike turns, and the damage it takes from basic saves, should each land within 97–103% of a d20's, with a day edge within ±0.1.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>No value makes up more than a third of the number cards.\u003c/strong> Decks piled onto a few values land on the same totals over and over, which makes their balance hard to predict. All twelve sign decks are inside it; the closest is Virgo, with twenty-four Aces among 87 number cards.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Abilities cost pips.\u003c/strong> A deck with a sign ability builds to a lower pip total: its size's pip total minus the ability's price at that size (chapter 12). To judge it, add the price back as a bonus on every check (each pip adds 2 × (number cards − 1) ÷ (cards × (cards − 1)) to the average); with that bonus it must pass rule 5. Unyielding (Taurus) is judged by playing it out instead: the first deck-out of the day gives no exhaustion.\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>Chapter 13 turns these rules into a paper method for building a deck, and chapter 23 shows how the sign abilities are priced.\u003c/p>\n","part":"Part Four · The Math"},{"id":"ae-18-what-a-two-card-draw-can-and-can-t-do","title":"18. What a two-card draw can and can't do","html":"\u003ch2 id=\"ae-18-what-a-two-card-draw-can-and-can-t-do-18-what-a-two-card-draw-can-and-can-t-do\">18. What a two-card draw can and can't do\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>It can't match a d20 exactly.\u003c/strong> Two draws from one deck can't add up to 20 equally likely card totals. Middle totals like 10 and 11 come up often and the extremes rarely, and each deck bends that shape its own way.\u003c/li>\n\u003cli>\u003cstrong>Decks that all matched the d20 would all play the same,\u003c/strong> so &quot;fair&quot; means the average over a standard day, not an identical shape.\u003c/li>\n\u003cli>\u003cstrong>Reshuffle only when forced.\u003c/strong> Each Joker comes up once per pass through the deck, and that is what holds natural 20s and 1s at the rates in chapter 20.\u003c/li>\n\u003cli>\u003cstrong>Card counting.\u003c/strong> Discards go face-down, so knowing when your only Eclipse is gone, or when the GM's Suns are used up, takes counting and memory. The balance math assumes nobody tracks this; in a 45-card deck a careful player can, and it helps with timing Hero Points and fortune effects.\u003c/li>\n\u003c/ul>\n"},{"id":"ae-19-why-the-average-isn-t-enough","title":"19. Why the average isn't enough","html":"\u003ch2 id=\"ae-19-why-the-average-isn-t-enough-19-why-the-average-isn-t-enough\">19. Why the average isn't enough\u003c/h2>\n\u003cp>Two 80-card example decks, both averaging exactly 10.5, with 2 Suns and 2 Eclipses each:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Steady:\u003c/strong> mostly 4s to 7s (2-5-9-12-13-13-11-7-4-0).\u003c/li>\n\u003cli>\u003cstrong>Swingy:\u003c/strong> mostly Aces, 2s, 9s and 10s (21-13-5-1-0-0-2-5-11-18).\u003c/li>\n\u003c/ul>\n\u003cp>A fighter makes three Strikes in a turn. The second takes −5 and the third −10, so the number needed on the draw rises from 8 to 13 to 18. A hit counts as 1, a crit as 2.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Strike\u003c/th>\n\u003cth>Need\u003c/th>\n\u003cth>d20\u003c/th>\n\u003cth>Steady deck\u003c/th>\n\u003cth>Swingy deck\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>First\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>50% hit, 15% crit → 0.80\u003c/td>\n\u003ctd>76% hit, 5% crit → 0.87\u003c/td>\n\u003ctd>50% hit, 21% crit → 0.91\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Second\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>35% hit, 5% crit → 0.45\u003c/td>\n\u003ctd>22% hit, 5% crit → 0.32\u003c/td>\n\u003ctd>24% hit, 5% crit → 0.34\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Third\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>10% hit, 5% crit → 0.20\u003c/td>\n\u003ctd>0% hit, 5% crit → 0.10\u003c/td>\n\u003ctd>16% hit, 5% crit → 0.26\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Turn total\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>1.45\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>1.29 (89%)\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>1.50 (103%)\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>The steady deck almost never misses the first Strike, but it almost never draws the 18+ it needs for a crit, and it can't land the third Strike without a Sun. The swingy deck misses more often, but its misses cost nothing extra and its high draws turn into crits and long-shot hits.\u003c/p>\n\u003cp>Saves work differently: a critical failure on a basic save doubles the damage you take, so extreme draws cut both ways, and decks differ by only a few percent. That's why the balance rules count both. The Strike balance holds when crits are worth more than double: with crits at 2.5 times a hit (typical for deadly weapons) or 3 times (fatal weapons), every sign deck stays within 97–103%, counting its ability as its price. Pisces is lowest (98.0% and 97.1%); the highest are Virgo at 2.5 times (101.3%) and Taurus at 3 times (101.7%).\u003c/p>\n"},{"id":"ae-20-the-sign-decks-against-a-d20","title":"20. The sign decks against a d20","html":"\u003ch2 id=\"ae-20-the-sign-decks-against-a-d20-20-the-sign-decks-against-a-d20\">20. The sign decks against a d20\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Average card total\u003c/th>\n\u003cth>Spread (SD; d20 5.77)\u003c/th>\n\u003cth>Natural 20 / 1\u003c/th>\n\u003cth>Cards per check\u003c/th>\n\u003cth>Fresh shuffle: Strike damage / save damage taken\u003c/th>\n\u003cth>Standard day: Strike damage / save damage taken\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>45\u003c/td>\n\u003ctd>11.44\u003c/td>\n\u003ctd>5.51\u003c/td>\n\u003ctd>4.4% / 4.4%\u003c/td>\n\u003ctd>1.96\u003c/td>\n\u003ctd>117% / 90%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>11.26\u003c/td>\n\u003ctd>4.65\u003c/td>\n\u003ctd>8.1% / 8.1%\u003c/td>\n\u003ctd>1.92\u003c/td>\n\u003ctd>113% / 93%\u003c/td>\n\u003ctd>99% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>51\u003c/td>\n\u003ctd>11.13\u003c/td>\n\u003ctd>5.72\u003c/td>\n\u003ctd>3.9% / 3.9%\u003c/td>\n\u003ctd>1.96\u003c/td>\n\u003ctd>114% / 93%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>55\u003c/td>\n\u003ctd>11.23\u003c/td>\n\u003ctd>5.70\u003c/td>\n\u003ctd>3.6% / 3.6%\u003c/td>\n\u003ctd>1.96\u003c/td>\n\u003ctd>113% / 93%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>59\u003c/td>\n\u003ctd>11.14\u003c/td>\n\u003ctd>5.19\u003c/td>\n\u003ctd>6.6% / 6.6%\u003c/td>\n\u003ctd>1.93\u003c/td>\n\u003ctd>110% / 94%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>63\u003c/td>\n\u003ctd>10.92\u003c/td>\n\u003ctd>5.79\u003c/td>\n\u003ctd>3.1% / 3.1%\u003c/td>\n\u003ctd>1.97\u003c/td>\n\u003ctd>110% / 94%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>67\u003c/td>\n\u003ctd>10.73\u003c/td>\n\u003ctd>5.41\u003c/td>\n\u003ctd>5.8% / 5.8%\u003c/td>\n\u003ctd>1.94\u003c/td>\n\u003ctd>108% / 96%\u003c/td>\n\u003ctd>100% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>71\u003c/td>\n\u003ctd>10.55\u003c/td>\n\u003ctd>4.80\u003c/td>\n\u003ctd>8.1% / 8.1%\u003c/td>\n\u003ctd>1.92\u003c/td>\n\u003ctd>106% / 97%\u003c/td>\n\u003ctd>99% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>10.91\u003c/td>\n\u003ctd>5.76\u003c/td>\n\u003ctd>2.6% / 2.6%\u003c/td>\n\u003ctd>1.97\u003c/td>\n\u003ctd>106% / 95%\u003c/td>\n\u003ctd>99% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>80\u003c/td>\n\u003ctd>10.83\u003c/td>\n\u003ctd>5.57\u003c/td>\n\u003ctd>4.9% / 4.9%\u003c/td>\n\u003ctd>1.95\u003c/td>\n\u003ctd>105% / 97%\u003c/td>\n\u003ctd>100% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>85\u003c/td>\n\u003ctd>10.45\u003c/td>\n\u003ctd>4.69\u003c/td>\n\u003ctd>9.0% / 9.0%\u003c/td>\n\u003ctd>1.91\u003c/td>\n\u003ctd>99% / 101%\u003c/td>\n\u003ctd>99% / 101%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>90\u003c/td>\n\u003ctd>10.52\u003c/td>\n\u003ctd>5.73\u003c/td>\n\u003ctd>4.4% / 2.2%\u003c/td>\n\u003ctd>1.97\u003c/td>\n\u003ctd>103% / 97%\u003c/td>\n\u003ctd>101% / 98%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>&quot;Average card total&quot; and &quot;Spread&quot; (its standard deviation) come from the deck's own cards, before exhaustion. The damage figures count each ability as its price, added back as a bonus on every check; Taurus's Unyielding is played out instead.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Virgo's extra Sun\u003c/strong> gives natural 20s on 4.4% of its checks and natural 1s on 2.2%, paid for with weaker number cards.\u003c/li>\n\u003cli>\u003cstrong>Taurus's eight Jokers\u003c/strong> give it natural 20s and 1s on 9.0% of its checks each, the most of any sign, paid for with steady number cards.\u003c/li>\n\u003cli>\u003cstrong>Cards per check\u003c/strong> average 2 − (Jokers ÷ deck size) over a day, about 1.91–1.97 for the twelve decks.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-20-the-sign-decks-against-a-d20-short-days-and-long-days\">Short days and long days\u003c/h3>\n\u003cp>Edge in points, with Strike damage compared with a d20, counting abilities as in the table above. The highest exhaustion level reached by the end of a long day is in brackets. On a standard day only Aries reaches Exhausted 2 (around check 46) and Taurus never tires. Nobody collapses, even on a long day.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Short day (25 checks)\u003c/th>\n\u003cth>Standard day (50 checks)\u003c/th>\n\u003cth>Long day (80 checks)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Aries\u003c/td>\n\u003ctd>45\u003c/td>\n\u003ctd>+1.1 · 115%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.3 · 84% (Exhausted 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leo\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>+1.0 · 113%\u003c/td>\n\u003ctd>0.0 · 99%\u003c/td>\n\u003ctd>−1.2 · 85% (Exhausted 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sagittarius\u003c/td>\n\u003ctd>51\u003c/td>\n\u003ctd>+0.9 · 114%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.1 · 86% (Exhausted 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Libra\u003c/td>\n\u003ctd>55\u003c/td>\n\u003ctd>+0.9 · 113%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.0 · 87% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aquarius\u003c/td>\n\u003ctd>59\u003c/td>\n\u003ctd>+0.8 · 110%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−0.9 · 89% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gemini\u003c/td>\n\u003ctd>63\u003c/td>\n\u003ctd>+0.7 · 110%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−0.9 · 89% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancer\u003c/td>\n\u003ctd>67\u003c/td>\n\u003ctd>+0.6 · 108%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−0.8 · 90% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scorpio\u003c/td>\n\u003ctd>71\u003c/td>\n\u003ctd>+0.5 · 106%\u003c/td>\n\u003ctd>0.0 · 99%\u003c/td>\n\u003ctd>−0.7 · 91% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pisces\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>+0.5 · 106%\u003c/td>\n\u003ctd>0.0 · 99%\u003c/td>\n\u003ctd>−0.7 · 90% (Exhausted 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Capricorn\u003c/td>\n\u003ctd>80\u003c/td>\n\u003ctd>+0.4 · 105%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−0.6 · 92% (Exhausted 1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Taurus\u003c/td>\n\u003ctd>85\u003c/td>\n\u003ctd>0.0 · 99%\u003c/td>\n\u003ctd>0.0 · 99%\u003c/td>\n\u003ctd>0.0 · 99% (never tires)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Virgo\u003c/td>\n\u003ctd>90\u003c/td>\n\u003ctd>+0.1 · 103%\u003c/td>\n\u003ctd>0.0 · 101%\u003c/td>\n\u003ctd>−0.7 · 92% (Exhausted 1)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Fire decks deal 13–17% more Strike damage than a d20 on a fresh shuffle, and on a long day all three reach Exhausted 3, fatigued. Earth decks barely move either way, and Taurus, whose one deck-out costs nothing even on a long day, doesn't move at all. No deck collapses within 80 checks; Aries, the first to, reaches Exhausted 4 around check 93.\u003c/p>\n\u003ch3 id=\"ae-20-the-sign-decks-against-a-d20-through-the-day\">Through the day\u003c/h3>\n\u003cp>Every deck except Taurus is ahead of a d20 early in the day and behind it late. Edge in the first and last quarters of a standard day: Fire +0.9 to +1.2 early and −1.0 to −1.4 late, Air +0.7 to +0.9 and −1.1 to −1.3, Water +0.5 to +0.6 and −1.3 to −1.4, Capricorn +0.4 and −1.0, Virgo +0.1 and −0.5. Unyielding cancels Taurus's one deck-out, so it stays flat all day.\u003c/p>\n"},{"id":"ae-21-checks-and-luck-against-a-d20","title":"21. Checks and luck against a d20","html":"\u003ch2 id=\"ae-21-checks-and-luck-against-a-d20-21-checks-and-luck-against-a-d20\">21. Checks and luck against a d20\u003c/h2>\n\u003ch3 id=\"ae-21-checks-and-luck-against-a-d20-the-fate-deck\">The Fate Deck\u003c/h3>\n\u003cp>Average card total 10.49; natural 20 and natural 1 each 5.8% (d20 5%); monster Strike damage 100.5% of a d20's and damage monsters take on basic saves 100.3%; within 7.4 percentage points of a d20 at every number needed. Long shots land a little more often: needing a 20, 9% instead of 5%. The face cards change none of this, so the numbers hold with wild magic or without.\u003c/p>\n\u003ch3 id=\"ae-21-checks-and-luck-against-a-d20-flat-checks\">Flat checks\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Flat check DC\u003c/th>\n\u003cth>Card needed\u003c/th>\n\u003cth>Chance\u003c/th>\n\u003cth>d20\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Any number card\u003c/td>\n\u003ctd>97%\u003c/td>\n\u003ctd>90%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>2 or higher\u003c/td>\n\u003ctd>80%\u003c/td>\n\u003ctd>85–75%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>3 or higher\u003c/td>\n\u003ctd>68%\u003c/td>\n\u003ctd>70–65%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>4 or higher\u003c/td>\n\u003ctd>56%\u003c/td>\n\u003ctd>60–55%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>DC − 6 (5 for DC 11, up to 10 for DC 16)\u003c/td>\n\u003ctd>51%, 46%, 41%, 35%, 28%, 21%\u003c/td>\n\u003ctd>50%, 45%, 40%, 35%, 30%, 25%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>21%\u003c/td>\n\u003ctd>20%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>Sun\u003c/td>\n\u003ctd>3%\u003c/td>\n\u003ctd>15–5%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Dying:\u003c/strong> with no help, a character who goes down at dying 1 dies 29% of the time (d20: 31%), at dying 2 57% (d20: 59%), at dying 3 81% (d20: 82%). Single recovery checks are a little less swingy: critical results come up 3% of the time instead of 5–15%.\u003c/li>\n\u003cli>\u003cstrong>Concealment\u003c/strong> (DC 5) passes 80% of the time, the same as a d20.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-21-checks-and-luck-against-a-d20-fortune-misfortune-and-rerolls\">Fortune, misfortune and rerolls\u003c/h3>\n\u003cp>Success chance at typical numbers needed (5 to 16):\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Effect\u003c/th>\n\u003cth>d20\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Fortune (keep the better)\u003c/td>\n\u003ctd>+22 percentage points\u003c/td>\n\u003ctd>+17 to +21.7, depending on the deck; the steadiest decks (Leo, Scorpio and Taurus) gain least\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Misfortune (keep the worse)\u003c/td>\n\u003ctd>−22 percentage points\u003c/td>\n\u003ctd>−17 to −22.5; the steadiest decks lose least\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Use the better result&quot; reroll\u003c/td>\n\u003ctd>turns 46% of failures into successes\u003c/td>\n\u003ctd>35–51%, never worse\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>&quot;Use the new result&quot; rerolls usually cost something (a Hero Point, a once-a-day feat), and the player sees the card they'd keep before deciding, so most players skip the reroll when that card is low:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>&quot;Use the new result&quot; reroll\u003c/th>\n\u003cth>Always rerolls a failure\u003c/th>\n\u003cth>Rerolls only with a 1-in-3 chance or better\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>d20\u003c/td>\n\u003ctd>46% succeed · 9.7% get worse\u003c/td>\n\u003ctd>spends on 75% of failures · 53% succeed · 7.2% worse\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cards (keep the most recent card)\u003c/td>\n\u003ctd>28–37% succeed · 4.5–9.9% worse\u003c/td>\n\u003ctd>spends on 31–59% of failures · 49–64% succeed · 1.1–3.0% worse\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>By deck, for a player who rerolls only with a 1-in-3 chance or better:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Deck\u003c/th>\n\u003cth>Failures they'd spend it on\u003c/th>\n\u003cth>Spends that succeed\u003c/th>\n\u003cth>Spends that make it worse\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Aries\u003c/td>\n\u003ctd>59%\u003c/td>\n\u003ctd>58%\u003c/td>\n\u003ctd>2.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Libra\u003c/td>\n\u003ctd>56%\u003c/td>\n\u003ctd>56%\u003c/td>\n\u003ctd>1.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancer\u003c/td>\n\u003ctd>53%\u003c/td>\n\u003ctd>54%\u003c/td>\n\u003ctd>2.5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scorpio\u003c/td>\n\u003ctd>39%\u003c/td>\n\u003ctd>58%\u003c/td>\n\u003ctd>3.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pisces\u003c/td>\n\u003ctd>54%\u003c/td>\n\u003ctd>53%\u003c/td>\n\u003ctd>1.3%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Taurus\u003c/td>\n\u003ctd>31%\u003c/td>\n\u003ctd>64%\u003c/td>\n\u003ctd>2.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Virgo\u003c/td>\n\u003ctd>55%\u003c/td>\n\u003ctd>49%\u003c/td>\n\u003ctd>1.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fate Deck\u003c/td>\n\u003ctd>52%\u003c/td>\n\u003ctd>52%\u003c/td>\n\u003ctd>2.5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cem>d20\u003c/em>\u003c/td>\n\u003ctd>\u003cem>75%\u003c/em>\u003c/td>\n\u003ctd>\u003cem>53%\u003c/em>\u003c/td>\n\u003ctd>\u003cem>7.2%\u003c/em>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"ae-21-checks-and-luck-against-a-d20-held-draws-and-lucky-numbers\">Held draws and lucky numbers\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Held draws:\u003c/strong> a character who holds a draw every combat round and skips draws too low to hit wastes about 3–9 cards a day, at most about 0.12 points of edge.\u003c/li>\n\u003cli>\u003cstrong>Lucky number:\u003c/strong> drawn from the Fate Deck, it comes up 5.4–6.3% of the time across the twelve signs (d20: 5%).\u003c/li>\n\u003c/ul>\n"},{"id":"ae-22-the-damage-deck-against-dice","title":"22. The damage deck against dice","html":"\u003ch2 id=\"ae-22-the-damage-deck-against-dice-22-the-damage-deck-against-dice\">22. The damage deck against dice\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Exact averages.\u003c/strong> Without Jokers, every row of the die table in chapter 10 has exactly the die's average (d4 2.5, d6 3.5, d8 4.5, d10 5.5, d12 6.5). Spreads are close to real dice: d4 1.02 (die 1.12), d6 1.50 (1.71), d8 2.58 (2.29), d10 2.87 (2.87), d12 2.87 (3.45). The d12 can't show a 1 or a 12, but its average is exact.\u003c/li>\n\u003cli>\u003cstrong>Jokers add a little.\u003c/strong> Each damage card is a Joker about 1 time in 21. The players' rule adds 3–4% to a die's average, and the monsters' rule 8–9%:\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Die\u003c/th>\n\u003cth>No Joker\u003c/th>\n\u003cth>Player (max)\u003c/th>\n\u003cth>Monster (max + another die)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>d4\u003c/td>\n\u003ctd>2.50\u003c/td>\n\u003ctd>2.57\u003c/td>\n\u003ctd>2.70\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d6\u003c/td>\n\u003ctd>3.50\u003c/td>\n\u003ctd>3.62\u003c/td>\n\u003ctd>3.80\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d8\u003c/td>\n\u003ctd>4.50\u003c/td>\n\u003ctd>4.67\u003c/td>\n\u003ctd>4.90\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d10\u003c/td>\n\u003ctd>5.50\u003c/td>\n\u003ctd>5.71\u003c/td>\n\u003ctd>6.00\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d12\u003c/td>\n\u003ctd>6.50\u003c/td>\n\u003ctd>6.76\u003c/td>\n\u003ctd>7.10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Bigger attacks see more Jokers:\u003c/strong> 9% of 2-die rolls, 25% of 6-die rolls, 44% of 12-die rolls (a dragon's breath) and 62% of 20-die rolls. For monsters those Jokers chain into extra dice, so the biggest monster attacks are where the damage deck bites hardest. Overall, monster damage runs about 8–9% above the averages of the dice it's written in and the party's about 3–4%, so fights run slightly deadlier for the party.\u003c/li>\n\u003cli>\u003cstrong>Big pools.\u003c/strong> Under the big-pools rule in chapter 10, 20d6 swings about ±3 instead of ±8.\u003c/li>\n\u003c/ul>\n"},{"id":"ae-23-pricing-the-abilities","title":"23. Pricing the abilities","html":"\u003ch2 id=\"ae-23-pricing-the-abilities-23-pricing-the-abilities\">23. Pricing the abilities\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Valued over a standard day.\u003c/strong> Each ability is worth what it adds over a standard day of 50 checks (three or four fights of initiative, two Strikes a round and a basic save every other round, plus exploration checks), drawing one card at a time with reshuffles and exhaustion.\u003c/li>\n\u003cli>\u003cstrong>Value is counted in hits.\u003c/strong> A Strike hit is worth 1 and a crit 2; damage avoided on a basic save counts the same way (a failed save is 1, a critical failure 2); other checks are worth half a hit per success. A d20 character earns about 18 hits of Strike damage a day and takes about 5 from basic saves.\u003c/li>\n\u003cli>\u003cstrong>The price is the number of pips worth the same value\u003c/strong> at that deck size, smoothed across sizes.\u003c/li>\n\u003cli>\u003cstrong>Unyielding is priced exactly.\u003c/strong> It takes one level of exhaustion off every check after the day's first deck-out, so its price is the pips that raise the average by the same amount over a standard day. That matches its worth in hits to within a pip, and it matches how the Lab test handles it (by playing it out).\u003c/li>\n\u003cli>\u003cstrong>Assumptions about play.\u003c/strong> Players use each ability sensibly: Twin Draw on an attack, Loose Arrow on a first card of 4 or lower, Sift only when the swap helps, Dream Tide on a failed check whose low card is 5 or less, Crowned's Sun kept for a second Strike, and Sting's Eclipse played on an enemy's attack. Shell covers every ally's saves, so its value counts a party of four. Water Bearer is once per day, so it's priced as one new check on the first failed attack or save of the day, whoever makes it.\u003c/li>\n\u003cli>\u003cstrong>The sign decks.\u003c/strong> Each sign deck pays its size's price, rounded to a whole pip, so for every sign but Taurus the ability gives back what the pips cost to within 0.1 hits a day. Taurus is judged by playing Unyielding out (below).\u003c/li>\n\u003cli>\u003cstrong>The balance rules add the price back.\u003c/strong> A deck with an ability is balanced if, with the price returned as a bonus on every check, it passes the usual rules: a day edge within ±0.1, and Strike damage and damage taken on saves within 97–103% of a d20's. The Lab test does this for you, and plays Taurus's Unyielding out exactly; Taurus passes that way too.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-23-pricing-the-abilities-what-each-ability-is-worth\">What each ability is worth\u003c/h3>\n\u003cp>Value in hits a day (a Strike hit is 1, a crit 2), across deck sizes:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Ability\u003c/th>\n\u003cth>Worth, in hits a day\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>First Blood (Aries)\u003c/td>\n\u003ctd>0.9–1.0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Crowned (Leo)\u003c/td>\n\u003ctd>0.7–0.8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Loose Arrow (Sagittarius)\u003c/td>\n\u003ctd>1.0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Weigh the Odds (Libra)\u003c/td>\n\u003ctd>0.5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Water Bearer (Aquarius)\u003c/td>\n\u003ctd>0.4–0.5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Twin Draw (Gemini)\u003c/td>\n\u003ctd>0.7–0.9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shell (Cancer)\u003c/td>\n\u003ctd>1.1–1.3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sting (Scorpio)\u003c/td>\n\u003ctd>1.4–1.9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dream Tide (Pisces)\u003c/td>\n\u003ctd>0.2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Second Ascent (Capricorn)\u003c/td>\n\u003ctd>0.1–0.4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unyielding (Taurus)\u003c/td>\n\u003ctd>0.6–3.5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sift (Virgo)\u003c/td>\n\u003ctd>0.4–0.5\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Prices are set on decks with one Sun and one Eclipse, and they hold for the twelve sign decks, which use five different Joker setups.\u003c/p>\n\u003ch3 id=\"ae-23-pricing-the-abilities-what-an-ability-does-to-a-deck\">What an ability does to a deck\u003c/h3>\n\u003cp>Paying the price weakens every check a little, which costs attacks, defense and other checks; the ability puts the value back in its own area. In hits a day:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Price\u003c/th>\n\u003cth>Cost to attacks\u003c/th>\n\u003cth>Cost to defense\u003c/th>\n\u003cth>Cost to other checks\u003c/th>\n\u003cth>The ability adds\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Aries\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>−0.7\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>+0.9 to attacks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leo\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>−0.6\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>+0.7 to attacks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sagittarius\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>−0.8\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>+1.0 to attacks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Libra\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>−0.4\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>+0.5 to initiative and the first attack\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aquarius\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>−0.3\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>+0.4 to any check, any ally\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gemini\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>−0.7\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>+0.8 to attacks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancer\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>−0.9\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>+1.1 to the party's saves\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scorpio\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>−1.1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.2\u003c/td>\n\u003ctd>+1.3 to defense\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pisces\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>+0.2 to any check\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Capricorn\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>+0.1 to any check\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Taurus\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>−0.6\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>−0.1\u003c/td>\n\u003ctd>+0.6 to every check after its deck-out\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Virgo\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>−0.3\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>0.0\u003c/td>\n\u003ctd>+0.4 to any check\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Attack abilities\u003c/strong> (Aries, Leo, Sagittarius) turn a little defense into more damage.\u003c/li>\n\u003cli>\u003cstrong>Protective abilities\u003c/strong> (Cancer, Scorpio) cost 13 to 18 pips, so the deck's own attacks deal 5–6% less than they would at full pips; it's paid back as more than a hit a day of damage kept off the party.\u003c/li>\n\u003cli>\u003cstrong>Taurus\u003c/strong> pays 12 pips and never tires on a standard day: its edge stays flat from the first check to the last instead of starting high and ending low. Its eight Jokers make it run out a little later than the one-Sun decks its price is set on, so Unyielding saves it a little less than the price (0.6 hits a day against 0.8); played out, the deck still passes the Lab test.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-23-pricing-the-abilities-abilities-on-custom-decks\">Abilities on custom decks\u003c/h3>\n\u003cp>For example, the 50-card starter that buys First Blood (13.6) has, counting First Blood at its price, a day edge of −0.01, 100.5% of a d20's Strike damage and 99.3% of its damage on saves. Without the ability, the same deck would be 0.27 points of edge short.\u003c/p>\n\u003cp>\u003cstrong>Any starter, any ability.\u003c/strong> A starter deck pays for an ability by flipping from the big end (10 → A first), or by moving a card or two down when the flips don't add up to the price. Every starter with even Jokers or an extra Sun stays balanced with any of the twelve abilities. With more Eclipses than Suns, every pairing but one does too, twenty of them after a different set of flips or one swing-dial move, most of those in the no-Sun decks. The one that doesn't is Sting in the 65-card deck with no Sun, which takes 103–104% of a d20's damage on saves.\u003c/p>\n\u003ch3 id=\"ae-23-pricing-the-abilities-the-sign-decks-without-abilities\">The sign decks without abilities\u003c/h3>\n\u003cp>Without their abilities, the sign decks as printed play weak: 0.02 to 0.46 points of day edge short, and Scorpio and Cancer also drop to about 93–95% of a d20's Strike damage. With their prices added back (chapter 12), every one passes the Lab test. Pisces and Capricorn, whose abilities cost 2 pips and 1 pip, already pass without any change, but the changes restore their full pip totals.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Deck code without the ability\u003c/th>\n\u003cth>Standard day: edge · Strike damage / save damage taken\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>8-6-2-1-0-2-3-6-7-8 / 1-1\u003c/td>\n\u003ctd>−0.02 · 99.4% / 98.4%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>1-2-4-4-7-7-9-6-4-0 / 2-2\u003c/td>\n\u003ctd>−0.01 · 99.5% / 99.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>11-7-3-1-0-0-3-5-7-12 / 1-1\u003c/td>\n\u003ctd>−0.02 · 100.3% / 98.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>12-8-4-0-0-0-2-6-9-12 / 1-1\u003c/td>\n\u003ctd>0.00 · 100.2% / 98.6%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>5-6-6-4-5-5-5-6-6-7 / 2-2\u003c/td>\n\u003ctd>0.00 · 100.2% / 99.3%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>14-10-5-1-0-0-1-4-9-17 / 1-1\u003c/td>\n\u003ctd>−0.01 · 100.2% / 99.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>9-8-6-4-3-5-5-5-7-11 / 2-2\u003c/td>\n\u003ctd>−0.01 · 100.4% / 99.5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>0-5-9-10-10-9-8-6-4-4 / 3-3\u003c/td>\n\u003ctd>0.00 · 99.8% / 99.4%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>20-11-4-1-0-0-1-6-12-18 / 1-1\u003c/td>\n\u003ctd>−0.01 · 99.3% / 98.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>14-11-7-5-2-3-3-6-10-15 / 2-2\u003c/td>\n\u003ctd>+0.01 · 100.3% / 99.5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>0-5-9-13-14-13-11-8-4-0 / 4-4\u003c/td>\n\u003ctd>0.00 · 100.3% / 100.4%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>24-14-7-1-0-0-2-7-13-19 / 2-1\u003c/td>\n\u003ctd>−0.01 · 101.6% / 98.3%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n"},{"id":"ae-24-how-sure-the-build-table-is","title":"24. How sure the build table is","html":"\u003ch2 id=\"ae-24-how-sure-the-build-table-is-24-how-sure-the-build-table-is\">24. How sure the build table is\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Every starter deck passes the Lab test.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>A deck that meets its row is balanced,\u003c/strong> from smooth shapes to lumpy ones with gaps, at every size and Joker setup in the build table. The rare exception misses the balance limits by less than 1 percentage point. The Deck Lab gives the exact answer for any deck.\u003c/li>\n\u003cli>\u003cstrong>The ranges are a safe zone, not the whole balanced region.\u003c/strong> A deck a few swing points outside can still pass the Lab test. All twelve sign decks sit inside their swing ranges, with their pip totals lowered by their abilities' prices; the six at in-between sizes use the range the Deck Lab works out between the two rows.
