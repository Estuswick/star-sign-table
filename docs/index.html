03c/strong> drawing the last card of your deck. It forces a reshuffle and gives you a level of exhaustion (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Destined:\u003c/strong> the character whose action completed the fourth set of face cards. Wild magic centers on them (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Die table:\u003c/strong> the table that reads a damage card as a d4, d6, d8, d10 or d12 (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Eclipse:\u003c/strong> the black Joker, a natural 1 (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Edge, day edge:\u003c/strong> how far a deck&#39;s average card total sits above 10.5 once its exhaustion penalty is counted. Day edge is the edge over a standard day (chapter 17).\u003c/li>\n\u003cli>\u003cstrong>Element:\u003c/strong> Fire, Air, Water or Earth. It sets a sign deck&#39;s size (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Exhaustion, Exhausted 1–4:\u003c/strong> the card engine&#39;s own track: −2 per level to your checks, fatigued at Exhausted 3, collapse at Exhausted 4 (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Face card:\u003c/strong> a Jack, Queen or King. Only the Fate Deck holds them, and they feed wild magic (chapters 9 and 14).\u003c/li>\n\u003cli>\u003cstrong>Fate Deck:\u003c/strong> the GM&#39;s 92-card deck, for monsters, minions, flat checks and secret checks (chapter 9).\u003c/li>\n\u003cli>\u003cstrong>Fate Deck page:\u003c/strong> the web tool that lays out the Fate Deck and resolves wild magic.\u003c/li>\n\u003cli>\u003cstrong>Flip:\u003c/strong> replace a card with its mirror, using the pip dial (13.5).\u003c/li>\n\u003cli>\u003cstrong>Fresh shuffle:\u003c/strong> your whole deck, shuffled at the start of each day (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Held draw:\u003c/strong> cards drawn now, set aside face-up and used later in place of a draw (chapter 7).\u003c/li>\n\u003cli>\u003cstrong>Joker:\u003c/strong> a Sun or an Eclipse.\u003c/li>\n\u003cli>\u003cstrong>Joker setup:\u003c/strong> a deck&#39;s Suns and Eclipses, written Suns / Eclipses, such as 1 / 2 (13.2).\u003c/li>\n\u003cli>\u003cstrong>Kept Sun, kept Eclipse:\u003c/strong> a Joker that Leo&#39;s or Scorpio&#39;s ability sets aside to play later. It isn&#39;t a held draw: one you haven&#39;t played goes back into your deck at your next night&#39;s rest (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Lab test:\u003c/strong> the Deck Lab&#39;s exact test of whether a deck is balanced.\u003c/li>\n\u003cli>\u003cstrong>Long day, short day:\u003c/strong> 80 and 25 checks, used to see how decks play away from the standard day (chapter 20).\u003c/li>\n\u003cli>\u003cstrong>Mirror:\u003c/strong> a card&#39;s partner the same distance from the middle: Ace and 10, 2 and 9, 3 and 8, 4 and 7, 5 and 6 (13.5).\u003c/li>\n\u003cli>\u003cstrong>Modality:\u003c/strong> Cardinal, Fixed or Mutable. It sets a sign deck&#39;s shape and the style of its ability (chapters 11 and 12).\u003c/li>\n\u003cli>\u003cstrong>Most recent card:\u003c/strong> the card a &quot;use the new result&quot; reroll keeps (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Natural 20, natural 1:\u003c/strong> a Sun or an Eclipse. A card total of 20 is not a natural 20 (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>New check:\u003c/strong> a brand-new two-card check, drawn in place of an old one (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Number card:\u003c/strong> Ace to 10. Aces count as 1.\u003c/li>\n\u003cli>\u003cstrong>Number needed:\u003c/strong> the card total a check needs to succeed, once modifiers are counted.\u003c/li>\n\u003cli>\u003cstrong>Once per day, once per encounter:\u003c/strong> how often an ability can be used. Once per day resets at a night&#39;s rest (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Opposite:\u003c/strong> the combination you get by swapping ♥ for ♠ and ♦ for ♣. It has the same odds, and every bad combination is the opposite of a good one (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Pip, pip total:\u003c/strong> a number card&#39;s value (Ace = 1), and the sum of a deck&#39;s number cards, which sets its average (13.4).\u003c/li>\n\u003cli>\u003cstrong>Pip dial, swing dial:\u003c/strong> the two ways to adjust a deck. The pip dial flips a card to its mirror and changes the pip total; the swing dial pushes two cards apart or pulls them together and changes the swing points (13.5).\u003c/li>\n\u003cli>\u003cstrong>Price:\u003c/strong> the pips a sign ability takes off the pip total (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Set:\u003c/strong> three face cards placed together. Wild magic goes off when the fourth set is complete (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Shape:\u003c/strong> how often a deck lands on each card total. \u003cstrong>Steady\u003c/strong> decks bunch near the middle; \u003cstrong>swingy\u003c/strong> decks spread toward the ends (chapter 19).\u003c/li>\n\u003cli>\u003cstrong>Sign deck:\u003c/strong> one of the twelve star-sign decks (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Standard day:\u003c/strong> the day all balance is measured over: 50 checks across 3–4 encounters and exploration (chapter 17).\u003c/li>\n\u003cli>\u003cstrong>Standard pack:\u003c/strong> 52 cards plus its Jokers, usually one colored and one black.\u003c/li>\n\u003cli>\u003cstrong>Starter deck:\u003c/strong> the ready-made deck in each row of the build table (13.4).\u003c/li>\n\u003cli>\u003cstrong>Sun:\u003c/strong> the colored Joker, a natural 20 (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Surge rank, surge DC:\u003c/strong> wild magic&#39;s rank (half the Destined&#39;s level, rounded up) and DC (the standard DC for the Destined&#39;s level) (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Swing points, swing range:\u003c/strong> a score for how far a deck&#39;s cards sit from the middle (Ace and 10 score 10, down to 0 for 5 and 6), and the range each build-table row allows (13.3).\u003c/li>\n\u003cli>\u003cstrong>Wild magic:\u003c/strong> the effect that goes off when the Fate Deck&#39;s face cards fill four sets (chapter 14).\u003c/li>\n\u003c/ul>\n"},{"id":"c2-appendix-c-license-notes","title":"Appendix C. License notes","html":"\u003ch2 id=\"c2-appendix-c-license-notes-appendix-c-license-notes\">Appendix C. License notes\u003c/h2>\n\u003cp>These rules are original work built on the game mechanics of a d20 roleplaying game released under the ORC License. They use that game&#39;s mechanics (checks, DCs, degrees of success, conditions, traits and actions) and leave out its publisher&#39;s reserved material: trademarks, product and setting names, and named characters, places, spells, feats and items. They are written against the ORC-licensed rules only: nothing here relies on material released under the Open Game License, and no spell, monster or setting names are taken from other publishers&#39; games.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Before publishing,\u003c/strong> add what the ORC License asks of a product built on licensed material: the ORC Notice, an attribution statement crediting the licensed rules these build on, and a statement of your own Reserved Material.\u003c/li>\n\u003cli>\u003cstrong>What you might reserve:\u003c/strong> the Star-Sign Card Engine name, the Sun and the Eclipse as card names, the twelve star-sign decks and their ability names, the wild magic effect names, the Deck Lab and the Fate Deck page.\u003c/li>\n\u003cli>\u003cstrong>Naming the base game\u003c/strong> in a compatibility statement is covered by that publisher&#39;s own compatibility terms, not by the ORC License.\u003c/li>\n\u003cli>This is general information, not legal advice.\u003c/li>\n\u003c/ul>\n"}]}},"classic":{"stars":{"title":"Written in the Stars: d20 Classic","sections":[{"id":"sd-introduction","title":"Introduction","html":"\u003cp>\u003cem>Playing fifth edition, 3.5 and Pathfinder First Edition with a deck of cards. An unofficial add-on, first release · 28 September 2026.\u003c/em>\u003c/p>\n\u003cp>Put the d20 away. Every check is two playing cards drawn one at a time and added together. Each player draws from a deck built around their character&#39;s star sign, and that deck is also their stamina: draw your last card and weariness starts to set in. The GM draws from a Fate Deck, and damage comes from a shared damage deck.\u003c/p>\n\u003cp>This booklet is for games where only a natural 20 crits: fifth edition, 3.5 and Pathfinder First Edition. Everything else plays as written: your character sheet, ability scores, AC, DCs, advantage, spells and feats. What changes is how luck feels: it has a shape, a memory and a cost.\u003c/p>\n\u003cp>The decks here are balanced for all three games at once. The complete rules are in \u003cem>Core Engine: d20 Classic\u003c/em>, and the numbers behind the decks are at the back of this booklet, in The Math.\u003c/p>\n"},{"id":"sd-at-a-glance","title":"At a glance","html":"\u003ch2 id=\"sd-at-a-glance-at-a-glance\">At a glance\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>With dice\u003c/th>\n\u003cth>With the cards\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Roll a d20 and add your modifier\u003c/td>\n\u003ctd>\u003cstrong>Draw two cards and add them\u003c/strong> (Ace = 1, so 2 to 20), then add your modifier\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Natural 20\u003c/td>\n\u003ctd>\u003cstrong>The Sun\u003c/strong> (the colored Joker): it counts as 20; on an attack it always hits and is the only card that crits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Natural 1\u003c/td>\n\u003ctd>\u003cstrong>The Eclipse\u003c/strong> (the black Joker): it counts as 1; on an attack it always misses\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical hit on a 19–20 or wider\u003c/td>\n\u003ctd>\u003cstrong>Only the Sun crits.\u003c/strong> A wider range becomes a bigger crit on a Sun\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Advantage / disadvantage\u003c/td>\n\u003ctd>\u003cstrong>Draw 3 cards and keep the best pair\u003c/strong> (advantage) or the worst pair (disadvantage)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rerolls, Heroic Inspiration, luck\u003c/td>\n\u003ctd>\u003cstrong>Draw a third card\u003c/strong> and pair it, as the reroll&#39;s wording says\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Extra dice on a check (Bardic Inspiration dice, \u003cem>guidance\u003c/em>, \u003cem>bless\u003c/em>)\u003c/td>\n\u003ctd>\u003cstrong>One damage-deck card per die,\u003c/strong> read as that die\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The GM rolls for monsters\u003c/td>\n\u003ctd>\u003cstrong>The GM draws from the Fate Deck,\u003c/strong> a deck of their own\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Damage dice and percentile rolls\u003c/td>\n\u003ctd>\u003cstrong>The damage deck:\u003c/strong> one card per die, read on the die table\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>—\u003c/td>\n\u003ctd>\u003cstrong>New: weariness.\u003c/strong> Running out of cards forces a reshuffle and costs you a level of weariness\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"sd-at-a-glance-what-stays-the-same\">What stays the same\u003c/h3>\n\u003cp>Your character sheet, ability scores, proficiency, AC, DCs and the action economy. Multiple attacks, spell slots, rests, conditions and your game&#39;s own exhaustion or fatigue work as written. Every rule that talks about the d20 still works; it just reads the card total instead.\u003c/p>\n"},{"id":"sd-what-you-need","title":"What you need","html":"\u003ch2 id=\"sd-what-you-need-what-you-need\">What you need\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>For each player:\u003c/strong> their deck, built from standard packs (52 cards plus Jokers). A sign deck needs 1 to 4 packs depending on the sign; only Aries fits in one.\u003c/li>\n\u003cli>\u003cstrong>For the GM:\u003c/strong> the Fate Deck, 80 cards built from 5 packs: Ace to 10 in set numbers, plus 2 Suns and 2 Eclipses.\u003c/li>\n\u003cli>\u003cstrong>For the table:\u003c/strong> a damage deck, one standard pack with the face cards removed (42 cards, Jokers included).\u003c/li>\n\u003cli>\u003cstrong>Optional:\u003c/strong> the Star-Sign Deck Lab, set to d20 Classic. It builds and tests player decks, loads every sign deck and starter deck, and tests the whole table&#39;s decks at once.\u003c/li>\n\u003c/ul>\n"},{"id":"sd-making-a-check","title":"Making a check","html":"\u003ch2 id=\"sd-making-a-check-making-a-check\">Making a check\u003c/h2>\n\u003cp>Draw a card, then a second, and add them. Add your modifier and compare the total with the DC or AC exactly as you would with a d20.\u003c/p>\n\u003cblockquote>\n\u003cp>Your fighter attacks a troll with AC 15 and a +7 bonus. You draw a 3, then a 6: 9 + 7 = 16, a hit. Only a Sun would have been a critical hit.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>A Joker ends the draw.\u003c/strong> If your first card is a Sun, stop: you&#39;ve drawn a natural 20, and the check cost only one card. An Eclipse works the same way as a natural 1. A Joker drawn second still counts as that natural result.\u003c/p>\n\u003cp>\u003cstrong>A card total of 20 isn&#39;t a natural 20.\u003c/strong> Two 10s make a 20, which hits or succeeds like any other 20. Only a Sun is a natural 20.\u003c/p>\n\u003cp>\u003cstrong>Discard face-down.\u003c/strong> Nobody looks back through a discard pile, so keeping track of what&#39;s left takes memory.\u003c/p>\n\u003ch3 id=\"sd-making-a-check-why-two-cards-feel-different-from-one-die\">Why two cards feel different from one die\u003c/h3>\n\u003cp>A d20 gives every number the same 5% chance. Two cards added together don&#39;t: middle card totals like 10 and 11 come up often, and the extremes rarely. Each deck bends that shape its own way. A deck heavy in 5s and 6s lands near its average most of the time. A deck of mostly Aces and 10s swings between great and awful.\u003c/p>\n\u003cp>None of this makes one deck better than another. Every deck is tuned to be as fair as a d20 over a standard day; a steady deck and a swingy deck just get there by different roads.\u003c/p>\n"},{"id":"sd-critical-hits-and-natural-1s","title":"Critical hits and natural 1s","html":"\u003ch2 id=\"sd-critical-hits-and-natural-1s-critical-hits-and-natural-1s\">Critical hits and natural 1s\u003c/h2>\n\u003cp>\u003cstrong>Only the Sun crits.\u003c/strong> On an attack, a Sun always hits and an Eclipse always misses. Everything else about hitting works as written.\u003c/p>\n\u003ch3 id=\"sd-critical-hits-and-natural-1s-fifth-edition\">Fifth edition\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>A Sun is a critical hit.\u003c/strong> Draw the attack&#39;s damage dice twice, as your game says.\u003c/li>\n\u003cli>\u003cstrong>A wider crit range becomes a bigger crit.\u003c/strong> A feature that crits on a 19–20 gives a Sun three sets of damage dice instead of two; 18–20 gives four. Each extra number in the crit range adds one set.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"sd-critical-hits-and-natural-1s-3-5-and-pathfinder-first-edition\">3.5 and Pathfinder First Edition\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Only the Sun threatens.\u003c/strong> Confirm it with a normal attack draw at the same bonus; if that hits, it&#39;s a critical hit. The confirming draw costs cards like any check.\u003c/li>\n\u003cli>\u003cstrong>A weapon&#39;s threat range becomes a bigger multiplier on a Sun:\u003c/strong> the multiplier on a Sun is 1 + (numbers in the threat range) × (the weapon&#39;s multiplier − 1). Multiply damage the way your game says.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Threat range\u003c/th>\n\u003cth>×2 weapon\u003c/th>\n\u003cth>×3 weapon\u003c/th>\n\u003cth>×4 weapon\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>20\u003c/td>\n\u003ctd>×2\u003c/td>\n\u003ctd>×3\u003c/td>\n\u003ctd>×4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>19–20\u003c/td>\n\u003ctd>×3\u003c/td>\n\u003ctd>×5\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>×4\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003ctd>×10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17–20\u003c/td>\n\u003ctd>×5\u003c/td>\n\u003ctd>×9\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15–20\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"sd-saves-checks-and-luck","title":"Saves, checks and luck","html":"\u003ch2 id=\"sd-saves-checks-and-luck-saves-checks-and-luck\">Saves, checks and luck\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Saving throws.\u003c/strong> In fifth edition a Sun and an Eclipse count as a 20 and a 1, nothing more. In 3.5 and Pathfinder First Edition a Sun always saves and an Eclipse always fails, as natural 20s and 1s do.\u003c/li>\n\u003cli>\u003cstrong>Ability and skill checks:\u003c/strong> a Sun and an Eclipse count as a 20 and a 1.\u003c/li>\n\u003cli>\u003cstrong>Take 10 and Take 20\u003c/strong> (3.5, Pathfinder First Edition): don&#39;t draw; take the result.\u003c/li>\n\u003cli>\u003cstrong>Advantage:\u003c/strong> draw 3 cards one at a time and keep the best pair. A Sun at any point ends the draw as a natural 20. An Eclipse is the card you drop; two Eclipses can&#39;t both be dropped, so the check is a natural 1.\u003c/li>\n\u003cli>\u003cstrong>Disadvantage:\u003c/strong> draw 3 and keep the worst pair. An Eclipse at any point ends the draw as a natural 1. A Sun is the card you drop; two Suns can&#39;t both be dropped, so the check is a natural 20.\u003c/li>\n\u003cli>\u003cstrong>Rerolls.\u003c/strong> A reroll that uses the new roll: keep your most recent card, draw a new one and pair them; the new card total stands. A reroll that lets you choose: draw a third card and keep the best pair of the three. A trait that rerolls natural 1s: on an Eclipse, make a new check.\u003c/li>\n\u003cli>\u003cstrong>Extra dice on a check\u003c/strong> (\u003cem>bless\u003c/em>, \u003cem>guidance\u003c/em>, Bardic Inspiration dice): one damage-deck card per die, read as that die.\u003c/li>\n\u003cli>\u003cstrong>Death saving throws\u003c/strong> (fifth edition): the GM draws one Fate Deck card. A 4 or higher succeeds, a Sun means you regain 1 hit point, and an Eclipse counts as two failures.\u003c/li>\n\u003cli>\u003cstrong>Percentile rolls\u003c/strong> (miss chances, d% tables): two damage cards, tens then ones (a 10 counts as 0, 0-0 is 100; redraw Jokers).\u003c/li>\n\u003c/ul>\n\u003cp>Advantage costs an extra card, so a table that hands it out freely will see decks run out a little sooner.\u003c/p>\n"},{"id":"sd-your-deck-is-your-stamina","title":"Your deck is your stamina","html":"\u003ch2 id=\"sd-your-deck-is-your-stamina-your-deck-is-your-stamina\">Your deck is your stamina\u003c/h2>\n\u003cp>This is the biggest change at the table. Cards are a resource.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Every check costs 2 cards\u003c/strong> (1 if the first card is a Joker).\u003c/li>\n\u003cli>\u003cstrong>Casting costs cards too:\u003c/strong> a cantrip costs 1, any other spell 2, whatever its level. Draw them and discard them unused. A spell attack is a separate check on top of that.\u003c/li>\n\u003cli>\u003cstrong>Drawing the last card of your deck (a deck-out) forces a reshuffle and gives you a level of weariness,\u003c/strong> starting with your next check.\u003c/li>\n\u003cli>\u003cstrong>Each level of weariness is −2 to every check you draw for.\u003c/strong> At Weary 3 you also take −1 to AC and saving throws. At Weary 4 you collapse: finish what you were doing, then fall unconscious for 10 minutes and wake at Weary 3.\u003c/li>\n\u003cli>\u003cstrong>A long rest clears it all,\u003c/strong> and every morning starts with a fresh shuffle.\u003c/li>\n\u003c/ul>\n\u003cp>Weariness is the card engine&#39;s own track. It sits beside your game&#39;s exhaustion or fatigue, which work as written and stack with it.\u003c/p>\n\u003cp>A \u003cstrong>standard day\u003c/strong> is about 50 checks: three or four fights plus exploration. All the balance is measured over it. A 30-card deck runs out three times in that day; a 75-card deck once, late.\u003c/p>\n\u003cp>\u003cstrong>What this means in play.\u003c/strong> Small decks are stronger card for card, because they pay for it by tiring sooner. Every deck starts the day strong and ends it weak. Resting before the big fight is a real decision now, and so is using advantage, which costs an extra card.\u003c/p>\n"},{"id":"sd-the-twelve-star-signs","title":"The twelve star signs","html":"\u003ch2 id=\"sd-the-twelve-star-signs-the-twelve-star-signs\">The twelve star signs\u003c/h2>\n\u003cp>Each player draws from a deck shaped by their sign. The element sets the deck&#39;s size, so it sets how fast the deck tires. Mutable decks are the swingiest of their element; Cardinal and Fixed decks are steadier.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Element · modality\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Deck code\u003c/th>\n\u003cth>Packs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aries\u003c/td>\n\u003ctd>Fire · Cardinal\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>1-2-3-3-3-3-3-4-4-3 / 1-0\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leo\u003c/td>\n\u003ctd>Fire · Fixed\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>3-2-3-3-3-3-3-3-4-5 / 1-0\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sagittarius\u003c/td>\n\u003ctd>Fire · Mutable\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>5-4-3-2-2-2-2-2-5-8 / 1-0\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Libra\u003c/td>\n\u003ctd>Air · Cardinal\u003c/td>\n\u003ctd>40\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>6-5-4-2-1-1-2-4-6-8 / 1-0\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aquarius\u003c/td>\n\u003ctd>Air · Fixed\u003c/td>\n\u003ctd>44\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>5-4-4-4-3-2-2-3-6-9 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gemini\u003c/td>\n\u003ctd>Air · Mutable\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>9-6-3-2-1-1-2-4-7-11 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancer\u003c/td>\n\u003ctd>Water · Cardinal\u003c/td>\n\u003ctd>52\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>0-3-6-9-8-7-6-4-3-3 / 2-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scorpio\u003c/td>\n\u003ctd>Water · Fixed\u003c/td>\n\u003ctd>56\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>3-4-5-6-7-8-8-6-4-2 / 2-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pisces\u003c/td>\n\u003ctd>Water · Mutable\u003c/td>\n\u003ctd>60\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>13-8-4-0-0-0-2-6-10-14 / 1-2\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Capricorn\u003c/td>\n\u003ctd>Earth · Cardinal\u003c/td>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>7-8-7-6-5-4-4-5-7-9 / 2-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Taurus\u003c/td>\n\u003ctd>Earth · Fixed\u003c/td>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>7-6-6-6-7-7-7-7-6-7 / 2-2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Virgo\u003c/td>\n\u003ctd>Earth · Mutable\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>15-11-7-3-0-2-4-7-10-13 / 2-1\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Fire decks\u003c/strong> start the day strongest and tire the fastest: they run out two or three times in a standard day.\u003c/li>\n\u003cli>\u003cstrong>Earth decks\u003c/strong> change the least from morning to night and run out once, late.\u003c/li>\n\u003cli>\u003cstrong>Water and Air\u003c/strong> sit in between.\u003c/li>\n\u003c/ul>\n"},{"id":"sd-building-your-own-deck","title":"Building your own deck","html":"\u003ch2 id=\"sd-building-your-own-deck-building-your-own-deck\">Building your own deck\u003c/h2>\n\u003cp>A player who doesn&#39;t want a sign deck can build one from 30 to 75 cards in steps of 5:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Pick a size and its Jokers\u003c/strong> from the build table below. Only the Sun crits, so the number of Suns goes by size: one from 30 to 50 cards, two from 55 to 75.\u003c/li>\n\u003cli>\u003cstrong>Hit the pip total exactly.\u003c/strong> Add up your number cards&#39; values, Ace = 1.\u003c/li>\n\u003cli>\u003cstrong>Land your swing points in your row&#39;s swing range.\u003c/strong> Each number card scores: A and 10 score 10, 2 and 9 score 6, 3 and 8 score 3, 4 and 7 score 1, 5 and 6 score 0. Below the range the deck saves too well; above it, its attacks hit too hard.\u003c/li>\n\u003cli>\u003cstrong>Land your lean in your row&#39;s lean range.\u003c/strong> Lean is the swing points from your 7s to 10s minus those from your Aces to 4s. It says whether your extremes sit high or low, which matters for fifth-edition attacks.\u003c/li>\n\u003cli>\u003cstrong>Keep each value to a third of your number cards:\u003c/strong> the copy limit (&quot;Most copies&quot;).\u003c/li>\n\u003cli>\u003cstrong>Or start from the row&#39;s starter deck\u003c/strong> and adjust it with two dials. The \u003cstrong>pip dial\u003c/strong> flips a card to its mirror (A and 10, 2 and 9, 3 and 8, 4 and 7, 5 and 6): it changes the pip total and the lean but not the swing points. The \u003cstrong>swing dial\u003c/strong> pushes a card and its mirror apart by the same steps (a 5 → 4 with a 6 → 7): it changes the swing points but not the pip total or the lean.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Pip total\u003c/th>\n\u003cth>Swing points\u003c/th>\n\u003cth>Lean\u003c/th>\n\u003cth>Most copies\u003c/th>\n\u003cth>Starter deck\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>178\u003c/td>\n\u003ctd>70–124\u003c/td>\n\u003ctd>10 to 79\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>2-2-2-3-3-3-3-3-4-4 / 1-0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>202\u003c/td>\n\u003ctd>135–209\u003c/td>\n\u003ctd>0 to 59\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>3-3-3-3-3-3-3-4-4-5 / 1-0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>232\u003c/td>\n\u003ctd>115–229\u003c/td>\n\u003ctd>40 to 99\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>4-4-4-3-2-1-2-4-6-8 / 1-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>259\u003c/td>\n\u003ctd>145–264\u003c/td>\n\u003ctd>60 to 109\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>4-4-4-4-3-2-1-4-7-9 / 1-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>282\u003c/td>\n\u003ctd>220–354\u003c/td>\n\u003ctd>30 to 99\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>8-6-4-2-0-1-2-5-8-11 / 1-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>288\u003c/td>\n\u003ctd>50–174\u003c/td>\n\u003ctd>−30 to 69\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>3-4-5-6-7-8-7-5-4-3 / 2-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>313\u003c/td>\n\u003ctd>155–264\u003c/td>\n\u003ctd>−40 to 69\u003c/td>\n\u003ctd>19\u003c/td>\n\u003ctd>5-5-5-6-7-7-7-6-5-4 / 2-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>343\u003c/td>\n\u003ctd>130–289\u003c/td>\n\u003ctd>−10 to 89\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>5-5-5-6-7-8-8-7-6-4 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>367\u003c/td>\n\u003ctd>215–379\u003c/td>\n\u003ctd>−30 to 79\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>5-6-6-7-8-8-8-7-6-5 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>395\u003c/td>\n\u003ctd>185–424\u003c/td>\n\u003ctd>−10 to 79\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>8-7-6-6-6-6-7-8-8-8 / 2-3\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Most sizes allow one or two other Joker setups, each with its own ranges; the Deck Lab lists them all in its Starter deck menu. The Lab test has the final word, and it suggests the smallest card change for a deck that fails.\u003c/p>\n"},{"id":"sd-for-gms-running-the-game","title":"For GMs: running the game","html":"\u003ch2 id=\"sd-for-gms-running-the-game-for-gms-running-the-game\">For GMs: running the game\u003c/h2>\n\u003ch3 id=\"sd-for-gms-running-the-game-the-fate-deck\">The Fate Deck\u003c/h3>\n\u003cp>The GM&#39;s 80-card deck is built to play like a d20. It never causes weariness; reshuffle it when it runs out, about every 41 checks.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Cards\u003c/th>\n\u003cth>Count\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aces\u003c/td>\n\u003ctd>17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 · 3 · 4 · 5 · 6 · 7 · 8 · 9\u003c/td>\n\u003ctd>9 · 6 · 5 · 5 · 5 · 3 · 2 · 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10s\u003c/td>\n\u003ctd>18\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Suns / Eclipses\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>80\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Monsters use it for their attacks, saves, checks and initiative. Players still draw their own checks, including saves against monster abilities. For a secret check, the GM draws face-down from the Fate Deck and adds the player&#39;s modifier.\u003c/p>\n\u003ch3 id=\"sd-for-gms-running-the-game-plain-rolls\">Plain rolls\u003c/h3>\n\u003cp>A pass-or-fail d20 roll with no modifier, like a death saving throw, is one Fate Deck card. A random d20 table uses a damage card instead (see the quick reference). A Sun always succeeds and an Eclipse always fails.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>d20 roll needed\u003c/th>\n\u003cth>Card needed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>3 or less\u003c/td>\n\u003ctd>Any number card\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>2 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>3 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>4 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>The number − 6 (5 for 11, up to 10 for 16)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>Sun\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"sd-for-gms-running-the-game-damage\">Damage\u003c/h3>\n\u003cp>Draw one damage-deck card per die and read it for the die size (a 10 is a 10 on a d10, a 6 on a d6). A critical hit draws its extra dice the same way. A Joker is bonus damage: for players it counts as the die&#39;s maximum; for monsters it counts as the maximum and adds another die, which can chain. That makes damage run a little high on both sides, more for monsters.\u003c/p>\n\u003ch3 id=\"sd-for-gms-running-the-game-pacing\">Pacing\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>The last fight of the day is the hardest,\u003c/strong> and nothing in the rules softens it. Every deck ends a standard day at its weakest, so a boss after a long day plays above its level.\u003c/li>\n\u003cli>\u003cstrong>Long days end in collapses.\u003c/strong> The Fire decks reach Weary 4 around checks 62 (Aries) to 74 (Sagittarius). Most parties will rest before then; a forced march or a dungeon with no safe rest will test them.\u003c/li>\n\u003cli>\u003cstrong>Day length shifts who shines.\u003c/strong> Short days favor small decks; long days favor big ones.\u003c/li>\n\u003c/ul>\n"},{"id":"sd-getting-started","title":"Getting started","html":"\u003ch2 id=\"sd-getting-started-getting-started\">Getting started\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Session zero: choose signs.\u003c/strong> Each player picks a star sign for their character, or builds a deck. The sign doesn&#39;t have to match anything else on the sheet, though it&#39;s more fun when it does.\u003c/li>\n\u003cli>\u003cstrong>Build the decks.\u003c/strong> Use the deck codes in this booklet: ten counts from Ace to 10, then Suns and Eclipses. The Deck Lab, set to d20 Classic, loads every sign deck and tests custom ones.\u003c/li>\n\u003cli>\u003cstrong>Build the GM&#39;s Fate Deck and the damage deck.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Start each day with a fresh shuffle.\u003c/strong> Keep discard piles face-down and track each player&#39;s weariness next to their deck.\u003c/li>\n\u003cli>\u003cstrong>Play.\u003c/strong> The first session, keep the quick reference at the back of this booklet on the table.\u003c/li>\n\u003c/ol>\n"},{"id":"sd-quick-reference","title":"Quick reference","html":"\u003ch2 id=\"sd-quick-reference-quick-reference\">Quick reference\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Situation\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Any check\u003c/td>\n\u003ctd>Draw 2 and add; a Joker ends the draw (a Sun is a natural 20, an Eclipse a natural 1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Attack\u003c/td>\n\u003ctd>A Sun always hits and is the only crit; an Eclipse always misses\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Wider crit range (fifth edition)\u003c/td>\n\u003ctd>A Sun deals one more set of damage dice per extra number in the range\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Threat range (3.5, Pathfinder First Edition)\u003c/td>\n\u003ctd>Only a Sun threatens; confirm with an attack draw; multiplier on a Sun = 1 + (numbers in the threat range) × (multiplier − 1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Saves\u003c/td>\n\u003ctd>Fifth edition: Sun and Eclipse count as 20 and 1. 3.5 and Pathfinder First Edition: a Sun always saves, an Eclipse always fails\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Advantage / disadvantage\u003c/td>\n\u003ctd>Draw 3, keep the best / worst pair\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reroll, &quot;use the new roll&quot;\u003c/td>\n\u003ctd>Keep your most recent card, draw 1, pair them\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reroll, &quot;choose either roll&quot;\u003c/td>\n\u003ctd>Draw 1, keep the best pair of the three\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Extra die on a check\u003c/td>\n\u003ctd>One damage card, read as that die\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Take 10 / Take 20\u003c/td>\n\u003ctd>No draw\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Death saving throw\u003c/td>\n\u003ctd>One Fate Deck card: 4 or higher succeeds; a Sun regains 1 hit point; an Eclipse is two failures\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Plain d20 roll, no modifier\u003c/td>\n\u003ctd>One Fate Deck card against the plain-rolls table\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cantrip / other spell\u003c/td>\n\u003ctd>Draw and discard 1 / 2 cards unused\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Your deck runs out\u003c/td>\n\u003ctd>Reshuffle and gain a level of weariness: −2 per level, −1 AC and saves at Weary 3, collapse at Weary 4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Damage\u003c/td>\n\u003ctd>One damage card per die, read on the table below; a Joker is bonus damage\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d20 table\u003c/td>\n\u003ctd>One damage card, plus 10 if it&#39;s red (redraw Jokers)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d100 (d%)\u003c/td>\n\u003ctd>Two damage cards: tens, then ones (10 counts as 0; 0-0 is 100; redraw Jokers)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Damage card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>d4\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d6\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d8\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d10\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d12\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"sd-questions-at-the-table","title":"Questions at the table","html":"\u003ch2 id=\"sd-questions-at-the-table-questions-at-the-table\">Questions at the table\u003c/h2>\n\u003cp>\u003cstrong>Is a card deck really as fair as a d20?\u003c/strong> Over a standard day, yes, in all three games. Shorter and longer days drift, and within a single fight they aren&#39;t meant to match: that&#39;s where the decks get their personalities. The Math, below, has the details.\u003c/p>\n\u003cp>\u003cstrong>Why does my deck have no Eclipse?\u003c/strong> In these games a natural 1 does little beyond missing, so the small decks balance best with a Sun and no Eclipse. Each size&#39;s Joker setup is the one that keeps crits and saves in line.\u003c/p>\n\u003cp>\u003cstrong>Can I count cards?\u003c/strong> Yes, if you can keep it in your head. Discards go face-down, so nobody can look back through them. The balance assumes nobody counts, so it&#39;s a small edge for players with a good memory.\u003c/p>\n\u003cp>\u003cstrong>What if I run out in the middle of a check?\u003c/strong> Reshuffle and draw your second card from the new deck. The weariness applies from your next check.\u003c/p>\n\u003cp>\u003cstrong>Do monsters get weary?\u003c/strong> No. The Fate Deck never causes weariness, and neither does the damage deck.\u003c/p>\n\u003cp>\u003cstrong>Can two players share a sign?\u003c/strong> Yes. Each builds their own copy of the deck.\u003c/p>\n\u003cp>\u003cstrong>Does this work for other d20 games?\u003c/strong> Games where only a natural 20 crits should work with these decks, though the numbers here cover only fifth edition, 3.5 and Pathfinder First Edition.\u003c/p>\n"},{"id":"sd-the-math","title":"The Math","html":"\u003ch2 id=\"sd-the-math-the-math\">The Math\u003c/h2>\n\u003cp>For anyone who wants to see how the cards line up with a d20. \u003cem>Core Engine: d20 Classic\u003c/em> has the full numbers in its Part Four.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>What &quot;balanced&quot; means.\u003c/strong> Over a standard day of 50 checks (three or four fights plus exploration, about 95 to 99 cards), a deck succeeds as often as a d20. Its attack damage in fifth edition, its attack damage in 3.5 and Pathfinder First Edition (with 20/×3, 19–20/×2 and 18–20/×2 weapons), and the damage it takes from saves each land within 97–103% of a d20&#39;s.\u003c/li>\n\u003cli>\u003cstrong>Suns.\u003c/strong> A deck&#39;s Suns come up on 3 to 8% of checks, against a d20&#39;s 5%, and its number cards are tuned to make up the difference.\u003c/li>\n\u003cli>\u003cstrong>Bigger crits.\u003c/strong> A 19–20 range crits 10% of the time on a d20 for one extra set of dice. The Sun comes up about 5% of the time, so it carries two extra sets: the same average damage, in fewer, bigger hits.\u003c/li>\n\u003cli>\u003cstrong>Through the day.\u003c/strong> Fire decks start the day about 2 points of edge ahead of a d20. In the last quarter of a standard day, the smallest decks sit about 2 points behind and the rest 1 to 1.5.\u003c/li>\n\u003cli>\u003cstrong>The Fate Deck.\u003c/strong> Its average card total is 10.5, and a Sun and an Eclipse each come up on 4.9% of checks. Monsters&#39; attacks deal 98 to 100% of a d20&#39;s damage in all three games, and monsters take 99.9% of a d20&#39;s damage on saves.\u003c/li>\n\u003cli>\u003cstrong>Plain rolls.\u003c/strong> Death saving throws succeed 57.5% of the time, against a d20&#39;s 55%, and a Sun and an Eclipse each come up 2.5% of the time, against 5%; a character who gets no help dies 37% of the time, against 41%. Other plain rolls:\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>d20 roll needed\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>d20\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>2–3\u003c/td>\n\u003ctd>97.5%\u003c/td>\n\u003ctd>95–90%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>76%\u003c/td>\n\u003ctd>85–75%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>65%\u003c/td>\n\u003ctd>70–65%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>57.5%\u003c/td>\n\u003ctd>60–55%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>51%, 45%, 39%, 35%, 32.5%, 25%\u003c/td>\n\u003ctd>50%, 45%, 40%, 35%, 30%, 25%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>25%\u003c/td>\n\u003ctd>20%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>2.5%\u003c/td>\n\u003ctd>15–5%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Advantage.\u003c/strong> Drawing 3 and keeping the best pair adds 16 to 21 percentage points of success at typical numbers needed, against 22 for two d20s.\u003c/li>\n\u003cli>\u003cstrong>Damage.\u003c/strong> Every die size keeps its exact average. The Jokers add about 3 to 4% to players&#39; damage and 8 to 9% to monsters&#39;.\u003c/li>\n\u003cli>\u003cstrong>Building your own.\u003c/strong> A deck built inside the ranges is balanced almost every time, and the rare miss is only a few tenths of a percentage point off.\u003c/li>\n\u003c/ul>\n"},{"id":"sd-license-note","title":"License note","html":"\u003ch2 id=\"sd-license-note-license-note\">License note\u003c/h2>\n\u003cp>\u003cem>Written in the Stars: d20 Classic is an unofficial fan-made add-on. It isn&#39;t published, endorsed or approved by Wizards of the Coast or Paizo. Pathfinder is a trademark of Paizo Inc. It explains how to replace dice with playing cards and reproduces no rules text from any game: fifth-edition terms are those of the System Reference Document 5.2, released under the Creative Commons Attribution 4.0 license, and 3.5 and Pathfinder First Edition are referred to by their game mechanics only, with no material released under the Open Game License. Before distributing it, add the attribution the SRD 5.2 license asks for and check each game&#39;s trademark terms.\u003c/em>\u003c/p>\n"}]},"core":{"title":"Core Engine: d20 Classic","sections":[{"id":"cd-introduction","title":"Introduction","html":"\u003cp>\u003cem>The Star-Sign Card Engine · first release · 28 September 2026\u003c/em>\u003c/p>\n\u003cp>These are card rules for d20 fantasy roleplaying games where only a natural 20 crits: fifth edition, 3.5 and Pathfinder First Edition, called d20 Classic games here. Every check draws two cards instead of rolling a d20. Each player draws from a deck tuned to their star sign, the GM draws from a Fate Deck, and damage comes from a shared damage deck. Everything else works as your game says: ability scores, proficiency, AC, DCs, spells, conditions and the action economy.\u003c/p>\n\u003cp>The rules chapters say what to do at the table. The numbers behind them, and how closely each rule tracks a d20, are gathered in Part Four, The Math, for anyone who wants them. Nothing there is needed to play.\u003c/p>\n\u003cp>One web tool goes with these rules. The \u003cstrong>Star-Sign Deck Lab\u003c/strong> builds and tests any player deck and loads every sign deck and starter deck; set its game switch to d20 Classic.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Part One, Playing:\u003c/strong> 1 Components · 2 Checks · 3 Casting costs · 4 Weariness and rest · 5 Plain rolls · 6 Advantage, disadvantage and rerolls · 7 Held draws · 8 Companions and other creatures · 9 The Fate Deck · 10 Damage\u003c/li>\n\u003cli>\u003cstrong>Part Two, Decks:\u003c/strong> 11 The twelve star-sign decks · 12 Building your own deck\u003c/li>\n\u003cli>\u003cstrong>Part Three, Running the game:\u003c/strong> 13 Pacing the day · 14 Watch in playtesting\u003c/li>\n\u003cli>\u003cstrong>Part Four, The Math:\u003c/strong> 15 The standard day and the balance rules · 16 What a two-card draw can and can&#39;t do · 17 Crits, saves and lean · 18 The sign decks against a d20 · 19 Checks and luck against a d20 · 20 The damage deck against dice · 21 How sure the build table is\u003c/li>\n\u003cli>\u003cstrong>Appendices:\u003c/strong> A Quick reference: what the system replaces · B Glossary · C License notes\u003c/li>\n\u003c/ul>\n"},{"id":"cd-1-components","title":"1. Components","html":"\u003ch2 id=\"cd-1-components-1-components\">1. Components\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Deck\u003c/th>\n\u003cth>Who uses it\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Built from\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Player deck\u003c/strong>\u003c/td>\n\u003ctd>Each player: a sign deck, or a custom deck they build (chapter 12)\u003c/td>\n\u003ctd>30–75: Ace to 10 plus Suns and Eclipses\u003c/td>\n\u003ctd>1–4 standard packs for a sign deck\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Fate Deck\u003c/strong>\u003c/td>\n\u003ctd>The GM, for monsters, companions and plain rolls\u003c/td>\n\u003ctd>80: Ace to 10, 2 Suns and 2 Eclipses\u003c/td>\n\u003ctd>5 standard packs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Damage deck\u003c/strong>\u003c/td>\n\u003ctd>Shared by the table; players may keep a personal copy\u003c/td>\n\u003ctd>42: Ace to 10 in four suits plus 2 Jokers\u003c/td>\n\u003ctd>1 standard pack, face cards removed\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Aces count as 1. A standard pack has four of each rank and usually one colored and one black Joker. \u003cstrong>The colored Joker is the Sun and the black one the Eclipse\u003c/strong>; the rules use those names, and &quot;Joker&quot; means either.\u003c/p>\n"},{"id":"cd-2-checks","title":"2. Checks","html":"\u003ch2 id=\"cd-2-checks-2-checks\">2. Checks\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Draw one card at a time, two in all, and add them.\u003c/strong> The \u003cstrong>card total\u003c/strong> (2–20) replaces the d20 roll. Add your modifier and compare with the DC or AC as usual.\u003c/li>\n\u003cli>\u003cstrong>A Joker ends the draw.\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>The Sun:\u003c/strong> natural 20. It counts as a card total of 20.\u003c/li>\n\u003cli>\u003cstrong>The Eclipse:\u003c/strong> natural 1. It counts as a card total of 1.\u003c/li>\n\u003cli>If the first card is a Joker, don&#39;t draw the second; the check costs only one card. A Joker drawn second still counts.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>A card total of 20 isn&#39;t a natural 20.\u003c/strong> Two 10s make a 20, which hits or succeeds like any other 20. Only a Sun is a natural 20.\u003c/li>\n\u003cli>\u003cstrong>Players draw from their own deck\u003c/strong> for their own checks: attacks, saving throws, ability and skill checks, and initiative. \u003cstrong>The GM draws from the Fate Deck\u003c/strong> for monsters&#39; checks, companions&#39; checks (chapter 8), plain rolls (chapter 5) and \u003cstrong>secret checks\u003c/strong>. For a secret check, the GM draws face-down and adds the player&#39;s modifier; it costs the player no cards, and advantage, disadvantage and rerolls on it use Fate Deck cards.\u003c/li>\n\u003cli>\u003cstrong>Discard drawn cards face-down.\u003c/strong> Nobody looks back through a discard pile, so knowing what&#39;s left in a deck takes memory.\u003c/li>\n\u003c/ol>\n\u003cp>A check costs 2 cards, or 1 when the first card is a Joker.\u003c/p>\n\u003ch3 id=\"cd-2-checks-attacks-and-critical-hits\">Attacks and critical hits\u003c/h3>\n\u003cp>\u003cstrong>Only the Sun crits.\u003c/strong> On an attack, a Sun always hits and an Eclipse always misses. How a Sun becomes a critical hit depends on the game.\u003c/p>\n\u003cp>\u003cstrong>Fifth edition\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>A Sun is a critical hit.\u003c/strong> Draw the attack&#39;s damage dice twice, as your game says (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>A wider crit range becomes a bigger crit.\u003c/strong> A feature that crits on a 19–20 gives a Sun three sets of damage dice instead of two; 18–20 gives four. Each extra number in the crit range adds one set.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>3.5 and Pathfinder First Edition\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Only the Sun threatens.\u003c/strong> Confirm it with a normal attack draw at the same bonus; if that hits, it&#39;s a critical hit. The confirming draw costs cards like any check.\u003c/li>\n\u003cli>\u003cstrong>A weapon&#39;s threat range becomes a bigger multiplier on a Sun:\u003c/strong> multiplier on a Sun = 1 + (numbers in the threat range) × (the weapon&#39;s multiplier − 1). Features that widen a threat range add numbers the same way.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Threat range\u003c/th>\n\u003cth>×2 weapon\u003c/th>\n\u003cth>×3 weapon\u003c/th>\n\u003cth>×4 weapon\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>20\u003c/td>\n\u003ctd>×2\u003c/td>\n\u003ctd>×3\u003c/td>\n\u003ctd>×4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>19–20\u003c/td>\n\u003ctd>×3\u003c/td>\n\u003ctd>×5\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>×4\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003ctd>×10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17–20\u003c/td>\n\u003ctd>×5\u003c/td>\n\u003ctd>×9\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15–20\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"cd-2-checks-saving-throws-and-other-checks\">Saving throws and other checks\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Saving throws.\u003c/strong> Fifth edition: a Sun and an Eclipse count as a 20 and a 1, nothing more. 3.5 and Pathfinder First Edition: a Sun always saves and an Eclipse always fails, as natural 20s and 1s do.\u003c/li>\n\u003cli>\u003cstrong>Ability and skill checks:\u003c/strong> a Sun and an Eclipse count as a 20 and a 1.\u003c/li>\n\u003cli>\u003cstrong>Take 10 and Take 20\u003c/strong> (3.5 and Pathfinder First Edition): don&#39;t draw; take the result. It costs no cards.\u003c/li>\n\u003cli>\u003cstrong>Death saving throws\u003c/strong> (fifth edition) are plain rolls (chapter 5).\u003c/li>\n\u003c/ul>\n"},{"id":"cd-3-casting-costs","title":"3. Casting costs","html":"\u003ch2 id=\"cd-3-casting-costs-3-casting-costs\">3. Casting costs\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>A cantrip costs 1 card. Any other spell costs 2, whatever its level.\u003c/strong> Draw them and discard them unused, whatever they are: a Sun drawn this way is wasted, and an Eclipse is dodged.\u003c/li>\n\u003cli>\u003cstrong>A spell attack is a separate check\u003c/strong> on top of the casting cost: two cards, or one if the first is a Joker.\u003c/li>\n\u003cli>So a spell with a spell attack costs 4 cards (3 when the attack opens on a Joker), and a cantrip with a spell attack costs 3 (2).\u003c/li>\n\u003cli>\u003cstrong>A spell that calls for a save\u003c/strong> costs only its casting cards; each target draws its own save.\u003c/li>\n\u003cli>\u003cstrong>Other checks a spell asks for,\u003c/strong> such as a concentration check, are ordinary checks.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-4-weariness-and-rest","title":"4. Weariness and rest","html":"\u003ch2 id=\"cd-4-weariness-and-rest-4-weariness-and-rest\">4. Weariness and rest\u003c/h2>\n\u003cp>Weariness is the card engine&#39;s own track. It sits beside your game&#39;s exhaustion or fatigue, which work as written and stack with it.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Drawing the last card of your deck (a deck-out) forces a reshuffle and gives you a level of weariness.\u003c/strong> If you need a second card after your deck&#39;s last one, reshuffle and draw it from the new deck.\u003c/li>\n\u003cli>\u003cstrong>Weary N:\u003c/strong> a −2 penalty per level of weariness (−2N) to every check you draw for, starting with your next check. It stacks with other penalties, and it doesn&#39;t lower your AC or your spell save DCs.\u003c/li>\n\u003cli>\u003cstrong>Weary 3:\u003c/strong> you also take −1 to AC and saving throws.\u003c/li>\n\u003cli>\u003cstrong>Weary 4 is the maximum: you collapse.\u003c/strong> Finish the check or spell you were drawing for, then fall unconscious. After 10 minutes you wake at Weary 3. Your next deck-out brings you back to Weary 4.\u003c/li>\n\u003cli>\u003cstrong>A long rest removes all weariness, and you start the next day with a fresh shuffle.\u003c/strong> A short rest doesn&#39;t.\u003c/li>\n\u003cli>The Fate Deck and damage decks never cause weariness; reshuffle them when they run out.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-5-plain-rolls","title":"5. Plain rolls","html":"\u003ch2 id=\"cd-5-plain-rolls-5-plain-rolls\">5. Plain rolls\u003c/h2>\n\u003cp>Plain rolls are pass-or-fail d20 rolls with no modifier: a death saving throw, a flat chance (&quot;on a 15 or higher&quot;), a roll to see whether something happens. Miss chances and other percentile rolls use damage cards instead (chapter 10).\u003c/p>\n\u003cp>\u003cstrong>The GM draws one card from the Fate Deck.\u003c/strong> A Sun always succeeds and an Eclipse always fails. Otherwise the card must meet this number:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>d20 roll needed\u003c/th>\n\u003cth>Card needed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>3 or less\u003c/td>\n\u003ctd>Any number card\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>2 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>3 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>4 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>The number − 6 (5 for 11, up to 10 for 16)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>Sun\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Death saving throws\u003c/strong> (fifth edition): a 4 or higher succeeds, as a 10 does on the die. A Sun means you regain 1 hit point, and an Eclipse counts as two failures.\u003c/li>\n\u003cli>\u003cstrong>Advantage\u003c/strong> on a plain roll draws 2 Fate Deck cards and keeps the better; \u003cstrong>disadvantage\u003c/strong> keeps the worse. \u003cstrong>A reroll\u003c/strong> draws a new card.\u003c/li>\n\u003cli>Plain rolls never cost players cards.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-6-advantage-disadvantage-and-rerolls","title":"6. Advantage, disadvantage and rerolls","html":"\u003ch2 id=\"cd-6-advantage-disadvantage-and-rerolls-6-advantage-disadvantage-and-rerolls\">6. Advantage, disadvantage and rerolls\u003c/h2>\n\u003cp>Advantage and disadvantage cancel out as your game says. When they cancel, draw normally.\u003c/p>\n\u003ch3 id=\"cd-6-advantage-disadvantage-and-rerolls-advantage\">Advantage\u003c/h3>\n\u003cp>\u003cstrong>Draw 3 cards and keep the best pair.\u003c/strong> Draw one at a time; a Sun at any point ends the draw as a natural 20. An Eclipse is the card you drop. Two Eclipses can&#39;t both be dropped, so the check is a natural 1. Advantage costs about 2.9 cards.\u003c/p>\n\u003ch3 id=\"cd-6-advantage-disadvantage-and-rerolls-disadvantage\">Disadvantage\u003c/h3>\n\u003cp>\u003cstrong>Draw 3 cards and keep the worst pair.\u003c/strong> An Eclipse at any point ends the draw as a natural 1. A Sun is the card you drop; two Suns can&#39;t both be dropped, so the check is a natural 20. The player draws from their own deck.\u003c/p>\n\u003ch3 id=\"cd-6-advantage-disadvantage-and-rerolls-rerolls\">Rerolls\u003c/h3>\n\u003cp>After a check, draw a third card. How it combines follows the reroll&#39;s wording:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Reroll says\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003cth>Examples\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Use the new roll\u003c/strong>, or doesn&#39;t say\u003c/td>\n\u003ctd>\u003cstrong>Keep your most recent card and pair it with the new card.\u003c/strong> Your first card is discarded, and the new card total stands even if it&#39;s lower.\u003c/td>\n\u003ctd>Heroic Inspiration, and most rerolls from features, feats and spells\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Choose either roll\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Keep the best pair of the three.\u003c/strong>\u003c/td>\n\u003ctd>Rerolls that let you pick the better result\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>New card is a Sun:\u003c/strong> natural 20, either way.\u003c/li>\n\u003cli>\u003cstrong>New card is an Eclipse:\u003c/strong> natural 1 for &quot;use the new roll&quot;; for &quot;choose either roll&quot; it&#39;s the lowest card, so you keep your original pair.\u003c/li>\n\u003cli>\u003cstrong>The check was an Eclipse:\u003c/strong> make a new check instead. This is also how a trait that rerolls natural 1s works.\u003c/li>\n\u003cli>\u003cstrong>A bonus on the reroll\u003c/strong> is added as usual.\u003c/li>\n\u003cli>\u003cstrong>Forcing an enemy to reroll\u003c/strong> uses a new check from the Fate Deck.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"cd-6-advantage-disadvantage-and-rerolls-extra-dice-on-a-check\">Extra dice on a check\u003c/h3>\n\u003cp>Dice added to a check (a d4 from \u003cem>bless\u003c/em> or \u003cem>guidance\u003c/em>, a Bardic Inspiration die) are one damage-deck card each, read as that die (chapter 10). Redraw Jokers.\u003c/p>\n"},{"id":"cd-7-held-draws","title":"7. Held draws","html":"\u003ch2 id=\"cd-7-held-draws-7-held-draws\">7. Held draws\u003c/h2>\n\u003cp>A held draw is a real draw, set aside face-up and used later in place of drawing. It covers effects that roll a d20 now and use the result later.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kind\u003c/th>\n\u003cth>Examples\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Hold a draw for yourself\u003c/strong>\u003c/td>\n\u003ctd>Effects that roll ahead of time and let you use the result later\u003c/td>\n\u003ctd>Draw normally and set the cards aside face-up. When you use them, don&#39;t draw again; modifiers apply at that moment, including weariness gained since. Discard them if the effect ends unused. Held cards are outside your deck, so a reshuffle doesn&#39;t return them.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Give a held draw to someone else\u003c/strong>\u003c/td>\n\u003ctd>Effects that roll ahead of time for an ally, or replace another creature&#39;s roll\u003c/td>\n\u003ctd>The giver draws from their own deck and pays the cards. The recipient uses them with their own modifiers.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Reuse or share a draw\u003c/strong>\u003c/td>\n\u003ctd>Effects that apply one roll to several targets, or one character rolling for a group\u003c/td>\n\u003ctd>The same card total counts again, with no new cards. An effect that reuses a result without its natural 20 or 1 counts a Sun as 20 and an Eclipse as 1. When one character rolls for a group, that character draws once.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>A held Sun is a natural 20 when used; a held Eclipse a natural 1.\u003c/li>\n\u003cli>Advantage on a held draw: draw 3, keep the best pair, and hold that.\u003c/li>\n\u003cli>Rerolls work on a check that used a held draw; for &quot;use the new roll&quot;, your most recent card is the second held card.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-8-companions-and-other-creatures","title":"8. Companions and other creatures","html":"\u003ch2 id=\"cd-8-companions-and-other-creatures-8-companions-and-other-creatures\">8. Companions and other creatures\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Companions draw from the Fate Deck.\u003c/strong> Animal companions, familiars, summoned and conjured creatures, mounts, hirelings and other creatures a player controls make their checks with the Fate Deck, as monsters do. The player decides what the creature does; the GM draws, or hands the player the Fate Deck to draw. Their checks never cost the player cards or cause weariness, and their advantage, disadvantage and rerolls use Fate Deck cards too.\u003c/li>\n\u003cli>\u003cstrong>Creatures that act through you are the exception.\u003c/strong> A creature that can act only by using its controller&#39;s action or attacks, so that the two act as one character, draws from its controller&#39;s deck.\u003c/li>\n\u003cli>\u003cstrong>Damage\u003c/strong> a companion deals uses the players&#39; Joker rule (chapter 10).\u003c/li>\n\u003c/ul>\n\u003cp>Why: companions would otherwise double their owner&#39;s card use and push them into weariness early.\u003c/p>\n"},{"id":"cd-9-the-fate-deck","title":"9. The Fate Deck","html":"\u003ch2 id=\"cd-9-the-fate-deck-9-the-fate-deck\">9. The Fate Deck\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Cards\u003c/th>\n\u003cth>Count\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aces\u003c/td>\n\u003ctd>17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 · 3 · 4 · 5 · 6 · 7 · 8 · 9\u003c/td>\n\u003ctd>9 · 6 · 5 · 5 · 5 · 3 · 2 · 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10s\u003c/td>\n\u003ctd>18\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Suns / Eclipses\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>80\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Same draw as the players:\u003c/strong> one card at a time, two in all; a first-card Joker ends the draw.\u003c/li>\n\u003cli>\u003cstrong>Monsters use it\u003c/strong> for their attacks, saving throws, ability checks and initiative, and monster advantage and disadvantage work as for players. \u003cstrong>Players still draw their own checks\u003c/strong>, including saves against monster abilities.\u003c/li>\n\u003cli>\u003cstrong>No weariness.\u003c/strong> Reshuffle it when it runs out, about every 41 checks.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-10-damage","title":"10. Damage","html":"\u003ch2 id=\"cd-10-damage-10-damage\">10. Damage\u003c/h2>\n\u003cp>The card rules that replace damage dice, healing dice and other random rolls.\u003c/p>\n\u003ch3 id=\"cd-10-damage-the-damage-deck\">The damage deck\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>The central damage deck\u003c/strong> is one standard pack with the face cards removed: \u003cstrong>42 cards, Ace to 10 in four suits, plus the 2 Jokers.\u003c/strong> Everyone draws damage from it, monsters included. Both Jokers work the same way here; the Sun and the Eclipse only differ on checks.\u003c/li>\n\u003cli>\u003cstrong>Optional personal damage decks.\u003c/strong> A player may keep their own damage deck instead of drawing from the central one. It holds exactly the same cards as the central deck. Damage decks have no star-sign variants.\u003c/li>\n\u003cli>\u003cstrong>Damage decks never tire you.\u003c/strong> Damage draws never come from a player deck and never cause weariness. When a damage deck runs out, reshuffle it and keep going.\u003c/li>\n\u003c/ul>\n\u003cp>Why damage stays out of player decks: every hit would burn cards, so characters would tire faster as they level, and each deck&#39;s shape would skew its damage.\u003c/p>\n\u003ch3 id=\"cd-10-damage-reading-a-card-as-a-die\">Reading a card as a die\u003c/h3>\n\u003cp>Draw one card per damage die and read it for that die size. Add the results, then add modifiers as usual.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>d4\u003c/strong> (card ÷ 3, rounded down, +1)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d6\u003c/strong> (card ÷ 2, rounded down, +1)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d8\u003c/strong> (card − 1; Ace is 1, 10 is 8)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d10\u003c/strong> (card value)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d12\u003c/strong> (card + 1)\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Rare sizes: \u003cstrong>d2\u003c/strong> is the card&#39;s color (black 1, red 2); \u003cstrong>d3\u003c/strong> is card ÷ 4, rounded down, +1. Jokers are covered below.\u003c/p>\n\u003ch3 id=\"cd-10-damage-jokers-bonus-damage\">Jokers: bonus damage\u003c/h3>\n\u003cp>Each damage card is a Joker about 1 time in 21. What a Joker does depends on who is dealing the damage:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Dealt by\u003c/th>\n\u003cth>Joker rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Players\u003c/strong> (and creatures they control: companions, familiars, summons)\u003c/td>\n\u003ctd>The die counts as its \u003cstrong>maximum\u003c/strong> (a 6 on a d6, 12 on a d12).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Monsters and hazards\u003c/strong>\u003c/td>\n\u003ctd>The die counts as its \u003cstrong>maximum, and you draw another die of the same size.\u003c/strong> If that&#39;s a Joker too, repeat.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>GMs building encounters: Jokers make damage run a little high on both sides, more for monsters, so fights run slightly deadlier for the party than their budget says. It shows most in big monster damage pools.\u003c/p>\n\u003cp>Jokers only matter for damage and healing dice. When the damage deck is used for other rolls (durations, d20 and d100 tables), redraw any Joker.\u003c/p>\n\u003ch3 id=\"cd-10-damage-damage-rules\">Damage rules\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Rule\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Damage dice (weapons, spells, monsters)\u003c/td>\n\u003ctd>One card per die, read on the die table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical hit, fifth edition\u003c/td>\n\u003ctd>Draw the attack&#39;s damage dice twice, extra dice included (sneak attack, smites). A Sun with a wider crit range adds one more set per extra number in the range (chapter 2).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical hit, 3.5 and Pathfinder First Edition\u003c/td>\n\u003ctd>Draw the damage as many times as the multiplier (a Sun&#39;s multiplier is in chapter 2) and add the totals, as your game says. Extra dice that aren&#39;t multiplied, such as sneak attack, are drawn once.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Half damage on a save\u003c/td>\n\u003ctd>Draw the dice, total them, then halve as usual.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Reroll 1s&quot; (or 1s and 2s)\u003c/td>\n\u003ctd>Redraw any card that reads as a rerolled number.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Roll twice and use either&quot;\u003c/td>\n\u003ctd>Draw the dice again and keep the higher total.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A low roll counting as higher (&quot;treat a 1 as a 2&quot;)\u003c/td>\n\u003ctd>Read the card, then apply the rule.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Maximum damage&quot; effects\u003c/td>\n\u003ctd>Count each die at its maximum; don&#39;t draw.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A monster&#39;s listed average damage\u003c/td>\n\u003ctd>Use it and don&#39;t draw, if your table plays that way.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ongoing damage (bleeding, burning)\u003c/td>\n\u003ctd>Draw its dice each time it applies.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Healing dice\u003c/td>\n\u003ctd>Same as damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Resistance, vulnerability, immunity\u003c/td>\n\u003ctd>Unchanged.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"cd-10-damage-other-dice\">Other dice\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Roll\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Random durations (&quot;1d4 rounds&quot;, &quot;1d4 hours&quot;)\u003c/td>\n\u003ctd>One damage card, read on the die table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d20 tables\u003c/td>\n\u003ctd>One damage card, \u003cstrong>plus 10 if it&#39;s red\u003c/strong>: an exact 1–20.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d100 tables and percentile rolls (miss chances)\u003c/td>\n\u003ctd>Two damage cards: the first is the tens, the second the ones; a 10 counts as 0, and 0-0 is 100. An exact 1–100.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d8, d10 and other small tables\u003c/td>\n\u003ctd>One damage card, read on the die table.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"cd-10-damage-recommended-house-rule-big-pools\">Recommended house rule: big pools\u003c/h3>\n\u003cp>For pools of more than 5 dice (a high-level blast spell, say), draw 5 cards and count every die beyond that at its average, rounding the total down.\u003c/p>\n\u003cul>\n\u003cli>Example: 20d6 is 5 cards plus 15 × 3.5 = 52.5, so 5 cards + 52.\u003c/li>\n\u003cli>It keeps 20-die spells quick, and the average is unchanged apart from Jokers; the results just bunch closer to the average.\u003c/li>\n\u003cli>Only the 5 drawn cards can be Jokers, so big pools get less of the Joker bonus under this rule, which matters most for monsters.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-11-the-twelve-star-sign-decks","title":"11. The twelve star-sign decks","html":"\u003ch2 id=\"cd-11-the-twelve-star-sign-decks-11-the-twelve-star-sign-decks\">11. The twelve star-sign decks\u003c/h2>\n\u003cp>\u003cstrong>Element sets the size. Modality sets the spread.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Fire (30–36 cards):\u003c/strong> short and fierce. Strongest on a fresh shuffle; runs out 2–3 times in a standard day.\u003c/li>\n\u003cli>\u003cstrong>Air (40–48 cards):\u003c/strong> quick; runs out twice.\u003c/li>\n\u003cli>\u003cstrong>Water (52–60 cards):\u003c/strong> middling; runs out once.\u003c/li>\n\u003cli>\u003cstrong>Earth (65–75 cards):\u003c/strong> long and enduring; runs out once, late in the day.\u003c/li>\n\u003cli>\u003cstrong>Mutable\u003c/strong> signs are the swingiest of their element. \u003cstrong>Cardinal\u003c/strong> and \u003cstrong>Fixed\u003c/strong> signs are steadier.\u003c/li>\n\u003cli>\u003cstrong>Suns go by size:\u003c/strong> most decks carry one Sun from 30 to 50 cards and two from 55 to 75. Cancer (52 cards, two Suns) and Pisces (60 cards, one Sun) use other setups that balance just as well. The four smallest decks carry no Eclipse; the others carry one or two.\u003c/li>\n\u003c/ul>\n\u003cp>Deck codes list Ace, 2, 3 … 10, then Suns / Eclipses. Any number of players can take the same sign; each builds their own copy of its deck. &quot;Packs&quot; is the number of standard packs needed to build it; only Aries fits in one.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Element · modality\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Deck code\u003c/th>\n\u003cth>Packs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>Fire · Cardinal\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>1-2-3-3-3-3-3-4-4-3 / 1-0\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>Fire · Fixed\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>3-2-3-3-3-3-3-3-4-5 / 1-0\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>Fire · Mutable\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>5-4-3-2-2-2-2-2-5-8 / 1-0\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>Air · Cardinal\u003c/td>\n\u003ctd>40\u003c/td>\n\u003ctd>6-5-4-2-1-1-2-4-6-8 / 1-0\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>Air · Fixed\u003c/td>\n\u003ctd>44\u003c/td>\n\u003ctd>5-4-4-4-3-2-2-3-6-9 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>Air · Mutable\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>9-6-3-2-1-1-2-4-7-11 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>Water · Cardinal\u003c/td>\n\u003ctd>52\u003c/td>\n\u003ctd>0-3-6-9-8-7-6-4-3-3 / 2-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>Water · Fixed\u003c/td>\n\u003ctd>56\u003c/td>\n\u003ctd>3-4-5-6-7-8-8-6-4-2 / 2-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>Water · Mutable\u003c/td>\n\u003ctd>60\u003c/td>\n\u003ctd>13-8-4-0-0-0-2-6-10-14 / 1-2\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>Earth · Cardinal\u003c/td>\n\u003ctd>65\u003c/td>\n\u003ctd>7-8-7-6-5-4-4-5-7-9 / 2-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>Earth · Fixed\u003c/td>\n\u003ctd>70\u003c/td>\n\u003ctd>7-6-6-6-7-7-7-7-6-7 / 2-2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>Earth · Mutable\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>15-11-7-3-0-2-4-7-10-13 / 2-1\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Chapter 18 compares each deck with a d20.\u003c/p>\n"},{"id":"cd-12-building-your-own-deck","title":"12. Building your own deck","html":"\u003ch2 id=\"cd-12-building-your-own-deck-12-building-your-own-deck\">12. Building your own deck\u003c/h2>\n\u003cp>How a player builds their own balanced deck instead of taking a star-sign deck. The Deck Lab, set to d20 Classic, tests any deck exactly and loads every starter deck in the build table (12.5).\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-the-short-version\">The short version\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Pick a size:\u003c/strong> 30, 35, 40 … up to 75 cards.\u003c/li>\n\u003cli>\u003cstrong>Pick your Jokers\u003c/strong> from the setups your size allows (12.2).\u003c/li>\n\u003cli>\u003cstrong>Fill the rest with number cards (Ace to 10)\u003c/strong> so that your row of the build table (12.5) is met:\u003cul>\n\u003cli>\u003cstrong>Pip total:\u003c/strong> the values of your number cards (Ace = 1) add up to exactly your row&#39;s pip total.\u003c/li>\n\u003cli>\u003cstrong>Swing points:\u003c/strong> add up to a number inside your row&#39;s swing range (12.3).\u003c/li>\n\u003cli>\u003cstrong>Lean:\u003c/strong> lands inside your row&#39;s lean range (12.4).\u003c/li>\n\u003cli>\u003cstrong>Copy limit:\u003c/strong> no value appears more times than your row allows (a third of your number cards).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Or start from your row&#39;s starter deck\u003c/strong> and change it with the pip dial and the swing dial (12.6).\u003c/li>\n\u003cli>\u003cstrong>Test it in the Deck Lab\u003c/strong> if you like; the GM may ask you to. A deck that meets its row is balanced.\u003c/li>\n\u003c/ol>\n\u003cp>A balanced deck is as fair as a d20 over a standard day, the same standard the sign decks are built to. Chapter 15 says exactly what that means.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-1-size\">12.1 Size\u003c/h3>\n\u003cp>Smaller decks get stronger cards but run out sooner, and every time a deck runs out you gain a level of weariness (chapter 4). The pip totals in 12.5 already account for this.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Runs out in a standard day\u003c/th>\n\u003cth>Highest weariness
