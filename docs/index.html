3c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Use the new roll\u003c/strong>, or doesn&#39;t say\u003c/td>\n\u003ctd>\u003cstrong>Keep your most recent card and pair it with the new card.\u003c/strong> Your first card is discarded, and the new card total stands even if it&#39;s lower.\u003c/td>\n\u003ctd>Heroic Inspiration, and most rerolls from features, feats and spells\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Choose either roll\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Keep the best pair of the three.\u003c/strong>\u003c/td>\n\u003ctd>Rerolls that let you pick the better result\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>New card is a Sun:\u003c/strong> natural 20, either way.\u003c/li>\n\u003cli>\u003cstrong>New card is an Eclipse:\u003c/strong> natural 1 for &quot;use the new roll&quot;; for &quot;choose either roll&quot; it&#39;s the lowest card, so you keep your original pair.\u003c/li>\n\u003cli>\u003cstrong>The check was an Eclipse:\u003c/strong> make a new check instead. This is also how a trait that rerolls natural 1s works.\u003c/li>\n\u003cli>\u003cstrong>A bonus on the reroll\u003c/strong> is added as usual.\u003c/li>\n\u003cli>\u003cstrong>Forcing an enemy to reroll\u003c/strong> uses a new check from the Fate Deck.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"cd-6-advantage-disadvantage-and-rerolls-extra-dice-on-a-check\">Extra dice on a check\u003c/h3>\n\u003cp>Dice added to a check (a d4 from \u003cem>bless\u003c/em> or \u003cem>guidance\u003c/em>, a Bardic Inspiration die) are one damage-deck card each, read as that die (chapter 10). Redraw Jokers.\u003c/p>\n"},{"id":"cd-7-held-draws","title":"7. Held draws","html":"\u003ch2 id=\"cd-7-held-draws-7-held-draws\">7. Held draws\u003c/h2>\n\u003cp>A held draw is a real draw, set aside face-up and used later in place of drawing. It covers effects that roll a d20 now and use the result later.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kind\u003c/th>\n\u003cth>Examples\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Hold a draw for yourself\u003c/strong>\u003c/td>\n\u003ctd>Effects that roll ahead of time and let you use the result later\u003c/td>\n\u003ctd>Draw normally and set the cards aside face-up. When you use them, don&#39;t draw again; modifiers apply at that moment, including weariness gained since. Discard them if the effect ends unused. Held cards are outside your deck, so a reshuffle doesn&#39;t return them.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Give a held draw to someone else\u003c/strong>\u003c/td>\n\u003ctd>Effects that roll ahead of time for an ally, or replace another creature&#39;s roll\u003c/td>\n\u003ctd>The giver draws from their own deck and pays the cards. The recipient uses them with their own modifiers.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Reuse or share a draw\u003c/strong>\u003c/td>\n\u003ctd>Effects that apply one roll to several targets, or one character rolling for a group\u003c/td>\n\u003ctd>The same card total counts again, with no new cards. An effect that reuses a result without its natural 20 or 1 counts a Sun as 20 and an Eclipse as 1. When one character rolls for a group, that character draws once.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>A held Sun is a natural 20 when used; a held Eclipse a natural 1.\u003c/li>\n\u003cli>Advantage on a held draw: draw 3, keep the best pair, and hold that.\u003c/li>\n\u003cli>Rerolls work on a check that used a held draw; for &quot;use the new roll&quot;, your most recent card is the second held card.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-8-companions-and-other-creatures","title":"8. Companions and other creatures","html":"\u003ch2 id=\"cd-8-companions-and-other-creatures-8-companions-and-other-creatures\">8. Companions and other creatures\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Companions draw from the Fate Deck.\u003c/strong> Animal companions, familiars, summoned and conjured creatures, mounts, hirelings and other creatures a player controls make their checks with the Fate Deck, as monsters do. The player decides what the creature does; the GM draws, or hands the player the Fate Deck to draw. Their checks never cost the player cards or cause weariness, and their advantage, disadvantage and rerolls use Fate Deck cards too.\u003c/li>\n\u003cli>\u003cstrong>Creatures that act through you are the exception.\u003c/strong> A creature that can act only by using its controller&#39;s action or attacks, so that the two act as one character, draws from its controller&#39;s deck.\u003c/li>\n\u003cli>\u003cstrong>Damage\u003c/strong> a companion deals uses the players&#39; Joker rule (chapter 10).\u003c/li>\n\u003c/ul>\n\u003cp>Why: companions would otherwise double their owner&#39;s card use and push them into weariness early.\u003c/p>\n"},{"id":"cd-9-the-fate-deck","title":"9. The Fate Deck","html":"\u003ch2 id=\"cd-9-the-fate-deck-9-the-fate-deck\">9. The Fate Deck\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Cards\u003c/th>\n\u003cth>Count\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aces\u003c/td>\n\u003ctd>17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 · 3 · 4 · 5 · 6 · 7 · 8 · 9\u003c/td>\n\u003ctd>12 · 12 · 5 · 5 · 5 · 6 · 7 · 7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10s\u003c/td>\n\u003ctd>18\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Suns / Eclipses\u003c/td>\n\u003ctd>3 / 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>100\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Face cards (J, Q, K of each suit), with wild magic\u003c/td>\n\u003ctd>12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total with wild magic\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>112\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Same draw as the players:\u003c/strong> one card at a time, two in all; a first-card Joker ends the draw.\u003c/li>\n\u003cli>\u003cstrong>Monsters use it\u003c/strong> for their attacks, saving throws, ability checks and initiative, and monster advantage and disadvantage work as for players. \u003cstrong>Players still draw their own checks\u003c/strong>, including saves against monster abilities.\u003c/li>\n\u003cli>\u003cstrong>With wild magic, face cards never change a total.\u003c/strong> When the GM draws one, place it in the wild magic sets and draw a replacement (chapter 13), so the odds come from the other 100 cards either way. About a fifth of Fate Deck checks turn one up.\u003c/li>\n\u003cli>\u003cstrong>No weariness.\u003c/strong> Reshuffle it when it runs out, about every 52 checks, with wild magic or without. Placed face cards stay out until wild magic goes off.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-10-damage","title":"10. Damage","html":"\u003ch2 id=\"cd-10-damage-10-damage\">10. Damage\u003c/h2>\n\u003cp>The card rules that replace damage dice, healing dice and other random rolls.\u003c/p>\n\u003ch3 id=\"cd-10-damage-the-damage-deck\">The damage deck\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>The central damage deck\u003c/strong> is one standard pack with the face cards removed: \u003cstrong>42 cards, Ace to 10 in four suits, plus the 2 Jokers.\u003c/strong> Everyone draws damage from it, monsters included. Both Jokers work the same way here; the Sun and the Eclipse only differ on checks.\u003c/li>\n\u003cli>\u003cstrong>Optional personal damage decks.\u003c/strong> A player may keep their own damage deck instead of drawing from the central one. It holds exactly the same cards as the central deck. Damage decks have no star-sign variants.\u003c/li>\n\u003cli>\u003cstrong>Damage decks never tire you.\u003c/strong> Damage draws never come from a player deck and never cause weariness. When a damage deck runs out, reshuffle it and keep going.\u003c/li>\n\u003c/ul>\n\u003cp>Why damage stays out of player decks: every hit would burn cards, so characters would tire faster as they level, and each deck&#39;s shape would skew its damage.\u003c/p>\n\u003ch3 id=\"cd-10-damage-reading-a-card-as-a-die\">Reading a card as a die\u003c/h3>\n\u003cp>Draw one card per damage die and read it for that die size. Add the results, then add modifiers as usual.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>d4\u003c/strong> (card ÷ 3, rounded down, +1)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d6\u003c/strong> (card ÷ 2, rounded down, +1)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d8\u003c/strong> (card − 1; Ace is 1, 10 is 8)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d10\u003c/strong> (card value)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>d12\u003c/strong> (card + 1)\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Rare sizes: \u003cstrong>d2\u003c/strong> is the card&#39;s color (black 1, red 2); \u003cstrong>d3\u003c/strong> is card ÷ 4, rounded down, +1. Jokers are covered below.\u003c/p>\n\u003ch3 id=\"cd-10-damage-jokers-bonus-damage\">Jokers: bonus damage\u003c/h3>\n\u003cp>Each damage card is a Joker about 1 time in 21. What a Joker does depends on who is dealing the damage:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Dealt by\u003c/th>\n\u003cth>Joker rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Players\u003c/strong> (and creatures they control: companions, familiars, summons)\u003c/td>\n\u003ctd>The die counts as its \u003cstrong>maximum\u003c/strong> (a 6 on a d6, 12 on a d12).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Monsters and hazards\u003c/strong>\u003c/td>\n\u003ctd>The die counts as its \u003cstrong>maximum, and you draw another die of the same size.\u003c/strong> If that&#39;s a Joker too, repeat.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>GMs building encounters: Jokers make damage run a little high on both sides, more for monsters, so fights run slightly deadlier for the party than their budget says. It shows most in big monster damage pools.\u003c/p>\n\u003cp>Jokers only matter for damage and healing dice. When the damage deck is used for other rolls (durations, d20 and d100 tables), redraw any Joker.\u003c/p>\n\u003ch3 id=\"cd-10-damage-damage-rules\">Damage rules\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Rule\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Damage dice (weapons, spells, monsters)\u003c/td>\n\u003ctd>One card per die, read on the die table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical hit, fifth edition\u003c/td>\n\u003ctd>Draw the attack&#39;s damage dice twice, extra dice included (sneak attack, smites). A Sun with a wider crit range adds one more set per extra number in the range (chapter 2).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical hit, 3.5\u003c/td>\n\u003ctd>Draw the damage as many times as the multiplier (a Sun&#39;s multiplier is in chapter 2) and add the totals, as your game says. Extra dice that aren&#39;t multiplied, such as sneak attack, are drawn once.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Half damage on a save\u003c/td>\n\u003ctd>Draw the dice, total them, then halve as usual.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Reroll 1s&quot; (or 1s and 2s)\u003c/td>\n\u003ctd>Redraw any card that reads as a rerolled number.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Roll twice and use either&quot;\u003c/td>\n\u003ctd>Draw the dice again and keep the higher total.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A low roll counting as higher (&quot;treat a 1 as a 2&quot;)\u003c/td>\n\u003ctd>Read the card, then apply the rule.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Maximum damage&quot; effects\u003c/td>\n\u003ctd>Count each die at its maximum; don&#39;t draw.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A monster&#39;s listed average damage\u003c/td>\n\u003ctd>Use it and don&#39;t draw, if your table plays that way.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ongoing damage (bleeding, burning)\u003c/td>\n\u003ctd>Draw its dice each time it applies.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Healing dice\u003c/td>\n\u003ctd>Same as damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Resistance, vulnerability, immunity\u003c/td>\n\u003ctd>Unchanged.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"cd-10-damage-other-dice\">Other dice\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Roll\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Random durations (&quot;1d4 rounds&quot;, &quot;1d4 hours&quot;)\u003c/td>\n\u003ctd>One damage card, read on the die table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d20 tables\u003c/td>\n\u003ctd>One damage card, \u003cstrong>plus 10 if it&#39;s red\u003c/strong>: an exact 1–20.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d100 tables and percentile rolls (miss chances)\u003c/td>\n\u003ctd>Two damage cards: the first is the tens, the second the ones; a 10 counts as 0, and 0-0 is 100. An exact 1–100.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d8, d10 and other small tables\u003c/td>\n\u003ctd>One damage card, read on the die table.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"cd-10-damage-recommended-house-rule-big-pools\">Recommended house rule: big pools\u003c/h3>\n\u003cp>For pools of more than 5 dice (a high-level blast spell, say), draw 5 cards and count every die beyond that at its average, rounding the total down.\u003c/p>\n\u003cul>\n\u003cli>Example: 20d6 is 5 cards plus 15 × 3.5 = 52.5, so 5 cards + 52.\u003c/li>\n\u003cli>It keeps 20-die spells quick, and the average is unchanged apart from Jokers; the results just bunch closer to the average.\u003c/li>\n\u003cli>Only the 5 drawn cards can be Jokers, so big pools get less of the Joker bonus under this rule, which matters most for monsters.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-11-the-twelve-star-sign-decks","title":"11. The twelve star-sign decks","html":"\u003ch2 id=\"cd-11-the-twelve-star-sign-decks-11-the-twelve-star-sign-decks\">11. The twelve star-sign decks\u003c/h2>\n\u003cp>\u003cstrong>Element sets the size. Modality sets the spread.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Fire (45–51 cards):\u003c/strong> short and fierce. Strongest on a fresh shuffle; runs out once or twice in a standard day.\u003c/li>\n\u003cli>\u003cstrong>Air (55–63 cards):\u003c/strong> quick; runs out once, around the middle of the day.\u003c/li>\n\u003cli>\u003cstrong>Water (67–75 cards):\u003c/strong> middling; runs out once, past the middle of the day.\u003c/li>\n\u003cli>\u003cstrong>Earth (80–90 cards):\u003c/strong> long and enduring; runs out once, late in the day.\u003c/li>\n\u003cli>\u003cstrong>Mutable\u003c/strong> signs are the swingiest of their element, except in Air: Libra carries one Sun and Gemini two, and a deck with fewer Suns needs more swing (12.5). \u003cstrong>Cardinal\u003c/strong> and \u003cstrong>Fixed\u003c/strong> signs are steadier.\u003c/li>\n\u003cli>\u003cstrong>Suns go by size:\u003c/strong> the four smallest decks, from 45 to 55 cards, carry one Sun, and the eight larger decks two. Aries carries no Eclipse; the others carry one to four.\u003c/li>\n\u003c/ul>\n\u003cp>Deck codes list Ace, 2, 3 … 10, then Suns / Eclipses. Any number of players can take the same sign; each builds their own copy of its deck. &quot;Packs&quot; is the number of standard packs needed to build it; Aquarius, Gemini and Cancer need only two.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Element · modality\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Deck code\u003c/th>\n\u003cth>Packs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>Fire · Cardinal\u003c/td>\n\u003ctd>45\u003c/td>\n\u003ctd>10-6-3-1-0-1-2-4-7-10 / 1-0\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>Fire · Fixed\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>9-6-3-2-1-1-2-4-7-11 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>Fire · Mutable\u003c/td>\n\u003ctd>51\u003c/td>\n\u003ctd>10-7-4-2-0-0-2-4-8-12 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>Air · Cardinal\u003c/td>\n\u003ctd>55\u003c/td>\n\u003ctd>13-7-3-1-0-0-2-6-9-12 / 1-1\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>Air · Fixed\u003c/td>\n\u003ctd>59\u003c/td>\n\u003ctd>4-5-6-6-7-7-6-6-5-4 / 2-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>Air · Mutable\u003c/td>\n\u003ctd>63\u003c/td>\n\u003ctd>7-6-5-6-6-6-6-6-6-6 / 2-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>Water · Cardinal\u003c/td>\n\u003ctd>67\u003c/td>\n\u003ctd>8-7-7-6-5-5-5-6-7-8 / 2-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>Water · Fixed\u003c/td>\n\u003ctd>71\u003c/td>\n\u003ctd>5-6-7-7-7-7-6-6-7-8 / 2-3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>Water · Mutable\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>12-10-8-5-3-3-4-6-9-12 / 2-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>Earth · Cardinal\u003c/td>\n\u003ctd>80\u003c/td>\n\u003ctd>13-10-8-5-3-3-4-7-10-13 / 2-2\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>Earth · Fixed\u003c/td>\n\u003ctd>85\u003c/td>\n\u003ctd>11-9-7-6-5-5-6-8-10-12 / 2-4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>Earth · Mutable\u003c/td>\n\u003ctd>90\u003c/td>\n\u003ctd>20-12-5-2-2-4-7-10-11-13 / 2-2\u003c/td>\n\u003ctd>5\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Chapter 19 compares each deck with a d20.\u003c/p>\n"},{"id":"cd-12-building-your-own-deck","title":"12. Building your own deck","html":"\u003ch2 id=\"cd-12-building-your-own-deck-12-building-your-own-deck\">12. Building your own deck\u003c/h2>\n\u003cp>How a player builds their own balanced deck instead of taking a star-sign deck. The Deck Lab, set to d20 Classic, tests any deck exactly and loads every starter deck in the build table (12.5).\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-the-short-version\">The short version\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Pick a size:\u003c/strong> 45, 50, 55 … up to 90 cards.\u003c/li>\n\u003cli>\u003cstrong>Pick your Jokers\u003c/strong> from the setups your size allows (12.2).\u003c/li>\n\u003cli>\u003cstrong>Fill the rest with number cards (Ace to 10)\u003c/strong> so that your row of the build table (12.5) is met:\n\u003cul>\n\u003cli>\u003cstrong>Pip total:\u003c/strong> the values of your number cards (Ace = 1) add up to exactly your row&#39;s pip total.\u003c/li>\n\u003cli>\u003cstrong>Swing points:\u003c/strong> add up to a number inside your row&#39;s swing range (12.3).\u003c/li>\n\u003cli>\u003cstrong>Lean:\u003c/strong> lands inside your row&#39;s lean range (12.4).\u003c/li>\n\u003cli>\u003cstrong>Copy limit:\u003c/strong> no value appears more times than your row allows (a third of your number cards).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Or start from your row&#39;s starter deck\u003c/strong> and change it with the pip dial and the swing dial (12.6).\u003c/li>\n\u003cli>\u003cstrong>Test it in the Deck Lab\u003c/strong> if you like; the GM may ask you to. A deck that meets its row is balanced.\u003c/li>\n\u003c/ol>\n\u003cp>A balanced deck is as fair as a d20 over a standard day, the same standard the sign decks are built to. Chapter 16 says exactly what that means.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-1-size\">12.1 Size\u003c/h3>\n\u003cp>Smaller decks get stronger cards but run out sooner, and every time a deck runs out you gain a level of weariness (chapter 4). The pip totals in 12.5 already account for this.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Runs out in a standard day\u003c/th>\n\u003cth>Highest weariness\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>twice\u003c/td>\n\u003ctd>Weary 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50–90\u003c/td>\n\u003ctd>once\u003c/td>\n\u003ctd>Weary 1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Custom decks come in steps of 5. For a size in between (the sign decks use 48, 51, 59, 63, 67 and 71), use the Deck Lab: it works out the exact pip total for any size, and the deck is fine if it passes the Lab test.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-2-jokers\">12.2 Jokers\u003c/h3>\n\u003cp>A Sun is a natural 20 and an Eclipse a natural 1 (chapter 2). Each size allows the setups below (Suns / Eclipses). The first is the size&#39;s main setup: one Sun at 45 and 50 cards, two from 55 to 90. The others balance too, each with its own row in 12.5.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Setups\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 2 · 1 / 1 · 1 / 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 2 · 2 / 1 · 1 / 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 1 · 1 / 2 · 1 / 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>2 / 1 · 2 / 2 · 1 / 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 2 · 2 / 1 · 2 / 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 2 · 2 / 3 · 2 / 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 3 · 2 / 2 · 2 / 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80\u003c/td>\n\u003ctd>2 / 3 · 2 / 2 · 2 / 4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>85\u003c/td>\n\u003ctd>2 / 3 · 2 / 4 · 2 / 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>2 / 4 · 2 / 3 · 2 / 2\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>More Jokers also make a deck last longer, because a check that opens on a Joker costs one card instead of two.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-3-swing-points\">12.3 Swing points\u003c/h3>\n\u003cp>Swing points measure how far your cards sit from the middle. Extreme cards swing your draws; middle cards keep them steady.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Swing points\u003c/strong>\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Add the points for every number card. Your row&#39;s swing range is where the deck stays balanced. Below it the deck saves too well; above it, its attacks hit too hard. Inside the range, the low end plays steady and the high end swingy.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-4-lean\">12.4 Lean\u003c/h3>\n\u003cp>Lean says whether your extremes sit high or low. It uses the same scores as swing points: add the points of your 7s to 10s, then subtract the points of your Aces to 4s.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Lean\u003c/strong>\u003c/td>\n\u003ctd>−10\u003c/td>\n\u003ctd>−6\u003c/td>\n\u003ctd>−3\u003c/td>\n\u003ctd>−1\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>+1\u003c/td>\n\u003ctd>+3\u003c/td>\n\u003ctd>+6\u003c/td>\n\u003ctd>+10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A positive lean means your high cards swing further from the middle than your low ones. It matters most for fifth-edition attacks, and your row&#39;s lean range keeps them balanced.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-5-the-build-table\">12.5 The build table\u003c/h3>\n\u003cp>Pick your row. &quot;Number cards&quot; is the size minus your Jokers. &quot;Most copies&quot; is the copy limit: the most of any one value. The starter deck meets every rule for its row; its code lists Ace, 2, 3 … 10, then Suns and Eclipses. &quot;Packs&quot; is the standard packs needed to build the starter.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Number cards\u003c/th>\n\u003cth>Pip total\u003c/th>\n\u003cth>Swing points\u003c/th>\n\u003cth>Lean\u003c/th>\n\u003cth>Most copies\u003c/th>\n\u003cth>Starter deck\u003c/th>\n\u003cth>Packs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>42\u003c/td>\n\u003ctd>259\u003c/td>\n\u003ctd>145–264\u003c/td>\n\u003ctd>60 to 109\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>4-4-4-4-3-2-1-4 al\">12.6 Adjusting a deck: the pip dial and the swing dial\u003c/h3>\n\u003cp>Every card has a \u003cstrong>mirror\u003c/strong>: A and 10, 2 and 9, 3 and 8, 4 and 7, 5 and 6. Mirrors have the same swing points, which gives you two dials.\u003c/p>\n\u003cp>\u003cstrong>The pip dial: flip a card to its mirror.\u003c/strong> The pip total and the lean change; the swing points don&#39;t.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Flip\u003c/th>\n\u003cth>Pip total\u003c/th>\n\u003cth>Lean\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>5 → 6\u003c/td>\n\u003ctd>+1\u003c/td>\n\u003ctd>0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4 → 7\u003c/td>\n\u003ctd>+3\u003c/td>\n\u003ctd>+2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3 → 8\u003c/td>\n\u003ctd>+5\u003c/td>\n\u003ctd>+6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 → 9\u003c/td>\n\u003ctd>+7\u003c/td>\n\u003ctd>+12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A → 10\u003c/td>\n\u003ctd>+9\u003c/td>\n\u003ctd>+20\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Flip the other way (6 → 5, 10 → A and so on) to lower both by the same amount.\u003c/p>\n\u003cp>\u003cstrong>The swing dial: push a card and its mirror apart, or pull them together.\u003c/strong> Move one card down and its mirror up by the same number of steps. The pip total and the lean don&#39;t change.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Push apart\u003c/th>\n\u003cth>Swing points\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>a 5 → 4 and a 6 → 7\u003c/td>\n\u003ctd>+2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 4 → 3 and a 7 → 8\u003c/td>\n\u003ctd>+4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 3 → 2 and an 8 → 9\u003c/td>\n\u003ctd>+6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 2 → A and a 9 → 10\u003c/td>\n\u003ctd>+8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 5 → A and a 6 → 10\u003c/td>\n\u003ctd>+20\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Pull together (the same moves reversed) to lower the swing points by the same amount. Other moves work too, as long as one card goes down and another goes up by the same number of steps: the pip total stays put, and the swing points and lean change by whatever the tables say.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-7-worked-example-45-cards-1-sun-and-1-eclipse\">12.7 Worked example: 45 cards, 1 Sun and 1 Eclipse\u003c/h3>\n\u003cp>The row says: 43 number cards, pip total \u003cstrong>254\u003c/strong>, swing points \u003cstrong>205–339\u003c/strong>, lean \u003cstrong>0 to 69\u003c/strong>, at most \u003cstrong>14\u003c/strong> of any value.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Deal the number cards evenly.\u003c/strong> Four of each value is 40 cards; add the other 3 from the middle out (5, 6, 4).\nAce to 10: 4-4-4-5-5-5-4-4-4-4. Pip total 235, swing points 161, lean −1.\u003c/li>\n\u003cli>\u003cstrong>Flip to reach 254 (+19) and lift the lean.\u003c/strong> Two Aces → 10s (+18 pips, +40 lean) and one 5 → 6 (+1 pip).\nNow 2-4-4-5-4-6-4-4-4-6. Pip total 254, swing points still 161, lean 39.\u003c/li>\n\u003cli>\u003cstrong>Push apart into the swing range (+80).\u003c/strong> Four times, a 5 and a 6 → an Ace and a 10.\nNow \u003cstrong>6-4-4-5-0-2-4-4-4-10 / 1-1\u003c/strong>. Pip total 254, swing points 241, lean 39, largest count 10.\u003c/li>\n\u003c/ol>\n\u003cp>The deck meets its row, and the Deck Lab confirms it&#39;s balanced. The deck after step 2 doesn&#39;t pass: its swing points sit below the range, so its 3.5 attacks deal only 96% of a d20&#39;s damage.\u003c/p>\n"},{"id":"cd-13-wild-magic-optional-rule","title":"13. Wild magic (optional rule)","html":"\u003ch2 id=\"cd-13-wild-magic-optional-rule-13-wild-magic-optional-rule\">13. Wild magic (optional rule)\u003c/h2>\n\u003cp>Wild magic is optional: the table decides at session zero whether to play with it. It adds the 12 face cards (the Jacks, Queens and Kings of one pack) to the Fate Deck, for 112 cards. The face cards never change a check, so the Fate Deck plays exactly the same either way (chapter 9). A table that plays without wild magic leaves them out and skips this chapter.\u003c/p>\n\u003ch3 id=\"cd-13-wild-magic-optional-rule-how-it-goes-off\">How it goes off\u003c/h3>\n\u003col>\n\u003cli>A face card never counts toward a card total: when the GM draws one from the Fate Deck, set it aside and draw a replacement. If the check was made in response to a player&#39;s action or request (plain rolls, secret checks and companions&#39; checks included), place the face card in the wild magic sets, in the order drawn: four sets of three. Any other face card goes to the discard pile. The GM can&#39;t draw extra checks to fish for them.\u003c/li>\n\u003cli>When the fourth set is complete (about every 48 Fate Deck checks, roughly once per encounter), wild magic goes off.\u003c/li>\n\u003cli>\u003cstrong>Read the side and strength from the cards.\u003c/strong> In each set, count pairs of matching suits: a one-suit set has 3 pairs, a two-suit set 1, a three-suit set none. Add red pairs (♥ ♦) and subtract black pairs (♠ ♣). The net, from −4 to +4, is the result:\n\u003cul>\n\u003cli>\u003cstrong>Above 0: good wild magic\u003c/strong>, stronger the higher it goes.\u003c/li>\n\u003cli>\u003cstrong>Below 0: bad wild magic\u003c/strong>, stronger the lower it goes.\u003c/li>\n\u003cli>\u003cstrong>0: mixed:\u003c/strong> it hits friend and foe alike, or it&#39;s a harmless oddity.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Look up the exact combination below for its effect, and resolve it with the rules in the next section. Order doesn&#39;t matter, either within a set or between sets.\u003c/li>\n\u003cli>Return all 12 face cards to the Fate Deck&#39;s discard pile.\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"cd-13-wild-magic-optional-rule-resolving-an-effect\">Resolving an effect\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cp>\u003cstrong>The Destined\u003c/strong> is the character whose action completed the fourth set: the player the GM was responding to when the last face card came up. If it came up on a companion&#39;s check, the Destined is the companion&#39;s controller. If that&#39;s unclear, the GM picks.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Allies\u003c/strong> are the Destined, the other player characters and their companions. \u003cstrong>Enemies\u003c/strong> are creatures hostile to the party. \u003cstrong>A chosen enemy\u003c/strong> is an enemy the Destined picks within 60 feet.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Surge level\u003c/strong> is half the Destined&#39;s level, rounded up, to a maximum of 9. \u003cstrong>Surge DC\u003c/strong> is a typical spell save DC for the Destined&#39;s level:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Destined level\u003c/th>\n\u003cth>1\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003cth>11\u003c/th>\n\u003cth>12\u003c/th>\n\u003cth>13\u003c/th>\n\u003cth>14\u003c/th>\n\u003cth>15\u003c/th>\n\u003cth>16\u003c/th>\n\u003cth>17\u003c/th>\n\u003cth>18\u003c/th>\n\u003cth>19\u003c/th>\n\u003cth>20\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Surge level\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Surge DC, fifth edition\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>13\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>19\u003c/td>\n\u003ctd>19\u003c/td>\n\u003ctd>19\u003c/td>\n\u003ctd>19\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Surge DC, 3.5\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>18\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>21\u003c/td>\n\u003ctd>21\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>24\u003c/td>\n\u003ctd>24\u003c/td>\n\u003ctd>26\u003c/td>\n\u003ctd>26\u003c/td>\n\u003ctd>26\u003c/td>\n\u003ctd>26\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>It happens at once,\u003c/strong> in the middle of whatever is going on, and costs no actions or cards. Creatures save against the surge DC with their normal draw: players from their own deck, monsters from the Fate Deck.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Effects last 1 minute (10 rounds)\u003c/strong> unless they say otherwise. They&#39;re magical: anything that can end a spell can end one, treating it as a spell of the surge level.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Saves are named for fifth edition.\u003c/strong> In 3.5, a Strength or Constitution save is a Fortitude save, a Dexterity save a Reflex save, and a Wisdom, Intelligence or Charisma save a Will save.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Save for half:\u003c/strong> a creature that succeeds takes half the damage.\u003c/li>\n\u003cli>\u003cstrong>Fails by 5 or more:\u003c/strong> the effect gets worse when the save&#39;s result is 5 or more below the surge DC.\u003c/li>\n\u003cli>\u003cstrong>With a repeat save:\u003c/strong> the creature makes the save again at the end of each of its turns, and the effect ends for it on a success.\u003c/li>\n\u003cli>\u003cstrong>Incapacitation:\u003c/strong> a creature whose level, challenge rating or Hit Dice is higher than the Destined&#39;s level automatically succeeds on that save.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Advantage and disadvantage\u003c/strong> are the card rules in chapter 6, in both games.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Reactions:\u003c/strong> in 3.5, an effect that stops reactions stops attacks of opportunity and immediate actions.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Heroic Inspiration:\u003c/strong> a character can have only one. In 3.5, which has none, it&#39;s a single reroll the character keeps until they use it or finish a long rest, and it works as Heroic Inspiration does (&quot;use the new roll&quot;, chapter 6).\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Damage and healing\u003c/strong> use the damage deck. Good and mixed wild magic use the players&#39; Joker rule; bad wild magic is a hazard and uses the monsters&#39; rule (chapter 10). Damage types are named for fifth edition, and an effect gives the 3.5 type where it differs.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Conditions\u003c/strong> are your game&#39;s own, except these six, which wild magic defines for both games:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Condition\u003c/th>\n\u003cth>What it does\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Concealed\u003c/strong>\u003c/td>\n\u003ctd>Attacks against it have disadvantage (3.5: a 20% miss chance).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Confused\u003c/strong>\u003c/td>\n\u003ctd>It can&#39;t take reactions. On its turn it attacks the nearest creature it can reach, friend or foe, or moves toward one if none is in reach (3.5: your game&#39;s confused).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Dazzled\u003c/strong>\u003c/td>\n\u003ctd>Disadvantage on attack rolls and on checks that rely on sight (3.5: your game&#39;s dazzled).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Quickened\u003c/strong>\u003c/td>\n\u003ctd>One extra action on each of its turns, used only to make one weapon attack, Dash or Disengage (3.5: one extra move action).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Shaken\u003c/strong>\u003c/td>\n\u003ctd>−2 to attack rolls and ability checks (3.5: your game&#39;s shaken).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Slowed\u003c/strong>\u003c/td>\n\u003ctd>Half speed, −2 to AC and Dexterity saves, no reactions, and on its turn an action or a bonus action, not both (3.5: half speed, −1 to attack rolls, AC and Reflex saves, and no full-round actions: each turn it can move or act, not both).\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>No enemy around?\u003c/strong> An effect that needs one waits and goes off at the start of the next encounter&#39;s first round. Everything else happens right away.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Bad is good turned around.\u003c/strong> Every bad combination is the opposite of a good one, with the same odds (swap ♥ for ♠ and ♦ for ♣), and its effect is that good effect turned against the party. The Opposite column pairs them.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Mixed wild magic hits friend and foe alike, or it&#39;s a harmless oddity.\u003c/strong> The most common combination of all, #58, sends you to the Oddities table below.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>The GM can swap\u003c/strong> an effect that makes no sense in the scene (a vine burst on a ship&#39;s rigging, say) for another of the same result.\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003cp>Chapter 23, at the back of the book, gives the odds of every result and combination.\u003c/p>\n\u003ch3 id=\"cd-13-wild-magic-optional-rule-all-93-combinations\">All 93 combinations\u003c/h3>\n\u003cp>Suits within a set are listed ♥ ♦ ♠ ♣. One-suit sets are listed first, then two-suit sets, then three-suit sets.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>The four sets\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Opposite\u003c/th>\n\u003cth>Effect\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♦ · ♠♠♣ · ♠♣♣\u003c/td>\n\u003ctd>Good 4\u003c/td>\n\u003ctd>#93\u003c/td>\n\u003ctd>\u003cstrong>Crown of Fortune.\u003c/strong> Every ally regains 2d8 hit points per surge level, loses one level of weariness and gains Heroic Inspiration. Each ally&#39;s next check this encounter is a natural 20: don&#39;t draw.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>♥♥♥ · ♦♠♣ · ♦♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#87\u003c/td>\n\u003ctd>\u003cstrong>Spell Surge.\u003c/strong> The Destined, or an ally they choose who casts spells, casts one of their spells of the surge level or lower that takes an action or less to cast (3.5: a standard action or less), right now and free: no action, no spell slot or prepared spell, no cards. If no ally casts spells, fire bursts instead in a 20-foot radius around a point the Destined chooses within 120 feet: 2d6 fire damage per surge level, Dexterity save for half.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>♦♦♦ · ♥♠♣ · ♥♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#88\u003c/td>\n\u003ctd>\u003cstrong>Ablative Barrier.\u003c/strong> Each ally within 40 feet of the Destined takes less damage from every source for 1 minute: reduce the damage by twice the surge level. Each time the reduction protects an ally, it drops by 1 for all of them; it ends at 0.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♠ · ♠♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#90\u003c/td>\n\u003ctd>\u003cstrong>Surge of Life.\u003c/strong> Life floods out of the Destined: each ally within 30 feet regains 2d8 hit points per surge level. Undead enemies in the area take that much radiant damage instead (3.5: positive energy), Constitution save for half (3.5: Will).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♣ · ♠♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#89\u003c/td>\n\u003ctd>\u003cstrong>Heroic Anthem.\u003c/strong> Four singing skeletons appear and serenade the party for 1 minute: allies gain a +1 bonus to attack rolls, saving throws, ability checks and skill checks (3.5: a morale bonus).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♠ · ♠♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#92\u003c/td>\n\u003ctd>\u003cstrong>Vanishing.\u003c/strong> The Destined and each ally within 10 feet of them turn invisible for 1 minute. An ally&#39;s invisibility ends the moment they deal damage or force anyone to make a save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♣ · ♠♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 3\u003c/td>\n\u003ctd>#91\u003c/td>\n\u003ctd>\u003cstrong>Quickening.\u003c/strong> The Destined and each ally within 30 feet are quickened for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♠ · ♦♣♣ · ♠♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#82\u003c/td>\n\u003ctd>\u003cstrong>Vitality Burst.\u003c/strong> Each ally within 20 feet of the Destined regains 1d8 hit points per surge level. Undead enemies in the area take that much radiant damage instead (3.5: positive energy), Constitution save for half (3.5: Will).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♣ · ♦♠♠ · ♠♣♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#81\u003c/td>\n\u003ctd>\u003cstrong>Bewilder.\u003c/strong> A chosen enemy makes a Wisdom save. Success: it can&#39;t take reactions until the end of its next turn. Failure: confused until the end of its next turn. Fails by 5 or more: confused for 1 minute, with a repeat save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♠ · ♥♣♣ · ♠♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#84\u003c/td>\n\u003ctd>\u003cstrong>Giant&#39;s Stature.\u003c/strong> The Destined grows to Large for 1 minute: reach +5 feet, +2 to melee damage rolls, and −1 to AC and Dexterity saves. At surge level 4 or higher they grow to Huge instead: reach +10 feet and +4 to melee damage rolls.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11\u003c/td>\n\u003ctd>♦♦♦ · ♥♥♣ · ♥♠♠ · ♠♣♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#83\u003c/td>\n\u003ctd>\u003cstrong>Stormlance.\u003c/strong> Lightning leaps from the Destined in a 120-foot line aimed where they choose: (surge level + 1)d12 lightning damage (3.5: electricity) to each creature in the line, Dexterity save for half.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>12\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♣ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#85\u003c/td>\n\u003ctd>\u003cstrong>Leaden Limbs.\u003c/strong> A chosen enemy makes a Constitution save. Success: slowed until the end of its next turn. Failure: slowed for 3 rounds. Fails by 5 or more: slowed for 1 minute, with a repeat save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♠ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 2\u003c/td>\n\u003ctd>#86\u003c/td>\n\u003ctd>\u003cstrong>Burst of Speed.\u003c/strong> The Destined is quickened for 3 rounds.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>14\u003c/td>\n\u003ctd>♥♥♥ · ♦♠♠ · ♦♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#59\u003c/td>\n\u003ctd>\u003cstrong>Lucky Break.\u003c/strong> The Destined gains Heroic Inspiration. If they already have it, their next check this encounter has advantage instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15\u003c/td>\n\u003ctd>♦♦♦ · ♥♠♠ · ♥♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#60\u003c/td>\n\u003ctd>\u003cstrong>Beast Ally.\u003c/strong> A beast made of starlight (a great stag, a bear or the like) appears next to the Destined and fights for the party for 1 minute, then fades. Its challenge rating is up to half the Destined&#39;s level, at least 1/4 (3.5: the Destined&#39;s level − 3, at least 1/2). It acts right after the Destined each round, as the Destined&#39;s player decides.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>16\u003c/td>\n\u003ctd>♥♥♠ · ♥♣♣ · ♦♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#61\u003c/td>\n\u003ctd>\u003cstrong>Clumsy Hex.\u003c/strong> A chosen enemy makes a Dexterity save. Failure: −2 to AC, Dexterity saves and Dexterity-based checks for 1 minute. Fails by 5 or more: −3 instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>♥♥♠ · ♥♦♦ · ♠♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#70\u003c/td>\n\u003ctd>\u003cstrong>Weakness Hex.\u003c/strong> A chosen enemy makes a Constitution save. Failure: −2 to Strength-based checks and Strength-based attack and damage rolls (fifth edition: and Strength saves) for 1 minute. Fails by 5 or more: −3 instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♠ · ♠♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#71\u003c/td>\n\u003ctd>\u003cstrong>Muddle.\u003c/strong> A chosen enemy makes a Wisdom save. Failure: −2 to Intelligence-, Wisdom- and Charisma-based checks, to Wisdom, Intelligence and Charisma saves (3.5: Will saves), and to its spell attacks and spell save DCs, for 1 minute. Fails by 5 or more: −3 instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>19\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♠ · ♦♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#62\u003c/td>\n\u003ctd>\u003cstrong>Verdant Clutch.\u003c/strong> Vines burst up in a 20-foot radius around a point the Destined chooses within 60 feet. Each creature in it makes a Dexterity save or its speed drops to 0 for 1 minute; it can use its action to try a Strength or Dexterity check against the surge DC to break free. The area is difficult terrain for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♣ · ♠♠♣ · ♥♦♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#65\u003c/td>\n\u003ctd>\u003cstrong>Tinge of Terror.\u003c/strong> Each enemy within 30 feet of the Destined makes a Wisdom save. Failure: shaken until the end of its next turn. Fails by 5 or more: shaken for 1 minute, with a repeat save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>21\u003c/td>\n\u003ctd>♥♥♠ · ♦♦♣ · ♠♣♣ · ♥♦♠\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#72\u003c/td>\n\u003ctd>\u003cstrong>Laughing Fit.\u003c/strong> A chosen enemy makes a Wisdom save. Success: it can&#39;t take reactions until the end of its next turn. Failure: slowed until the end of its next turn. Fails by 5 or more: slowed for 3 rounds, and it falls prone.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>22\u003c/td>\n\u003ctd>♥♥♣ · ♥♠♠ · ♦♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#63\u003c/td>\n\u003ctd>\u003cstrong>Echo Selves.\u003c/strong> Three illusory images of the Destined appear for 1 minute. An attack against the Destined picks at random among the Destined and the remaining images; an image that&#39;s hit vanishes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>23\u003c/td>\n\u003ctd>♥♥♣ · ♥♦♦ · ♠♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#67\u003c/td>\n\u003ctd>\u003cstrong>Dancing Blade.\u003c/strong> The Destined&#39;s weapon (or a spectral fist dealing 1d6 bludgeoning damage) animates beside them for 3 rounds. At the end of each of the Destined&#39;s turns it attacks an enemy within 15 feet of them, drawing from the Fate Deck with the Destined&#39;s attack bonus − 2 (3.5: their best attack bonus − 2), and deals the weapon&#39;s damage dice with no modifier.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>24\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♠ · ♠♠♣ · ♥♦♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#66\u003c/td>\n\u003ctd>\u003cstrong>Whirligig.\u003c/strong> A chosen enemy makes a Wisdom save (incapacitation). On a failure it spins like a top and is confused until the end of its next turn.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>25\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♠ · ♠♣♣ · ♥♦♠\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#74\u003c/td>\n\u003ctd>\u003cstrong>Critter Curse.\u003c/strong> A chosen enemy makes a Wisdom save (incapacitation). On a failure it turns into a harmless Tiny animal until the end of its next turn (for 1d4 rounds if it fails by 5 or more): it can move and hide but can&#39;t attack, cast spells or use its gear.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>26\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♣ · ♠♠♣ · ♥♦♠\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#68\u003c/td>\n\u003ctd>\u003cstrong>Fortune&#39;s Turn.\u003c/strong> Each ally&#39;s next check this encounter has advantage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>27\u003c/td>\n\u003ctd>♥♥♣ · ♦♦♣ · ♦♠♠ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#64\u003c/td>\n\u003ctd>\u003cstrong>Borrowed Time.\u003c/strong> Each ally shuffles the top 3 cards of their discard pile back into their deck.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>28\u003c/td>\n\u003ctd>♥♥♦ · ♦♦♠ · ♠♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#73\u003c/td>\n\u003ctd>\u003cstrong>Ward.\u003c/strong> Each ally within 30 feet of the Destined gains temporary hit points equal to 3 × the surge level for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>29\u003c/td>\n\u003ctd>♥♥♦ · ♦♦♣ · ♠♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#69\u003c/td>\n\u003ctd>\u003cstrong>Glimpse.\u003c/strong> The Destined looks at the top 3 cards of the Fate Deck and puts them back in any order.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>♥♥♠ · ♥♦♣ · ♦♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#77\u003c/td>\n\u003ctd>\u003cstrong>Tattletale Glow.\u003c/strong> Glittering light outlines every enemy in a 20-foot radius around a point the Destined chooses within 120 feet, for 1 minute: they can&#39;t hide, and attacks against them never suffer disadvantage (3.5: a miss chance) for being unseen.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>31\u003c/td>\n\u003ctd>♥♥♣ · ♥♦♠ · ♦♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#79\u003c/td>\n\u003ctd>\u003cstrong>Stolen Thoughts.\u003c/strong> For 1 minute the Destined hears a chosen enemy&#39;s surface thoughts: at the start of each round, the GM tells them what it plans to do.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>32\u003c/td>\n\u003ctd>♥♥♦ · ♥♠♣ · ♦♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#75\u003c/td>\n\u003ctd>\u003cstrong>Sticky Nectar.\u003c/strong> Sticky nectar coats a chosen enemy (Dexterity save negates): −1 to AC and Dexterity saves, and its speeds drop by 10 feet, for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>33\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♣ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#76\u003c/td>\n\u003ctd>\u003cstrong>Sun Breaks Through.\u003c/strong> The next Eclipse any ally draws on a check this encounter counts as a Sun instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>34\u003c/td>\n\u003ctd>♦♦♠ · ♥♦♣ · ♥♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#78\u003c/td>\n\u003ctd>\u003cstrong>Luminous Pests.\u003c/strong> Birds of light burst from the Destined in a 30-foot cone. Each enemy in it makes a Wisdom save or is dazzled for 1 minute, with a repeat save (if it fails by 5 or more, it&#39;s blinded until the end of its next turn first). Allies are unaffected.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>♦♦♣ · ♥♦♠ · ♥♠♣ · ♥♠♣\u003c/td>\n\u003ctd>Good 1\u003c/td>\n\u003ctd>#80\u003c/td>\n\u003ctd>\u003cstrong>Gale Blast.\u003c/strong> Wind blasts from the Destined in a 30-foot cone aimed where they choose. Each enemy in it makes a Strength save: pushed 10 feet on a failure, pushed 10 feet and knocked prone if it fails by 5 or more.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>36\u003c/td>\n\u003ctd>♥♥♥ · ♦♦♦ · ♠♠♠ · ♣♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>The Grand Alignment.\u003c/strong> The four suits align. All weariness ends, every deck in play (the players&#39; decks and the Fate Deck) is reshuffled with its discard pile without anyone gaining weariness, and every creature in the encounter, friend and foe, treats its next check as a natural 20.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>37\u003c/td>\n\u003ctd>♥♥♥ · ♠♠♠ · ♦♦♣ · ♦♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Slumber Tide.\u003c/strong> Drowsy magic fills a 100-foot radius around the Destined. Every creature in it, friend and foe, makes a Wisdom save (incapacitation). Failure: unconscious until the end of its next turn. Fails by 5 or more: unconscious for 1 minute, with a repeat save. A sleeper wakes if it takes damage or someone uses an action to shake it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>38\u003c/td>\n\u003ctd>♥♥♥ · ♣♣♣ · ♦♦♠ · ♦♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Double Spin.\u003c/strong> The Destined and the enemy nearest them both spin like tops. Each makes a Wisdom save (incapacitation); on a failure it&#39;s confused until the end of its next turn.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>39\u003c/td>\n\u003ctd>♦♦♦ · ♠♠♠ · ♥♥♣ · ♥♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Antimagic Eruption.\u003c/strong> The wild magic tries to end every spell and magical effect on each creature within 30 feet of the Destined, friend and foe. One of the surge level or lower ends. For a higher one, the GM draws a Fate Deck check and adds the surge level: on 10 + that spell&#39;s level or higher, it ends.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>♦♦♦ · ♣♣♣ · ♥♥♠ · ♥♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Falling Up.\u003c/strong> The sky pulls within 60 feet of the Destined. Every creature there, friend and foe, falls 30 feet upward unless it succeeds on a Dexterity save to grab hold of something. The fallen hang there, unable to move, until the start of the Destined&#39;s next turn, then drop back down and take falling damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>41\u003c/td>\n\u003ctd>♥♥♠ · ♥♠♠ · ♦♦♣ · ♦♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Sudden Gale.\u003c/strong> Wild winds blow in a random direction within 40 feet of the Destined for 1 minute. A creature that starts its turn there makes a Strength save or falls prone (and is pushed 10 feet if it fails by 5 or more); the Destined saves right away. Moving against the wind is difficult terrain, for flying creatures too.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>42\u003c/td>\n\u003ctd>♥♥♠ · ♥♣♣ · ♦♦♣ · ♦♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Tremor.\u003c/strong> The ground heaves within 40 feet of the Destined. Every creature standing on the ground makes a Dexterity save or falls prone, and the area is difficult terrain for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>43\u003c/td>\n\u003ctd>♥♥♠ · ♥♦♦ · ♦♣♣ · ♠♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Weightless.\u003c/strong> Creatures and objects within 20 feet of the Destined become nearly weightless until the end of the Destined&#39;s next turn: they can climb at their full speed and jump as high as they normally jump across.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>44\u003c/td>\n\u003ctd>♥♥♣ · ♥♠♠ · ♦♦♠ · ♦♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Swap.\u003c/strong> The Destined and the enemy nearest them trade places by teleporting.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>♥♥♣ · ♥♣♣ · ♦♦♠ · ♦♠♠\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Hellish Shortcut.\u003c/strong> The Destined vanishes in a puff of sulfur and reappears 30 feet away, in the direction of their choice (the nearest open space if that spot is taken), singed: they take 1d4 fire damage per surge level (no save).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>46\u003c/td>\n\u003ctd>♥♥♣ · ♥♦♦ · ♦♠♠ · ♠♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Emotional Turmoil.\u003c/strong> For 1 minute, at the start of each of the Destined&#39;s turns, draw a damage-deck card: red, +2 to attack rolls, saving throws, ability checks and skill checks until their next turn (3.5: a luck bonus); black, −2 instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>47\u003c/td>\n\u003ctd>♥♥♦ · ♥♠♠ · ♦♦♣ · ♠♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Monstrous Transformation.\u003c/strong> The Destined&#39;s head and arms take a beast&#39;s shape for 1 minute, adding the surge level to their weapon and unarmed damage rolls. At the start of each of their turns they make a Wisdom save or are confused until their next turn; if they succeed by 5 or more, they can end the effect.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>48\u003c/td>\n\u003ctd>♥♥♦ · ♥♣♣ · ♦♦♠ · ♠♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Warp.\u003c/strong> Reality ripples through the Destined: they&#39;re confused until the end of their next turn and gain 1d6 temporary hit points per surge level (at least 4d6) for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>49\u003c/td>\n\u003ctd>♥♥♦ · ♥♦♦ · ♠♠♣ · ♠♣♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Day for Night.\u003c/strong> Until the encounter ends, Suns and Eclipses swap meanings on every check and plain roll, for players and GM alike: a Sun is a natural 1 and an Eclipse a natural 20.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>♥♠♠ · ♦♦♣ · ♥♦♣ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Trinket Squall.\u003c/strong> Illusory trinkets rain down in a 40-foot radius around the Destined for 1 minute, making everything in it concealed. A creature that uses an action to study the illusion and succeeds on an Intelligence check (3.5: a Will save) against the surge DC sees through it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>51\u003c/td>\n\u003ctd>♥♣♣ · ♦♦♠ · ♥♦♠ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Blackout.\u003c/strong> Magical darkness fills a 20-foot radius around the Destined for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>52\u003c/td>\n\u003ctd>♥♥♠ · ♦♣♣ · ♥♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Cloudburst.\u003c/strong> Hail hammers a 30-foot radius around the Destined for a moment: nonmagical fires there go out, the wild magic tries to end magical fire (as #39), and the ground is slick with ice, difficult terrain for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>53\u003c/td>\n\u003ctd>♥♥♣ · ♦♠♠ · ♥♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Strike Up the Band.\u003c/strong> For 1 minute theme music follows the Destined: +2 to Charisma checks to persuade, intimidate or perform, −2 to Charisma checks to deceive, and they can&#39;t hide or move silently.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>54\u003c/td>\n\u003ctd>♥♥♦ · ♠♠♣ · ♥♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Stolen Face.\u003c/strong> The Destined and the enemy nearest them swap appearances for 1 minute (an illusion). A creature that uses an action to study one of them and succeeds on an Intelligence check (3.5: a Will save) against the surge DC sees through it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>♥♥♦ · ♠♣♣ · ♥♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Living Object.\u003c/strong> The nearest unattended object (up to Medium size) sprouts animal legs and follows the Destined around until the encounter ends, getting underfoot. It&#39;s harmless.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>56\u003c/td>\n\u003ctd>♥♦♦ · ♠♠♣ · ♥♦♣ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Starshard Spray.\u003c/strong> Shards of cold starlight burst from the Destined in a 15-foot cone: 1 piercing damage to each creature in it, friend or foe. Where they land, they glitter for an hour, shedding dim light in a 5-foot radius.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>57\u003c/td>\n\u003ctd>♥♦♦ · ♠♣♣ · ♥♦♠ · ♥♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Ghost Object.\u003c/strong> The unattended object nearest the Destined (up to 30 cubic feet: a crate, a door, a table) turns pale and insubstantial for good: it gives no cover, and anything can pass through it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>58\u003c/td>\n\u003ctd>♥♦♠ · ♥♦♣ · ♥♠♣ · ♦♠♣\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003cstrong>Oddity.\u003c/strong> Something harmless and strange: draw a damage-deck card (redraw Jokers) and look it up on the Oddities table.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>59\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♣ · ♦♦♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#14\u003c/td>\n\u003ctd>\u003cstrong>Bad Omen.\u003c/strong> The Destined loses Heroic Inspiration. If they have none, their next check this encounter has disadvantage instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♠ · ♦♦♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#15\u003c/td>\n\u003ctd>\u003cstrong>Hostile Beast.\u003c/strong> A beast made of starlight appears within 30 feet of the Destined and attacks the party for 1 minute, then fades. Its challenge rating is up to half the Destined&#39;s level, at least 1/4 (3.5: the Destined&#39;s level − 3, at least 1/2). It acts right after the Destined each round.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>61\u003c/td>\n\u003ctd>♥♠♠ · ♥♣♣ · ♦♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#16\u003c/td>\n\u003ctd>\u003cstrong>Clumsy Hex.\u003c/strong> The Destined makes a Dexterity save. Failure: −2 to AC, Dexterity saves and Dexterity-based checks for 1 minute. Fails by 5 or more: −3 instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>62\u003c/td>\n\u003ctd>♥♠♠ · ♥♣♣ · ♦♦♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#19\u003c/td>\n\u003ctd>\u003cstrong>Verdant Clutch.\u003c/strong> Vines burst up in a 20-foot radius around the Destined. Each creature in it makes a Dexterity save or its speed drops to 0 for 1 minute; it can use its action to try a Strength or Dexterity check against the surge DC to break free. The area is difficult terrain for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>63\u003c/td>\n\u003ctd>♥♥♠ · ♦♠♠ · ♦♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#22\u003c/td>\n\u003ctd>\u003cstrong>Starmote Swarm.\u003c/strong> A whirl of glittering motes fills a 20-foot radius around the Destined for 2 rounds. Creatures inside are blinded while they stay in it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>64\u003c/td>\n\u003ctd>♥♥♣ · ♦♠♠ · ♦♣♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#27\u003c/td>\n\u003ctd>\u003cstrong>Burnout.\u003c/strong> Each ally burns the top 3 cards of their deck: discard them unused. If that takes a deck&#39;s last card, it runs out as usual.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>♥♥♦ · ♥♠♠ · ♦♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#20\u003c/td>\n\u003ctd>\u003cstrong>Tinge of Terror.\u003c/strong> The Destined and each ally within 20 feet make a Wisdom save. Failure: shaken until the end of their next turn. Fails by 5 or more: shaken for 1 minute, with a repeat save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>66\u003c/td>\n\u003ctd>♥♥♦ · ♥♣♣ · ♦♠♠ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#24\u003c/td>\n\u003ctd>\u003cstrong>Whirligig.\u003c/strong> The Destined makes a Wisdom save (incapacitation). On a failure they spin like a top and are confused until the end of their next turn.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>67\u003c/td>\n\u003ctd>♥♥♦ · ♦♠♠ · ♠♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#23\u003c/td>\n\u003ctd>\u003cstrong>Leaping Weapon.\u003c/strong> The Destined&#39;s weapon, or whatever they&#39;re holding, leaps from their hands and lands 10 feet away in a random direction.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>68\u003c/td>\n\u003ctd>♥♥♦ · ♦♠♠ · ♦♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#26\u003c/td>\n\u003ctd>\u003cstrong>Ill Fortune.\u003c/strong> Each ally&#39;s next check this encounter has disadvantage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>69\u003c/td>\n\u003ctd>♥♥♦ · ♦♣♣ · ♠♠♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#29\u003c/td>\n\u003ctd>\u003cstrong>Glimpsed.\u003c/strong> The GM looks at the top 3 cards of the Destined&#39;s deck and puts them back in any order.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♠ · ♠♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#17\u003c/td>\n\u003ctd>\u003cstrong>Weakness Hex.\u003c/strong> The Destined makes a Constitution save. Failure: −2 to Strength-based checks and Strength-based attack and damage rolls (fifth edition: and Strength saves) for 1 minute. Fails by 5 or more: −3 instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>71\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♠ · ♥♣♣ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#18\u003c/td>\n\u003ctd>\u003cstrong>Muddle.\u003c/strong> The Destined makes a Wisdom save. Failure: −2 to Intelligence-, Wisdom- and Charisma-based checks, to Wisdom, Intelligence and Charisma saves (3.5: Will saves), and to their spell attacks and spell save DCs, for 1 minute. Fails by 5 or more: −3 instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>72\u003c/td>\n\u003ctd>♥♦♦ · ♥♠♠ · ♦♣♣ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#21\u003c/td>\n\u003ctd>\u003cstrong>Laughing Fit.\u003c/strong> The Destined makes a Wisdom save. Success: they can&#39;t take reactions until the end of their next turn. Failure: slowed until the end of their next turn. Fails by 5 or more: slowed for 3 rounds, and they fall prone.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>73\u003c/td>\n\u003ctd>♥♦♦ · ♥♣♣ · ♠♠♣ · ♥♦♠\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#28\u003c/td>\n\u003ctd>\u003cstrong>Backlash.\u003c/strong> The magic snaps back at the Destined and each ally within 30 feet: 1d6 force damage per surge level, Constitution save for half.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>74\u003c/td>\n\u003ctd>♥♦♦ · ♥♣♣ · ♦♠♠ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#25\u003c/td>\n\u003ctd>\u003cstrong>Critter Curse.\u003c/strong> The Destined makes a Wisdom save (incapacitation). On a failure they turn into a harmless Tiny animal until the end of their next turn (for 1d4 rounds if they fail by 5 or more): they can move and hide but can&#39;t attack, cast spells or use their gear.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>♠♠♣ · ♥♦♠ · ♥♦♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#32\u003c/td>\n\u003ctd>\u003cstrong>Sticky Nectar.\u003c/strong> Sticky nectar coats the Destined (Dexterity save negates): −1 to AC and Dexterity saves, and their speeds drop by 10 feet, for 1 minute.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>76\u003c/td>\n\u003ctd>♠♣♣ · ♥♦♠ · ♥♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#33\u003c/td>\n\u003ctd>\u003cstrong>Sudden Eclipse.\u003c/strong> The next Sun any ally draws on a check this encounter counts as an Eclipse instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>77\u003c/td>\n\u003ctd>♥♠♠ · ♥♦♣ · ♥♦♣ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#30\u003c/td>\n\u003ctd>\u003cstrong>Tattletale Glow.\u003c/strong> Glittering light outlines the Destined and each ally within 20 feet for 1 minute: they can&#39;t hide, and attacks against them never suffer disadvantage (3.5: a miss chance) for being unseen.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>78\u003c/td>\n\u003ctd>♥♣♣ · ♥♦♠ · ♥♦♠ · ♦♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#34\u003c/td>\n\u003ctd>\u003cstrong>Luminous Pests.\u003c/strong> Birds of light burst from the Destined and swirl around them. The Destined and each creature within 15 feet, allies included, make a Wisdom save or are dazzled for 1 minute, with a repeat save (if they fail by 5 or more, they&#39;re blinded until the end of their next turn first).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>79\u003c/td>\n\u003ctd>♦♠♠ · ♥♦♣ · ♥♦♣ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#31\u003c/td>\n\u003ctd>\u003cstrong>Mental Broadcast.\u003c/strong> For 1 minute everyone within 30 feet hears the Destined&#39;s surface thoughts: before each of the Destined&#39;s turns, their player says out loud what they plan to do, and enemies can act on it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80\u003c/td>\n\u003ctd>♦♣♣ · ♥♦♠ · ♥♦♠ · ♥♠♣\u003c/td>\n\u003ctd>Bad 1\u003c/td>\n\u003ctd>#35\u003c/td>\n\u003ctd>\u003cstrong>Gale Blast.\u003c/strong> Wind slams through the party: the Destined and each ally within 20 feet make a Strength save. Failure: pushed 10 feet in the same random direction. Fails by 5 or more: also knocked prone.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>81\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♣ · ♥♦♦ · ♦♣♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#9\u003c/td>\n\u003ctd>\u003cstrong>Bewildered.\u003c/strong> The Destined makes a Wisdom save. Success: they can&#39;t take reactions until the end of their next turn. Failure: confused until the end of their next turn. Fails by 5 or more: confused for 1 minute, with a repeat save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>82\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♦ · ♥♣♣ · ♦♦♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#8\u003c/td>\n\u003ctd>\u003cstrong>Energy Unleashed.\u003c/strong> Raw energy bursts out of the Destined: each creature within 10 feet, the Destined included, takes 2d6 force damage per surge level, Dexterity save for half.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>83\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♠ · ♥♦♦ · ♦♠♠\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#11\u003c/td>\n\u003ctd>\u003cstrong>Lightning Strike.\u003c/strong> Lightning strikes the Destined and arcs to each ally within 10 feet of them: (surge level + 1)d12 lightning damage (3.5: electricity), Dexterity save for half.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>84\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♦ · ♥♠♠ · ♦♦♠\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#10\u003c/td>\n\u003ctd>\u003cstrong>Dwindle.\u003c/strong> The Destined makes a Constitution save or shrinks to Tiny for 1 minute (1 hour if they fail by 5 or more): −2 to damage rolls, their speeds drop by 10 feet, and they can attack only creatures next to them.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>85\u003c/td>\n\u003ctd>♥♠♠ · ♦♣♣ · ♥♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#12\u003c/td>\n\u003ctd>\u003cstrong>Leaden Limbs.\u003c/strong> The Destined makes a Constitution save. Success: slowed until the end of their next turn. Failure: slowed for 3 rounds. Fails by 5 or more: slowed for 1 minute, with a repeat save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>86\u003c/td>\n\u003ctd>♥♣♣ · ♦♠♠ · ♥♦♠ · ♥♦♣\u003c/td>\n\u003ctd>Bad 2\u003c/td>\n\u003ctd>#13\u003c/td>\n\u003ctd>\u003cstrong>Oppressive Voice.\u003c/strong> A voice thunders through the Destined&#39;s mind: 1d4 psychic damage per surge level that can knock them out but not kill them (3.5: nonlethal damage), Wisdom save for half. On a failure they&#39;re also slowed until the end of their next turn; if they fail by 5 or more, for 3 rounds.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>87\u003c/td>\n\u003ctd>♠♠♠ · ♥♦♣ · ♥♦♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#2\u003c/td>\n\u003ctd>\u003cstrong>Magical Nemesis.\u003c/strong> A hostile creature drawn by the magic appears within 60 feet of the Destined. The GM picks it; its challenge rating is up to the Destined&#39;s level − 3, at least 1/2 (3.5: the Destined&#39;s level − 2, at least 1). It acts right after the Destined&#39;s turn, fights on the enemies&#39; side, and after 1 minute may leave or stay.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>88\u003c/td>\n\u003ctd>♣♣♣ · ♥♦♠ · ♥♦♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#3\u003c/td>\n\u003ctd>\u003cstrong>Flame Burst.\u003c/strong> Flames burst from the ground beneath the Destined and each ally within 20 feet of them: 2d6 fire damage per surge level to each, Dexterity save for half. Enemies within 20 feet of the Destined are caught too.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>89\u003c/td>\n\u003ctd>♠♠♠ · ♥♥♦ · ♦♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#5\u003c/td>\n\u003ctd>\u003cstrong>Dirge.\u003c/strong> Four wailing skeletons appear and sing the party&#39;s dirge for 1 minute: allies take −1 to attack rolls, saving throws, ability checks and skill checks.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>♠♠♠ · ♥♦♦ · ♥♣♣ · ♥♦♣\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#4\u003c/td>\n\u003ctd>\u003cstrong>Life Sap.\u003c/strong> The magic feeds on the Destined and each ally within 20 feet (Constitution save). Success: −1 to Strength-based checks and Strength-based attack and damage rolls for 1 minute. Failure: −2 instead, and their hit point maximum drops by 1d8 per surge level until they finish a long rest. Fails by 5 or more: as a failure, and their hit point maximum drops by 2d8 per surge level instead.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>91\u003c/td>\n\u003ctd>♣♣♣ · ♥♥♦ · ♦♠♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#7\u003c/td>\n\u003ctd>\u003cstrong>Slowing Wave.\u003c/strong> Time thickens around the Destined and each ally within 30 feet (Constitution save). Success: slowed until the end of their next turn. Failure: slowed for 3 rounds. Fails by 5 or more: slowed for 1 minute, with a repeat save.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>92\u003c/td>\n\u003ctd>♣♣♣ · ♥♦♦ · ♥♠♠ · ♥♦♠\u003c/td>\n\u003ctd>Bad 3\u003c/td>\n\u003ctd>#6\u003c/td>\n\u003ctd>\u003cstrong>Toxic Cloud.\u003c/strong> A poisonous cloud fills a 15-foot radius around the Destined for 1 minute; creatures inside are concealed. A creature that starts its turn in it takes 1d6 poison damage per surge level (3.5: damage with no energy type), Constitution save for half, and on a failure is poisoned (3.5: sickened) until the start of its next turn.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>93\u003c/td>\n\u003ctd>♠♠♠ · ♣♣♣ · ♥♥♦ · ♥♦♦\u003c/td>\n\u003ctd>Bad 4\u003c/td>\n\u003ctd>#1\u003c/td>\n\u003ctd>\u003cstrong>Crown of Ruin.\u003c/strong> Every ally takes 2d8 necrotic damage per surge level (3.5: negative energy), Constitution save for half, gains one level of weariness (as if their deck ran out, without the reshuffle) and loses Heroic Inspiration. Each ally&#39;s next check this encounter is a natural 1: don&#39;t draw.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"cd-13-wild-magic-optional-rule-oddities-58\">Oddities (#58)\u003c/h3>\n\u003cp>Draw a card from the damage deck; redraw Jokers.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>Oddity\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>For a day, the Destined&#39;s shadow falls toward the nearest light instead of away from
