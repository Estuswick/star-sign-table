\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>3 times\u003c/td>\n\u003ctd>Weary 3 (−1 AC and saves)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35–45\u003c/td>\n\u003ctd>twice\u003c/td>\n\u003ctd>Weary 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50–75\u003c/td>\n\u003ctd>once\u003c/td>\n\u003ctd>Weary 1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Custom decks come in steps of 5. For a size in between (the sign decks use 33, 36, 44, 48, 52 and 56), use the Deck Lab: it works out the exact pip total for any size, and the deck is fine if it passes the Lab test.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-2-jokers\">12.2 Jokers\u003c/h3>\n\u003cp>A Sun is a natural 20 and an Eclipse a natural 1 (chapter 2). Each size allows the setups below (Suns / Eclipses). The first is the size&#39;s main setup: one Sun from 30 to 50 cards, two from 55 to 75. The others balance too, each with its own row in 12.5.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Setups\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 0 · 1 / 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>1 / 1 · 1 / 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 2 · 1 / 1 · 1 / 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 2 · 2 / 1 · 1 / 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 1 · 1 / 2 · 1 / 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>2 / 1 · 2 / 2 · 1 / 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 2 · 2 / 1 · 2 / 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 2 · 2 / 3 · 2 / 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 3 · 2 / 2 · 2 / 1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>More Jokers also make a deck last longer, because a check that opens on a Joker costs one card instead of two.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-3-swing-points\">12.3 Swing points\u003c/h3>\n\u003cp>Swing points measure how far your cards sit from the middle. Extreme cards swing your draws; middle cards keep them steady.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Swing points\u003c/strong>\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Add the points for every number card. Your row&#39;s swing range is where the deck stays balanced. Below it the deck saves too well; above it, its attacks hit too hard. Inside the range, the low end plays steady and the high end swingy.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-4-lean\">12.4 Lean\u003c/h3>\n\u003cp>Lean says whether your extremes sit high or low. It uses the same scores as swing points: add the points of your 7s to 10s, then subtract the points of your Aces to 4s.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Lean\u003c/strong>\u003c/td>\n\u003ctd>−10\u003c/td>\n\u003ctd>−6\u003c/td>\n\u003ctd>−3\u003c/td>\n\u003ctd>−1\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>+1\u003c/td>\n\u003ctd>+3\u003c/td>\n\u003ctd>+6\u003c/td>\n\u003ctd>+10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A positive lean means your high cards swing further from the middle than your low ones. It matters most for fifth-edition attacks, and your row&#39;s lean range keeps them balanced.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-5-the-build-table\">12.5 The build table\u003c/h3>\n\u003cp>Pick your row. &quot;Number cards&quot; is the size minus your Jokers. &quot;Most copies&quot; is the copy limit: the most of any one value. The starter deck meets every rule for its row; its code lists Ace, 2, 3 … 10, then Suns and Eclipses. &quot;Packs&quot; is the standard packs needed to build the starter.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Number cards\u003c/th>\n\u003cth>Pip total\u003c/th>\n\u003cth>Swing points\u003c/th>\n\u003cth>Lean\u003c/th>\n\u003cth>Most copies\u003c/th>\n\u003cth>Starter deck\u003c/th>\n\u003cth>Packs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>29\u003c/td>\n\u003ctd>178\u003c/td>\n\u003ctd>70–124\u003c/td>\n\u003ctd>10 to 79\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>2-2-2-3-3-3-3-3-4-4 / 1-0\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>34\u003c/td>\n\u003ctd>202\u003c/td>\n\u003ctd>135–209\u003c/td>\n\u003ctd>0 to 59\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>3-3-3-3-3-3-3-4-4-5 / 1-0\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>207\u003c/td>\n\u003ctd>90–129\u003c/td 03ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>72\u003c/td>\n\u003ctd>386\u003c/td>\n\u003ctd>320–514\u003c/td>\n\u003ctd>−110 to −11\u003c/td>\n\u003ctd>24\u003c/td>\n\u003ctd>12-10-8-5-2-3-5-7-9-11 / 2-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-6-adjusting-a-deck-the-pip-dial-and-the-swing-dial\">12.6 Adjusting a deck: the pip dial and the swing dial\u003c/h3>\n\u003cp>Every card has a \u003cstrong>mirror\u003c/strong>: A and 10, 2 and 9, 3 and 8, 4 and 7, 5 and 6. Mirrors have the same swing points, which gives you two dials.\u003c/p>\n\u003cp>\u003cstrong>The pip dial: flip a card to its mirror.\u003c/strong> The pip total and the lean change; the swing points don&#39;t.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Flip\u003c/th>\n\u003cth>Pip total\u003c/th>\n\u003cth>Lean\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>5 → 6\u003c/td>\n\u003ctd>+1\u003c/td>\n\u003ctd>0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4 → 7\u003c/td>\n\u003ctd>+3\u003c/td>\n\u003ctd>+2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3 → 8\u003c/td>\n\u003ctd>+5\u003c/td>\n\u003ctd>+6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 → 9\u003c/td>\n\u003ctd>+7\u003c/td>\n\u003ctd>+12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A → 10\u003c/td>\n\u003ctd>+9\u003c/td>\n\u003ctd>+20\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Flip the other way (6 → 5, 10 → A and so on) to lower both by the same amount.\u003c/p>\n\u003cp>\u003cstrong>The swing dial: push a card and its mirror apart, or pull them together.\u003c/strong> Move one card down and its mirror up by the same number of steps. The pip total and the lean don&#39;t change.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Push apart\u003c/th>\n\u003cth>Swing points\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>a 5 → 4 and a 6 → 7\u003c/td>\n\u003ctd>+2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 4 → 3 and a 7 → 8\u003c/td>\n\u003ctd>+4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 3 → 2 and an 8 → 9\u003c/td>\n\u003ctd>+6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 2 → A and a 9 → 10\u003c/td>\n\u003ctd>+8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>a 5 → A and a 6 → 10\u003c/td>\n\u003ctd>+20\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Pull together (the same moves reversed) to lower the swing points by the same amount. Other moves work too, as long as one card goes down and another goes up by the same number of steps: the pip total stays put, and the swing points and lean change by whatever the tables say.\u003c/p>\n\u003ch3 id=\"cd-12-building-your-own-deck-12-7-worked-example-40-cards-1-sun-and-1-eclipse\">12.7 Worked example: 40 cards, 1 Sun and 1 Eclipse\u003c/h3>\n\u003cp>The row says: 38 number cards, pip total \u003cstrong>232\u003c/strong>, swing points \u003cstrong>115–229\u003c/strong>, lean \u003cstrong>40 to 99\u003c/strong>, at most \u003cstrong>12\u003c/strong> of any value.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Deal the number cards evenly.\u003c/strong> Three of each value is 30 cards; add the other 8 from the middle out (5, 6, 4, 7, 3, 8, 2, 9).\nAce to 10: 3-4-4-4-4-4-4-4-4-3. Pip total 209, swing points 140, lean 0.\u003c/li>\n\u003cli>\u003cstrong>Flip to reach 232 (+23) and lift the lean.\u003c/strong> Two Aces → 10s (+18 pips, +40 lean) and one 3 → 8 (+5 pips, +6 lean).\nNow 1-4-3-4-4-4-4-5-4-5. Pip total 232, swing points still 140, lean 46.\u003c/li>\n\u003cli>\u003cstrong>Push apart toward the middle of the swing range (+20).\u003c/strong> A 5 and a 6 → an Ace and a 10.\nNow \u003cstrong>2-4-3-4-3-3-4-5-4-6 / 1-1\u003c/strong>. Pip total 232, swing points 160, lean 46, largest count 6.\u003c/li>\n\u003c/ol>\n\u003cp>The deck meets its row, and the Deck Lab confirms it&#39;s balanced. The deck after step 2 already passed too; step 3 moves it away from the steady end of the range.\u003c/p>\n"},{"id":"cd-13-pacing-the-day","title":"13. Pacing the day","html":"\u003ch2 id=\"cd-13-pacing-the-day-13-pacing-the-day\">13. Pacing the day\u003c/h2>\n\u003cp>\u003cstrong>The last fight of the day is the GM&#39;s to balance and the party&#39;s to prepare for.\u003c/strong> No rule softens it.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Every deck is strong early in the day and weak late,\u003c/strong> because every deck runs out at least once in a standard day. Fire decks swing the most between morning and night, Earth decks the least. A boss at the end of a long day plays harder than its encounter budget says.\u003c/li>\n\u003cli>\u003cstrong>Day length shifts which decks are strong:\u003c/strong> short days favor small decks, long days favor big ones.\u003c/li>\n\u003cli>\u003cstrong>Advantage costs cards.\u003c/strong> Each use draws a third card, so a table that hands advantage out freely will see decks run out a little sooner.\u003c/li>\n\u003cli>\u003cstrong>Damage runs a little high on both sides\u003c/strong> because of the damage deck&#39;s Jokers, a little more for monsters (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Collapses only happen on long days.\u003c/strong> Weary 4 comes around check 62 for Aries, 68 for Leo, 74 for Sagittarius and 82 for Libra; the other decks don&#39;t get there in any realistic day.\u003c/li>\n\u003cli>\u003cstrong>What the party can do:\u003c/strong> track the cards left in each deck, rest before the big fight when they can, and save Heroic Inspiration and advantage for it.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-14-watch-in-playtesting","title":"14. Watch in playtesting","html":"\u003ch2 id=\"cd-14-watch-in-playtesting-14-watch-in-playtesting\">14. Watch in playtesting\u003c/h2>\n\u003cp>Things to watch at the table; none of them breaks the balance rules.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Advantage costs cards.\u003c/strong> It comes up often in fifth edition, and each use draws an extra card, so decks run out sooner than the standard day assumes. One possible fix: put the dropped card on the bottom of your deck instead of the discard pile.\u003c/li>\n\u003cli>\u003cstrong>Confirming crits costs cards\u003c/strong> in 3.5 and Pathfinder First Edition: about one extra card every 10 attacks. The balance leaves this out.\u003c/li>\n\u003cli>\u003cstrong>Card counting.\u003c/strong> Discards go face-down, but a player who keeps track in their head can still know when their only Eclipse is gone. The balance assumes nobody does, so it&#39;s a small edge for players with a good memory.\u003c/li>\n\u003cli>\u003cstrong>Other games.\u003c/strong> Games where only a natural 20 crits should work with these decks, but the numbers in this book cover only fifth edition, 3.5 and Pathfinder First Edition.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-15-the-standard-day-and-the-balance-rules","title":"15. The standard day and the balance rules","html":"\u003ch2 id=\"cd-15-the-standard-day-and-the-balance-rules-15-the-standard-day-and-the-balance-rules\">15. The standard day and the balance rules\u003c/h2>\n\u003cp>Every &quot;balanced&quot; in this book means the same thing: over a standard day of 50 checks, a deck&#39;s day edge is within ±0.1, and its attack damage in fifth edition, its attack damage in 3.5 and Pathfinder First Edition, and the damage it takes from saves each land within 97–103% of a d20&#39;s. A deck&#39;s \u003cstrong>edge\u003c/strong> is its average card total minus 10.5, minus its weariness penalty; its \u003cstrong>day edge\u003c/strong> is that edge over a standard day. One point of edge is about 5% more success on a typical check. This chapter sets out the day, what balance covers, and the rules the decks are built to.\u003c/p>\n\u003ch3 id=\"cd-15-the-standard-day-and-the-balance-rules-the-standard-day\">The standard day\u003c/h3>\n\u003cp>All balance numbers assume a \u003cstrong>standard day of 50 checks\u003c/strong>, a martial character&#39;s day: 3–4 encounters plus exploration. That&#39;s about 95–99 cards, depending on the deck. Every day starts with a fresh shuffle, and each deck-out costs −2 from then on.\u003c/p>\n\u003ch3 id=\"cd-15-the-standard-day-and-the-balance-rules-what-balance-covers\">What balance covers\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Fifth-edition attacks\u003c/strong> with numbers needed from 5 to 15 on a d20. A natural 20 hits and crits, a natural 1 misses, and a crit counts as 1.6 ordinary hits, since only the dice double.\u003c/li>\n\u003cli>\u003cstrong>Fifth-edition saves\u003c/strong> at the same numbers needed, half damage on a success, with no natural-roll effects.\u003c/li>\n\u003cli>\u003cstrong>3.5 and Pathfinder First Edition attacks:\u003c/strong> three per turn at 0, −5 and −10, the first needing 5 to 11, with a Sun confirmed by a second attack draw. A deck must balance with all three weapon types: 20/×3, 19–20/×2 and 18–20/×2.\u003c/li>\n\u003cli>\u003cstrong>3.5 and Pathfinder First Edition saves\u003c/strong> for half damage, with a Sun always saving and an Eclipse always failing.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"cd-15-the-standard-day-and-the-balance-rules-balance-rules\">Balance rules\u003c/h3>\n\u003col>\n\u003cli>\u003cp>\u003cstrong>Size buys power.\u003c/strong> A deck&#39;s allowed average card total is \u003cstrong>10.5 + 2 × its average weariness level over a standard day.\u003c/strong> For the main setups:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Deck size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Runs out around check\u003c/th>\n\u003cth>Highest weariness in a standard day\u003c/th>\n\u003cth>Allowed average\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>15, 31, 46\u003c/td>\n\u003ctd>3 (−6)\u003c/td>\n\u003ctd>12.81\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>18, 36\u003c/td>\n\u003ctd>2 (−4)\u003c/td>\n\u003ctd>12.35\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>21, 41\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>12.02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>23, 47\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>11.69\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>26\u003c/td>\n\u003ctd>1 (−2)\u003c/td>\n\u003ctd>11.46\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>28\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.36\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>31\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.26\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>34\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.15\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>11.05\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>39\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>10.94\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The Deck Lab works out the exact allowed average for any deck. A deck at its allowed average succeeds exactly as often as a d20 over a standard day, averaged over all difficulties.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Suns by size, not by shape.\u003c/strong> Only the Sun crits, so a deck&#39;s crit rate is just how often it draws a Sun. About one Sun per 40 cards gives a d20&#39;s 5%, so each size&#39;s main setup carries one Sun from 30 to 50 cards and two from 55 to 75; the other setups in 12.2 balance too. Eclipses become a choice of shape.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Saves set the floor, attacks the ceiling.\u003c/strong> Saves are pass or fail, so the steadier a deck, the less damage it takes on saves; that sets the low end of each swing range. In 3.5 and Pathfinder First Edition, attack damage rises with swing, which sets the high end.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Lean, for fifth edition.\u003c/strong> Swing points alone don&#39;t settle fifth-edition attack damage; what matters is whether a deck&#39;s extremes sit high or low. Each row has a lean range as well as a swing range (chapter 17).\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Aim for 97–103%.\u003c/strong> Over a standard day, each attack figure and the save figure should land within 97–103% of a d20&#39;s, with a day edge within ±0.1.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>No value makes up more than a third of the number cards.\u003c/strong> Decks piled onto a few values land on the same totals over and over, which makes their balance hard to predict.\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>Chapter 12 turns these rules into a paper method for building a deck.\u003c/p>\n"},{"id":"cd-16-what-a-two-card-draw-can-and-can-t-do","title":"16. What a two-card draw can and can't do","html":"\u003ch2 id=\"cd-16-what-a-two-card-draw-can-and-can-t-do-16-what-a-two-card-draw-can-and-can-39-t-do\">16. What a two-card draw can and can&#39;t do\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>It can&#39;t match a d20 exactly.\u003c/strong> Two draws from one deck can&#39;t add up to 20 equally likely card totals. Middle totals like 10 and 11 come up often and the extremes rarely, and each deck bends that shape its own way.\u003c/li>\n\u003cli>\u003cstrong>Decks that all matched the d20 would all play the same,\u003c/strong> so &quot;fair&quot; means the average over a standard day, not an identical shape.\u003c/li>\n\u003cli>\u003cstrong>Suns and natural 20s.\u003c/strong> Across the sign decks, a Sun comes up on 3.3 to 7.5% of checks, against a d20&#39;s 5%. Each deck&#39;s number cards make up the difference.\u003c/li>\n\u003cli>\u003cstrong>Reshuffle only when forced.\u003c/strong> Each Joker comes up once per pass through the deck, and that is what holds natural 20s and 1s at the rates in chapter 18.\u003c/li>\n\u003cli>\u003cstrong>Card counting.\u003c/strong> Discards go face-down, so knowing when your only Eclipse is gone, or when the GM&#39;s Suns are used up, takes counting and memory. The balance math assumes nobody tracks this; in a 30-card deck a careful player can, and it helps with timing Heroic Inspiration and advantage.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-17-crits-saves-and-lean","title":"17. Crits, saves and lean","html":"\u003ch2 id=\"cd-17-crits-saves-and-lean-17-crits-saves-and-lean\">17. Crits, saves and lean\u003c/h2>\n\u003cp>What decides whether a deck deals and takes a d20&#39;s damage in these games.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Why only the Sun crits.\u003c/strong> Two cards don&#39;t land on 19 or 20 at a die&#39;s steady 10%: swingy decks land there far more often, steady decks hardly ever. A Sun comes up at close to a d20&#39;s 5% in every deck, so every deck crits about as often as a d20.\u003c/li>\n\u003cli>\u003cstrong>Why a wider range becomes a bigger crit.\u003c/strong> A 19–20 range on a d20 crits 10% of the time for one extra set of dice. On cards a Sun comes up about 5% of the time, so it carries two extra sets: the same extra damage on average, in fewer, bigger hits. The multiplier rule for 3.5 and Pathfinder First Edition works the same way: 19–20/×2 becomes ×3 on a Sun, and 18–20/×2 becomes ×4, while 20/×3 stays ×3.\u003c/li>\n\u003cli>\u003cstrong>What a fifth-edition crit is worth.\u003c/strong> A crit doubles only the damage dice, so the balance counts it as 1.6 ordinary hits.\u003c/li>\n\u003cli>\u003cstrong>Why steady decks save too well.\u003c/strong> Saves are pass or fail, so a deck whose totals bunch near the middle clears typical save DCs more reliably than a d20 and takes less damage. That&#39;s what sets the bottom of each swing range.\u003c/li>\n\u003cli>\u003cstrong>Why lean exists.\u003c/strong> In fifth edition, a deck&#39;s attack damage depends on whether its extremes sit high or low, not just on how many it has. Swing points count the extremes, and lean says which end they sit at. In 3.5 and Pathfinder First Edition, swing points alone settle attack damage.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-18-the-sign-decks-against-a-d20","title":"18. The sign decks against a d20","html":"\u003ch2 id=\"cd-18-the-sign-decks-against-a-d20-18-the-sign-decks-against-a-d20\">18. The sign decks against a d20\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Average card total\u003c/th>\n\u003cth>Spread (SD; d20 5.77)\u003c/th>\n\u003cth>Natural 20 / 1\u003c/th>\n\u003cth>Swing · lean\u003c/th>\n\u003cth>Fifth-edition attack damage\u003c/th>\n\u003cth>3.5 and Pathfinder First Edition attack damage\u003c/th>\n\u003cth>Save damage taken\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Aries\u003c/strong>\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>12.79\u003c/td>\n\u003ctd>4.03\u003c/td>\n\u003ctd>6.7% / 0%\u003c/td>\n\u003ctd>103 · 35\u003c/td>\n\u003ctd>101.1%\u003c/td>\n\u003ctd>99.7–101.2%\u003c/td>\n\u003ctd>98.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Leo\u003c/strong>\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>12.48\u003c/td>\n\u003ctd>4.42\u003c/td>\n\u003ctd>6.1% / 0%\u003c/td>\n\u003ctd>140 · 32\u003c/td>\n\u003ctd>101.2%\u003c/td>\n\u003ctd>99.7–100.8%\u003c/td>\n\u003ctd>98.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sagittarius\u003c/strong>\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>12.28\u003c/td>\n\u003ctd>4.99\u003c/td>\n\u003ctd>5.6% / 0%\u003c/td>\n\u003ctd>203 · 33\u003c/td>\n\u003ctd>100.7%\u003c/td>\n\u003ctd>100.6–101.3%\u003c/td>\n\u003ctd>98.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Libra\u003c/strong>\u003c/td>\n\u003ctd>40\u003c/td>\n\u003ctd>12.06\u003c/td>\n\u003ctd>5.08\u003c/td>\n\u003ctd>5.0% / 0%\u003c/td>\n\u003ctd>234 · 26\u003c/td>\n\u003ctd>100.1%\u003c/td>\n\u003ctd>99.8–100.0%\u003c/td>\n\u003ctd>98.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Aquarius\u003c/strong>\u003c/td>\n\u003ctd>44\u003c/td>\n\u003ctd>11.78\u003c/td>\n\u003ctd>5.25\u003c/td>\n\u003ctd>4.5% / 4.5%\u003c/td>\n\u003ctd>227 · 47\u003c/td>\n\u003ctd>100.5%\u003c/td>\n\u003ctd>99.3–99.6%\u003c/td>\n\u003ctd>98.4%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gemini\u003c/strong>\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>11.56\u003c/td>\n\u003ctd>5.61\u003c/td>\n\u003ctd>4.1% / 4.1%\u003c/td>\n\u003ctd>303 · 29\u003c/td>\n\u003ctd>99.8%\u003c/td>\n\u003ctd>99.9–100.5%\u003c/td>\n\u003ctd>98.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Cancer\u003c/strong>\u003c/td>\n\u003ctd>52\u003c/td>\n\u003ctd>11.43\u003c/td>\n\u003ctd>4.24\u003c/td>\n\u003ctd>7.5% / 3.8%\u003c/td>\n\u003ctd>111 · 21\u003c/td>\n\u003ctd>100.4%\u003c/td>\n\u003ctd>99.7–101.8%\u003c/td>\n\u003ctd>97.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Scorpio\u003c/strong>\u003c/td>\n\u003ctd>56\u003c/td>\n\u003ctd>11.33\u003c/td>\n\u003ctd>4.37\u003c/td>\n\u003ctd>7.0% / 3.5%\u003c/td>\n\u003ctd>145 · −5\u003c/td>\n\u003ctd>100.9%\u003c/td>\n\u003ctd>99.3–101.0%\u003c/td>\n\u003ctd>97.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Pisces\u003c/strong>\u003c/td>\n\u003ctd>60\u003c/td>\n\u003ctd>11.26\u003c/td>\n\u003ctd>5.94\u003c/td>\n\u003ctd>3.3% / 6.6%\u003c/td>\n\u003ctd>410 · 30\u003c/td>\n\u003ctd>98.4%\u003c/td>\n\u003ctd>99.2–100.5%\u003c/td>\n\u003ctd>99.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Capricorn\u003c/strong>\u003c/td>\n\u003ctd>65\u003c/td>\n\u003ctd>11.15\u003c/td>\n\u003ctd>5.04\u003c/td>\n\u003ctd>6.1% / 3.0%\u003c/td>\n\u003ctd>296 · 6\u003c/td>\n\u003ctd>99.6%\u003c/td>\n\u003ctd>99.7–100.8%\u003c/td>\n\u003ctd>99.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Taurus\u003c/strong>\u003c/td>\n\u003ctd>70\u003c/td>\n\u003ctd>11.05\u003c/td>\n\u003ctd>4.95\u003c/td>\n\u003ctd>5.6% / 5.6%\u003c/td>\n\u003ctd>264 · 4\u003c/td>\n\u003ctd>101.0%\u003c/td>\n\u003ctd>99.2–99.8%\u003c/td>\n\u003ctd>98.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Virgo\u003c/strong>\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>10.95\u003c/td>\n\u003ctd>5.51\u003c/td>\n\u003ctd>5.3% / 2.6%\u003c/td>\n\u003ctd>455 · −25\u003c/td>\n\u003ctd>98.2%\u003c/td>\n\u003ctd>100.8–101.2%\u003c/td>\n\u003ctd>99.7%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>&quot;Average card total&quot; and &quot;Spread&quot; (its standard deviation) come from the deck&#39;s own cards, before weariness. Damage figures are over a standard day, compared with a d20&#39;s; the 3.5 and Pathfinder First Edition attack figure is the range across the three weapon types. Damage taken on saves is the same in both games, except Aries at 98.1% in 3.5 and Pathfinder First Edition. Every deck&#39;s day edge is within ±0.02.\u003c/p>\n\u003ch3 id=\"cd-18-the-sign-decks-against-a-d20-short-days-and-long-days\">Short days and long days\u003c/h3>\n\u003cp>Edge in points, with fifth-edition attack damage compared with a d20. Long days count only the checks made while awake, so they don&#39;t show what a collapse costs.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Short day (25 checks)\u003c/th>\n\u003cth>Standard day (50 checks)\u003c/th>\n\u003cth>Long day (80 checks)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aries\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>+1.5 · 121%\u003c/td>\n\u003ctd>0.0 · 101%\u003c/td>\n\u003ctd>−1.4 · 84% (collapses around check 62)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leo\u003c/td>\n\u003ctd>33\u003c/td>\n\u003ctd>+1.4 · 118%\u003c/td>\n\u003ctd>0.0 · 101%\u003c/td>\n\u003ctd>−1.5 · 84% (collapses around check 68)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sagittarius\u003c/td>\n\u003ctd>36\u003c/td>\n\u003ctd>+1.3 · 114%\u003c/td>\n\u003ctd>0.0 · 101%\u003c/td>\n\u003ctd>−1.5 · 85% (collapses around check 74)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Libra\u003c/td>\n\u003ctd>40\u003c/td>\n\u003ctd>+1.2 · 112%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.4 · 85% (Weary 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aquarius\u003c/td>\n\u003ctd>44\u003c/td>\n\u003ctd>+1.1 · 113%\u003c/td>\n\u003ctd>0.0 · 101%\u003c/td>\n\u003ctd>−1.3 · 86% (Weary 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gemini\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>+1.0 · 109%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.2 · 88% (Weary 3)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancer\u003c/td>\n\u003ctd>52\u003c/td>\n\u003ctd>+0.9 · 113%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−1.1 · 87% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scorpio\u003c/td>\n\u003ctd>56\u003c/td>\n\u003ctd>+0.8 · 112%\u003c/td>\n\u003ctd>0.0 · 101%\u003c/td>\n\u003ctd>−1.0 · 88% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pisces\u003c/td>\n\u003ctd>60\u003c/td>\n\u003ctd>+0.8 · 104%\u003c/td>\n\u003ctd>0.0 · 98%\u003c/td>\n\u003ctd>−0.9 · 91% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Capricorn\u003c/td>\n\u003ctd>65\u003c/td>\n\u003ctd>+0.7 · 107%\u003c/td>\n\u003ctd>0.0 · 100%\u003c/td>\n\u003ctd>−0.8 · 90% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Taurus\u003c/td>\n\u003ctd>70\u003c/td>\n\u003ctd>+0.6 · 108%\u003c/td>\n\u003ctd>0.0 · 101%\u003c/td>\n\u003ctd>−0.7 · 92% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Virgo\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>+0.5 · 102%\u003c/td>\n\u003ctd>0.0 · 98%\u003c/td>\n\u003ctd>−0.7 · 92% (Weary 2)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"cd-18-the-sign-decks-against-a-d20-through-the-day\">Through the day\u003c/h3>\n\u003cp>Edge in the first and last quarters of a standard day: Fire +1.8 to +2.3 early and −2.0 to −2.4 late, Air +1.1 to +1.6 and −1.1 to −2.0, Water +0.8 to +0.9 and −1.1 to −1.2, Earth about +0.5 and −1.4.\u003c/p>\n"},{"id":"cd-19-checks-and-luck-against-a-d20","title":"19. Checks and luck against a d20","html":"\u003ch2 id=\"cd-19-checks-and-luck-against-a-d20-19-checks-and-luck-against-a-d20\">19. Checks and luck against a d20\u003c/h2>\n\u003ch3 id=\"cd-19-checks-and-luck-against-a-d20-the-fate-deck\">The Fate Deck\u003c/h3>\n\u003cp>Average card total 10.50; a Sun and an Eclipse each come up on 4.9% of checks (d20 5%). Monster attacks deal 97.7% of a d20&#39;s damage in fifth edition and 99.5 to 99.6% in 3.5 and Pathfinder First Edition, and monsters take 99.9% of a d20&#39;s damage on saves. At every number needed it stays within 6.5 percentage points of a d20; long shots land a little more often (needing a 20, 10% instead of 5%).\u003c/p>\n\u003ch3 id=\"cd-19-checks-and-luck-against-a-d20-plain-rolls\">Plain rolls\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>d20 roll needed\u003c/th>\n\u003cth>Card needed\u003c/th>\n\u003cth>Chance\u003c/th>\n\u003cth>d20\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>2–3\u003c/td>\n\u003ctd>Any number card\u003c/td>\n\u003ctd>97.5%\u003c/td>\n\u003ctd>95–90%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>2 or higher\u003c/td>\n\u003ctd>76%\u003c/td>\n\u003ctd>85–75%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>3 or higher\u003c/td>\n\u003ctd>65%\u003c/td>\n\u003ctd>70–65%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>4 or higher\u003c/td>\n\u003ctd>57.5%\u003c/td>\n\u003ctd>60–55%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>The number − 6 (5 for 11, up to 10 for 16)\u003c/td>\n\u003ctd>51%, 45%, 39%, 35%, 32.5%, 25%\u003c/td>\n\u003ctd>50%, 45%, 40%, 35%, 30%, 25%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>25%\u003c/td>\n\u003ctd>20%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>Sun\u003c/td>\n\u003ctd>2.5%\u003c/td>\n\u003ctd>15–5%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Death saving throws\u003c/strong> succeed 57.5% of the time, against a d20&#39;s 55%, and a Sun and an Eclipse each come up 2.5% of the time, against 5%. A character who gets no help dies 37% of the time, against 41% with a d20.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"cd-19-checks-and-luck-against-a-d20-advantage-and-disadvantage\">Advantage and disadvantage\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Card advantage is a little weaker than rolling twice.\u003c/strong> Drawing 3 and keeping the best pair adds 16 to 21 percentage points of success at typical numbers needed for the starter decks, against 22 for two d20s.\u003c/li>\n\u003cli>\u003cstrong>Crits under advantage\u003c/strong> come up on 6 to 11% of advantaged attacks, against 9.75% for two d20s.\u003c/li>\n\u003cli>\u003cstrong>Each use costs an extra card,\u003c/strong> and advantage is common in fifth edition, so decks run out sooner than the standard day assumes.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"cd-19-checks-and-luck-against-a-d20-cards-per-check\">Cards per check\u003c/h3>\n\u003cp>A check averages 2 − (Jokers ÷ deck size) cards over a day: 1.94 to 1.98 for the sign decks.\u003c/p>\n"},{"id":"cd-20-the-damage-deck-against-dice","title":"20. The damage deck against dice","html":"\u003ch2 id=\"cd-20-the-damage-deck-against-dice-20-the-damage-deck-against-dice\">20. The damage deck against dice\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Exact averages.\u003c/strong> Without Jokers, every row of the die table in chapter 10 has exactly the die&#39;s average (d4 2.5, d6 3.5, d8 4.5, d10 5.5, d12 6.5). Spreads are close to real dice: d4 1.02 (die 1.12), d6 1.50 (1.71), d8 2.58 (2.29), d10 2.87 (2.87), d12 2.87 (3.45). The d12 can&#39;t show a 1 or a 12, but its average is exact.\u003c/li>\n\u003cli>\u003cstrong>Jokers add a little.\u003c/strong> Each damage card is a Joker about 1 time in 21. The players&#39; rule adds 3–4% to a die&#39;s average, and the monsters&#39; rule 8–9%:\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Die\u003c/th>\n\u003cth>No Joker\u003c/th>\n\u003cth>Player (max)\u003c/th>\n\u003cth>Monster (max + another die)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>d4\u003c/td>\n\u003ctd>2.50\u003c/td>\n\u003ctd>2.57\u003c/td>\n\u003ctd>2.70\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d6\u003c/td>\n\u003ctd>3.50\u003c/td>\n\u003ctd>3.62\u003c/td>\n\u003ctd>3.80\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d8\u003c/td>\n\u003ctd>4.50\u003c/td>\n\u003ctd>4.67\u003c/td>\n\u003ctd>4.90\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d10\u003c/td>\n\u003ctd>5.50\u003c/td>\n\u003ctd>5.71\u003c/td>\n\u003ctd>6.00\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d12\u003c/td>\n\u003ctd>6.50\u003c/td>\n\u003ctd>6.76\u003c/td>\n\u003ctd>7.10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Bigger attacks see more Jokers:\u003c/strong> 9% of 2-die rolls, 25% of 6-die rolls, 44% of 12-die rolls and 62% of 20-die rolls. For monsters those Jokers chain into extra dice, so the biggest monster attacks are where the damage deck bites hardest.\u003c/li>\n\u003cli>\u003cstrong>Big pools.\u003c/strong> Under the house rule in chapter 10, 20d6 swings about ±3 instead of ±8.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-21-how-sure-the-build-table-is","title":"21. How sure the build table is","html":"\u003ch2 id=\"cd-21-how-sure-the-build-table-is-21-how-sure-the-build-table-is\">21. How sure the build table is\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Every starter deck passes the Lab test,\u003c/strong> in both games, with its own Joker setup.\u003c/li>\n\u003cli>\u003cstrong>A deck built inside the ranges is balanced\u003c/strong> almost every time, and the rare miss sits only a few tenths of a percentage point outside the balance limits. The Deck Lab gives the exact answer for any deck.\u003c/li>\n\u003cli>\u003cstrong>The ranges are a safe zone, not the whole balanced region.\u003c/strong> A deck a little outside its row can still pass the Lab test.\u003c/li>\n\u003cli>\u003cstrong>The copy limit is part of what makes the ranges reliable.\u003c/strong> Decks piled onto a few values land on the same totals over and over and fall outside the balance limits in ways swing points and lean don&#39;t predict.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"cd-21-how-sure-the-build-table-is-the-starter-decks\">The starter decks\u003c/h3>\n\u003cp>How often each starter deck in 12.5 draws a natural 20 and a natural 1 (a d20: 5% each), and its damage over a standard day, compared with a d20&#39;s. The 3.5 and Pathfinder First Edition figure is the range across the three weapon types.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Natural 20 / 1\u003c/th>\n\u003cth>Fifth-edition attack damage\u003c/th>\n\u003cth>3.5 and Pathfinder First Edition attack damage\u003c/th>\n\u003cth>Save damage taken\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>30\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>6.7% / 0%\u003c/td>\n\u003ctd>101.6%\u003c/td>\n\u003ctd>100.7–102.2%\u003c/td>\n\u003ctd>98.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>5.7% / 0%\u003c/td>\n\u003ctd>100.5%\u003c/td>\n\u003ctd>98.6–99.3%\u003c/td>\n\u003ctd>98.3%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>5.6% / 5.6%\u003c/td>\n\u003ctd>102.4% \u003ctd>1 / 1\u003c/td>\n\u003ctd>3.6% / 3.6%\u003c/td>\n\u003ctd>98.6%\u003c/td>\n\u003ctd>97.6–98.6%\u003c/td>\n\u003ctd>99.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>6.6% / 3.3%\u003c/td>\n\u003ctd>100.6%\u003c/td>\n\u003ctd>99.0–100.4%\u003c/td>\n\u003ctd>98.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>6.5% / 6.5%\u003c/td>\n\u003ctd>102.0%\u003c/td>\n\u003ctd>100.4–101.8%\u003c/td>\n\u003ctd>97.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>3.3% / 6.6%\u003c/td>\n\u003ctd>99.6%\u003c/td>\n\u003ctd>97.9–99.2%\u003c/td>\n\u003ctd>98.6%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>6.0% / 6.0%\u003c/td>\n\u003ctd>102.0%\u003c/td>\n\u003ctd>99.8–100.8%\u003c/td>\n\u003ctd>97.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>6.1% / 3.0%\u003c/td>\n\u003ctd>99.7%\u003c/td>\n\u003ctd>98.2–99.2%\u003c/td>\n\u003ctd>98.6%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>6.0% / 8.9%\u003c/td>\n\u003ctd>102.2%\u003c/td>\n\u003ctd>100.5–101.5%\u003c/td>\n\u003ctd>97.6%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>5.6% / 5.6%\u003c/td>\n\u003ctd>100.9%\u003c/td>\n\u003ctd>98.3–99.0%\u003c/td>\n\u003ctd>97.8%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>5.5% / 8.3%\u003c/td>\n\u003ctd>102.2%\u003c/td>\n\u003ctd>100.2–100.8%\u003c/td>\n\u003ctd>97.6%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>5.6% / 2.8%\u003c/td>\n\u003ctd>99.5%\u003c/td>\n\u003ctd>98.0–98.7%\u003c/td>\n\u003ctd>98.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>5.2% / 7.8%\u003c/td>\n\u003ctd>101.5%\u003c/td>\n\u003ctd>100.0–100.3%\u003c/td>\n\u003ctd>98.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>5.2% / 5.2%\u003c/td>\n\u003ctd>100.1%\u003c/td>\n\u003ctd>97.7–98.1%\u003c/td>\n\u003ctd>98.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>5.3% / 2.6%\u003c/td>\n\u003ctd>98.4%\u003c/td>\n\u003ctd>99.1–99.5%\u003c/td>\n\u003ctd>99.4%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The worked example in 12.7 deals 102.3% of a d20&#39;s attack damage in fifth edition and 99.8–100.0% in 3.5 and Pathfinder First Edition, takes 97.5% on saves, and has a day edge of +0.02.\u003c/p>\n"},{"id":"cd-appendix-a-quick-reference-what-the-system-replaces","title":"Appendix A. Quick reference: what the system replaces","html":"\u003ch2 id=\"cd-appendix-a-quick-reference-what-the-system-replaces-appendix-a-quick-reference-what-the-system-replaces\">Appendix A. Quick reference: what the system replaces\u003c/h2>\n\u003cp>Every dice mechanic in a d20 Classic game has a card rule. Where each one is handled:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Mechanic\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003cth>Where\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>The d20 roll, natural 20 / 1\u003c/td>\n\u003ctd>Two cards added one at a time; the Sun (the colored Joker) = natural 20, the Eclipse (the black Joker) = natural 1\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical hits and threat ranges\u003c/td>\n\u003ctd>Only the Sun crits; a wider range means more dice (fifth edition) or a bigger multiplier (3.5, Pathfinder First Edition)\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Saving throws, ability and skill checks\u003c/td>\n\u003ctd>Two cards; natural results as the game says\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Take 10 / Take 20\u003c/td>\n\u003ctd>No draw\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Secret checks\u003c/td>\n\u003ctd>The GM draws face-down from the Fate Deck and adds the player&#39;s modifier\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pass-or-fail rolls with no modifier, death saving throws\u003c/td>\n\u003ctd>One Fate Deck card against a threshold\u003c/td>\n\u003ctd>Chapter 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Advantage and disadvantage\u003c/td>\n\u003ctd>Draw 3 cards, keep the best or worst pair\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rerolls, Heroic Inspiration and luck\u003c/td>\n\u003ctd>Draw a third card: keep your most recent card (&quot;use the new roll&quot;) or the best pair (&quot;choose either roll&quot;)\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Extra dice on a check\u003c/td>\n\u003ctd>One damage card per die\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rolls made ahead and used later\u003c/td>\n\u003ctd>Held draws, set aside face-up\u003c/td>\n\u003ctd>Chapter 7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Companion, familiar and summon checks\u003c/td>\n\u003ctd>The Fate Deck; a creature that acts through its controller draws from the controller&#39;s deck\u003c/td>\n\u003ctd>Chapter 8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Monster checks\u003c/td>\n\u003ctd>The Fate Deck\u003c/td>\n\u003ctd>Chapter 9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Damage and healing dice\u003c/td>\n\u003ctd>One card per die from the damage deck, read on a table with exact averages; big-pools house rule\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical damage\u003c/td>\n\u003ctd>Dice drawn twice (fifth edition) or damage drawn once per multiplier (3.5, Pathfinder First Edition)\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Random durations, d20 tables, d100 (d%) and miss chances\u003c/td>\n\u003ctd>Damage-deck cards (d20 = card + 10 if red; d100 = two cards)\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Running out of cards\u003c/td>\n\u003ctd>A deck-out forces a reshuffle and costs a level of weariness (player decks only)\u003c/td>\n\u003ctd>Chapter 4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"cd-appendix-b-glossary","title":"Appendix B. Glossary","html":"\u003ch2 id=\"cd-appendix-b-glossary-appendix-b-glossary\">Appendix B. Glossary\u003c/h2>\n\u003cp>Every term the card engine adds to your game, with where it&#39;s explained.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Allowed average:\u003c/strong> the average card total a deck may have for its size and Jokers: 10.5 + 2 × its average weariness level over a standard day (chapter 15).\u003c/li>\n\u003cli>\u003cstrong>Attack damage:\u003c/strong> a deck&#39;s damage on attacks over a standard day, compared with a d20&#39;s (chapter 15).\u003c/li>\n\u003cli>\u003cstrong>Balanced:\u003c/strong> a deck whose day edge is within ±0.1, and whose attack damage (in fifth edition, and in 3.5 and Pathfinder First Edition) and damage taken on saves each land within 97–103% of a d20&#39;s over a standard day. Those spans are the \u003cstrong>balance limits\u003c/strong> (chapter 15).\u003c/li>\n\u003cli>\u003cstrong>Best pair, worst pair:\u003c/strong> of three cards, the two with the highest or lowest card total (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Build table:\u003c/strong> the table of deck sizes and Joker setups, with each row&#39;s pip total, swing range, lean range, copy limit and starter deck (12.5).\u003c/li>\n\u003cli>\u003cstrong>Burn:\u003c/strong> discard a card unused. Casting costs burn cards (chapter 3).\u003c/li>\n\u003cli>\u003cstrong>Card total:\u003c/strong> the sum of a check&#39;s two cards, 2 to 20. It replaces the d20 roll; add your modifier as usual (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Casting cost:\u003c/strong> the cards a spell burns: 1 for a cantrip, 2 for any other spell (chapter 3).\u003c/li>\n\u003cli>\u003cstrong>Collapse:\u003c/strong> reaching Weary 4. You fall unconscious (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Copy limit:\u003c/strong> the most copies of any one value a deck may hold, a third of its number cards (12.5).\u003c/li>\n\u003cli>\u003cstrong>Custom deck:\u003c/strong> a player deck you build yourself (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Damage deck, damage card:\u003c/strong> the shared 42-card deck used for damage and other dice, and a card drawn from it (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Deck code:\u003c/strong> a deck&#39;s makeup, written as the counts of Ace, 2, 3 … 10, then Suns / Eclipses (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Deck Lab:\u003c/strong> the Star-Sign Deck Lab, the web tool that builds decks and runs the Lab test.\u003c/li>\n\u003cli>\u003cstrong>Deck-out:\u003c/strong> drawing the last card of your deck. It forces a reshuffle and gives you a level of weariness (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Die table:\u003c/strong> the table that reads a damage card as a d4, d6, d8, d10 or d12 (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Eclipse:\u003c/strong> the black Joker, a natural 1 (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Edge, day edge:\u003c/strong> how far a deck&#39;s average card total sits above 10.5 once its weariness penalty is counted. Day edge is the edge over a standard day (chapter 15).\u003c/li>\n\u003cli>\u003cstrong>Element:\u003c/strong> Fire, Air, Water or Earth. It sets a sign deck&#39;s size (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Fate Deck:\u003c/strong> the GM&#39;s 80-card deck, for monsters, companions, plain rolls and secret checks (chapter 9).\u003c/li>\n\u003cli>\u003cstrong>Flip:\u003c/strong> replace a card with its mirror, using the pip dial (12.6).\u003c/li>\n\u003cli>\u003cstrong>Fresh shuffle:\u003c/strong> your whole deck, shuffled at the start of each day (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Held draw:\u003c/strong> cards drawn now, set aside face-up and used later in place of a draw (chapter 7).\u003c/li>\n\u003cli>\u003cstrong>Joker:\u003c/strong> a Sun or an Eclipse.\u003c/li>\n\u003cli>\u003cstrong>Joker setup:\u003c/strong> a deck&#39;s Suns and Eclipses, written Suns / Eclipses, such as 1 / 0 (12.2).\u003c/li>\n\u003cli>\u003cstrong>Lab test:\u003c/strong> the Deck Lab&#39;s exact test of whether a deck is balanced.\u003c/li>\n\u003cli>\u003cstrong>Lean, lean range:\u003c/strong> the swing points of a deck&#39;s 7s to 10s minus those of its Aces to 4s, and the range each build-table row allows (12.4).\u003c/li>\n\u003cli>\u003cstrong>Long day, short day:\u003c/strong> 80 and 25 checks, used to see how decks play away from the standard day (chapter 18).\u003c/li>\n\u003cli>\u003cstrong>Main setup:\u003c/strong> the first Joker setup listed for each size: one Sun from 30 to 50 cards, two from 55 to 75 (12.2).\u003c/li>\n\u003cli>\u003cstrong>Mirror:\u003c/strong> a card&#39;s partner the same distance from the middle: Ace and 10, 2 and 9, 3 and 8, 4 and 7, 5 and 6 (12.6).\u003c/li>\n\u003cli>\u003cstrong>Modality:\u003c/strong> Cardinal, Fixed or Mutable. It sets how swingy a sign deck is (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Most recent card:\u003c/strong> the card a &quot;use the new roll&quot; reroll keeps (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Multiplier on a Sun:\u003c/strong> in 3.5 and Pathfinder First Edition, the crit multiplier a weapon gets on a Sun: 1 + (numbers in the threat range) × (multiplier − 1) (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Natural 20, natural 1:\u003c/strong> a Sun or an Eclipse. A card total of 20 is not a natural 20 (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>New check:\u003c/strong> a brand-new two-card check, drawn in place of an old one (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Number card:\u003c/strong> Ace to 10. Aces count as 1.\u003c/li>\n\u003cli>\u003cstrong>Number needed:\u003c/strong> the card total a check needs to succeed, once modifiers are counted.\u003c/li>\n\u003cli>\u003cstrong>Pip, pip total:\u003c/strong> a number card&#39;s value (Ace = 1), and the sum of a deck&#39;s number cards, which sets its average (12.5).\u003c/li>\n\u003cli>\u003cstrong>Pip dial, swing dial:\u003c/strong> the two ways to adjust a deck. The pip dial flips a card to its mirror and changes the pip total and the lean; the swing dial pushes a card and its mirror apart or pulls them together and changes the swing points (12.6).\u003c/li>\n\u003cli>\u003cstrong>Plain roll:\u003c/strong> a pass-or-fail roll with no modifier, made with one Fate Deck card (chapter 5).\u003c/li>\n\u003cli>\u003cstrong>Shape:\u003c/strong> how often a deck lands on each card total. \u003cstrong>Steady\u003c/strong> decks bunch near the middle; \u003cstrong>swingy\u003c/strong> decks spread toward the ends (chapter 16).\u003c/li>\n\u003cli>\u003cstrong>Sign deck:\u003c/strong> one of the twelve star-sign decks (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Standard day:\u003c/strong> the day all balance is measured over: 50 checks across 3–4 encounters and exploration (chapter 15).\u003c/li>\n\u003cli>\u003cstrong>Standard pack:\u003c/strong> 52 cards plus its Jokers, usually one colored and one black.\u003c/li>\n\u003cli>\u003cstrong>Starter deck:\u003c/strong> the ready-made deck in each row of the build table (12.5).\u003c/li>\n\u003cli>\u003cstrong>Sun:\u003c/strong> the colored Joker, a natural 20. Only the Sun crits (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Swing points, swing range:\u003c/strong> a score for how far a deck&#39;s cards sit from the middle (Ace and 10 score 10, down to 0 for 5 and 6), and the range each build-table row allows (12.3).\u003c/li>\n\u003cli>\u003cstrong>Weariness, Weary 1–4:\u003c/strong> the card engine&#39;s own track: −2 per level to your checks, −1 to AC and saving throws at Weary 3, collapse at Weary 4 (chapter 4).\u003c/li>\n\u003c/ul>\n"},{"id":"cd-appendix-c-license-notes","title":"Appendix C. License notes","html":"\u003ch2 id=\"cd-appendix-c-license-notes-appendix-c-license-notes\">Appendix C. License notes\u003c/h2>\n\u003cp>These rules are original work. They refer to fifth edition, 3.5 and Pathfinder First Edition by their game mechanics only (checks, attack rolls, saving throws, critical hits, advantage and conditions) and reproduce no rules text from any of them. Fifth-edition terms and spell names are those of the System Reference Document 5.2, released under the Creative Commons Attribution 4.0 license. Nothing here relies on material released under the Open Game License.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Before publishing,\u003c/strong> add the attribution the SRD 5.2 license asks for, and check each game&#39;s trademark terms. Pathfinder is a trademark of Paizo Inc. These rules aren&#39;t published, endorsed or approved by Wizards of the Coast or Paizo.\u003c/li>\n\u003cli>\u003cstrong>What you might reserve:\u003c/strong> the Star-Sign Card Engine name, the Sun and the Eclipse as card names, the twelve star-sign decks, and the Deck Lab.\u003c/li>\n\u003cli>This is general information, not legal advice.\u003c/li>\n\u003c/ul>\n"}]}}}</script>

/* ---------- draw math ---------- */
function analyse(c, R, B){

    for (let b=1;b<=10;b++){ const w = ca*(c[b-1] - (a===b?1:0)); if (w>0) res[a+b]+=w; } }
  for (let i=0;i<21;i++) res[i]/=tot;
  const pR = (R*(N-1) + nums*R)/tot, pB = (B*(N-1) + nums*B)/tot;   // Joker on card 1, or card 2 after a number
  const full = res.slice(); full[20]+=pR; full[1]+=pB;
  let mean=0; for (let r=1;r<=20;r++) mean+=r*full[r];
  let v=0; for (let r=1;r<=20;r++) v+=(r-mean)**2*full[r];
  const surv = new Array(22).fill(0);
  for (let n=20;n>=1;n--) surv[n]=surv[n+1]+full[n];
  const deg = need => {
    const f = r => r>=need+10?3 : r>=need?2 : r<=need-10?0 : 1;
    const out=[0,0,0,0];
    for (let r=2;r<=20;r++) out[f(r)]+=res[r];
    out[Math.min(3,f(20)+1)]+=pR; out[Math.max(0,f(1)-1)]+=pB;
    return out;
  };
  const q = (R+B)/N;   // chance a check stops after one card
  const ge = new Array(22).fill(0); for (let n=20;n>=2;n--) ge[n] = ge[n+1] + res[n];   // P(two number cards total n or more)
  return {nums, N, res, full, pR, pB, mean, sd:Math.sqrt(v), surv, deg, q, cpc:2-q, ge};
}
function d20deg(need){
  const out=[0,0,0,0];

    if (r===20) d=Math.min(3,d+1); if (r===1) d=Math.max(0,d-1); out[d]+=0.05; }

}
function degF(A, x){   // degrees at a fractional need, interpolated between whole numbers (for an ability's price added back)
  const lo = Math.floor(x + 1e-9), f = x - lo;

const strike = p => p[2] + 2*p[3];
const taken  = p => 2*p[0] + p[1] + 0.5*p[2];

for (let n=5;n<=11;n++){ let s=0; for (const k of [0,5,10]) s+=strike(d20deg(n+k)); D20_OFF[n]=s; }

/* ---------- exhaustion math ---------- */
// Before check i (1-based), i-1 checks have been made; K of them stopped after one card (K ~ Binomial(i-1, q)).
// Cards used = 2(i-1) - K; level = floor((o + cards) / S), with o the starting position when the deck carries over.
function binom(n, q){
  const out = new Array(n+1).fill(0);
  if (q<=0){ out[0]=1; return out; }
  let p = Math.pow(1-q, n); out[0]=p;
  for (let k=0;k<n;k++){ p = p*(n-k)/(k+1)*q/(1-q); out[k+1]=p; }

  for (let o=0;o<offs;o++) for (let k=0;k<pk.length;k++){ if (pk[k]<1e-9) continue;
    let L = Math.floor((o + 2*(i-1) - k)/S); if (unyielding) L = Math.max(0, L-1);   // Unyielding: the day's first deck-out gives no level
    L = Math.min(3, L); w.set(L,(w.get(L)||0) + pk[k]/offs); }   // Exhausted 4 is a collapse; you draw again only after waking at 3

}

  const out = [];

  return out;
}

  return w;
}
const strike3 = p => p[2] + 3*p[3];      // fatal weapons: a crit is worth about three hits
const D20_OFF3 = {}; for (let n=5;n<=11;n++){ let s=0; for (const k of [0,5,10]) s+=strike3(d20deg(n+k)); D20_OFF3[n]=s; }
function dayMetrics(A, S, ab, set){   // ab = {bonus, unyielding}: the ability counted at its price, or Unyielding played out; set = rules (default: the page's)
  set = set || state;

  const w = levelWeights(S, set.cpd, set.rest==='carry', A.q, uny);

  for (const [L,x] of w){ Lbar+=L*x; const sh=set.pen*L - bonus, m=combat(A, sh); off+=x*m.off; def+=x*m.def;
    let a3=0; for (let n=5;n<=11;n++){ let t=0; for (const k of [0,5,10]) t+=strike3(degF(A, n+k+sh)); a3+=t/D20_OFF3[n]; } off3+=x*a3/7; }

}
function abilityOf(key, A, S){   // how the Lab counts an ability: its price as a bonus on every check, or Unyielding played out

function deckOuts(S, C, cpc){ const out=[]; for (let k=1; k*S/cpc <= C; k++) out.push(k*S/cpc); return out; }   // expected check at which each reshuffle happens

/* ---------- helpers ---------- */

const pct = (x,d=0) => (100*x).toFixed(d)+'%';
const signed = (x,d=2) => { const a=Math.abs(x).toFixed(d); return +a===0 ? a : (x>0?'+':'−')+a; };

const deckSize = (c,r,b) => c.reduce((a,x)=>a+x,0)+r+b;
const rowAt = (S,R,B) => BUILD.find(x=>x[0]===S&&x[1]===R&&x[2]===B);

  const a=rowAt(Math.floor(S/5)*5,R,B), b=rowAt(Math.ceil(S/5)*5,R,B);

/* ---------- deck check: every build rule, then the exact check with the standard rules ---------- */
const STD = {pen:2, cpd:50, rest:'fresh'};
const STEP_MAX = {30:2,35:3,40:3,45:4,50:4,55:5,60:6,65:6,70:7,75:7};
const sumOf = c => c.reduce((a,x)=>a+x,0);

const normName = s => s.toLowerCase().replace(/[^a-z]/g,'');
