\u003c/li>\n\u003cli>\u003cstrong>The copy limit is part of what makes the ranges reliable.\u003c/strong> Decks piled onto a few values (say, half 3s and half 8s) land on the same totals over and over and fall outside the balance limits in ways swing points don't predict.\u003c/li>\n\u003cli>\u003cstrong>Crit-heavy weapons.\u003c/strong> The balance rules cover ordinary Strikes. With fatal weapons, where a crit is worth about three hits, the starter decks in the build table range from 93% to 107% of a d20's damage: lowest with no Sun, highest with extra Suns or the most Jokers. Deadly weapons fall in between. A player who relies on fatal or deadly weapons should pick a setup with a Sun; the Lab test shows the fatal figure for any deck.\u003c/li>\n\u003cli>\u003cstrong>Casters\u003c/strong> draw a few more or fewer cards than the standard day, depending on level (chapter 17). That shifts a custom deck the same small amount as a sign deck.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-24-how-sure-the-build-table-is-what-each-kind-of-setup-plays-like\">What each kind of setup plays like\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Setup\u003c/th>\n\u003cth>Examples\u003c/th>\n\u003cth>How it plays\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Even\u003c/strong>\u003c/td>\n\u003ctd>1 / 1, 2 / 2, 3 / 3, 4 / 4 (every sign but Virgo)\u003c/td>\n\u003ctd>The default. Natural 20s and 1s come up equally. Strike damage 97–103% of a d20's; you take 97–101% of a d20's damage on saves.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>One extra Eclipse\u003c/strong>\u003c/td>\n\u003ctd>1 / 2, 2 / 3, 3 / 4, 4 / 5\u003c/td>\n\u003ctd>More natural 1s, paid for with stronger number cards (a higher pip total). You take 100–103% of a d20's damage on saves; Strikes are unchanged.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>No Sun\u003c/strong>\u003c/td>\n\u003ctd>0 / 1, 0 / 2\u003c/td>\n\u003ctd>Never a natural 20. Crits come only from high totals, so the deck has to be mostly Aces and 10s. Weapons that rely on crits (deadly, fatal) deal about 93–95% of a d20's damage.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>One extra Sun\u003c/strong> (75 cards and up)\u003c/td>\n\u003ctd>2 / 1 (Virgo), 3 / 2, 4 / 3, 5 / 4\u003c/td>\n\u003ctd>More natural 20s, paid for with weaker number cards. Both sides favor you: Strike damage 99–103%, and you take 97–99% of a d20's damage on saves. That's close to the limit of balance, so the swing ranges are narrow.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"ae-24-how-sure-the-build-table-is-why-the-joker-limits-sit-where-they-do\">Why the Joker limits sit where they do\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Why Eclipses can outnumber Suns but not the other way round.\u003c/strong> A missed Strike costs the same whether it's a failure or a critical failure, so an extra natural 1 costs you almost nothing on attacks; it hurts on saves, where a critical failure doubles the damage. Stronger number cards pay that back. An extra natural 20 helps both: more crits on Strikes and more saves that take no damage. Weaker number cards can take back one of those but not both, until the deck is big enough (75 cards or more) to dilute the extra Joker.\u003c/li>\n\u003cli>\u003cstrong>Why more Jokers need bigger decks.\u003c/strong> In a 45-card deck, three of each Joker would make natural 20s and 1s 12.6% each, against a d20's 5%. Even the steadiest number cards can't offset that many natural 20s on Strikes. Bigger decks dilute the Jokers.\u003c/li>\n\u003cli>\u003cstrong>Why a deck needs a Sun.\u003c/strong> Without one, the only way to crit as often as a d20 is to fill the deck with Aces and 10s, and the copy limit caps that. Only decks of 65 cards or more have room.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-24-how-sure-the-build-table-is-the-starter-decks\">The starter decks\u003c/h3>\n\u003cp>How often each starter deck in 13.4 draws a natural 20 and a natural 1 (a d20: 5% each), and its Strike damage and damage taken on saves over a standard day, compared with a d20's:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Natural 20 / 1\u003c/th>\n\u003cth>Standard day: Strike damage / save damage taken\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>4.4% / 4.4%\u003c/td>\n\u003ctd>101% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>4.3% / 8.7%\u003c/td>\n\u003ctd>100% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>8.6% / 8.6%\u003c/td>\n\u003ctd>101% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>4.0% / 4.0%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>3.9% / 7.8%\u003c/td>\n\u003ctd>100% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>7.8% / 7.8%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>3.6% / 3.6%\u003c/td>\n\u003ctd>101% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>3.6% / 7.1%\u003c/td>\n\u003ctd>100% / 101%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>7.1% / 7.1%\u003c/td>\n\u003ctd>100% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>7.0% / 10.5%\u003c/td>\n\u003ctd>98% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>3.3% / 3.3%\u003c/td>\n\u003ctd>101% / 99%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd> % / 10.6%\u003c/td>\n\u003ctd>99% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>0 / 1\u003c/td>\n\u003ctd>0% / 2.2%\u003c/td>\n\u003ctd>97% / 100%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>0 / 2\u003c/td>\n\u003ctd>0% / 4.4%\u003c/td>\n\u003ctd>98% / 102%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>4.4% / 2.2%\u003c/td>\n\u003ctd>101% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>3 / 2\u003c/td>\n\u003ctd>6.5% / 4.3%\u003c/td>\n\u003ctd>100% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>4 / 3\u003c/td>\n\u003ctd>8.6% / 6.4%\u003c/td>\n\u003ctd>101% / 98%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>5 / 4\u003c/td>\n\u003ctd>10.6% / 8.5%\u003c/td>\n\u003ctd>102% / 99%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>The worked example in 13.7 deals 100.3% of a d20's Strike damage over a standard day and takes 102.1% on saves, with a day edge of −0.01; the deck after its step 2 deals only 94.0%.\u003c/p>\n"},{"id":"ae-25-wild-magic-odds","title":"25. Wild magic odds","html":"\u003ch2 id=\"ae-25-wild-magic-odds-25-wild-magic-odds\">25. Wild magic odds\u003c/h2>\n\u003cp>Wild magic goes off when the fourth set of face cards is complete: about every 48 Fate Deck checks, roughly once per encounter.\u003c/p>\n\u003ch3 id=\"ae-25-wild-magic-odds-odds-of-each-result\">Odds of each result\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Net\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Combinations\u003c/th>\n\u003cth>Chance\u003c/th>\n\u003cth>About 1 in\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>+4\u003c/td>\n\u003ctd>Good 4 (extreme)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0.06%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>+3\u003c/td>\n\u003ctd>Good 3 (major)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>1.87%\u003c/td>\n\u003ctd>53\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>+2\u003c/td>\n\u003ctd>Good 2 (moderate)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>4.91%\u003c/td>\n\u003ctd>20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>+1\u003c/td>\n\u003ctd>Good 1 (minor)\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>28.05%\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0\u003c/td>\n\u003ctd>Mixed\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>30.22%\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−1\u003c/td>\n\u003ctd>Bad 1 (minor)\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>28.05%\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−2\u003c/td>\n\u003ctd>Bad 2 (moderate)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>4.91%\u003c/td>\n\u003ctd>20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−3\u003c/td>\n\u003ctd>Bad 3 (major)\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>1.87%\u003c/td>\n\u003ctd>53\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>−4\u003c/td>\n\u003ctd>Bad 4 (extreme)\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0.06%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Good and bad are evenly matched: swapping ♥ for ♠ and ♦ for ♣ turns every good combination into a bad one with the same odds.\u003c/p>\n\u003ch3 id=\"ae-25-wild-magic-odds-odds-of-each-combination\">Odds of each combination\u003c/h3>\n\u003cp>A combination's chance depends only on the shape of its four sets, so the 93 fall into nine groups:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Chance\u003c/th>\n\u003cth>About 1 in\u003c/th>\n\u003cth>Combinations\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>8.4156%\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>#58 (four three-suit sets, each missing a different suit)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2.1039%\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>#12, #13, #30–35, #50–57, #75–80, #85, #86\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1.0519%\u003c/td>\n\u003ctd>95\u003c/td>\n\u003ctd>#16–29, #61–74\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.5260%\u003c/td>\n\u003ctd>190\u003c/td>\n\u003ctd>#41–49\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.3506%\u003c/td>\n\u003ctd>285\u003c/td>\n\u003ctd>#4–7, #14, #15, #59, #60, #89–92\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.2338%\u003c/td>\n\u003ctd>428\u003c/td>\n\u003ctd>#2, #3, #87, #88\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.1753%\u003c/td>\n\u003ctd>570\u003c/td>\n\u003ctd>#8–11, #81–84\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.0584%\u003c/td>\n\u003ctd>1,711\u003c/td>\n\u003ctd>#1, #37–40, #93\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0.0065%\u003c/td>\n\u003ctd>15,400\u003c/td>\n\u003ctd>#36 (four one-suit sets)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n"},{"id":"ae-appendix-a-quick-reference-every-card-rule","title":"Appendix A. Quick reference: every card rule","html":"\u003ch2 id=\"ae-appendix-a-quick-reference-every-card-rule-appendix-a-quick-reference-every-card-rule\">Appendix A. Quick reference: every card rule\u003c/h2>\n\u003cp>Every random number in the game comes from a card. Where each card rule is:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Situation\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003cth>Where\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>A check; natural 20 and natural 1\u003c/td>\n\u003ctd>Two cards added one at a time; the Sun (the colored Joker) is a natural 20, the Eclipse (the black Joker) a natural 1\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Flat checks\u003c/td>\n\u003ctd>One card from the Fate Deck against a threshold\u003c/td>\n\u003ctd>Chapter 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fortune and misfortune\u003c/td>\n\u003ctd>Draw 3 cards, keep the best or worst pair\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rerolls and Hero Points\u003c/td>\n\u003ctd>Draw a third card: keep your most recent card (&quot;use the new result&quot;) or the best pair (&quot;use the better result&quot;)\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A fixed result instead of a draw\u003c/td>\n\u003ctd>Burn 1 card, take the fixed result\u003c/td>\n\u003ctd>Chapter 6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Held and reused draws\u003c/td>\n\u003ctd>Held draws, set aside face-up\u003c/td>\n\u003ctd>Chapter 7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Monster checks\u003c/td>\n\u003ctd>The Fate Deck\u003c/td>\n\u003ctd>Chapter 9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Companion, familiar and summon checks\u003c/td>\n\u003ctd>The Fate Deck; a bonded partner that shares its controller's actions draws from the controller's deck\u003c/td>\n\u003ctd>Chapter 8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Secret checks\u003c/td>\n\u003ctd>The GM draws face-down from the Fate Deck and adds the player's modifier\u003c/td>\n\u003ctd>Chapter 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Damage dice d4–d12, pools of 1–30\u003c/td>\n\u003ctd>One card per die from the damage deck, read on a table with exact averages; big-pools rule\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Deadly, fatal, two-hand, jousting, striking runes, crits\u003c/td>\n\u003ctd>Extra cards, re-read cards on a new die size, double the total\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Persistent damage\u003c/td>\n\u003ctd>Damage cards each turn; one Fate Deck card to end it\u003c/td>\n\u003ctd>Chapters 10 and 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Random durations, 1–20 and 1–100 tables\u003c/td>\n\u003ctd>Damage-deck cards (1–20 = card + 10 if red; 1–100 = two cards)\u003c/td>\n\u003ctd>Chapter 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Running out of cards\u003c/td>\n\u003ctd>A deck-out forces a reshuffle and costs a level of exhaustion (player decks only)\u003c/td>\n\u003ctd>Chapter 4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n","part":"Appendices"},{"id":"ae-appendix-b-glossary","title":"Appendix B. Glossary","html":"\u003ch2 id=\"ae-appendix-b-glossary-appendix-b-glossary\">Appendix B. Glossary\u003c/h2>\n\u003cp>Every term the card engine adds, with where it's explained.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>After each deck-out:\u003c/strong> an ability that resets every time your deck runs out (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Allowed average:\u003c/strong> the average card total a deck may have for its size and Jokers: 10.5 + 2 × its average exhaustion level over a standard day (chapter 17).\u003c/li>\n\u003cli>\u003cstrong>Balanced:\u003c/strong> a deck whose day edge is within ±0.1, and whose Strike damage and damage taken on saves each land within 97–103% of a d20's over a standard day. Those spans are the \u003cstrong>balance limits\u003c/strong> (chapter 17).\u003c/li>\n\u003cli>\u003cstrong>Best pair, worst pair:\u003c/strong> of three cards, the two with the highest or lowest card total (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Build table:\u003c/strong> the table of deck sizes and Joker setups, with each row's pip total, swing range, copy limit and starter deck (13.4).\u003c/li>\n\u003cli>\u003cstrong>Burn:\u003c/strong> discard a card unused. Casting costs and fixed results burn cards (chapters 3 and 6).\u003c/li>\n\u003cli>\u003cstrong>Card total:\u003c/strong> the sum of a check's two cards, 2 to 20. Add your modifier to get the check's result (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Casting cost:\u003c/strong> the cards a spell burns: 1 for a cantrip, 2 for any other spell (chapter 3).\u003c/li>\n\u003cli>\u003cstrong>Collapse:\u003c/strong> reaching Exhausted 4. You fall unconscious (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Combination:\u003c/strong> one of wild magic's 93 suit patterns, numbered #1 to #93. Its text is its effect; its tier (Good 2, Mixed and so on) is its result (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Copy limit:\u003c/strong> the most copies of any one value a deck may hold, a third of its number cards (13.4).\u003c/li>\n\u003cli>\u003cstrong>Custom deck:\u003c/strong> a player deck you build yourself (chapter 13).\u003c/li>\n\u003cli>\u003cstrong>d20:\u003c/strong> the benchmark the Math measures against: an even spread of results from 1 to 20, as on a twenty-sided die. The game never rolls one (chapter 17).\u003c/li>\n\u003cli>\u003cstrong>Damage deck, damage card:\u003c/strong> the shared 42-card deck used for damage, healing, random durations and random tables, and a card drawn from it (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Deck code:\u003c/strong> a deck's makeup, written as the counts of Ace, 2, 3 … 10, then Suns / Eclipses (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Deck Lab:\u003c/strong> the Star-Sign Deck Lab, the web tool that builds decks and runs the Lab test.\u003c/li>\n\u003cli>\u003cstrong>Deck-out:\u003c/strong> drawing the last card of your deck. It forces a reshuffle and gives you a level of exhaustion (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Degree of success:\u003c/strong> critical success, success, failure or critical failure. Meeting the DC succeeds; 10 over is a critical success and 10 under a critical failure (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Destined:\u003c/strong> the character whose action completed the fourth set of face cards. Wild magic centers on them (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Die size:\u003c/strong> how damage and other random numbers are written (d4 to d12, as in 2d6). Each die is one damage card (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Die table:\u003c/strong> the table that reads a damage card as a d4, d6, d8, d10 or d12 (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>Eclipse:\u003c/strong> the black Joker, a natural 1 (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Edge, day edge:\u003c/strong> how far a deck's average card total sits above 10.5 once its exhaustion penalty is counted. Day edge is the edge over a standard day (chapter 17).\u003c/li>\n\u003cli>\u003cstrong>Element:\u003c/strong> Fire, Air, Water or Earth. It sets a sign deck's size (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Exhaustion, Exhausted 1–4:\u003c/strong> the engine's own track: −2 per level to your checks, fatigued at Exhausted 3, collapse at Exhausted 4 (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Face card:\u003c/strong> a Jack, Queen or King. Only the Fate Deck holds them, and only when you play with wild magic, which they feed (chapters 9 and 14).\u003c/li>\n\u003cli>\u003cstrong>Fate Deck:\u003c/strong> the GM's deck, 100 cards (112 with wild magic), for monsters, minions, flat checks and secret checks (chapter 9).\u003c/li>\n\u003cli>\u003cstrong>Fate Deck page:\u003c/strong> the web tool that lays out the Fate Deck and resolves wild magic.\u003c/li>\n\u003cli>\u003cstrong>Flip:\u003c/strong> replace a card with its mirror, using the pip dial (13.5).\u003c/li>\n\u003cli>\u003cstrong>Fresh shuffle:\u003c/strong> your whole deck, shuffled at the start of each day (chapter 4).\u003c/li>\n\u003cli>\u003cstrong>Held draw:\u003c/strong> cards drawn now, set aside face-up and used later in place of a draw (chapter 7).\u003c/li>\n\u003cli>\u003cstrong>Joker:\u003c/strong> a Sun or an Eclipse.\u003c/li>\n\u003cli>\u003cstrong>Joker setup:\u003c/strong> a deck's Suns and Eclipses, written Suns / Eclipses, such as 1 / 2 (13.2).\u003c/li>\n\u003cli>\u003cstrong>Kept Sun, kept Eclipse:\u003c/strong> a Joker that Leo's or Scorpio's ability sets aside to play later. It isn't a held draw: one you haven't played goes back into your deck at your next night's rest (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Lab test:\u003c/strong> the Deck Lab's exact test of whether a deck is balanced.\u003c/li>\n\u003cli>\u003cstrong>Long day, short day:\u003c/strong> 80 and 25 checks, used to see how decks play away from the standard day (chapter 20).\u003c/li>\n\u003cli>\u003cstrong>Mirror:\u003c/strong> a card's partner the same distance from the middle: Ace and 10, 2 and 9, 3 and 8, 4 and 7, 5 and 6 (13.5).\u003c/li>\n\u003cli>\u003cstrong>Modality:\u003c/strong> Cardinal, Fixed or Mutable. It sets a sign deck's shape and the style of its ability (chapters 11 and 12).\u003c/li>\n\u003cli>\u003cstrong>Most recent card:\u003c/strong> the card a &quot;use the new result&quot; reroll keeps (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Natural 20, natural 1:\u003c/strong> a Sun or an Eclipse. A card total of 20 is not a natural 20 (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>New check:\u003c/strong> a brand-new two-card check, drawn in place of an old one (chapter 6).\u003c/li>\n\u003cli>\u003cstrong>Number card:\u003c/strong> Ace to 10. Aces count as 1.\u003c/li>\n\u003cli>\u003cstrong>Number needed:\u003c/strong> the card total a check needs to succeed, once modifiers are counted.\u003c/li>\n\u003cli>\u003cstrong>Once per day, once per encounter:\u003c/strong> how often an ability can be used. Once per day resets at a night's rest (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Opposite:\u003c/strong> the combination you get by swapping ♥ for ♠ and ♦ for ♣. It has the same odds, and every bad combination is the opposite of a good one (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Pip, pip total:\u003c/strong> a number card's value (Ace = 1), and the sum of a deck's number cards, which sets its average (13.4).\u003c/li>\n\u003cli>\u003cstrong>Pip dial, swing dial:\u003c/strong> the two ways to adjust a deck. The pip dial flips a card to its mirror and changes the pip total; the swing dial pushes two cards apart or pulls them together and changes the swing points (13.5).\u003c/li>\n\u003cli>\u003cstrong>Price:\u003c/strong> the pips a sign ability takes off the pip total (chapter 12).\u003c/li>\n\u003cli>\u003cstrong>Set:\u003c/strong> three face cards placed together. Wild magic goes off when the fourth set is complete (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Shape:\u003c/strong> how often a deck lands on each card total. \u003cstrong>Steady\u003c/strong> decks bunch near the middle; \u003cstrong>swingy\u003c/strong> decks spread toward the ends (chapter 19).\u003c/li>\n\u003cli>\u003cstrong>Sign deck:\u003c/strong> one of the twelve star-sign decks (chapter 11).\u003c/li>\n\u003cli>\u003cstrong>Standard day:\u003c/strong> the day all balance is measured over: 50 checks across 3–4 encounters and exploration (chapter 17).\u003c/li>\n\u003cli>\u003cstrong>Standard pack:\u003c/strong> 52 cards plus its Jokers, usually one colored and one black.\u003c/li>\n\u003cli>\u003cstrong>Starter deck:\u003c/strong> the ready-made deck in each row of the build table (13.4).\u003c/li>\n\u003cli>\u003cstrong>Sun:\u003c/strong> the colored Joker, a natural 20 (chapter 2).\u003c/li>\n\u003cli>\u003cstrong>Surge rank, surge DC:\u003c/strong> wild magic's rank (half the Destined's level, rounded up) and DC (the standard DC for the Destined's level) (chapter 14).\u003c/li>\n\u003cli>\u003cstrong>Swing points, swing range:\u003c/strong> a score for how far a deck's cards sit from the middle (Ace and 10 score 10, down to 0 for 5 and 6), and the range each build-table row allows (13.3).\u003c/li>\n\u003cli>\u003cstrong>Wild magic:\u003c/strong> the optional rule whose effects go off when the Fate Deck's face cards fill four sets (chapter 14).\u003c/li>\n\u003c/ul>\n"},{"id":"ae-appendix-c-licenses","title":"Appendix C. Licenses","html":"\u003ch2 id=\"ae-appendix-c-licenses-appendix-c-licenses\">Appendix C. Licenses\u003c/h2>\n\u003cp>\u003cem>Aces &amp; Eclipses Core Rulebook\u003c/em> © 2026 Different Games. It's an independent product, not published, endorsed or approved by the publisher of the rules it builds on.\u003c/p>\n\u003cp>Aces &amp; Eclipses and the Aces &amp; Eclipses Compatibility Logo are trademarks of Diff title.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Don't imply endorsement.\u003c/strong> Don't say or suggest that Different Games made, sponsored, approved or checked Your Product.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Leave the rest of the brand alone.\u003c/strong> This license covers only the Marks. It doesn't cover Different Games' other Reserved Material, such as artwork (including the cover art, the sun-and-eclipse emblem and the zodiac ring), trade dress and page design.\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"ae-appendix-d-aces-eclipses-compatibility-license-4-what-this-license-doesn-t-change\">4. What this license doesn't change\u003c/h3>\n\u003cul>\n\u003cli>Your own work in Your Product stays yours, subject to the ORC License for any rules you use or adapt.\u003c/li>\n\u003cli>It adds no terms to the ORC License. Anything the ORC License lets you do with the Aces &amp; Eclipses rules, you can still do without this license.\u003c/li>\n\u003cli>The ORC License already lets anyone name Aces &amp; Eclipses as far as reasonably needed to say what their product works with. This license adds the Compatibility Logo and a fuller use of the name.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-appendix-d-aces-eclipses-compatibility-license-5-new-versions-and-ending\">5. New versions and ending\u003c/h3>\n\u003cul>\n\u003cli>Different Games may publish new versions of this license. You may keep using the version in force when Your Product was first published, or move to a newer one.\u003c/li>\n\u003cli>If Your Product breaks these terms, Different Games may tell you. If you don't fix it within 30 days, your permission for that product ends: stop using the Marks on new copies, store pages and advertising for it. You don't have to recall copies already sold.\u003c/li>\n\u003cli>Different Games may also end your permission, by notice, for a product that is unlawful or that uses the Marks alongside hateful or harassing content.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ae-appendix-d-aces-eclipses-compatibility-license-6-no-warranty\">6. No warranty\u003c/h3>\n\u003cp>The Marks are provided as they are, with no warranty of any kind. Different Games isn't responsible for Your Product or for anything that results from using this license.\u003c/p>\n\u003ch3 id=\"ae-appendix-d-aces-eclipses-compatibility-license-7-crediting-aces-amp-eclipses\">7. Crediting Aces &amp; Eclipses\u003c/h3>\n\u003cp>In an ORC Attribution Notice, credit: \u003cem>Aces &amp; Eclipses Core Rulebook\u003c/em> © 2026 Different Games.\u003c/p>\n\u003cp>For questions about this license, contact Different Games through the store or site where Aces &amp; Eclipses is sold.\u003c/p>\n\u003ch3 id=\"ae-appendix-d-aces-eclipses-compatibility-license-8-the-compatibility-logo\">8. The Compatibility Logo\u003c/h3>\n\u003cp>The logo comes in two versions: light, for light backgrounds, and dark, for dark ones. Different Games publishes the logo files with this license.\u003c/p>\n"}]}},"classic":{"stars":{"title":"Written in the Stars: d20 Classic","sections":[{"id":"sd-introduction","title":"Introduction","html":"\u003cp>\u003cem>Playing fifth edition and 3.5 with a deck of cards. An unofficial add-on, second release · 3 October 2026.\u003c/em>\u003c/p>\n\u003cp>Put the d20 away. Every check is two playing cards drawn one at a time and added together. Each player draws from a deck built around their character&#39;s star sign, and that deck is also their stamina: draw your last card and weariness starts to set in. The GM draws from a Fate Deck, and damage comes from a shared damage deck.\u003c/p>\n\u003cp>This booklet is for games where only a natural 20 crits: fifth edition and 3.5, along with the games built on 3.5&#39;s rules (this booklet calls them all 3.5). Everything else plays as written: your character sheet, ability scores, AC, DCs, advantage, spells and feats. What changes is how luck feels: it has a shape, a memory and a cost.\u003c/p>\n\u003cp>The decks here are balanced for fifth edition and 3.5 at once. The complete rules are in \u003cem>Core Engine: d20 Classic\u003c/em>, and the numbers behind the decks are at the back of this booklet, in The Math.\u003c/p>\n"},{"id":"sd-at-a-glance","title":"At a glance","html":"\u003ch2 id=\"sd-at-a-glance-at-a-glance\">At a glance\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>With dice\u003c/th>\n\u003cth>With the cards\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Roll a d20 and add your modifier\u003c/td>\n\u003ctd>\u003cstrong>Draw two cards and add them\u003c/strong> (Ace = 1, so 2 to 20), then add your modifier\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Natural 20\u003c/td>\n\u003ctd>\u003cstrong>The Sun\u003c/strong> (the colored Joker): it counts as 20; on an attack it always hits and is the only card that crits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Natural 1\u003c/td>\n\u003ctd>\u003cstrong>The Eclipse\u003c/strong> (the black Joker): it counts as 1; on an attack it always misses\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Critical hit on a 19–20 or wider\u003c/td>\n\u003ctd>\u003cstrong>Only the Sun crits.\u003c/strong> A wider range becomes a bigger crit on a Sun\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Advantage / disadvantage\u003c/td>\n\u003ctd>\u003cstrong>Draw 3 cards and keep the best pair\u003c/strong> (advantage) or the worst pair (disadvantage)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rerolls, Heroic Inspiration, luck\u003c/td>\n\u003ctd>\u003cstrong>Draw a third card\u003c/strong> and pair it, as the reroll&#39;s wording says\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Extra dice on a check (Bardic Inspiration dice, \u003cem>guidance\u003c/em>, \u003cem>bless\u003c/em>)\u003c/td>\n\u003ctd>\u003cstrong>One damage-deck card per die,\u003c/strong> read as that die\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The GM rolls for monsters\u003c/td>\n\u003ctd>\u003cstrong>The GM draws from the Fate Deck,\u003c/strong> a deck of their own\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Damage dice and percentile rolls\u003c/td>\n\u003ctd>\u003cstrong>The damage deck:\u003c/strong> one card per die, read on the die table\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>—\u003c/td>\n\u003ctd>\u003cstrong>New: weariness.\u003c/strong> Running out of cards forces a reshuffle and costs you a level of weariness\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"sd-at-a-glance-what-stays-the-same\">What stays the same\u003c/h3>\n\u003cp>Your character sheet, ability scores, proficiency, AC, DCs and the action economy. Multiple attacks, spell slots, rests, conditions and your game&#39;s own exhaustion or fatigue work as written. Every rule that talks about the d20 still works; it just reads the card total instead.\u003c/p>\n"},{"id":"sd-what-you-need","title":"What you need","html":"\u003ch2 id=\"sd-what-you-need-what-you-need\">What you need\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>For each player:\u003c/strong> their deck, built from standard packs (52 cards plus Jokers). A sign deck needs 2 to 5 packs depending on the sign.\u003c/li>\n\u003cli>\u003cstrong>For the GM:\u003c/strong> the Fate Deck, 100 cards built from 5 packs: Ace to 10 in set numbers, plus 3 Suns and 3 Eclipses. With wild magic, add the 12 face cards from one pack, for 112.\u003c/li>\n\u003cli>\u003cstrong>For the table:\u003c/strong> a damage deck, one standard pack with the face cards removed (42 cards, Jokers included).\u003c/li>\n\u003cli>\u003cstrong>Optional:\u003c/strong> the Star-Sign Deck Lab, set to d20 Classic. It builds and tests player decks, loads every sign deck and starter deck, and tests the whole table&#39;s decks at once.\u003c/li>\n\u003c/ul>\n"},{"id":"sd-making-a-check","title":"Making a check","html":"\u003ch2 id=\"sd-making-a-check-making-a-check\">Making a check\u003c/h2>\n\u003cp>Draw a card, then a second, and add them. Add your modifier and compare the total with the DC or AC exactly as you would with a d20.\u003c/p>\n\u003cblockquote>\n\u003cp>Your fighter attacks a troll with AC 15 and a +7 bonus. You draw a 3, then a 6: 9 + 7 = 16, a hit. Only a Sun would have been a critical hit.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cstrong>A Joker ends the draw.\u003c/strong> If your first card is a Sun, stop: you&#39;ve drawn a natural 20, and the check cost only one card. An Eclipse works the same way as a natural 1. A Joker drawn second still counts as that natural result.\u003c/p>\n\u003cp>\u003cstrong>A card total of 20 isn&#39;t a natural 20.\u003c/strong> Two 10s make a 20, which hits or succeeds like any other 20. Only a Sun is a natural 20.\u003c/p>\n\u003cp>\u003cstrong>Discard face-down.\u003c/strong> Nobody looks back through a discard pile, so keeping track of what&#39;s left takes memory.\u003c/p>\n\u003ch3 id=\"sd-making-a-check-why-two-cards-feel-different-from-one-die\">Why two cards feel different from one die\u003c/h3>\n\u003cp>A d20 gives every number the same 5% chance. Two cards added together don&#39;t: middle card totals like 10 and 11 come up often, and the extremes rarely. Each deck bends that shape its own way. A deck heavy in 5s and 6s lands near its average most of the time. A deck of mostly Aces and 10s swings between great and awful.\u003c/p>\n\u003cp>None of this makes one deck better than another. Every deck is tuned to be as fair as a d20 over a standard day; a steady deck and a swingy deck just get there by different roads.\u003c/p>\n"},{"id":"sd-critical-hits-and-natural-1s","title":"Critical hits and natural 1s","html":"\u003ch2 id=\"sd-critical-hits-and-natural-1s-critical-hits-and-natural-1s\">Critical hits and natural 1s\u003c/h2>\n\u003cp>\u003cstrong>Only the Sun crits.\u003c/strong> On an attack, a Sun always hits and an Eclipse always misses. Everything else about hitting works as written.\u003c/p>\n\u003ch3 id=\"sd-critical-hits-and-natural-1s-fifth-edition\">Fifth edition\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>A Sun is a critical hit.\u003c/strong> Draw the attack&#39;s damage dice twice, as your game says.\u003c/li>\n\u003cli>\u003cstrong>A wider crit range becomes a bigger crit.\u003c/strong> A feature that crits on a 19–20 gives a Sun three sets of damage dice instead of two; 18–20 gives four. Each extra number in the crit range adds one set.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"sd-critical-hits-and-natural-1s-3-5\">3.5\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Only the Sun threatens.\u003c/strong> Confirm it with a normal attack draw at the same bonus; if that hits, it&#39;s a critical hit. The confirming draw costs cards like any check.\u003c/li>\n\u003cli>\u003cstrong>A weapon&#39;s threat range becomes a bigger multiplier on a Sun:\u003c/strong> the multiplier on a Sun is 1 + (numbers in the threat range) × (the weapon&#39;s multiplier − 1). Multiply damage the way your game says.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Threat range\u003c/th>\n\u003cth>×2 weapon\u003c/th>\n\u003cth>×3 weapon\u003c/th>\n\u003cth>×4 weapon\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>20\u003c/td>\n\u003ctd>×2\u003c/td>\n\u003ctd>×3\u003c/td>\n\u003ctd>×4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>19–20\u003c/td>\n\u003ctd>×3\u003c/td>\n\u003ctd>×5\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>×4\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003ctd>×10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17–20\u003c/td>\n\u003ctd>×5\u003c/td>\n\u003ctd>×9\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15–20\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"sd-saves-checks-and-luck","title":"Saves, checks and luck","html":"\u003ch2 id=\"sd-saves-checks-and-luck-saves-checks-and-luck\">Saves, checks and luck\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Saving throws.\u003c/strong> In fifth edition a Sun and an Eclipse count as a 20 and a 1, nothing more. In 3.5 a Sun always saves and an Eclipse always fails, as natural 20s and 1s do.\u003c/li>\n\u003cli>\u003cstrong>Ability and skill checks:\u003c/strong> a Sun and an Eclipse count as a 20 and a 1.\u003c/li>\n\u003cli>\u003cstrong>Take 10 and Take 20\u003c/strong> (3.5): don&#39;t draw; take the result.\u003c/li>\n\u003cli>\u003cstrong>Advantage:\u003c/strong> draw 3 cards one at a time and keep the best pair. A Sun at any point ends the draw as a natural 20. An Eclipse is the card you drop; two Eclipses can&#39;t both be dropped, so the check is a natural 1.\u003c/li>\n\u003cli>\u003cstrong>Disadvantage:\u003c/strong> draw 3 and keep the worst pair. An Eclipse at any point ends the draw as a natural 1. A Sun is the card you drop; two Suns can&#39;t both be dropped, so the check is a natural 20.\u003c/li>\n\u003cli>\u003cstrong>Rerolls.\u003c/strong> A reroll that uses the new roll: keep your most recent card, draw a new one and pair them; the new card total stands. A reroll that lets you choose: draw a third card and keep the best pair of the three. A trait that rerolls natural 1s: on an Eclipse, make a new check.\u003c/li>\n\u003cli>\u003cstrong>Extra dice on a check\u003c/strong> (\u003cem>bless\u003c/em>, \u003cem>guidance\u003c/em>, Bardic Inspiration dice): one damage-deck card per die, read as that die.\u003c/li>\n\u003cli>\u003cstrong>Death saving throws\u003c/strong> (fifth edition): the GM draws one Fate Deck card. A 4 or higher succeeds, a Sun means you regain 1 hit point, and an Eclipse counts as two failures.\u003c/li>\n\u003cli>\u003cstrong>Percentile rolls\u003c/strong> (miss chances, d% tables): two damage cards, tens then ones (a 10 counts as 0, 0-0 is 100; redraw Jokers).\u003c/li>\n\u003c/ul>\n\u003cp>Advantage costs an extra card, so a table that hands it out freely will see decks run out a little sooner.\u003c/p>\n"},{"id":"sd-your-deck-is-your-stamina","title":"Your deck is your stamina","html":"\u003ch2 id=\"sd-your-deck-is-your-stamina-your-deck-is-your-stamina\">Your deck is your stamina\u003c/h2>\n\u003cp>This is the biggest change at the table. Cards are a resource.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Every check costs 2 cards\u003c/strong> (1 if the first card is a Joker).\u003c/li>\n\u003cli>\u003cstrong>Casting costs cards too:\u003c/strong> a cantrip costs 1, any other spell 2, whatever its level. Draw them and discard them unused. A spell attack is a separate check on top of that.\u003c/li>\n\u003cli>\u003cstrong>Drawing the last card of your deck (a deck-out) forces a reshuffle and gives you a level of weariness,\u003c/strong> starting with your next check.\u003c/li>\n\u003cli>\u003cstrong>Each level of weariness is −2 to every check you draw for.\u003c/strong> At Weary 3 you also take −1 to AC and saving throws. At Weary 4 you collapse: finish what you were doing, then fall unconscious for 10 minutes and wake at Weary 3.\u003c/li>\n\u003cli>\u003cstrong>A long rest clears it all,\u003c/strong> and every morning starts with a fresh shuffle.\u003c/li>\n\u003c/ul>\n\u003cp>Weariness is the card engine&#39;s own track. It sits beside your game&#39;s exhaustion or fatigue, which work as written and stack with it.\u003c/p>\n\u003cp>A \u003cstrong>standard day\u003c/strong> is about 50 checks: three or four fights plus exploration. All the balance is measured over it. A 45-card deck runs out twice in that day; a 90-card deck once, late.\u003c/p>\n\u003cp>\u003cstrong>What this means in play.\u003c/strong> Small decks are stronger card for card, because they pay for it by tiring sooner. Every deck starts the day strong and ends it weak. Resting before the big fight is a real decision now, and so is using advantage, which costs an extra card.\u003c/p>\n"},{"id":"sd-the-twelve-star-signs","title":"The twelve star signs","html":"\u003ch2 id=\"sd-the-twelve-star-signs-the-twelve-star-signs\">The twelve star signs\u003c/h2>\n\u003cp>Each player draws from a deck shaped by their sign. The element sets the deck&#39;s size, so it sets how fast the deck tires. Mutable decks are the swingiest of their element, except in Air, where one-Sun Libra swings more than two-Sun Gemini; Cardinal and Fixed decks are steadier.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sign\u003c/th>\n\u003cth>Element · modality\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Deck code\u003c/th>\n\u003cth>Packs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aries\u003c/td>\n\u003ctd>Fire · Cardinal\u003c/td>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 0\u003c/td>\n\u003ctd>10-6-3-1-0-1-2-4-7-10 / 1-0\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leo\u003c/td>\n\u003ctd>Fire · Fixed\u003c/td>\n\u003ctd>48\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>9-6-3-2-1-1-2-4-7-11 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sagittarius\u003c/td>\n\u003ctd>Fire · Mutable\u003c/td>\n\u003ctd>51\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>10-7-4-2-0-0-2-4-8-12 / 1-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Libra\u003c/td>\n\u003ctd>Air · Cardinal\u003c/td>\n\u003ctd>55\u003c/td>\n\u003ctd>1 / 1\u003c/td>\n\u003ctd>13-7-3-1-0-0-2-6-9-12 / 1-1\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aquarius\u003c/td>\n\u003ctd>Air · Fixed\u003c/td>\n\u003ctd>59\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>4-5-6-6-7-7-6-6-5-4 / 2-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gemini\u003c/td>\n\u003ctd>Air · Mutable\u003c/td>\n\u003ctd>63\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>7-6-5-6-6-6-6-6-6-6 / 2-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cancer\u003c/td>\n\u003ctd>Water · Cardinal\u003c/td>\n\u003ctd>67\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>8-7-7-6-5-5-5-6-7-8 / 2-1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scorpio\u003c/td>\n\u003ctd>Water · Fixed\u003c/td>\n\u003ctd>71\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>5-6-7-7-7-7-6-6-7-8 / 2-3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pisces\u003c/td>\n\u003ctd>Water · Mutable\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>12-10-8-5-3-3-4-6-9-12 / 2-1\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Capricorn\u003c/td>\n\u003ctd>Earth · Cardinal\u003c/td>\n\u003ctd>80\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>13-10-8-5-3-3-4-7-10-13 / 2-2\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Taurus\u003c/td>\n\u003ctd>Earth · Fixed\u003c/td>\n\u003ctd>85\u003c/td>\n\u003ctd>2 / 4\u003c/td>\n\u003ctd>11-9-7-6-5-5-6-8-10-12 / 2-4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Virgo\u003c/td>\n\u003ctd>Earth · Mutable\u003c/td>\n\u003ctd>90\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>20-12-5-2-2-4-7-10-11-13 / 2-2\u003c/td>\n\u003ctd>5\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Fire decks\u003c/strong> start the day strongest and tire the fastest: they run out once or twice in a standard day.\u003c/li>\n\u003cli>\u003cstrong>Earth decks\u003c/strong> change the least from morning to night and run out once, late.\u003c/li>\n\u003cli>\u003cstrong>Water and Air\u003c/strong> sit in between.\u003c/li>\n\u003c/ul>\n"},{"id":"sd-building-your-own-deck","title":"Building your own deck","html":"\u003ch2 id=\"sd-building-your-own-deck-building-your-own-deck\">Building your own deck\u003c/h2>\n\u003cp>A player who doesn&#39;t want a sign deck can build one from 45 to 90 cards in steps of 5:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Pick a size and its Jokers\u003c/strong> from the build table below. Only the Sun crits, so the number of Suns goes by size: one at 45 and 50 cards, two from 55 to 90.\u003c/li>\n\u003cli>\u003cstrong>Hit the pip total exactly.\u003c/strong> Add up your number cards&#39; values, Ace = 1.\u003c/li>\n\u003cli>\u003cstrong>Land your swing points in your row&#39;s swing range.\u003c/strong> Each number card scores: A and 10 score 10, 2 and 9 score 6, 3 and 8 score 3, 4 and 7 score 1, 5 and 6 score 0. Below the range the deck saves too well; above it, its attacks hit too hard.\u003c/li>\n\u003cli>\u003cstrong>Land your lean in your row&#39;s lean range.\u003c/strong> Lean is the swing points from your 7s to 10s minus those from your Aces to 4s. It says whether your extremes sit high or low, which matters for fifth-edition attacks.\u003c/li>\n\u003cli>\u003cstrong>Keep each value to a third of your number cards:\u003c/strong> the copy limit (&quot;Most copies&quot;).\u003c/li>\n\u003cli>\u003cstrong>Or start from the row&#39;s starter deck\u003c/strong> and adjust it with two dials. The \u003cstrong>pip dial\u003c/strong> flips a card to its mirror (A and 10, 2 and 9, 3 and 8, 4 and 7, 5 and 6): it changes the pip total and the lean but not the swing points. The \u003cstrong>swing dial\u003c/strong> pushes a card and its mirror apart by the same steps (a 5 → 4 with a 6 → 7): it changes the swing points but not the pip total or the lean.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Size\u003c/th>\n\u003cth>Suns / Eclipses\u003c/th>\n\u003cth>Pip total\u003c/th>\n\u003cth>Swing points\u003c/th>\n\u003cth>Lean\u003c/th>\n\u003cth>Most copies\u003c/th>\n\u003cth>Starter deck\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>45\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>259\u003c/td>\n\u003ctd>145–264\u003c/td>\n\u003ctd>60 to 109\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>4-4-4-4-3-2-1-4-7-9 / 1-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>50\u003c/td>\n\u003ctd>1 / 2\u003c/td>\n\u003ctd>282\u003c/td>\n\u003ctd>220–354\u003c/td>\n\u003ctd>30 to 99\u003c/td>\n\u003ctd>15\u003c/td>\n\u003ctd>8-6-4-2-0-1-2-5-8-11 / 1-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>55\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>288\u003c/td>\n\u003ctd>50–174\u003c/td>\n\u003ctd>−30 to 69\u003c/td>\n\u003ctd>17\u003c/td>\n\u003ctd>3-4-5-6-7-8-7-5-4-3 / 2-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>60\u003c/td>\n\u003ctd>2 / 1\u003c/td>\n\u003ctd>313\u003c/td>\n\u003ctd>155–264\u003c/td>\n\u003ctd>−40 to 69\u003c/td>\n\u003ctd>19\u003c/td>\n\u003ctd>5-5-5-6-7-7-7-6-5-4 / 2-1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>65\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>343\u003c/td>\n\u003ctd>130–289\u003c/td>\n\u003ctd>−10 to 89\u003c/td>\n\u003ctd>20\u003c/td>\n\u003ctd>5-5-5-6-7-8-8-7-6-4 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>70\u003c/td>\n\u003ctd>2 / 2\u003c/td>\n\u003ctd>367\u003c/td>\n\u003ctd>215–379\u003c/td>\n\u003ctd>−30 to 79\u003c/td>\n\u003ctd>22\u003c/td>\n\u003ctd>5-6-6-7-8-8-8-7-6-5 / 2-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>75\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>395\u003c/td>\n\u003ctd>185–424\u003c/td>\n\u003ctd>−10 to 79\u003c/td>\n\u003ctd>23\u003c/td>\n\u003ctd>8-7-6-6-6-6-7-8-8-8 / 2-3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>80\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>418\u003c/td>\n\u003ctd>300–469\u003c/td>\n\u003ctd>−40 to 49\u003c/td>\n\u003ctd>25\u003c/td>\n\u003ctd>12-8-6-5-5-5-6-8-9-11 / 2-3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>85\u003c/td>\n\u003ctd>2 / 3\u003c/td>\n\u003ctd>441\u003c/td>\n\u003ctd>350–529\u003c/td>\n\u003ctd>−60 to 19\u003c/td>\n\u003ctd>26\u003c/td>\n\u003ctd>13-10-7-6-5-4-4-7-10-14 / 2-3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>90\u003c/td>\n\u003ctd>2 / 4\u003c/td>\n\u003ctd>467\u003c/td>\n\u003ctd>380–539\u003c/td>\n\u003ctd>−60 to 19\u003c/td>\n\u003ctd>28\u003c/td>\n\u003ctd>13-10-8-6-5-5-5-7-10-15 / 2-4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Each size allows two other Joker setups, each with its own ranges; the Deck Lab lists them all in its Starter deck menu. The Lab test has the final word, and it suggests the smallest card change for a deck that fails.\u003c/p>\n"},{"id":"sd-for-gms-running-the-game","title":"For GMs: running the game","html":"\u003ch2 id=\"sd-for-gms-running-the-game-for-gms-running-the-game\">For GMs: running the game\u003c/h2>\n\u003ch3 id=\"sd-for-gms-running-the-game-the-fate-deck\">The Fate Deck\u003c/h3>\n\u003cp>The GM&#39;s 100-card deck (112 with wild magic) is built to play like a d20. It never causes weariness; reshuffle it when it runs out, about every 52 checks.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Cards\u003c/th>\n\u003cth>Count\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aces\u003c/td>\n\u003ctd>17\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 · 3 · 4 · 5 · 6 · 7 · 8 · 9\u003c/td>\n\u003ctd>12 · 12 · 5 · 5 · 5 · 6 · 7 · 7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10s\u003c/td>\n\u003ctd>18\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Suns / Eclipses\u003c/td>\n\u003ctd>3 / 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>100\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Face cards (J, Q, K of each suit), with wild magic\u003c/td>\n\u003ctd>12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total with wild magic\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>112\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Monsters use it for their attacks, saves, checks and initiative. Players still draw their own checks, including saves against monster abilities. For a secret check, the GM draws face-down from the Fate Deck and adds the player&#39;s modifier.\u003c/p>\n\u003ch3 id=\"sd-for-gms-running-the-game-wild-magic-optional\">Wild magic (optional)\u003c/h3>\n\u003cp>Wild magic is optional; the table decides at session zero. To play with it, add the 12 face cards to the Fate Deck. Face cards never count toward a card total: when one comes up, set it aside and draw a replacement. Set aside face cards from Fate Deck checks made in response to a player&#39;s action or request (plain rolls and secret checks included), in the order they come up, three to a set. Never draw extra checks to fish for them. When the fourth set is full, about once per encounter, wild magic goes off around the \u003cstrong>Destined\u003c/strong>: the character whose action drew the last face card.\u003c/p>\n\u003cp>The suits decide what happens. Matching red suits push it good, matching black suits push it bad, and an even split makes it mixed: an effect that hits friend and foe alike, or a harmless oddity. About a third of the time it&#39;s good, a third bad and a third mixed, and the strong results are rare. Good effects run from a hex on an enemy to a bolt of lightning, a veil of invisibility or a wave of healing; bad ones are the same effects turned against the party. \u003cem>Core Engine: d20 Classic\u003c/em> lists all 93 combinations, with their fifth-edition and 3.5 rules.\u003c/p>\n\u003ch3 id=\"sd-for-gms-running-the-game-plain-rolls\">Plain rolls\u003c/h3>\n\u003cp>A pass-or-fail d20 roll with no modifier, like a death saving throw, is one Fate Deck card. A random d20 table uses a damage card instead (see the quick reference). A Sun always succeeds and an Eclipse always fails.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>d20 roll needed\u003c/th>\n\u003cth>Card needed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>3 or less\u003c/td>\n\u003ctd>Any number card\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>2 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>3 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>4 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>The number − 6 (5 for 11, up to 10 for 16)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>Sun\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"sd-for-gms-running-the-game-damage\">Damage\u003c/h3>\n\u003cp>Draw one damage-deck card per die and read it for the die size (a 10 is a 10 on a d10, a 6 on a d6). A critical hit draws its extra dice the same way. A Joker is bonus damage: for players it counts as the die&#39;s maximum; for monsters it counts as the maximum and adds another die, which can chain. That makes damage run a little high on both sides, more for monsters.\u003c/p>\n\u003ch3 id=\"sd-for-gms-running-the-game-pacing\">Pacing\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>The last fight of the day is the hardest,\u003c/strong> and nothing in the rules softens it. Every deck ends a standard day at its weakest, so a boss after a long day plays above its level.\u003c/li>\n\u003cli>\u003cstrong>Long days wear decks down.\u003c/strong> On a long day of 80 checks the Fire decks reach Weary 3; even Aries, the smallest, would collapse only around check 91. Most parties will rest before then; a forced march or a dungeon with no safe rest will test them.\u003c/li>\n\u003cli>\u003cstrong>Day length shifts who shines.\u003c/strong> Short days favor small decks; long days favor big ones.\u003c/li>\n\u003c/ul>\n"},{"id":"sd-getting-started","title":"Getting started","html":"\u003ch2 id=\"sd-getting-started-getting-started\">Getting started\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Session zero: choose signs.\u003c/strong> Each player picks a star sign for their character, or builds a deck. The sign doesn&#39;t have to match anything else on the sheet, though it&#39;s more fun when it does. Decide together whether to play with wild magic.\u003c/li>\n\u003cli>\u003cstrong>Build the decks.\u003c/strong> Use the deck codes in this booklet: ten counts from Ace to 10, then Suns and Eclipses. The Deck Lab, set to d20 Classic, loads every sign deck and tests custom ones.\u003c/li>\n\u003cli>\u003cstrong>Build the GM&#39;s Fate Deck and the damage deck.\u003c/strong> Add the 12 face cards to the Fate Deck if you play with wild magic.\u003c/li>\n\u003cli>\u003cstrong>Start each day with a fresh shuffle.\u003c/strong> Keep discard piles face-down and track each player&#39;s weariness next to their deck.\u003c/li>\n\u003cli>\u003cstrong>Play.\u003c/strong> The first session, keep the quick reference at the back of this booklet on the table.\u003c/li>\n\u003c/ol>\n"},{"id":"sd-quick-reference","title":"Quick reference","html":"\u003ch2 id=\"sd-quick-reference-quick-reference\">Quick reference\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Situation\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Any check\u003c/td>\n\u003ctd>Draw 2 and add; a Joker ends the draw (a Sun is a natural 20, an Eclipse a natural 1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Attack\u003c/td>\n\u003ctd>A Sun always hits and is the only crit; an Eclipse always misses\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Wider crit range (fifth edition)\u003c/td>\n\u003ctd>A Sun deals one more set of damage dice per extra number in the range\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Threat range (3.5)\u003c/td>\n\u003ctd>Only a Sun threatens; confirm with an attack draw; multiplier on a Sun = 1 + (numbers in the threat range) × (multiplier − 1)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Saves\u003c/td>\n\u003ctd>Fifth edition: Sun and Eclipse count as 20 and 1. 3.5: a Sun always saves, an Eclipse always fails\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Advantage / disadvantage\u003c/td>\n\u003ctd>Draw 3, keep the best / worst pair\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reroll, &quot;use the new roll&quot;\u003c/td>\n\u003ctd>Keep your most recent card, draw 1, pair them\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reroll, &quot;choose either roll&quot;\u003c/td>\n\u003ctd>Draw 1, keep the best pair of the three\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Extra die on a check\u003c/td>\n\u003ctd>One damage card, read as that die\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Take 10 / Take 20\u003c/td>\n\u003ctd>No draw\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Death saving throw\u003c/td>\n\u003ctd>One Fate Deck card: 4 or higher succeeds; a Sun regains 1 hit point; an Eclipse is two failures\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Plain d20 roll, no modifier\u003c/td>\n\u003ctd>One Fate Deck card against the plain-rolls table\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Face card from the Fate Deck (wild magic)\u003c/td>\n\u003ctd>Set it aside and draw again; four sets of three set off wild magic\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cantrip / other spell\u003c/td>\n\u003ctd>Draw and discard 1 / 2 cards unused\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Your deck runs out\u003c/td>\n\u003ctd>Reshuffle and gain a level of weariness: −2 per level, −1 AC and saves at Weary 3, collapse at Weary 4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Damage\u003c/td>\n\u003ctd>One damage card per die, read on the table below; a Joker is bonus damage\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d20 table\u003c/td>\n\u003ctd>One damage card, plus 10 if it&#39;s red (redraw Jokers)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d100 (d%)\u003c/td>\n\u003ctd>Two damage cards: tens, then ones (10 counts as 0; 0-0 is 100; redraw Jokers)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Damage card\u003c/th>\n\u003cth>A\u003c/th>\n\u003cth>2\u003c/th>\n\u003cth>3\u003c/th>\n\u003cth>4\u003c/th>\n\u003cth>5\u003c/th>\n\u003cth>6\u003c/th>\n\u003cth>7\u003c/th>\n\u003cth>8\u003c/th>\n\u003cth>9\u003c/th>\n\u003cth>10\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>d4\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d6\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d8\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d10\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>d12\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>5\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>11\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n"},{"id":"sd-questions-at-the-table","title":"Questions at the table","html":"\u003ch2 id=\"sd-questions-at-the-table-questions-at-the-table\">Questions at the table\u003c/h2>\n\u003cp>\u003cstrong>Is a card deck really as fair as a d20?\u003c/strong> Over a standard day, yes, in fifth edition and in 3.5. Shorter and longer days drift, and within a single fight they aren&#39;t meant to match: that&#39;s where the decks get their personalities. The Math, below, has the details.\u003c/p>\n\u003cp>\u003cstrong>Why does Aries have no Eclipse?\u003c/strong> In these games a natural 1 does little beyond missing, so a small deck balances well with a Sun and no Eclipse. Each sign&#39;s Joker setup is one that keeps crits and saves in line.\u003c/p>\n\u003cp>\u003cstrong>Can I count cards?\u003c/strong> Yes, if you can keep it in your head. Discards go face-down, so nobody can look back through them. The balance assumes nobody counts, so it&#39;s a small edge for players with a good memory.\u003c/p>\n\u003cp>\u003cstrong>What if I run out in the middle of a check?\u003c/strong> Reshuffle and draw your second card from the new deck. The weariness applies from your next check.\u003c/p>\n\u003cp>\u003cstrong>Do monsters get weary?\u003c/strong> No. The Fate Deck never causes weariness, and neither does the damage deck.\u003c/p>\n\u003cp>\u003cstrong>Can two players share a sign?\u003c/strong> Yes. Each builds their own copy of the deck.\u003c/p>\n\u003cp>\u003cstrong>Does this work for other d20 games?\u003c/strong> Games where only a natural 20 crits should work with these decks, though the numbers here cover only fifth edition and 3.5.\u003c/p>\n"},{"id":"sd-the-math","title":"The Math","html":"\u003ch2 id=\"sd-the-math-the-math\">The Math\u003c/h2>\n\u003cp>For anyone who wants to see how the cards line up with a d20. \u003cem>Core Engine: d20 Classic\u003c/em> has the full numbers in its Part Four.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>What &quot;balanced&quot; means.\u003c/strong> Over a standard day of 50 checks (three or four fights plus exploration, about 95 to 99 cards), a deck succeeds as often as a d20. Its attack damage in fifth edition, its attack damage in 3.5 (with 20/×3, 19–20/×2 and 18–20/×2 weapons), and the damage it takes from saves each land within 97–103% of a d20&#39;s.\u003c/li>\n\u003cli>\u003cstrong>Suns.\u003c/strong> A deck&#39;s Suns come up on 3 to 8% of checks, against a d20&#39;s 5%, and its number cards are tuned to make up the difference.\u003c/li>\n\u003cli>\u003cstrong>Bigger crits.\u003c/strong> A 19–20 range crits 10% of the time on a d20 for one extra set of dice. The Sun comes up about 5% of the time, so it carries two extra sets: the same average damage, in fewer, bigger hits.\u003c/li>\n\u003cli>\u003cstrong>Through the day.\u003c/strong> Fire decks start the day about 1 point of edge ahead of a d20. In the last quarter of a standard day, most decks sit 1 to 1.4 points behind, and the Earth decks less.\u003c/li>\n\u003cli>\u003cstrong>The Fate Deck.\u003c/strong> Its average card total is 10.5, and a Sun and an Eclipse each come up on 5.8% of checks. Monsters&#39; attacks deal 98.5 to 101.5% of a d20&#39;s damage in fifth edition and in 3.5, and monsters take 99.9% of a d20&#39;s damage on saves.\u003c/li>\n\u003cli>\u003cstrong>Plain rolls.\u003c/strong> Death saving throws succeed 56% of the time, against a d20&#39;s 55%, and a Sun and an Eclipse each come up 3% of the time, against 5%; a character who gets no help dies 39% of the time, against 41%. Other plain rolls:\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>d20 roll needed\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>d20\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>2–3\u003c/td>\n\u003ctd>97%\u003c/td>\n\u003ctd>95–90%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>80%\u003c/td>\n\u003ctd>85–75%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>68%\u003c/td>\n\u003ctd>70–65%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>56%\u003c/td>\n\u003ctd>60–55%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>51%, 46%, 41%, 35%, 28%, 21%\u003c/td>\n\u003ctd>50%, 45%, 40%, 35%, 30%, 25%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>21%\u003c/td>\n\u003ctd>20%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>3%\u003c/td>\n\u003ctd>15–5%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Advantage.\u003c/strong> Drawing 3 and keeping the best pair adds 18 to 22 percentage points of success at typical numbers needed, against 22 for two d20s.\u003c/li>\n\u003cli>\u003cstrong>Damage.\u003c/strong> Every die size keeps its exact average. The Jokers add about 3 to 4% to players&#39; damage and 8 to 9% to monsters&#39;.\u003c/li>\n\u003cli>\u003cstrong>Building your own.\u003c/strong> A deck built inside the ranges is balanced almost every time, and the rare miss is only a few tenths of a percentage point off.\u003c/li>\n\u003c/ul>\n"},{"id":"sd-licenses","title":"Licenses","html":"\u003ch2 id=\"sd-licenses-licenses\">Licenses\u003c/h2>\n\u003cp>\u003cem>Written in the Stars: d20 Classic\u003c/em> © 2026 Different Games. It&#39;s an independent product, not published, endorsed or approved by the publishers of the games it works with.\u003c/p>\n\u003ch3 id=\"sd-licenses-system-reference-document-5-2-1\">System Reference Document 5.2.1\u003c/h3>\n\u003cp>This work includes material from the System Reference Document 5.2.1 (&quot;SRD 5.2.1&quot;) by Wizards of the Coast LLC, available at \u003ca href=\"https://www.dndbeyond.com/srd\">https://www.dndbeyond.com/srd\u003c/a>. The SRD 5.2.1 is licensed under the Creative Commons Attribution 4.0 International License, available at \u003ca href=\"https://creativecommons.org/licenses/by/4.0/legalcode\">https://creativecommons.org/licenses/by/4.0/legalcode\u003c/a>.\u003c/p>\n\u003cp>Compatible with fifth edition.\u003c/p>\n\u003ch3 id=\"sd-licenses-3-5\">3.5\u003c/h3>\n\u003cp>The 3.5 rules are referred to by their game mechanics only. No rules text is reproduced from any game, and no material released under the Open Game License is used.\u003c/p>\n"}]},"core":{"title":"Core Engine: d20 Classic","sections":[{"id":"cd-introduction","title":"Introduction","html":"\u003cp>\u003cem>The Star-Sign Card Engine · second release · 3 October 2026\u003c/em>\u003c/p>\n\u003cp>These are card rules for d20 fantasy roleplaying games where only a natural 20 crits: fifth edition and 3.5, along with the games built on 3.5&#39;s rules, called d20 Classic games here. Where this book says 3.5, it means 3.5 and the games built on its rules. Every check draws two cards instead of rolling a d20. Each player draws from a deck tuned to their star sign, the GM draws from a Fate Deck, and damage comes from a shared damage deck. An optional rule adds wild magic, fed by face cards in the Fate Deck. Everything else works as your game says: ability scores, proficiency, AC, DCs, spells, conditions and the action economy.\u003c/p>\n\u003cp>The rules chapters say what to do at the table. The numbers behind them, and how closely each rule tracks a d20, are gathered in Part Four, The Math, for anyone who wants them. Nothing there is needed to play.\u003c/p>\n\u003cp>One web tool goes with these rules. The \u003cstrong>Star-Sign Deck Lab\u003c/strong> builds and tests any player deck and loads every sign deck and starter deck; set its game switch to d20 Classic.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Part One, Playing:\u003c/strong> 1 Components · 2 Checks · 3 Casting costs · 4 Weariness and rest · 5 Plain rolls · 6 Advantage, disadvantage and rerolls · 7 Held draws · 8 Companions and other creatures · 9 The Fate Deck · 10 Damage\u003c/li>\n\u003cli>\u003cstrong>Part Two, Decks:\u003c/strong> 11 The twelve star-sign decks · 12 Building your own deck\u003c/li>\n\u003cli>\u003cstrong>Part Three, Running the game:\u003c/strong> 13 Wild magic (optional rule) · 14 Pacing the day · 15 Watch in playtesting\u003c/li>\n\u003cli>\u003cstrong>Part Four, The Math:\u003c/strong> 16 The standard day and the balance rules · 17 What a two-card draw can and can&#39;t do · 18 Crits, saves and lean · 19 The sign decks against a d20 · 20 Checks and luck against a d20 · 21 The damage deck against dice · 22 How sure the build table is · 23 Wild magic odds\u003c/li>\n\u003cli>\u003cstrong>Appendices:\u003c/strong> A Quick reference: what the system replaces · B Glossary · C Licenses\u003c/li>\n\u003c/ul>\n"},{"id":"cd-1-components","title":"1. Components","html":"\u003ch2 id=\"cd-1-components-1-components\">1. Components\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Deck\u003c/th>\n\u003cth>Who uses it\u003c/th>\n\u003cth>Cards\u003c/th>\n\u003cth>Built from\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Player deck\u003c/strong>\u003c/td>\n\u003ctd>Each player: a sign deck, or a custom deck they build (chapter 12)\u003c/td>\n\u003ctd>45–90: Ace to 10 plus Suns and Eclipses\u003c/td>\n\u003ctd>2–5 standard packs for a sign deck\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Fate Deck\u003c/strong>\u003c/td>\n\u003ctd>The GM, for monsters, companions and plain rolls\u003c/td>\n\u003ctd>100: Ace to 10, 3 Suns and 3 Eclipses; 112 with wild magic, which adds the 12 face cards\u003c/td>\n\u003ctd>5 standard packs (face cards from one)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Damage deck\u003c/strong>\u003c/td>\n\u003ctd>Shared by the table; players may keep a personal copy\u003c/td>\n\u003ctd>42: Ace to 10 in four suits plus 2 Jokers\u003c/td>\n\u003ctd>1 standard pack, face cards removed\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Aces count as 1. A standard pack has four of each rank and usually one colored and one black Joker. \u003cstrong>The colored Joker is the Sun and the black one the Eclipse\u003c/strong>; the rules use those names, and &quot;Joker&quot; means either.\u003c/p>\n"},{"id":"cd-2-checks","title":"2. Checks","html":"\u003ch2 id=\"cd-2-checks-2-checks\">2. Checks\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Draw one card at a time, two in all, and add them.\u003c/strong> The \u003cstrong>card total\u003c/strong> (2–20) replaces the d20 roll. Add your modifier and compare with the DC or AC as usual.\u003c/li>\n\u003cli>\u003cstrong>A Joker ends the draw.\u003c/strong>\n\u003cul>\n\u003cli>\u003cstrong>The Sun:\u003c/strong> natural 20. It counts as a card total of 20.\u003c/li>\n\u003cli>\u003cstrong>The Eclipse:\u003c/strong> natural 1. It counts as a card total of 1.\u003c/li>\n\u003cli>If the first card is a Joker, don&#39;t draw the second; the check costs only one card. A Joker drawn second still counts.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>A card total of 20 isn&#39;t a natural 20.\u003c/strong> Two 10s make a 20, which hits or succeeds like any other 20. Only a Sun is a natural 20.\u003c/li>\n\u003cli>\u003cstrong>Players draw from their own deck\u003c/strong> for their own checks: attacks, saving throws, ability and skill checks, and initiative. \u003cstrong>The GM draws from the Fate Deck\u003c/strong> for monsters&#39; checks, companions&#39; checks (chapter 8), plain rolls (chapter 5) and \u003cstrong>secret checks\u003c/strong>. For a secret check, the GM draws face-down and adds the player&#39;s modifier; it costs the player no cards, and advantage, disadvantage and rerolls on it use Fate Deck cards.\u003c/li>\n\u003cli>\u003cstrong>Discard drawn cards face-down.\u003c/strong> Nobody looks back through a discard pile, so knowing what&#39;s left in a deck takes memory.\u003c/li>\n\u003c/ol>\n\u003cp>A check costs 2 cards, or 1 when the first card is a Joker.\u003c/p>\n\u003ch3 id=\"cd-2-checks-attacks-and-critical-hits\">Attacks and critical hits\u003c/h3>\n\u003cp>\u003cstrong>Only the Sun crits.\u003c/strong> On an attack, a Sun always hits and an Eclipse always misses. How a Sun becomes a critical hit depends on the game.\u003c/p>\n\u003cp>\u003cstrong>Fifth edition\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>A Sun is a critical hit.\u003c/strong> Draw the attack&#39;s damage dice twice, as your game says (chapter 10).\u003c/li>\n\u003cli>\u003cstrong>A wider crit range becomes a bigger crit.\u003c/strong> A feature that crits on a 19–20 gives a Sun three sets of damage dice instead of two; 18–20 gives four. Each extra number in the crit range adds one set.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>3.5\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Only the Sun threatens.\u003c/strong> Confirm it with a normal attack draw at the same bonus; if that hits, it&#39;s a critical hit. The confirming draw costs cards like any check.\u003c/li>\n\u003cli>\u003cstrong>A weapon&#39;s threat range becomes a bigger multiplier on a Sun:\u003c/strong> multiplier on a Sun = 1 + (numbers in the threat range) × (the weapon&#39;s multiplier − 1). Features that widen a threat range add numbers the same way.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Threat range\u003c/th>\n\u003cth>×2 weapon\u003c/th>\n\u003cth>×3 weapon\u003c/th>\n\u003cth>×4 weapon\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>20\u003c/td>\n\u003ctd>×2\u003c/td>\n\u003ctd>×3\u003c/td>\n\u003ctd>×4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>19–20\u003c/td>\n\u003ctd>×3\u003c/td>\n\u003ctd>×5\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>×4\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003ctd>×10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17–20\u003c/td>\n\u003ctd>×5\u003c/td>\n\u003ctd>×9\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15–20\u003c/td>\n\u003ctd>×7\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"cd-2-checks-saving-throws-and-other-checks\">Saving throws and other checks\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Saving throws.\u003c/strong> Fifth edition: a Sun and an Eclipse count as a 20 and a 1, nothing more. 3.5: a Sun always saves and an Eclipse always fails, as natural 20s and 1s do.\u003c/li>\n\u003cli>\u003cstrong>Ability and skill checks:\u003c/strong> a Sun and an Eclipse count as a 20 and a 1.\u003c/li>\n\u003cli>\u003cstrong>Take 10 and Take 20\u003c/strong> (3.5): don&#39;t draw; take the result. It costs no cards.\u003c/li>\n\u003cli>\u003cstrong>Death saving throws\u003c/strong> (fifth edition) are plain rolls (chapter 5).\u003c/li>\n\u003c/ul>\n"},{"id":"cd-3-casting-costs","title":"3. Casting costs","html":"\u003ch2 id=\"cd-3-casting-costs-3-casting-costs\">3. Casting costs\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>A cantrip costs 1 card. Any other spell costs 2, whatever its level.\u003c/strong> Draw them and discard them unused, whatever they are: a Sun drawn this way is wasted, and an Eclipse is dodged.\u003c/li>\n\u003cli>\u003cstrong>A spell attack is a separate check\u003c/strong> on top of the casting cost: two cards, or one if the first is a Joker.\u003c/li>\n\u003cli>So a spell with a spell attack costs 4 cards (3 when the attack opens on a Joker), and a cantrip with a spell attack costs 3 (2).\u003c/li>\n\u003cli>\u003cstrong>A spell that calls for a save\u003c/strong> costs only its casting cards; each target draws its own save.\u003c/li>\n\u003cli>\u003cstrong>Other checks a spell asks for,\u003c/strong> such as a concentration check, are ordinary checks.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-4-weariness-and-rest","title":"4. Weariness and rest","html":"\u003ch2 id=\"cd-4-weariness-and-rest-4-weariness-and-rest\">4. Weariness and rest\u003c/h2>\n\u003cp>Weariness is the card engine&#39;s own track. It sits beside your game&#39;s exhaustion or fatigue, which work as written and stack with it.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Drawing the last card of your deck (a deck-out) forces a reshuffle and gives you a level of weariness.\u003c/strong> If you need a second card after your deck&#39;s last one, reshuffle and draw it from the new deck.\u003c/li>\n\u003cli>\u003cstrong>Weary N:\u003c/strong> a −2 penalty per level of weariness (−2N) to every check you draw for, starting with your next check. It stacks with other penalties, and it doesn&#39;t lower your AC or your spell save DCs.\u003c/li>\n\u003cli>\u003cstrong>Weary 3:\u003c/strong> you also take −1 to AC and saving throws.\u003c/li>\n\u003cli>\u003cstrong>Weary 4 is the maximum: you collapse.\u003c/strong> Finish the check or spell you were drawing for, then fall unconscious. After 10 minutes you wake at Weary 3. Your next deck-out brings you back to Weary 4.\u003c/li>\n\u003cli>\u003cstrong>A long rest removes all weariness, and you start the next day with a fresh shuffle.\u003c/strong> A short rest doesn&#39;t.\u003c/li>\n\u003cli>The Fate Deck and damage decks never cause weariness; reshuffle them when they run out.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-5-plain-rolls","title":"5. Plain rolls","html":"\u003ch2 id=\"cd-5-plain-rolls-5-plain-rolls\">5. Plain rolls\u003c/h2>\n\u003cp>Plain rolls are pass-or-fail d20 rolls with no modifier: a death saving throw, a flat chance (&quot;on a 15 or higher&quot;), a roll to see whether something happens. Miss chances and other percentile rolls use damage cards instead (chapter 10).\u003c/p>\n\u003cp>\u003cstrong>The GM draws one card from the Fate Deck.\u003c/strong> A Sun always succeeds and an Eclipse always fails. With wild magic, a face card is set aside and replaced, as on any Fate Deck check (chapter 9). Otherwise the card must meet this number:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>d20 roll needed\u003c/th>\n\u003cth>Card needed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>3 or less\u003c/td>\n\u003ctd>Any number card\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4–6\u003c/td>\n\u003ctd>2 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–8\u003c/td>\n\u003ctd>3 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9–10\u003c/td>\n\u003ctd>4 or higher\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–16\u003c/td>\n\u003ctd>The number − 6 (5 for 11, up to 10 for 16)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–20\u003c/td>\n\u003ctd>Sun\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>Death saving throws\u003c/strong> (fifth edition): a 4 or higher succeeds, as a 10 does on the die. A Sun means you regain 1 hit point, and an Eclipse counts as two failures.\u003c/li>\n\u003cli>\u003cstrong>Advantage\u003c/strong> on a plain roll draws 2 Fate Deck cards and keeps the better; \u003cstrong>disadvantage\u003c/strong> keeps the worse. \u003cstrong>A reroll\u003c/strong> draws a new card.\u003c/li>\n\u003cli>Plain rolls never cost players cards.\u003c/li>\n\u003c/ul>\n"},{"id":"cd-6-advantage-disadvantage-and-rerolls","title":"6. Advantage, disadvantage and rerolls","html":"\u003ch2 id=\"cd-6-advantage-disadvantage-and-rerolls-6-advantage-disadvantage-and-rerolls\">6. Advantage, disadvantage and rerolls\u003c/h2>\n\u003cp>Advantage and disadvantage cancel out as your game says. When they cancel, draw normally.\u003c/p>\n\u003ch3 id=\"cd-6-advantage-disadvantage-and-rerolls-advantage\">Advantage\u003c/h3>\n\u003cp>\u003cstrong>Draw 3 cards and keep the best pair.\u003c/strong> Draw one at a time; a Sun at any point ends the draw as a natural 20. An Eclipse is the card you drop. Two Eclipses can&#39;t both be dropped, so the check is a natural 1. Advantage costs about 2.9 cards.\u003c/p>\n\u003ch3 id=\"cd-6-advantage-disadvantage-and-rerolls-disadvantage\">Disadvantage\u003c/h3>\n\u003cp>\u003cstrong>Draw 3 cards and keep the worst pair.\u003c/strong> An Eclipse at any point ends the draw as a natural 1. A Sun is the card you drop; two Suns can&#39;t both be dropped, so the check is a natural 20. The player draws from their own deck.\u003c/p>\n\u003ch3 id=\"cd-6-advantage-disadvantage-and-rerolls-rerolls\">Rerolls\u003c/h3>\n\u003cp>After a check, draw a third card. How it combines follows the reroll&#39;s wording:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Reroll says\u003c/th>\n\u003cth>Card rule\u003c/th>\n\u003cth>Examples\u00
