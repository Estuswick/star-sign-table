# Builds the Android app (.apk) from the web app in docs/ every time it changes.
# The finished file goes to the "apk" branch as StarSignTable.apk, so there's always one link to download it.
name: Android app

on:
  push:
    branches: [main]
    paths: ['docs/**', 'android/**', 'tools/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        id: sdk

      - uses: gradle/actions/setup-gradle@v4
        id: gradle
        with:
          gradle-version: '8.11.1'

      - name: Put the app inside the Android project
        id: assets
        run: |
          exec > >(tee -a prepare.log) 2>&1
          set -x
          mkdir -p android/app/src/main/assets
          cp docs/index.html android/app/src/main/assets/index.html
          cp -r docs/icons android/app/src/main/assets/icons
          sed -i "s/window.SST_HOST='web'/window.SST_HOST='android'/" android/app/src/main/assets/index.html
          grep -q "window.SST_HOST='android'" android/app/src/main/assets/index.html
          python3 tools/localize_fonts.py android/app/src/main/assets/index.html || echo "Fonts not copied; the app will use the phone's fonts."

      - name: Build the app
        id: build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Publish StarSignTable.apk to the apk branch
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/StarSignTable.apk
          cd out
          echo "Star-Sign Table for Android, build ${GITHUB_RUN_NUMBER}, from commit ${GITHUB_SHA}" > BUILD.txt
          git init -q
          git checkout -q -b apk
          git add .
          git -c user.name='github-actions' -c user.email='github-actions@users.noreply.github.com' commit -qm "Android app, build ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk

      - uses: actions/upload-artifact@v4
        with:
          name: StarSignTable-apk
          path: out/StarSignTable.apk

      - name: Keep the build log if something failed
        if: failure()
        run: |
          mkdir -p logs
          cp build.log logs/ 2>/dev/null || echo "The build stopped before Gradle ran." > logs/build.log
          cp prepare.log logs/ 2>/dev/null || true
          cat > logs/steps.json <<'JSON'
          ${{ toJSON(steps) }}
          JSON
          (java -version; echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1; which gradle; gradle --version) > logs/env.txt 2>&1 || true
          cd logs
          git init -q
          git checkout -q -b ci-log
          git add .
          git -c user.name='github-actions' -c user.email='github-actions@users.noreply.github.com' commit -qm "Failed build ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-log
